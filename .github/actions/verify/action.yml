name: Verify the project
description: >
  Installs the dependencies, runs every check, builds the site into dist/ and drives it in a real browser.
  The pull request check and the deploy both use this, so what passes review is what is allowed to ship.

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: 22  # wrangler 4 requires Node >= 22
        cache: npm

    # One install for the whole repo (npm workspaces): the app, hono (which wrangler bundles into the Pages
    # Function) and the tools.
    - name: Install dependencies
      shell: bash
      run: npm ci

    # The quizzes and design challenges are files in content/, and the admin editor can commit one without regenerating the file the API
    # is bundled with (api/generated/practice-content.json). Build it here, so the deploy always carries what is in the content folder;
    # the check below then validates the content itself. (Locally, `npm run check` still says when the committed copy is stale.)
    - name: Build the practice content
      shell: bash
      run: npm run practice:build

    # A missing await on isAdmin() silently grants admin to everyone; see scripts/check/check-admin-guards.mjs.
    # The same step checks that paths.json and every lesson image are valid.
    - name: Check admin guards, learning paths and images
      shell: bash
      run: npm run check

    - name: Lint
      shell: bash
      run: npm run lint

    - name: Type check
      shell: bash
      run: npm run typecheck

    - name: Unit tests
      shell: bash
      run: npm test

    # Assembles the whole site in dist/, the only thing deployed. See the "build" script in the root package.json.
    - name: Build the site
      shell: bash
      run: npm run build

    # What a visitor downloads: the first page, and what the heavy screens (the writing studio, the workspace, the admin) add.
    # The budgets are in site.config.json; an editor or a diagram library cannot slip into the first download unnoticed.
    - name: Check the size of what is downloaded
      shell: bash
      run: npm run check:bundle

    # Every address the site has published (docs/url-registry.tsv) still answers, with the same canonical address and no new noindex:
    # a published address is a promise to everyone who linked to it. See docs/URL_MIGRATION_REGISTRY.md.
    - name: Check that every published address still answers
      shell: bash
      run: npm run check:urls

    # The pages as a reader gets them: a lesson opens, links work, videos play under the real security policy, the
    # built pages carry what search engines read. Chrome is preinstalled on GitHub's Ubuntu runners.
    - name: Browser tests
      shell: bash
      run: |
        chrome="$(command -v google-chrome || command -v chromium || true)"
        [ -n "$chrome" ] || { echo "::error::no Chrome or Chromium found on this runner"; exit 1; }
        export E2E_EXECUTABLE="$chrome"
        npm run preview > preview.log 2>&1 &
        for _ in $(seq 1 30); do curl -sf -o /dev/null http://localhost:4180/ && break; sleep 1; done
        curl -sf -o /dev/null http://localhost:4180/ || { cat preview.log; echo "::error::the preview server did not start"; exit 1; }
        npm run test:e2e
