name: Deploy static docs browser to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: webapp/package-lock.json
      # A missing await on isAdmin() silently grants admin to everyone;
      # see scripts/check-admin-guards.js.
      - name: Check admin guards
        run: node scripts/check-admin-guards.js
      - name: Regenerate docs-index.json
        run: python3 scripts/gen-docs-index.py
      - name: Regenerate search-index.json
        run: python3 scripts/gen-search-index.py
      - name: Build webapp
        working-directory: webapp
        run: |
          rm -rf ../assets
          npm ci
          npm run build
          # The Pages artifact is the whole repo root, so build-only
          # dependencies would otherwise ride along into it.
          rm -rf node_modules
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
