name: Azure Static Web Apps CI/CD

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: [main]

# A second push while a deploy is in flight should supersede it cleanly,
# rather than leaving two runs uploading to the same environment.
concurrency:
  group: swa-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    # Everything here should finish in ~3 minutes. If it hasn't in 20, it's
    # wedged — fail fast instead of holding a runner for the 6-hour default.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false
          lfs: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            webapp/package-lock.json
            api/package-lock.json
      # A missing await on isAdmin() silently grants admin to everyone;
      # see scripts/check-admin-guards.js.
      - name: Check admin guards
        run: node scripts/check-admin-guards.js
      - name: Regenerate docs-index.json
        run: python3 scripts/gen-docs-index.py
      - name: Regenerate search-index.json
        run: python3 scripts/gen-search-index.py
      - name: Build webapp
        working-directory: webapp
        run: |
          rm -rf ../assets
          npm ci
          npm run build
          # app_location is the repo root, so everything still sitting here
          # gets uploaded. These 65MB of build-only dependencies are not part
          # of the site; dropping them keeps the deploy payload honest.
          rm -rf node_modules
      # Built here rather than by Oryx inside the deploy step. Oryx runs
      # `npm install --production` and then `npm install` again, which on the
      # Free tier's build container was taking >4 minutes for 28 packages and
      # getting killed mid-install. The runner does the same work in seconds
      # with a warm npm cache, so skip_api_build below turns Oryx off.
      - name: Build api
        working-directory: api
        run: npm ci --omit=dev
      - name: Build and Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "/"
          api_location: "api"
          output_location: ""
          skip_app_build: true
          skip_api_build: true
          skip_deploy_on_missing_secrets: true

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: "close"
          skip_deploy_on_missing_secrets: true
