name: PR checks

# Runs every check and builds the whole site on every pull request, so contributors get feedback before review.
# The steps are the shared action in .github/actions/verify, the same one the deploy runs. No deploy and no
# secrets, so it is safe for pull requests from forks.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # the build dates every page from git history; a shallow clone has none

      - uses: ./.github/actions/verify
