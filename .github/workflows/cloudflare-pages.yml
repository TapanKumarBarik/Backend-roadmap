name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# A second push while a deploy is in flight supersedes it.
concurrency:
  group: cf-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # the build dates every page from git history (sitemap, structured data); a shallow clone has none

      # Install, every check, the build into dist/ (the only thing deployed) and the browser tests: the same steps a
      # pull request runs, in .github/actions/verify. Nothing below runs unless they all pass.
      - uses: ./.github/actions/verify

      # Failures surface as annotations (::error::), which — unlike step logs —
      # are readable on the public repo without signing in.
      - name: Check Cloudflare credentials
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          [ -n "$CF_TOKEN" ]   || { echo "::error::Repository secret CLOUDFLARE_API_TOKEN is missing or empty"; exit 1; }
          [ -n "$CF_ACCOUNT" ] || { echo "::error::Repository secret CLOUDFLARE_ACCOUNT_ID is missing or empty"; exit 1; }
          status=$(curl -s https://api.cloudflare.com/client/v4/user/tokens/verify -H "Authorization: Bearer $CF_TOKEN" | jq -r '.result.status // .errors[0].message // "unknown"')
          [ "$status" = active ] || { echo "::error::CLOUDFLARE_API_TOKEN rejected by Cloudflare: $status (token length ${#CF_TOKEN}; stray quotes or spaces?)"; exit 1; }
          echo "token active; account id length ${#CF_ACCOUNT}"

      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -o pipefail
          npx --yes wrangler@4.145.0 pages deploy dist --project-name=backend-roadmap --branch=main --commit-dirty=true 2>&1 | tee deploy.log || {
            echo "::error title=wrangler pages deploy failed::$(grep -v '^\s*$' deploy.log | tail -n 15 | tr '\n' ' ' | cut -c1-1500)"
            exit 1
          }

      # Tell Bing and the other IndexNow engines which modules changed (Google learns from the sitemap). Best
      # effort: the deploy has already succeeded, so a failure here must not turn it red.
      - name: Notify IndexNow
        continue-on-error: true
        run: node scripts/maintain/indexnow.mjs "${{ github.event.before }}"
