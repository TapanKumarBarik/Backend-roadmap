name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# A second push while a deploy is in flight supersedes it.
concurrency:
  group: cf-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22  # wrangler 4 requires Node >= 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            webapp/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # A missing await on isAdmin() silently grants admin to everyone;
      # see scripts/check-admin-guards.js (covers api/ and api-cf/).
      - name: Check admin guards
        run: node scripts/check-admin-guards.js

      # docs-index.json / search-index.json are gitignored and regenerated
      # on every deploy — same as the old Azure workflow.
      - name: Regenerate content indexes
        run: |
          python scripts/gen-docs-index.py
          python scripts/gen-search-index.py

      # Root deps = hono, which wrangler bundles into the Pages Function.
      - name: Install API deps
        run: npm ci

      - name: Build webapp
        working-directory: webapp
        run: |
          rm -rf ../assets
          npm ci
          npm run build

      # Only an explicit allowlist is ever uploaded (dist/) — never the repo
      # root, which also holds source, local secrets and data exports.
      - name: Stage deployable site
        run: node scripts/stage-dist.cjs

      # Failures surface as annotations (::error::), which — unlike step logs —
      # are readable on the public repo without signing in.
      - name: Check Cloudflare credentials
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          [ -n "$CF_TOKEN" ]   || { echo "::error::Repository secret CLOUDFLARE_API_TOKEN is missing or empty"; exit 1; }
          [ -n "$CF_ACCOUNT" ] || { echo "::error::Repository secret CLOUDFLARE_ACCOUNT_ID is missing or empty"; exit 1; }
          status=$(curl -s https://api.cloudflare.com/client/v4/user/tokens/verify -H "Authorization: Bearer $CF_TOKEN" | jq -r '.result.status // .errors[0].message // "unknown"')
          [ "$status" = active ] || { echo "::error::CLOUDFLARE_API_TOKEN rejected by Cloudflare: $status (token length ${#CF_TOKEN}; stray quotes or spaces?)"; exit 1; }
          echo "token active; account id length ${#CF_ACCOUNT}"

      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -o pipefail
          npx --yes wrangler@4.145.0 pages deploy dist --project-name=backend-roadmap --branch=main --commit-dirty=true 2>&1 | tee deploy.log || {
            echo "::error title=wrangler pages deploy failed::$(grep -v '^\s*$' deploy.log | tail -n 15 | tr '\n' ' ' | cut -c1-1500)"
            exit 1
          }
