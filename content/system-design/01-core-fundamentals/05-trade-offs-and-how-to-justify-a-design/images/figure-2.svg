<svg width='640' height='120' role='img' viewBox='0 0 640 120' xmlns='http://www.w3.org/2000/svg' font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"><title>Figure 2: Trade-offs and How to Justify a Design</title><desc>The four-part trade-off statement. Part 3 is what interviewers listen for: you know what you gave up.</desc><rect x='0' y='0' width='640' height='120' rx='16' fill='#fbfbf9' stroke='#e4e4de'/><defs><marker id='ar-blue' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#2f6fdb'/></marker><marker id='ar-green' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#178a5e'/></marker><marker id='ar-purple' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#6f52c9'/></marker><marker id='ar-orange' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#d0702c'/></marker><marker id='ar-pink' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#c43d6e'/></marker><marker id='ar-grey' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#6b7280'/></marker><marker id='ar-teal' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#0f7b6c'/></marker><marker id='ar-ink' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#5b6478'/></marker></defs><rect x='8' y='20' width='148' height='49' rx='7' fill='#fff' stroke='#1f2a44' stroke-width='1.2'/><text x='22' y='42' font-size='12.5' font-weight='700' fill='#1f2a44'>1 · Choice</text><text x='22' y='60' font-size='10.5' fill='#1f2a44'>cache, not more replicas</text><line x1='156' y1='44' x2='164' y2='44' stroke='#0f7b6c' stroke-width='1.6' marker-end='url(#ar-teal)'/><rect x='166' y='20' width='148' height='49' rx='7' fill='#fff' stroke='#1f2a44' stroke-width='1.2'/><text x='180' y='42' font-size='12.5' font-weight='700' fill='#1f2a44'>2 · Because</text><text x='180' y='60' font-size='10.5' fill='#1f2a44'>fast reads at low cost</text><line x1='314' y1='44' x2='322' y2='44' stroke='#0f7b6c' stroke-width='1.6' marker-end='url(#ar-teal)'/><rect x='324' y='20' width='148' height='49' rx='7' fill='#e3f3f0' stroke='#0f7b6c' stroke-width='1.6'/><text x='338' y='42' font-size='12.5' font-weight='700' fill='#1f2a44'>3 · We accept</text><text x='338' y='60' font-size='10.5' fill='#1f2a44'>prices ≤ 60 s stale</text><line x1='472' y1='44' x2='480' y2='44' stroke='#0f7b6c' stroke-width='1.6' marker-end='url(#ar-teal)'/><rect x='482' y='20' width='148' height='49' rx='7' fill='#fff' stroke='#1f2a44' stroke-width='1.2'/><text x='496' y='42' font-size='12.5' font-weight='700' fill='#1f2a44'>4 · Mitigation</text><text x='496' y='60' font-size='10.5' fill='#1f2a44'>skip cache at checkout</text><text x='320' y='108' text-anchor='middle' font-size='10.5' font-weight='400' fill='#5b6478' font-style='italic'>say the choice, the reason, the cost, and how you limit the cost</text></svg>