<svg width='640' height='170' role='img' viewBox='0 0 640 170' xmlns='http://www.w3.org/2000/svg' font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"><title>Figure 1: Trade-offs and How to Justify a Design</title><desc>Three trade-offs you will meet in nearly every interview. The requirements decide where the dot sits.</desc><rect x='0' y='0' width='640' height='170' rx='16' fill='#fbfbf9' stroke='#e4e4de'/><defs><marker id='ar-blue' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#2f6fdb'/></marker><marker id='ar-green' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#178a5e'/></marker><marker id='ar-purple' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#6f52c9'/></marker><marker id='ar-orange' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#d0702c'/></marker><marker id='ar-pink' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#c43d6e'/></marker><marker id='ar-grey' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#6b7280'/></marker><marker id='ar-teal' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#0f7b6c'/></marker><marker id='ar-ink' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#5b6478'/></marker></defs><rect x='8' y='8' width='170' height='34' rx='7' fill='#fff' stroke='#1f2a44' stroke-width='1.2'/><text x='22' y='30' font-size='12.5' font-weight='700' fill='#1f2a44'>Consistency</text><rect x='462' y='8' width='170' height='34' rx='7' fill='#fff' stroke='#1f2a44' stroke-width='1.2'/><text x='476' y='30' font-size='12.5' font-weight='700' fill='#1f2a44'>Availability</text><line x1='180' y1='25' x2='460' y2='25' stroke='#d9d4c7' stroke-width='2'/><circle cx='320' cy='25' r='6' fill='#0f7b6c'/><text x='320' y='48' text-anchor='middle' font-size='10.5' font-weight='400' fill='#5b6478'>latest data, or always respond?</text><rect x='8' y='62' width='170' height='34' rx='7' fill='#fff' stroke='#1f2a44' stroke-width='1.2'/><text x='22' y='84' font-size='12.5' font-weight='700' fill='#1f2a44'>Latency</text><rect x='462' y='62' width='170' height='34' rx='7' fill='#fff' stroke='#1f2a44' stroke-width='1.2'/><text x='476' y='84' font-size='12.5' font-weight='700' fill='#1f2a44'>Cost</text><line x1='180' y1='79' x2='460' y2='79' stroke='#d9d4c7' stroke-width='2'/><circle cx='320' cy='79' r='6' fill='#0f7b6c'/><text x='320' y='102' text-anchor='middle' font-size='10.5' font-weight='400' fill='#5b6478'>faster usually means more servers</text><rect x='8' y='116' width='170' height='34' rx='7' fill='#fff' stroke='#1f2a44' stroke-width='1.2'/><text x='22' y='138' font-size='12.5' font-weight='700' fill='#1f2a44'>Simplicity</text><rect x='462' y='116' width='170' height='34' rx='7' fill='#fff' stroke='#1f2a44' stroke-width='1.2'/><text x='476' y='138' font-size='12.5' font-weight='700' fill='#1f2a44'>Flexibility</text><line x1='180' y1='133' x2='460' y2='133' stroke='#d9d4c7' stroke-width='2'/><circle cx='320' cy='133' r='6' fill='#0f7b6c'/><text x='320' y='156' text-anchor='middle' font-size='10.5' font-weight='400' fill='#5b6478'>easy to run, or easy to extend?</text></svg>