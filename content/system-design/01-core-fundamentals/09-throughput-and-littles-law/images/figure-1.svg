<svg width='640' height='140' role='img' viewBox='0 0 640 140' xmlns='http://www.w3.org/2000/svg' font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"><title>Figure 1: Throughput and Little's Law</title><desc>One worker at 10 ms per request can never serve more than 100 requests per second; more workers raise throughput, not latency.</desc><rect x='0' y='0' width='640' height='140' rx='16' fill='#fbfbf9' stroke='#e4e4de'/><defs><marker id='ar-blue' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#2f6fdb'/></marker><marker id='ar-green' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#178a5e'/></marker><marker id='ar-purple' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#6f52c9'/></marker><marker id='ar-orange' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#d0702c'/></marker><marker id='ar-pink' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#c43d6e'/></marker><marker id='ar-grey' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#6b7280'/></marker><marker id='ar-teal' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#0f7b6c'/></marker><marker id='ar-ink' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#5b6478'/></marker></defs><rect x='20' y='52' width='120' height='44' rx='7' fill='#fbe6ee' stroke='#c43d6e' stroke-width='1.6'/><text x='80.0' y='72.0' text-anchor='middle' font-size='12.5' font-weight='600' fill='#1f2a44'>1 worker</text><text x='80.0' y='87.0' text-anchor='middle' font-size='10.5' fill='#5b6478'>10 ms per request</text><rect x='250' y='22' width='160' height='44' rx='7' fill='#e2f4ec' stroke='#178a5e' stroke-width='1.6'/><text x='330.0' y='42.0' text-anchor='middle' font-size='12' font-weight='600' fill='#1f2a44'>Latency: 10 ms</text><text x='330.0' y='57.0' text-anchor='middle' font-size='10.5' fill='#5b6478'>fast for each user</text><rect x='250' y='86' width='160' height='44' rx='7' fill='#fcefe4' stroke='#d0702c' stroke-width='1.6'/><text x='330.0' y='106.0' text-anchor='middle' font-size='12' font-weight='600' fill='#1f2a44'>Throughput: 100 RPS</text><text x='330.0' y='121.0' text-anchor='middle' font-size='10.5' fill='#5b6478'>max, one at a time</text><line x1='140' y1='66' x2='248' y2='44' stroke='#178a5e' stroke-width='1.5' marker-end='url(#ar-green)'/><line x1='140' y1='82' x2='248' y2='108' stroke='#d0702c' stroke-width='1.5' marker-end='url(#ar-orange)'/><rect x='470' y='52' width='152' height='44' rx='7' fill='#e6eefc' stroke='#2f6fdb' stroke-width='1.6'/><text x='546.0' y='72.0' text-anchor='middle' font-size='12' font-weight='600' fill='#1f2a44'>10 workers</text><text x='546.0' y='87.0' text-anchor='middle' font-size='10.5' fill='#5b6478'>same latency, 1,000 RPS</text><line x1='410' y1='74' x2='468' y2='74' stroke='#5b6478' stroke-width='1.5' marker-end='url(#ar-ink)' stroke-dasharray='5 4'/><text x='440' y='66' text-anchor='middle' font-size='9.5' font-weight='400' fill='#5b6478'>add</text></svg>