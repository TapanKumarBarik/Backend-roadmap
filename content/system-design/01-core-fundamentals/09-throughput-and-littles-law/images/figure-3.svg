<svg width='640' height='212' role='img' viewBox='0 0 640 212' xmlns='http://www.w3.org/2000/svg' font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"><title>Figure 3: Throughput and Little's Law</title><desc>Left: throughput flattens at capacity. Right: response time in a simple queue grows like 1 / (1 − utilization), so it explodes near 100% (at 99% it reaches 100×, off this chart).</desc><rect x='0' y='0' width='640' height='212' rx='16' fill='#fbfbf9' stroke='#e4e4de'/><defs><marker id='ar-blue' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#2f6fdb'/></marker><marker id='ar-green' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#178a5e'/></marker><marker id='ar-purple' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#6f52c9'/></marker><marker id='ar-orange' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#d0702c'/></marker><marker id='ar-pink' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#c43d6e'/></marker><marker id='ar-grey' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#6b7280'/></marker><marker id='ar-teal' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#0f7b6c'/></marker><marker id='ar-ink' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#5b6478'/></marker></defs><path d='M60 176 H310' fill='none' stroke='#5b6478' stroke-width='1.5' marker-end='url(#ar-ink)'/><path d='M60 176 V16' fill='none' stroke='#5b6478' stroke-width='1.5' marker-end='url(#ar-ink)'/><text x='185.0' y='206' text-anchor='middle' font-size='10.5' font-weight='400' fill='#5b6478'>offered load (requests / s)</text><text x='20' y='96.0' text-anchor='middle' font-size='10.5' fill='#5b6478' transform='rotate(-90 20 96.0)'>throughput</text><line x1='60' y1='56' x2='304' y2='56' stroke='#c43d6e' stroke-width='1.2' stroke-dasharray='4 4'/><text x='304' y='50' text-anchor='end' font-size='10' font-weight='600' fill='#c43d6e'>capacity</text><path d='M60 176 L210 56 H300' fill='none' stroke='#178a5e' stroke-width='2.4'/><text x='144' y='144' text-anchor='start' font-size='9.5' font-weight='400' fill='#178a5e'>rises with demand</text><text x='228' y='78' text-anchor='start' font-size='9.5' font-weight='400' fill='#178a5e'>flat: extra work queues</text><rect x='380' y='16' width='168.0' height='160' fill='#e2f4ec' fill-opacity='0.7'/><text x='464.0' y='30' text-anchor='middle' font-size='9' font-weight='600' fill='#178a5e'>headroom zone (&lt; 70%)</text><path d='M380 176 H620' fill='none' stroke='#5b6478' stroke-width='1.5' marker-end='url(#ar-ink)'/><path d='M380 176 V16' fill='none' stroke='#5b6478' stroke-width='1.5' marker-end='url(#ar-ink)'/><text x='500.0' y='206' text-anchor='middle' font-size='10.5' font-weight='400' fill='#5b6478'>utilization</text><text x='340' y='96.0' text-anchor='middle' font-size='10.5' fill='#5b6478' transform='rotate(-90 340 96.0)'>response time (× service time)</text><line x1='377' y1='136.0' x2='380' y2='136.0' stroke='#d9d4c7' stroke-width='1'/><text x='374' y='139.0' text-anchor='end' font-size='8.5' font-weight='400' fill='#5b6478'>5×</text><line x1='377' y1='96.0' x2='380' y2='96.0' stroke='#d9d4c7' stroke-width='1'/><text x='374' y='99.0' text-anchor='end' font-size='8.5' font-weight='400' fill='#5b6478'>10×</text><line x1='377' y1='56.0' x2='380' y2='56.0' stroke='#d9d4c7' stroke-width='1'/><text x='374' y='59.0' text-anchor='e