<svg width='640' height='120' role='img' viewBox='0 0 640 120' xmlns='http://www.w3.org/2000/svg' font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"><title>Figure 2: Throughput and Little's Law</title><desc>5,000 requests arrive per second and each stays 50 ms, so about 250 are inside the system at any instant.</desc><rect x='0' y='0' width='640' height='120' rx='16' fill='#fbfbf9' stroke='#e4e4de'/><defs><marker id='ar-blue' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#2f6fdb'/></marker><marker id='ar-green' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#178a5e'/></marker><marker id='ar-purple' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#6f52c9'/></marker><marker id='ar-orange' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#d0702c'/></marker><marker id='ar-pink' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#c43d6e'/></marker><marker id='ar-grey' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#6b7280'/></marker><marker id='ar-teal' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#0f7b6c'/></marker><marker id='ar-ink' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#5b6478'/></marker></defs><rect x='10' y='26' width='170' height='49' rx='7' fill='#fff' stroke='#1f2a44' stroke-width='1.2'/><text x='24' y='48' font-size='12.5' font-weight='700' fill='#1f2a44'>Arrivals</text><text x='24' y='66' font-size='10.5' fill='#1f2a44'>λ = 5,000 requests / s</text><rect x='232' y='18' width='176' height='64' rx='7' fill='#e3f3f0' stroke='#0f7b6c' stroke-width='1.6'/><text x='246' y='40' font-size='12.5' font-weight='700' fill='#1f2a44'>In the system</text><text x='246' y='58' font-size='10.5' fill='#1f2a44'>each stays W = 50 ms</text><text x='246' y='73' font-size='10.5' fill='#1f2a44'>L = 5,000 × 0.05 = 250</text><rect x='460' y='26' width='170' height='49' rx='7' fill='#fff' stroke='#1f2a44' stroke-width='1.2'/><text x='474' y='48' font-size='12.5' font-weight='700' fill='#1f2a44'>Completions</text><text x='474' y='66' font-size='10.5' fill='#1f2a44'>5,000 requests / s</text><line x1='182' y1='52' x2='228' y2='52' stroke='#0f7b6c' stroke-width='1.6' marker-end='url(#ar-teal)'/><line x1='410' y1='52' x2='456' y2='52' stroke='#0f7b6c' stroke-width='1.6' marker-end='url(#ar-teal)'/><text x='320' y='108' text-anchor='middle' font-size='10.5' font-weight='400' fill='#5b6478' font-style='italic'>about 250 requests are inside at any instant</text></svg>