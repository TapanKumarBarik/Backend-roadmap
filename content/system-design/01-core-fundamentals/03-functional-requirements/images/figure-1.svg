<svg width='640' height='180' role='img' viewBox='0 0 640 180' xmlns='http://www.w3.org/2000/svg' font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"><title>Figure 1: Functional Requirements</title><desc>A URL shortener's requirements, split into what you design now and what you park.</desc><rect x='0' y='0' width='640' height='180' rx='16' fill='#fbfbf9' stroke='#e4e4de'/><defs><marker id='ar-blue' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#2f6fdb'/></marker><marker id='ar-green' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#178a5e'/></marker><marker id='ar-purple' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#6f52c9'/></marker><marker id='ar-orange' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#d0702c'/></marker><marker id='ar-pink' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#c43d6e'/></marker><marker id='ar-grey' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#6b7280'/></marker><marker id='ar-teal' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#0f7b6c'/></marker><marker id='ar-ink' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#5b6478'/></marker></defs><rect x='8' y='8' width='300' height='164' rx='8' fill='#e3f3f0' stroke='#0f7b6c'/><rect x='332' y='8' width='300' height='164' rx='8' fill='#fff' stroke='#d9d4c7' stroke-dasharray='5 4'/><text x='22' y='30' text-anchor='start' font-size='12.5' font-weight='700' fill='#1f2a44'>Core: in scope</text><text x='346' y='30' text-anchor='start' font-size='12.5' font-weight='700' fill='#1f2a44'>Nice-to-have: parked</text><text x='30' y='58' text-anchor='start' font-size='11.5' font-weight='600' fill='#1f2a44'>✓  Create a short link</text><text x='30' y='86' text-anchor='start' font-size='11.5' font-weight='600' fill='#1f2a44'>✓  Redirect to the long URL</text><text x='30' y='114' text-anchor='start' font-size='11.5' font-weight='400' fill='#5b6478'>✓  Custom alias (optional)</text><text x='30' y='142' text-anchor='start' font-size='11.5' font-weight='400' fill='#5b6478'>✓  Expiry date (optional)</text><text x='354' y='58' text-anchor='start' font-size='11.5' font-weight='400' fill='#5b6478'>○  Click analytics</text><text x='354' y='86' text-anchor='start' font-size='11.5' font-weight='400' fill='#5b6478'>○  User accounts</text><text x='354' y='114' text-anchor='start' font-size='11.5' font-weight='400' fill='#5b6478'>○  QR codes</text><text x='354' y='142' text-anchor='start' font-size='11.5' font-weight='400' fill='#5b6478'>○  Browser extension</text></svg>