<svg width='640' height='230' role='img' viewBox='0 0 640 230' xmlns='http://www.w3.org/2000/svg' font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"><title>Figure 2: Stateless vs Stateful</title><desc>Alice and Bob are connected to different servers. A registry finds Bob's server; pub/sub carries the message there.</desc><rect x='0' y='0' width='640' height='230' rx='16' fill='#fbfbf9' stroke='#e4e4de'/><defs><marker id='ar-blue' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#2f6fdb'/></marker><marker id='ar-green' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#178a5e'/></marker><marker id='ar-purple' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#6f52c9'/></marker><marker id='ar-orange' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#d0702c'/></marker><marker id='ar-pink' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#c43d6e'/></marker><marker id='ar-grey' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#6b7280'/></marker><marker id='ar-teal' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#0f7b6c'/></marker><marker id='ar-ink' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#5b6478'/></marker></defs><rect x='8' y='20' width='110' height='49' rx='7' fill='#fff' stroke='#1f2a44' stroke-width='1.2'/><text x='22' y='42' font-size='12.5' font-weight='700' fill='#1f2a44'>Alice</text><text x='22' y='60' font-size='10.5' fill='#1f2a44'>WebSocket</text><rect x='8' y='130' width='110' height='49' rx='7' fill='#fff' stroke='#1f2a44' stroke-width='1.2'/><text x='22' y='152' font-size='12.5' font-weight='700' fill='#1f2a44'>Bob</text><text x='22' y='170' font-size='10.5' fill='#1f2a44'>WebSocket</text><rect x='170' y='20' width='140' height='49' rx='7' fill='#fff' stroke='#1f2a44' stroke-width='1.2'/><text x='184' y='42' font-size='12.5' font-weight='700' fill='#1f2a44'>Server 1</text><text x='184' y='60' font-size='10.5' fill='#1f2a44'>holds Alice&#x27;s socket</text><rect x='170' y='130' width='140' height='49' rx='7' fill='#fff' stroke='#1f2a44' stroke-width='1.2'/><text x='184' y='152' font-size='12.5' font-weight='700' fill='#1f2a44'>Server 2</text><text x='184' y='170' font-size='10.5' fill='#1f2a44'>holds Bob&#x27;s socket</text><rect x='410' y='20' width='220' height='49' rx='7' fill='#fff' stroke='#1f2a44' stroke-width='1.2'/><text x='424' y='42' font-size='12.5' font-weight='700' fill='#1f2a44'>Registry (Redis)</text><text x='424' y='60' font-size='10.5' fill='#1f2a44'>Bob → Server 2</text><rect x='410' y='130' width='220' height='49' rx='7' fill='#e3f3f0' stroke='#0f7b6c' stroke-width='1.6'/><text x='424' y='152' font-size='12.5' font-weight='700' fill='#1f2a44'>Pub/sub channel</text><text x='424' y='170' font-size='10.5' fill='#1f2a44'>Redis or Kafka</text><line x1='118' y1='44' x2='166' y2='44' stroke='#0f7b6c' stroke-width='1.6' marker-end='url(#ar-teal)'/><line x1='166' y1='154' x2='118' y2='154' stroke='#0f7b6c' stroke-width='1.6' marker-end='url(#ar-teal)'/><circle cx='360' cy='32' r='9' fill='#0f7b6c'/><text x='360' y='35.8' text-anchor='middle' font-size='10.5' font-weight='700' fill='#fff'>1</text><line x1='310' y1='44' x2='406' y2='44' stroke='#0f7b6c' stroke-width='1.6' marker-end='url(#ar-teal)'/><text x='318' y='64' text-anchor='start' font-size='10' font-weight='600' fill='#1f2a44'>where is Bob?</text><circle cx='29