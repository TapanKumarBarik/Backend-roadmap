<svg width='640' height='130' role='img' viewBox='0 0 640 130' xmlns='http://www.w3.org/2000/svg' font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"><title>Figure 1: Stateless vs Stateful</title><desc>Stateless components are interchangeable; stateful ones hold data or connections that live on a specific node.</desc><rect x='0' y='0' width='640' height='130' rx='16' fill='#fbfbf9' stroke='#e4e4de'/><defs><marker id='ar-blue' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#2f6fdb'/></marker><marker id='ar-green' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#178a5e'/></marker><marker id='ar-purple' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#6f52c9'/></marker><marker id='ar-orange' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#d0702c'/></marker><marker id='ar-pink' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#c43d6e'/></marker><marker id='ar-grey' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#6b7280'/></marker><marker id='ar-teal' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#0f7b6c'/></marker><marker id='ar-ink' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#5b6478'/></marker></defs><rect x='8' y='10' width='300' height='79' rx='7' fill='#e3f3f0' stroke='#0f7b6c' stroke-width='1.6'/><text x='22' y='32' font-size='12.5' font-weight='700' fill='#1f2a44'>Stateless</text><text x='22' y='50' font-size='10.5' fill='#1f2a44'>no per-client data between requests</text><text x='22' y='65' font-size='10.5' fill='#1f2a44'>any instance serves any request</text><text x='22' y='80' font-size='10.5' fill='#1f2a44'>web APIs, workers</text><rect x='332' y='10' width='300' height='79' rx='7' fill='#fff' stroke='#1f2a44' stroke-width='1.2'/><text x='346' y='32' font-size='12.5' font-weight='700' fill='#1f2a44'>Stateful</text><text x='346' y='50' font-size='10.5' fill='#1f2a44'>remembers data or connections</text><text x='346' y='65' font-size='10.5' fill='#1f2a44'>needs placement, replication, rebalancing</text><text x='346' y='80' font-size='10.5' fill='#1f2a44'>databases, caches, WebSocket servers</text></svg>