<svg width='640' height='120' role='img' viewBox='0 0 640 120' xmlns='http://www.w3.org/2000/svg' font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"><title>Figure 1: Simple Beats Clever</title><desc>The cloud bill is the smallest part of what a component costs.</desc><rect x='0' y='0' width='640' height='120' rx='16' fill='#fbfbf9' stroke='#e4e4de'/><defs><marker id='ar-blue' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#2f6fdb'/></marker><marker id='ar-green' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#178a5e'/></marker><marker id='ar-purple' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#6f52c9'/></marker><marker id='ar-orange' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#d0702c'/></marker><marker id='ar-pink' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#c43d6e'/></marker><marker id='ar-grey' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#6b7280'/></marker><marker id='ar-teal' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#0f7b6c'/></marker><marker id='ar-ink' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#5b6478'/></marker></defs><rect x='8' y='14' width='200' height='64' rx='7' fill='#fff' stroke='#1f2a44' stroke-width='1.2'/><text x='22' y='36' font-size='12.5' font-weight='700' fill='#1f2a44'>Money</text><text x='22' y='54' font-size='10.5' fill='#1f2a44'>servers, storage, network</text><text x='22' y='69' font-size='10.5' fill='#1f2a44'>licences</text><rect x='220' y='14' width='200' height='64' rx='7' fill='#e3f3f0' stroke='#0f7b6c' stroke-width='1.6'/><text x='234' y='36' font-size='12.5' font-weight='700' fill='#1f2a44'>Operations</text><text x='234' y='54' font-size='10.5' fill='#1f2a44'>deploy, monitor, upgrade</text><text x='234' y='69' font-size='10.5' fill='#1f2a44'>on-call</text><rect x='432' y='14' width='200' height='64' rx='7' fill='#fff' stroke='#1f2a44' stroke-width='1.2'/><text x='446' y='36' font-size='12.5' font-weight='700' fill='#1f2a44'>Failure modes</text><text x='446' y='54' font-size='10.5' fill='#1f2a44'>the part can break,</text><text x='446' y='69' font-size='10.5' fill='#1f2a44'>and so can each link</text><text x='320' y='110' text-anchor='middle' font-size='10.5' font-weight='400' fill='#5b6478' font-style='italic'>every box you add costs all three</text></svg>