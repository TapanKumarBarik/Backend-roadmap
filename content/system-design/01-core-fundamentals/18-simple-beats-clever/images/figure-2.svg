<svg width='640' height='150' role='img' viewBox='0 0 640 150' xmlns='http://www.w3.org/2000/svg' font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"><title>Figure 2: Simple Beats Clever</title><desc>Both designs meet the load; the simple one does it with far less to build and run.</desc><rect x='0' y='0' width='640' height='150' rx='16' fill='#fbfbf9' stroke='#e4e4de'/><defs><marker id='ar-blue' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#2f6fdb'/></marker><marker id='ar-green' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#178a5e'/></marker><marker id='ar-purple' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#6f52c9'/></marker><marker id='ar-orange' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#d0702c'/></marker><marker id='ar-pink' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#c43d6e'/></marker><marker id='ar-grey' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#6b7280'/></marker><marker id='ar-teal' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#0f7b6c'/></marker><marker id='ar-ink' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#5b6478'/></marker></defs><rect x='8' y='10' width='300' height='79' rx='7' fill='#e3f3f0' stroke='#0f7b6c' stroke-width='1.6'/><text x='22' y='32' font-size='12.5' font-weight='700' fill='#1f2a44'>Postgres primary + 2 read replicas</text><text x='22' y='50' font-size='10.5' fill='#1f2a44'>handles 2,000 QPS (mostly reads)</text><text x='22' y='65' font-size='10.5' fill='#1f2a44'>one schema, normal SQL, joins</text><text x='22' y='80' font-size='10.5' fill='#1f2a44'>a small team can run it</text><rect x='332' y='10' width='300' height='79' rx='7' fill='#fff' stroke='#1f2a44' stroke-width='1.2'/><text x='346' y='32' font-size='12.5' font-weight='700' fill='#1f2a44'>Sharded across 8 nodes</text><text x='346' y='50' font-size='10.5' fill='#1f2a44'>also handles it, with room to spare</text><text x='346' y='65' font-size='10.5' fill='#1f2a44'>routing, resharding, no cross-shard joins</text><text x='346' y='80' font-size='10.5' fill='#1f2a44'>solves a problem you don&#x27;t have yet</text><text x='320' y='136' text-anchor='middle' font-size='10.5' font-weight='400' fill='#5b6478' font-style='italic'>YAGNI: design for real scale + ~10× growth, leave seams for later</text></svg>