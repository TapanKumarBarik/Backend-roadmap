<svg width='640' height='150' role='img' viewBox='0 0 640 150' xmlns='http://www.w3.org/2000/svg' font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"><title>Figure 2: Client-Server and Multi-Tier Architecture</title><desc>A typical three-tier web stack. Only the application tier can reach the database.</desc><rect x='0' y='0' width='640' height='150' rx='16' fill='#fbfbf9' stroke='#e4e4de'/><defs><marker id='ar-blue' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#2f6fdb'/></marker><marker id='ar-green' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#178a5e'/></marker><marker id='ar-purple' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#6f52c9'/></marker><marker id='ar-orange' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#d0702c'/></marker><marker id='ar-pink' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#c43d6e'/></marker><marker id='ar-grey' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#6b7280'/></marker><marker id='ar-teal' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#0f7b6c'/></marker><marker id='ar-ink' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#5b6478'/></marker></defs><rect x='8' y='40' width='110' height='49' rx='7' fill='#fff' stroke='#1f2a44' stroke-width='1.2'/><text x='22' y='62' font-size='12.5' font-weight='700' fill='#1f2a44'>Browser</text><text x='22' y='80' font-size='10.5' fill='#1f2a44'>sends HTTPS</text><rect x='150' y='32' width='140' height='64' rx='7' fill='#fff' stroke='#1f2a44' stroke-width='1.2'/><text x='164' y='54' font-size='12.5' font-weight='700' fill='#1f2a44'>NGINX</text><text x='164' y='72' font-size='10.5' fill='#1f2a44'>TLS, static files</text><text x='164' y='87' font-size='10.5' fill='#1f2a44'>forwards the rest</text><rect x='322' y='32' width='150' height='64' rx='7' fill='#e3f3f0' stroke='#0f7b6c' stroke-width='1.6'/><text x='336' y='54' font-size='12.5' font-weight='700' fill='#1f2a44'>FastAPI workers</text><text x='336' y='72' font-size='10.5' fill='#1f2a44'>business logic</text><text x='336' y='87' font-size='10.5' fill='#1f2a44'>stateless, many copies</text><path d='M506 47 A60.0 7 0 0 1 626 47 V89 A60.0 7 0 0 1 506 89 Z' fill='#e2f4ec' stroke='#178a5e' stroke-width='1.6'/><path d='M506 47 A60.0 7 0 0 0 626 47' fill='none' stroke='#178a5e' stroke-width='1.6'/><text x='566.0' y='76.0' text-anchor='middle' font-size='11.5' font-weight='600' fill='#1f2a44'>PostgreSQL</text><line x1='118' y1='64' x2='146' y2='64' stroke='#0f7b6c' stroke-width='1.6' marker-end='url(#ar-teal)'/><line x1='290' y1='64' x2='318' y2='64' stroke='#0f7b6c' stroke-width='1.6' marker-end='url(#ar-teal)'/><line x1='472' y1='64' x2='502' y2='64' stroke='#0f7b6c' stroke-width='1.6' marker-end='url(#ar-teal)'/><text x='320' y='132' text-anchor='middle' font-size='10' font-weight='400' fill='#5b6478' font-style='italic'>presentation → application → data; add a cache or a queue and it becomes N-tier</text></svg>