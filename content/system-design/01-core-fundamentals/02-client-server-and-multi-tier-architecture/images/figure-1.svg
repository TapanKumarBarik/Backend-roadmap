<svg width='640' height='228' role='img' viewBox='0 0 640 228' xmlns='http://www.w3.org/2000/svg' font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"><title>Figure 1: Client-Server and Multi-Tier Architecture</title><desc>As tiers are added, business logic moves out of the client and the database stops being exposed to every user.</desc><rect x='0' y='0' width='640' height='228' rx='16' fill='#fbfbf9' stroke='#e4e4de'/><defs><marker id='ar-blue' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#2f6fdb'/></marker><marker id='ar-green' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#178a5e'/></marker><marker id='ar-purple' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#6f52c9'/></marker><marker id='ar-orange' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#d0702c'/></marker><marker id='ar-pink' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#c43d6e'/></marker><marker id='ar-grey' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#6b7280'/></marker><marker id='ar-teal' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#0f7b6c'/></marker><marker id='ar-ink' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#5b6478'/></marker></defs><rect x='10' y='8' width='196' height='212' rx='8' fill='#fff' stroke='#d9d4c7'/><text x='24' y='30' text-anchor='start' font-size='12.5' font-weight='700' fill='#1f2a44'>Single-tier</text><text x='24' y='46' text-anchor='start' font-size='9.5' font-weight='400' fill='#5b6478'>UI + logic + data in one app</text><rect x='222' y='8' width='196' height='212' rx='8' fill='#fff' stroke='#d9d4c7'/><text x='236' y='30' text-anchor='start' font-size='12.5' font-weight='700' fill='#1f2a44'>Two-tier</text><text x='236' y='46' text-anchor='start' font-size='9.5' font-weight='400' fill='#5b6478'>client talks straight to the DB</text><rect x='434' y='8' width='196' height='212' rx='8' fill='#fff' stroke='#d9d4c7'/><text x='448' y='30' text-anchor='start' font-size='12.5' font-weight='700' fill='#1f2a44'>Three-tier</text><text x='448' y='46' text-anchor='start' font-size='9.5' font-weight='400' fill='#5b6478'>each tier talks only to its neighbour</text><rect x='30' y='70' width='156' height='49' rx='7' fill='#fff' stroke='#1f2a44' stroke-width='1.2'/><text x='44' y='92' font-size='12.5' font-weight='700' fill='#1f2a44'>Desktop app</text><text x='44' y='110' font-size='10.5' fill='#1f2a44'>UI, logic, local file</text><rect x='242' y='64' width='156' height='49' rx='7' fill='#fff' stroke='#1f2a44' stroke-width='1.2'/><text x='256' y='86' font-size='12.5' font-weight='700' fill='#1f2a44'>Client</text><text x='256' y='104' font-size='10.5' fill='#1f2a44'>UI + business logic</text><path d='M282 141 A38.0 7 0 0 1 358 141 V171 A38.0 7 0 0 1 282 171 Z' fill='#e2f4ec' stroke='#178a5e' stroke-width='1.6'/><path d='M282 141 A38.0 7 0 0 0 358 141' fill='none' stroke='#178a5e' stroke-width='1.6'/><text x='320.0' y='164.0' text-anchor='middle' font-size='11' font-weight='600' fill='#1f2a44'>DB</text><line x1='320' y1='113' x2='320' y2='132' stroke='#0f7b6c' stroke-width='1.6' marker-end='url(#ar-teal)'/><rect x='454' y='56' width='156' height='49' rx='7' fill='#fff' stroke='#1f2a44' stroke-width='1.2'/><text x='468' y='78' font-size='12.5' font-weight='700' fill='#1f2a44'>Presentation</text><text x='468' y='96' font-size='10.5' fill='#1f2a44'>browser, mobile app</text><rect x='454' y='114' width='156' height='49' rx='7' fill='#e3f3f0' stroke='#0f7b6c' stroke-width='1.6'/><text x='468' y='136' font-size='12.5' font-weight='700' fill='#1f2a44'>Application</text><text x='468' y='154' font-size='10.5' fill='#1f2a44'>business rules</text><rect x='454' y='172' width='156' height='49' rx='7' fill='#fff' stroke='#1f2a44' stroke-width='1.2'/><text x='468' y='194' font-size='12.5' font-weight='700' fill='#1f2a44'>Data</text><text x='468' y='212' font-size='10.5' fill='#1f2a44'>stores, protects</text></svg>