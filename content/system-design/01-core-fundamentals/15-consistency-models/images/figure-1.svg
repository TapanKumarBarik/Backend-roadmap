<svg width='640' height='150' role='img' viewBox='0 0 640 150' xmlns='http://www.w3.org/2000/svg' font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"><title>Figure 1: Consistency Models</title><desc>Stronger models are easier to reason about but need coordination; weaker ones are cheaper and stay available.</desc><rect x='0' y='0' width='640' height='150' rx='16' fill='#fbfbf9' stroke='#e4e4de'/><defs><marker id='ar-blue' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#2f6fdb'/></marker><marker id='ar-green' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#178a5e'/></marker><marker id='ar-purple' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#6f52c9'/></marker><marker id='ar-orange' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#d0702c'/></marker><marker id='ar-pink' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#c43d6e'/></marker><marker id='ar-grey' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#6b7280'/></marker><marker id='ar-teal' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#0f7b6c'/></marker><marker id='ar-ink' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#5b6478'/></marker></defs><line x1='20' y1='40' x2='620' y2='40' stroke='#1f2a44' stroke-width='1.4' marker-end='url(#ar-ink)'/><text x='20' y='24' text-anchor='start' font-size='10' font-weight='600' fill='#1f2a44'>stronger: easier to reason about, costs latency</text><text x='620' y='24' text-anchor='end' font-size='10' font-weight='600' fill='#1f2a44'>weaker: cheaper, faster, more available</text><rect x='14' y='62' width='144' height='49' rx='7' fill='#e3f3f0' stroke='#0f7b6c' stroke-width='1.6'/><text x='28' y='84' font-size='12.5' font-weight='700' fill='#1f2a44'>Linearizable</text><text x='28' y='102' font-size='10.5' fill='#1f2a44'>like one copy</text><rect x='170' y='62' width='144' height='49' rx='7' fill='#fff' stroke='#1f2a44' stroke-width='1.2'/><text x='184' y='84' font-size='12.5' font-weight='700' fill='#1f2a44'>Sequential</text><text x='184' y='102' font-size='10.5' fill='#1f2a44'>one order for all</text><rect x='326' y='62' width='144' height='49' rx='7' fill='#fff' stroke='#1f2a44' stroke-width='1.2'/><text x='340' y='84' font-size='12.5' font-weight='700' fill='#1f2a44'>Causal</text><text x='340' y='102' font-size='10.5' fill='#1f2a44'>causes before effects</text><rect x='482' y='62' width='144' height='49' rx='7' fill='#e3f3f0' stroke='#0f7b6c' stroke-width='1.6'/><text x='496' y='84' font-size='12.5' font-weight='700' fill='#1f2a44'>Eventual</text><text x='496' y='102' font-size='10.5' fill='#1f2a44'>converges over time</text></svg>