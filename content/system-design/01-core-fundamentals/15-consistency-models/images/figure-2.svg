<svg width='640' height='220' role='img' viewBox='0 0 640 220' xmlns='http://www.w3.org/2000/svg' font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"><title>Figure 2: Consistency Models</title><desc>The write goes to the primary, the reload reads a lagging replica, and the author sees the old value.</desc><rect x='0' y='0' width='640' height='220' rx='16' fill='#fbfbf9' stroke='#e4e4de'/><defs><marker id='ar-blue' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#2f6fdb'/></marker><marker id='ar-green' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#178a5e'/></marker><marker id='ar-purple' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#6f52c9'/></marker><marker id='ar-orange' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#d0702c'/></marker><marker id='ar-pink' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#c43d6e'/></marker><marker id='ar-grey' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#6b7280'/></marker><marker id='ar-teal' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#0f7b6c'/></marker><marker id='ar-ink' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#5b6478'/></marker></defs><line x1='80' y1='42' x2='80' y2='172' stroke='#d9d4c7' stroke-dasharray='4 4'/><rect x='32.0' y='8' width='96' height='34' rx='6' fill='#fff' stroke='#1f2a44' stroke-width='1.2'/><text x='80' y='29' text-anchor='middle' font-size='12' font-weight='700' fill='#1f2a44'>Author</text><line x1='260' y1='42' x2='260' y2='172' stroke='#d9d4c7' stroke-dasharray='4 4'/><rect x='212.0' y='8' width='96' height='34' rx='6' fill='#fff' stroke='#1f2a44' stroke-width='1.2'/><text x='260' y='29' text-anchor='middle' font-size='12' font-weight='700' fill='#1f2a44'>Primary</text><line x1='440' y1='42' x2='440' y2='172' stroke='#d9d4c7' stroke-dasharray='4 4'/><rect x='392.0' y='8' width='96' height='34' rx='6' fill='#fff' stroke='#1f2a44' stroke-width='1.2'/><text x='440' y='29' text-anchor='middle' font-size='12' font-weight='700' fill='#1f2a44'>Replica</text><line x1='80' y1='74' x2='256' y2='74' stroke='#0f7b6c' stroke-width='1.6' marker-end='url(#ar-teal)'/><circle cx='94' cy='62' r='9' fill='#0f7b6c'/><text x='94' y='65.8' text-anchor='middle' font-size='10.5' font-weight='700' fill='#fff'>1</text><text x='108' y='66' font-size='10.5' font-weight='600' fill='#0f7b6c'>save new bio</text><line x1='260' y1='108' x2='436' y2='108' stroke='#5b6478' stroke-width='1.6' marker-end='url(#ar-teal)'/><circle cx='274' cy='96' r='9' fill='#0f7b6c'/><text x='274' y='99.8' text-anchor='middle' font-size='10.5' font-weight='700' fill='#fff'>2</text><text x='288' y='100' font-size='10.5' font-weight='600' fill='#5b6478'>replicate (1 s behind)</text><line x1='80' y1='150' x2='436' y2='150' stroke='#c43d6e' stroke-width='1.6' marker-end='url(#ar-teal)'/><circle cx='94' cy='138' r='9' fill='#0f7b6c'/><text x='94' y='141.8' text-anchor='middle' font-size='10.5' font-weight='700' fill='#fff'>3</text><text x='108' y='142' font-size='10.5' font-weight='600' fill='#c43d6e'>reload page: reads the replica</text><rect x='470' y='104' width='162' height='49' rx='7' fill='#fff' stroke='#1f2a44' stroke-width='1.2'/><text x='484' y='126' font-size='12.5' font-weight='700' fill='#1f2a44'>Shows the old bio</text><text x='484' y='144' font-size='10.5' fill='#1f2a44'>“my save failed?”</text><text x='320' y='206' text-anchor='middle' font-size='10.5' font-weight='400' fill='#5b6478' font-style='italic'>fine for other users for a moment; not fine for the author</text></svg>