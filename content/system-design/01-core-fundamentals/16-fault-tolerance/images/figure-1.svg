<svg width='640' height='200' role='img' viewBox='0 0 640 200' xmlns='http://www.w3.org/2000/svg' font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"><title>Figure 1: Fault Tolerance</title><desc>Replicas in three availability zones. If one zone goes down, the load balancer stops sending it traffic and the other two carry the load.</desc><rect x='0' y='0' width='640' height='200' rx='16' fill='#fbfbf9' stroke='#e4e4de'/><defs><marker id='ar-blue' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#2f6fdb'/></marker><marker id='ar-green' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#178a5e'/></marker><marker id='ar-purple' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#6f52c9'/></marker><marker id='ar-orange' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#d0702c'/></marker><marker id='ar-pink' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#c43d6e'/></marker><marker id='ar-grey' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#6b7280'/></marker><marker id='ar-teal' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#0f7b6c'/></marker><marker id='ar-ink' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#5b6478'/></marker></defs><rect x='236' y='8' width='170' height='49' rx='7' fill='#fff' stroke='#1f2a44' stroke-width='1.2'/><text x='250' y='30' font-size='12.5' font-weight='700' fill='#1f2a44'>Load balancer</text><text x='250' y='48' font-size='10.5' fill='#1f2a44'>health checks every few s</text><rect x='20' y='96' width='190' height='96' rx='8' fill='#e3f3f0' stroke='#0f7b6c' stroke-dasharray='0'/><text x='34' y='118' text-anchor='start' font-size='12' font-weight='700' fill='#1f2a44'>Zone A</text><text x='34' y='138' text-anchor='start' font-size='10.5' font-weight='400' fill='#5b6478'>app + DB replica</text><text x='34' y='156' text-anchor='start' font-size='10' font-weight='400' fill='#5b6478'>sized for 50% of load</text><line x1='320' y1='54' x2='115' y2='94' stroke='#0f7b6c' stroke-width='1.6' marker-end='url(#ar-teal)'/><rect x='230' y='96' width='190' height='96' rx='8' fill='#fbe6ee' stroke='#c43d6e' stroke-dasharray='5 4'/><text x='244' y='118' text-anchor='start' font-size='12' font-weight='700' fill='#1f2a44'>Zone B</text><text x='244' y='138' text-anchor='start' font-size='10.5' font-weight='600' fill='#c43d6e'>zone down: no traffic</text><text x='244' y='156' text-anchor='start' font-size='10' font-weight='400' fill='#5b6478'></text><rect x='440' y='96' width='190' height='96' rx='8' fill='#e3f3f0' stroke='#0f7b6c' stroke-dasharray='0'/><text x='454' y='118' text-anchor='start' font-size='12' font-weight='700' fill='#1f2a44'>Zone C</text><text x='454' y='138' text-anchor='start' font-size='10.5' font-weight='400' fill='#5b6478'>app + DB replica</text><text x='454' y='156' text-anchor='start' font-size='10' font-weight='400' fill='#5b6478'>sized for 50% of load</text><line x1='320' y1='54' x2='535' y2='94' stroke='#0f7b6c' stroke-width='1.6' marker-end='url(#ar-teal)'/><line x1='320' y1='54' x2='320' y2='90' stroke='#c43d6e' stroke-width='1.6' stroke-dasharray='4 4'/></svg>