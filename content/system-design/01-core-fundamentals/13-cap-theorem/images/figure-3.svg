<svg width='640' height='220' role='img' viewBox='0 0 640 220' xmlns='http://www.w3.org/2000/svg' font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"><title>Figure 3: CAP Theorem</title><desc>Left: a 5-node CP cluster split 3 / 2; only the majority side accepts writes. Right: an AP store accepts writes on both sides and merges them when the network heals (here, by keeping the later write).</desc><rect x='0' y='0' width='640' height='220' rx='16' fill='#fbfbf9' stroke='#e4e4de'/><defs><marker id='ar-blue' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#2f6fdb'/></marker><marker id='ar-green' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#178a5e'/></marker><marker id='ar-purple' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#6f52c9'/></marker><marker id='ar-orange' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#d0702c'/></marker><marker id='ar-pink' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#c43d6e'/></marker><marker id='ar-grey' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#6b7280'/></marker><marker id='ar-teal' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#0f7b6c'/></marker><marker id='ar-ink' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#5b6478'/></marker></defs><rect x='8' y='8' width='302' height='204' rx='8' fill='#fff' stroke='#d9d4c7'/><text x='22' y='30' text-anchor='start' font-size='12' font-weight='700' fill='#1f2a44'>CP · ZooKeeper, etcd</text><rect x='330' y='8' width='302' height='204' rx='8' fill='#fff' stroke='#d9d4c7'/><text x='344' y='30' text-anchor='start' font-size='12' font-weight='700' fill='#1f2a44'>AP · Cassandra (default)</text><circle cx='60' cy='88' r='13' fill='#e3f3f0' stroke='#0f7b6c' stroke-width='1.5'/><circle cx='96' cy='88' r='13' fill='#e3f3f0' stroke='#0f7b6c' stroke-width='1.5'/><circle cx='132' cy='88' r='13' fill='#e3f3f0' stroke='#0f7b6c' stroke-width='1.5'/><circle cx='220' cy='88' r='13' fill='#fff' stroke='#5b6478' stroke-width='1.5'/><circle cx='256' cy='88' r='13' fill='#fff' stroke='#5b6478' stroke-width='1.5'/><line x1='186' y1='54' x2='186' y2='122' stroke='#c43d6e' stroke-width='2' stroke-dasharray='6 5'/><rect x='22' y='136' width='140' height='49' rx='7' fill='#e3f3f0' stroke='#0f7b6c' stroke-width='1.6'/><text x='36' y='158' font-size='12.5' font-weight='700' fill='#1f2a44'>Majority (3)</text><text x='36' y='176' font-size='10.5' fill='#1f2a44'>keeps accepting writes</text><rect x='172' y='136' width='126' height='49' rx='7' fill='#fff' stroke='#1f2a44' stroke-width='1.2'/><text x='186' y='158' font-size='12.5' font-weight='700' fill='#1f2a44'>Minority (2)</text><text x='186' y='176' font-size='10.5' fill='#1f2a44'>refuses writes</text><circle cx='420' cy='82' r='17' fill='#e3f3f0' stroke='#0f7b6c' stroke-width='1.5'/><text x='420' y='87' text-anchor='middle' font-size='13' font-weight='700' fill='#1f2a44'>A</text><circle cx='544' cy='82' r='17' fill='#e3f3f0' stroke='#0f7b6c' stroke-width='1.5'/><text x='544' y='87' text-anchor='middle' font-size='13' font-weight='700' fill='#1f2a44'>B</text><line x1='482' y1='54' x2='482' y2='112' stroke='#c43d6e' stroke-width='2' stroke-dasharray='6 5'/><text x='420' y='120' text-anchor='middle' font-size='10.5' font-weight='600' fill='#1f2a44'>accepts x = 2</text><text x='544' y='120' text-anchor='middle' font-size='10.5' font-we