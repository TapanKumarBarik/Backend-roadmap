<svg width='640' height='300' role='img' viewBox='0 0 640 300' xmlns='http://www.w3.org/2000/svg' font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"><title>Figure 1: CAP Theorem</title><desc>During a partition, node B cannot both stay consistent and keep answering. Whatever it does, it gives up one of the two.</desc><rect x='0' y='0' width='640' height='300' rx='16' fill='#fbfbf9' stroke='#e4e4de'/><defs><marker id='ar-blue' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#2f6fdb'/></marker><marker id='ar-green' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#178a5e'/></marker><marker id='ar-purple' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#6f52c9'/></marker><marker id='ar-orange' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#d0702c'/></marker><marker id='ar-pink' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#c43d6e'/></marker><marker id='ar-grey' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#6b7280'/></marker><marker id='ar-teal' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#0f7b6c'/></marker><marker id='ar-ink' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#5b6478'/></marker></defs><line x1='80' y1='42' x2='80' y2='176' stroke='#d9d4c7' stroke-dasharray='4 4'/><rect x='32.0' y='8' width='96' height='34' rx='6' fill='#fff' stroke='#1f2a44' stroke-width='1.2'/><text x='80' y='29' text-anchor='middle' font-size='12' font-weight='700' fill='#1f2a44'>Client 1</text><line x1='240' y1='42' x2='240' y2='176' stroke='#d9d4c7' stroke-dasharray='4 4'/><rect x='192.0' y='8' width='96' height='34' rx='6' fill='#fff' stroke='#1f2a44' stroke-width='1.2'/><text x='240' y='29' text-anchor='middle' font-size='12' font-weight='700' fill='#1f2a44'>Node A</text><line x1='400' y1='42' x2='400' y2='176' stroke='#d9d4c7' stroke-dasharray='4 4'/><rect x='352.0' y='8' width='96' height='34' rx='6' fill='#fff' stroke='#1f2a44' stroke-width='1.2'/><text x='400' y='29' text-anchor='middle' font-size='12' font-weight='700' fill='#1f2a44'>Node B</text><line x1='560' y1='42' x2='560' y2='176' stroke='#d9d4c7' stroke-dasharray='4 4'/><rect x='512.0' y='8' width='96' height='34' rx='6' fill='#fff' stroke='#1f2a44' stroke-width='1.2'/><text x='560' y='29' text-anchor='middle' font-size='12' font-weight='700' fill='#1f2a44'>Client 2</text><line x1='320' y1='52' x2='320' y2='176' stroke='#c43d6e' stroke-width='2.2' stroke-dasharray='6 5'/><text x='320' y='192' text-anchor='middle' font-size='10' font-weight='600' fill='#c43d6e'>network partition</text><line x1='80' y1='82' x2='236' y2='82' stroke='#0f7b6c' stroke-width='1.6' marker-end='url(#ar-teal)'/><circle cx='94' cy='70' r='9' fill='#0f7b6c'/><text x='94' y='73.8' text-anchor='middle' font-size='10.5' font-weight='700' fill='#fff'>1</text><text x='108' y='74' font-size='10.5' font-weight='600' fill='#0f7b6c'>write x = 2</text><line x1='240' y1='122' x2='306' y2='122' stroke='#c43d6e' stroke-width='1.6' marker-end='url(#ar-teal)'/><circle cx='254' cy='110' r='9' fill='#0f7b6c'/><text x='254' y='113.8' text-anchor='middle' font-size='10.5' font-weight='700' fill='#fff'>2</text><text x='268' y='114' text-anchor='start' font-size='10.5' font-weight='600' fill='#c43d6e'>copy</text><text x='334' y='126' text-anchor='start' font-size='10.5' font-weight='700' fill='#c43d6e'>lost</text><line x1='560' y1='160' x2='404' y2='160' stroke='#0f7b6c' stroke-width='1.6' marker-end='url(#ar-teal)'/><circle cx='414' cy='148' r='9' fill='#0f7b6c'/><text x='414' y='151.8' text-anchor='middle' font-size='10.5' font-weight='700' fill='#fff'>3</text><text x='428' y='152' font-size='10.5' font-weight='600' fill='#0f7b6c'>read x</text><text x='408' y='66' text-anchor='start' font-size='10' font-weight='600' fill='#1f2a44'>still has x = 1</text><rect x='24' y='234' width='288' height='49' rx='7' fill='#fff' stroke='#1f2a44' stroke-width='1.2'/><text x='38' y='256' font-size='12.5' font-weight='700' fill='#1f2a44'>CP: refuse to answer</text><text x='38' y='274' font-size='10.5' fill='#1f2a44'>error or timeout, never stale data</text><rect x='328' y='234' width='288' height='49' rx='7' fill='#fff' stroke='#1f2a44' stroke-width='1.2'/><text x='342' y='256' font-size='12.5' font-weight='700' fill='#1f2a44'>AP: answer x = 1</text><text x='342' y='274' font-size='10.5' fill='#1f2a44'>always responds, but the data is stale</text><text x='320' y='224' text-anchor='middle' font-size='11' font-weight='700' fill='#1f2a44'>so B must pick one:</text></svg>