<svg width='640' height='110' role='img' viewBox='0 0 640 110' xmlns='http://www.w3.org/2000/svg' font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"><title>Figure 2: CAP Theorem</title><desc>Partitions are short, rare windows. CAP describes behaviour inside them; PACELC adds the latency vs consistency choice for the rest of the time.</desc><rect x='0' y='0' width='640' height='110' rx='16' fill='#fbfbf9' stroke='#e4e4de'/><defs><marker id='ar-blue' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#2f6fdb'/></marker><marker id='ar-green' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#178a5e'/></marker><marker id='ar-purple' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#6f52c9'/></marker><marker id='ar-orange' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#d0702c'/></marker><marker id='ar-pink' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#c43d6e'/></marker><marker id='ar-grey' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#6b7280'/></marker><marker id='ar-teal' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#0f7b6c'/></marker><marker id='ar-ink' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#5b6478'/></marker></defs><rect x='20' y='30' width='600' height='26' rx='5' fill='#e2f4ec' stroke='#178a5e'/><rect x='300' y='30' width='90' height='26' fill='#fbe6ee' stroke='#c43d6e'/><text x='345' y='22' text-anchor='middle' font-size='10.5' font-weight='600' fill='#c43d6e'>partition: choose C or A</text><text x='150' y='47' text-anchor='middle' font-size='10.5' font-weight='600' fill='#178a5e'>normal: C and A both possible</text><text x='505' y='47' text-anchor='middle' font-size='10.5' font-weight='600' fill='#178a5e'>normal again</text><text x='320' y='84' text-anchor='middle' font-size='10' font-weight='400' fill='#5b6478' font-style='italic'>the everyday trade-off without a partition is latency vs consistency → PACELC (next lesson)</text><text x='20' y='104' text-anchor='start' font-size='9.5' font-weight='400' fill='#5b6478'>time →</text></svg>