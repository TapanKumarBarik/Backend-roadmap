<svg width='640' height='170' role='img' viewBox='0 0 640 170' xmlns='http://www.w3.org/2000/svg' font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"><title>Figure 1: Non-Functional Requirements</title><desc>“Fast, reliable, scalable” mean nothing in a design review. A number can be tested and designed for.</desc><rect x='0' y='0' width='640' height='170' rx='16' fill='#fbfbf9' stroke='#e4e4de'/><defs><marker id='ar-blue' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#2f6fdb'/></marker><marker id='ar-green' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#178a5e'/></marker><marker id='ar-purple' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#6f52c9'/></marker><marker id='ar-orange' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#d0702c'/></marker><marker id='ar-pink' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#c43d6e'/></marker><marker id='ar-grey' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#6b7280'/></marker><marker id='ar-teal' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#0f7b6c'/></marker><marker id='ar-ink' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#5b6478'/></marker></defs><rect x='8' y='8' width='170' height='49' rx='7' fill='#fff' stroke='#1f2a44' stroke-width='1.2'/><text x='22' y='30' font-size='12.5' font-weight='700' fill='#1f2a44'>“Fast”</text><text x='22' y='48' font-size='10.5' fill='#1f2a44'>vague</text><rect x='260' y='8' width='370' height='49' rx='7' fill='#e3f3f0' stroke='#0f7b6c' stroke-width='1.6'/><text x='274' y='30' font-size='12.5' font-weight='700' fill='#1f2a44'>p99 latency &lt; 200 ms at 10,000 RPS</text><text x='274' y='48' font-size='10.5' fill='#1f2a44'>testable target</text><line x1='180' y1='32' x2='256' y2='32' stroke='#0f7b6c' stroke-width='1.6' marker-end='url(#ar-teal)'/><rect x='8' y='62' width='170' height='49' rx='7' fill='#fff' stroke='#1f2a44' stroke-width='1.2'/><text x='22' y='84' font-size='12.5' font-weight='700' fill='#1f2a44'>“Reliable”</text><text x='22' y='102' font-size='10.5' fill='#1f2a44'>vague</text><rect x='260' y='62' width='370' height='49' rx='7' fill='#e3f3f0' stroke='#0f7b6c' stroke-width='1.6'/><text x='274' y='84' font-size='12.5' font-weight='700' fill='#1f2a44'>99.9% monthly uptime (≈ 43 min down)</text><text x='274' y='102' font-size='10.5' fill='#1f2a44'>testable target</text><line x1='180' y1='86' x2='256' y2='86' stroke='#0f7b6c' stroke-width='1.6' marker-end='url(#ar-teal)'/><rect x='8' y='116' width='170' height='49' rx='7' fill='#fff' stroke='#1f2a44' stroke-width='1.2'/><text x='22' y='138' font-size='12.5' font-weight='700' fill='#1f2a44'>“Scalable”</text><text x='22' y='156' font-size='10.5' fill='#1f2a44'>vague</text><rect x='260' y='116' width='370' height='49' rx='7' fill='#e3f3f0' stroke='#0f7b6c' stroke-width='1.6'/><text x='274' y='138' font-size='12.5' font-weight='700' fill='#1f2a44'>10,000 RPS at peak, 3× growth per year</text><text x='274' y='156' font-size='10.5' fill='#1f2a44'>testable target</text><line x1='180' y1='140' x2='256' y2='140' stroke='#0f7b6c' stroke-width='1.6' marker-end='url(#ar-teal)'/></svg>