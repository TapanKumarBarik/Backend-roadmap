<svg width='640' height='130' role='img' viewBox='0 0 640 130' xmlns='http://www.w3.org/2000/svg' font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"><title>Figure 1: Vertical Scaling</title><desc>A database at its limit, fixed by resizing the machine.</desc><rect x='0' y='0' width='640' height='130' rx='16' fill='#fbfbf9' stroke='#e4e4de'/><defs><marker id='ar-blue' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#2f6fdb'/></marker><marker id='ar-green' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#178a5e'/></marker><marker id='ar-purple' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#6f52c9'/></marker><marker id='ar-orange' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#d0702c'/></marker><marker id='ar-pink' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#c43d6e'/></marker><marker id='ar-grey' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#6b7280'/></marker><marker id='ar-teal' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#0f7b6c'/></marker><marker id='ar-ink' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#5b6478'/></marker></defs><rect x='8' y='22' width='230' height='64' rx='7' fill='#fff' stroke='#1f2a44' stroke-width='1.2'/><text x='22' y='44' font-size='12.5' font-weight='700' fill='#1f2a44'>Before: 8 vCPU VM</text><text x='22' y='62' font-size='10.5' fill='#1f2a44'>PostgreSQL at 90% CPU at peak</text><text x='22' y='77' font-size='10.5' fill='#1f2a44'>slow queries</text><rect x='402' y='22' width='230' height='64' rx='7' fill='#e3f3f0' stroke='#0f7b6c' stroke-width='1.6'/><text x='416' y='44' font-size='12.5' font-weight='700' fill='#1f2a44'>After: 32 vCPU + more RAM</text><text x='416' y='62' font-size='10.5' fill='#1f2a44'>CPU ~30% at peak</text><text x='416' y='77' font-size='10.5' fill='#1f2a44'>same code, same data</text><line x1='240' y1='52' x2='398' y2='52' stroke='#0f7b6c' stroke-width='1.6' marker-end='url(#ar-teal)'/><text x='320' y='44' text-anchor='middle' font-size='10.5' font-weight='600' fill='#1f2a44'>resize</text><text x='320' y='118' text-anchor='middle' font-size='10.5' font-weight='400' fill='#5b6478' font-style='italic'>no sharding, no new code, no migration: only a restart or failover</text></svg>