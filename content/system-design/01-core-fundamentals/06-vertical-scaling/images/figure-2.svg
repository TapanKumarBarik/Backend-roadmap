<svg width='640' height='120' role='img' viewBox='0 0 640 120' xmlns='http://www.w3.org/2000/svg' font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"><title>Figure 2: Vertical Scaling</title><desc>Why scaling up is a first step, not a final answer.</desc><rect x='0' y='0' width='640' height='120' rx='16' fill='#fbfbf9' stroke='#e4e4de'/><defs><marker id='ar-blue' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#2f6fdb'/></marker><marker id='ar-green' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#178a5e'/></marker><marker id='ar-purple' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#6f52c9'/></marker><marker id='ar-orange' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#d0702c'/></marker><marker id='ar-pink' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#c43d6e'/></marker><marker id='ar-grey' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#6b7280'/></marker><marker id='ar-teal' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#0f7b6c'/></marker><marker id='ar-ink' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#5b6478'/></marker></defs><rect x='8' y='16' width='148' height='49' rx='7' fill='#fff' stroke='#1f2a44' stroke-width='1.2'/><text x='22' y='38' font-size='12.5' font-weight='700' fill='#1f2a44'>Hardware ceiling</text><text x='22' y='56' font-size='10.5' fill='#1f2a44'>biggest VM has a max</text><rect x='166' y='16' width='148' height='64' rx='7' fill='#fff' stroke='#1f2a44' stroke-width='1.2'/><text x='180' y='38' font-size='12.5' font-weight='700' fill='#1f2a44'>Steep cost</text><text x='180' y='56' font-size='10.5' fill='#1f2a44'>price grows faster</text><text x='180' y='71' font-size='10.5' fill='#1f2a44'>than performance</text><rect x='324' y='16' width='148' height='64' rx='7' fill='#fff' stroke='#1f2a44' stroke-width='1.2'/><text x='338' y='38' font-size='12.5' font-weight='700' fill='#1f2a44'>Single point</text><text x='338' y='56' font-size='10.5' fill='#1f2a44'>one machine dies,</text><text x='338' y='71' font-size='10.5' fill='#1f2a44'>service is down</text><rect x='482' y='16' width='148' height='64' rx='7' fill='#fff' stroke='#1f2a44' stroke-width='1.2'/><text x='496' y='38' font-size='12.5' font-weight='700' fill='#1f2a44'>Resize downtime</text><text x='496' y='56' font-size='10.5' fill='#1f2a44'>restart unless you</text><text x='496' y='71' font-size='10.5' fill='#1f2a44'>fail over first</text></svg>