<svg width='640' height='200' role='img' viewBox='0 0 640 200' xmlns='http://www.w3.org/2000/svg' font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"><title>Figure 1: PACELC Theorem</title><desc>PACELC as a decision. The “else” branch applies every day, with no failures at all.</desc><rect x='0' y='0' width='640' height='200' rx='16' fill='#fbfbf9' stroke='#e4e4de'/><defs><marker id='ar-blue' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#2f6fdb'/></marker><marker id='ar-green' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#178a5e'/></marker><marker id='ar-purple' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#6f52c9'/></marker><marker id='ar-orange' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#d0702c'/></marker><marker id='ar-pink' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#c43d6e'/></marker><marker id='ar-grey' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#6b7280'/></marker><marker id='ar-teal' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#0f7b6c'/></marker><marker id='ar-ink' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#5b6478'/></marker></defs><rect x='236' y='8' width='170' height='34' rx='7' fill='#fff' stroke='#1f2a44' stroke-width='1.2'/><text x='250' y='30' font-size='12.5' font-weight='700' fill='#1f2a44'>Is there a partition?</text><rect x='40' y='96' width='250' height='49' rx='7' fill='#fff' stroke='#1f2a44' stroke-width='1.2'/><text x='54' y='118' font-size='12.5' font-weight='700' fill='#1f2a44'>Yes (P): choose A or C</text><text x='54' y='136' font-size='10.5' fill='#1f2a44'>this half is just CAP</text><rect x='352' y='96' width='250' height='64' rx='7' fill='#e3f3f0' stroke='#0f7b6c' stroke-width='1.6'/><text x='366' y='118' font-size='12.5' font-weight='700' fill='#1f2a44'>Else (E): choose L or C</text><text x='366' y='136' font-size='10.5' fill='#1f2a44'>the new idea: every day,</text><text x='366' y='151' font-size='10.5' fill='#1f2a44'>no failures needed</text><line x1='290' y1='42' x2='190' y2='94' stroke='#0f7b6c' stroke-width='1.6' marker-end='url(#ar-teal)'/><line x1='352' y1='42' x2='452' y2='94' stroke='#0f7b6c' stroke-width='1.6' marker-end='url(#ar-teal)'/><text x='222' y='70' text-anchor='start' font-size='10' font-weight='600' fill='#1f2a44'>yes</text><text x='410' y='70' text-anchor='start' font-size='10' font-weight='600' fill='#1f2a44'>no</text></svg>