<svg width='640' height='190' role='img' viewBox='0 0 640 190' xmlns='http://www.w3.org/2000/svg' font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"><title>Figure 2: Availability</title><desc>Dependencies in a chain multiply availability down; independent replicas multiply the failure chance down.</desc><rect x='0' y='0' width='640' height='190' rx='16' fill='#fbfbf9' stroke='#e4e4de'/><defs><marker id='ar-blue' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#2f6fdb'/></marker><marker id='ar-green' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#178a5e'/></marker><marker id='ar-purple' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#6f52c9'/></marker><marker id='ar-orange' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#d0702c'/></marker><marker id='ar-pink' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#c43d6e'/></marker><marker id='ar-grey' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#6b7280'/></marker><marker id='ar-teal' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#0f7b6c'/></marker><marker id='ar-ink' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#5b6478'/></marker></defs><rect x='8' y='8' width='306' height='174' rx='8' fill='#fff' stroke='#d9d4c7'/><rect x='326' y='8' width='306' height='174' rx='8' fill='#fff' stroke='#d9d4c7'/><text x='22' y='30' text-anchor='start' font-size='12' font-weight='700' fill='#1f2a44'>Series: both needed → multiply</text><text x='340' y='30' text-anchor='start' font-size='12' font-weight='700' fill='#1f2a44'>Parallel: either works → multiply failures</text><rect x='26' y='60' width='116' height='49' rx='7' fill='#fff' stroke='#1f2a44' stroke-width='1.2'/><text x='40' y='82' font-size='12.5' font-weight='700' fill='#1f2a44'>Service A</text><text x='40' y='100' font-size='10.5' fill='#1f2a44'>99.9%</text><rect x='180' y='60' width='116' height='49' rx='7' fill='#fff' stroke='#1f2a44' stroke-width='1.2'/><text x='194' y='82' font-size='12.5' font-weight='700' fill='#1f2a44'>Service B</text><text x='194' y='100' font-size='10.5' fill='#1f2a44'>99.9%</text><line x1='142' y1='84' x2='176' y2='84' stroke='#0f7b6c' stroke-width='1.6' marker-end='url(#ar-teal)'/><text x='161' y='150' text-anchor='middle' font-size='11.5' font-weight='700' fill='#1f2a44'>0.999 × 0.999 ≈ 99.8%</text><text x='161' y='168' text-anchor='middle' font-size='10.5' font-weight='400' fill='#5b6478'>≈ 17.5 h down per year</text><rect x='350' y='46' width='116' height='49' rx='7' fill='#fff' stroke='#1f2a44' stroke-width='1.2'/><text x='364' y='68' font-size='12.5' font-weight='700' fill='#1f2a44'>Replica 1</text><text x='364' y='86' font-size='10.5' fill='#1f2a44'>99%</text><rect x='350' y='104' width='116' height='49' rx='7' fill='#fff' stroke='#1f2a44' stroke-width='1.2'/><text x='364' y='126' font-size='12.5' font-weight='700' fill='#1f2a44'>Replica 2</text><text x='364' y='144' font-size='10.5' fill='#1f2a44'>99%</text><rect x='500' y='74' width='116' height='49' rx='7' fill='#e3f3f0' stroke='#0f7b6c' stroke-width='1.6'/><text x='514' y='96' font-size='12.5' font-weight='700' fill='#1f2a44'>System</text><text x='514' y='114' font-size='10.5' fill='#1f2a44'>up if either is up</text><line x1='466' y1='70' x2='496' y2='92' stroke='#0f7b6c' stroke-width='1.6' marker-end='url(#ar-teal)'/><line x1='466' y1='128' x2='496' y2='106' stroke='#0f7b6c' stroke-width='1.6' marker-end='url(#ar-teal)'/><text x='479' y='168' text-anchor='middle' font-size='11.5' font-weight='700' fill='#1f2a44'>1 − 0.01 × 0.01 = 99.99%</text></svg>