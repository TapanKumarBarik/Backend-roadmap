<svg width='640' height='220' role='img' viewBox='0 0 640 220' xmlns='http://www.w3.org/2000/svg' font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"><title>Figure 1: Horizontal Scaling</title><desc>A horizontally scaled service: identical, stateless copies behind a load balancer, with state in shared stores.</desc><rect x='0' y='0' width='640' height='220' rx='16' fill='#fbfbf9' stroke='#e4e4de'/><defs><marker id='ar-blue' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#2f6fdb'/></marker><marker id='ar-green' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#178a5e'/></marker><marker id='ar-purple' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#6f52c9'/></marker><marker id='ar-orange' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#d0702c'/></marker><marker id='ar-pink' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#c43d6e'/></marker><marker id='ar-grey' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#6b7280'/></marker><marker id='ar-teal' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#0f7b6c'/></marker><marker id='ar-ink' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#5b6478'/></marker></defs><rect x='8' y='84' width='100' height='34' rx='7' fill='#fff' stroke='#1f2a44' stroke-width='1.2'/><text x='22' y='106' font-size='12.5' font-weight='700' fill='#1f2a44'>Users</text><rect x='140' y='76' width='120' height='49' rx='7' fill='#fff' stroke='#1f2a44' stroke-width='1.2'/><text x='154' y='98' font-size='12.5' font-weight='700' fill='#1f2a44'>Load balancer</text><text x='154' y='116' font-size='10.5' fill='#1f2a44'>spreads requests</text><rect x='300' y='18' width='120' height='49' rx='7' fill='#e3f3f0' stroke='#0f7b6c' stroke-width='1.6'/><text x='314' y='40' font-size='12.5' font-weight='700' fill='#1f2a44'>App copy 1</text><text x='314' y='58' font-size='10.5' fill='#1f2a44'>stateless</text><line x1='260' y1='100' x2='296' y2='42' stroke='#0f7b6c' stroke-width='1.6' marker-end='url(#ar-teal)'/><rect x='300' y='80' width='120' height='49' rx='7' fill='#e3f3f0' stroke='#0f7b6c' stroke-width='1.6'/><text x='314' y='102' font-size='12.5' font-weight='700' fill='#1f2a44'>App copy 2</text><text x='314' y='120' font-size='10.5' fill='#1f2a44'>stateless</text><line x1='260' y1='100' x2='296' y2='104' stroke='#0f7b6c' stroke-width='1.6' marker-end='url(#ar-teal)'/><rect x='300' y='142' width='120' height='49' rx='7' fill='#e3f3f0' stroke='#0f7b6c' stroke-width='1.6'/><text x='314' y='164' font-size='12.5' font-weight='700' fill='#1f2a44'>App copy 3</text><text x='314' y='182' font-size='10.5' fill='#1f2a44'>stateless</text><line x1='260' y1='100' x2='296' y2='166' stroke='#0f7b6c' stroke-width='1.6' marker-end='url(#ar-teal)'/><line x1='108' y1='100' x2='136' y2='100' stroke='#0f7b6c' stroke-width='1.6' marker-end='url(#ar-teal)'/><rect x='476' y='18' width='156' height='49' rx='7' fill='#fff' stroke='#1f2a44' stroke-width='1.2'/><text x='490' y='40' font-size='12.5' font-weight='700' fill='#1f2a44'>Redis</text><text x='490' y='58' font-size='10.5' fill='#1f2a44'>sessions</text><rect x='476' y='80' width='156' height='49' rx='7' fill='#fff' stroke='#1f2a44' stroke-width='1.2'/><text x='490' y='102' font-size='12.5' font-weight='700' fill='#1f2a44'>Object storage</text><text x='490' y='120' font-size='10.5' fill='#1f2a44'>files</text><rect x='476' y='142' width='156' height='49' rx='7' fill='#fff' stroke='#1f2a44' stroke-width='1.2'/><text x='490' y='164' font-size='12.5' font-weight='700' fill='#1f2a44'>Database</text><text x='490' y='182' font-size='10.5' fill='#1f2a44'>data</text><line x1='420' y1='42' x2='472' y2='42' stroke='#0f7b6c' stroke-width='1.6' marker-end='url(#ar-teal)'/><line x1='420' y1='104' x2='472' y2='104' stroke='#0f7b6c' stroke-width='1.6' marker-end='url(#ar-teal)'/><line x1='420' y1='166' x2='472' y2='166' stroke='#0f7b6c' stroke-width='1.6' marker-end='url(#ar-teal)'/><text x='320' y='212' text-anchor='middle' font-size='10.5' font-weight='400' fill='#5b6478' font-style='italic'>state lives outside the copies, so any copy can serve any request</text></svg>