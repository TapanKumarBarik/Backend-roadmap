<svg width='640' height='130' role='img' viewBox='0 0 640 130' xmlns='http://www.w3.org/2000/svg' font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"><title>Figure 1: Single Point of Failure</title><desc>The app tier is redundant, but sessions live on one Redis node. When it dies, every user is logged out at once.</desc><rect x='0' y='0' width='640' height='130' rx='16' fill='#fbfbf9' stroke='#e4e4de'/><defs><marker id='ar-blue' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#2f6fdb'/></marker><marker id='ar-green' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#178a5e'/></marker><marker id='ar-purple' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#6f52c9'/></marker><marker id='ar-orange' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#d0702c'/></marker><marker id='ar-pink' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#c43d6e'/></marker><marker id='ar-grey' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#6b7280'/></marker><marker id='ar-teal' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#0f7b6c'/></marker><marker id='ar-ink' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#5b6478'/></marker></defs><rect x='8' y='14' width='116' height='49' rx='7' fill='#fff' stroke='#1f2a44' stroke-width='1.2'/><text x='22' y='36' font-size='12.5' font-weight='700' fill='#1f2a44'>DNS</text><text x='22' y='54' font-size='10.5' fill='#1f2a44'>1 provider?</text><line x1='124' y1='38' x2='132' y2='38' stroke='#0f7b6c' stroke-width='1.6' marker-end='url(#ar-teal)'/><rect x='134' y='14' width='116' height='49' rx='7' fill='#fff' stroke='#1f2a44' stroke-width='1.2'/><text x='148' y='36' font-size='12.5' font-weight='700' fill='#1f2a44'>Load balancer</text><text x='148' y='54' font-size='10.5' fill='#1f2a44'>1 node?</text><line x1='250' y1='38' x2='258' y2='38' stroke='#0f7b6c' stroke-width='1.6' marker-end='url(#ar-teal)'/><rect x='260' y='14' width='116' height='49' rx='7' fill='#fff' stroke='#1f2a44' stroke-width='1.2'/><text x='274' y='36' font-size='12.5' font-weight='700' fill='#1f2a44'>App servers</text><text x='274' y='54' font-size='10.5' fill='#1f2a44'>3 copies ✓</text><line x1='376' y1='38' x2='384' y2='38' stroke='#0f7b6c' stroke-width='1.6' marker-end='url(#ar-teal)'/><rect x='386' y='14' width='116' height='49' rx='7' fill='#e3f3f0' stroke='#0f7b6c' stroke-width='1.6'/><text x='400' y='36' font-size='12.5' font-weight='700' fill='#1f2a44'>Redis</text><text x='400' y='54' font-size='10.5' fill='#1f2a44'>1 node!</text><line x1='502' y1='38' x2='510' y2='38' stroke='#0f7b6c' stroke-width='1.6' marker-end='url(#ar-teal)'/><rect x='512' y='14' width='116' height='49' rx='7' fill='#fff' stroke='#1f2a44' stroke-width='1.2'/><text x='526' y='36' font-size='12.5' font-weight='700' fill='#1f2a44'>Database</text><text x='526' y='54' font-size='10.5' fill='#1f2a44'>1 primary?</text><text x='320' y='112' text-anchor='middle' font-size='10.5' font-weight='400' fill='#5b6478' font-style='italic'>walk the path and ask of every box: if this dies, does the system go down?</text></svg>