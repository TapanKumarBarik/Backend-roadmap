<svg width='640' height='170' role='img' viewBox='0 0 640 170' xmlns='http://www.w3.org/2000/svg' font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"><title>Figure 2: Single Point of Failure</title><desc>Active-passive is simpler; active-active uses capacity better but needs state kept in sync across nodes.</desc><rect x='0' y='0' width='640' height='170' rx='16' fill='#fbfbf9' stroke='#e4e4de'/><defs><marker id='ar-blue' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#2f6fdb'/></marker><marker id='ar-green' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#178a5e'/></marker><marker id='ar-purple' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#6f52c9'/></marker><marker id='ar-orange' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#d0702c'/></marker><marker id='ar-pink' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#c43d6e'/></marker><marker id='ar-grey' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#6b7280'/></marker><marker id='ar-teal' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#0f7b6c'/></marker><marker id='ar-ink' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#5b6478'/></marker></defs><rect x='8' y='8' width='306' height='154' rx='8' fill='#fff' stroke='#d9d4c7'/><rect x='326' y='8' width='306' height='154' rx='8' fill='#fff' stroke='#d9d4c7'/><text x='22' y='30' text-anchor='start' font-size='12.5' font-weight='700' fill='#1f2a44'>Active-passive</text><text x='340' y='30' text-anchor='start' font-size='12.5' font-weight='700' fill='#1f2a44'>Active-active</text><rect x='26' y='48' width='126' height='49' rx='7' fill='#e3f3f0' stroke='#0f7b6c' stroke-width='1.6'/><text x='40' y='70' font-size='12.5' font-weight='700' fill='#1f2a44'>Primary</text><text x='40' y='88' font-size='10.5' fill='#1f2a44'>serves all traffic</text><rect x='172' y='48' width='126' height='49' rx='7' fill='#fff' stroke='#1f2a44' stroke-width='1.2'/><text x='186' y='70' font-size='12.5' font-weight='700' fill='#1f2a44'>Standby</text><text x='186' y='88' font-size='10.5' fill='#1f2a44'>idle, waits</text><text x='161' y='128' text-anchor='middle' font-size='10.5' font-weight='400' fill='#5b6478'>simpler · failover takes time</text><text x='161' y='146' text-anchor='middle' font-size='10.5' font-weight='400' fill='#5b6478'>standby capacity sits unused</text><rect x='344' y='48' width='126' height='49' rx='7' fill='#e3f3f0' stroke='#0f7b6c' stroke-width='1.6'/><text x='358' y='70' font-size='12.5' font-weight='700' fill='#1f2a44'>Node 1</text><text x='358' y='88' font-size='10.5' fill='#1f2a44'>serves traffic</text><rect x='490' y='48' width='126' height='49' rx='7' fill='#e3f3f0' stroke='#0f7b6c' stroke-width='1.6'/><text x='504' y='70' font-size='12.5' font-weight='700' fill='#1f2a44'>Node 2</text><text x='504' y='88' font-size='10.5' fill='#1f2a44'>serves traffic</text><text x='479' y='128' text-anchor='middle' font-size='10.5' font-weight='400' fill='#5b6478'>uses all capacity · fast failover</text><text x='479' y='146' text-anchor='middle' font-size='10.5' font-weight='400' fill='#5b6478'>keeping state in sync is harder</text></svg>