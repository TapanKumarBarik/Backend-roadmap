<svg width='640' height='170' role='img' viewBox='0 0 640 170' xmlns='http://www.w3.org/2000/svg' font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"><title>Figure 1: Scalability</title><desc>Fan-out on write: expensive writes, cheap reads. The real load parameter is followers per tweet.</desc><rect x='0' y='0' width='640' height='170' rx='16' fill='#fbfbf9' stroke='#e4e4de'/><defs><marker id='ar-blue' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#2f6fdb'/></marker><marker id='ar-green' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#178a5e'/></marker><marker id='ar-purple' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#6f52c9'/></marker><marker id='ar-orange' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#d0702c'/></marker><marker id='ar-pink' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#c43d6e'/></marker><marker id='ar-grey' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#6b7280'/></marker><marker id='ar-teal' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#0f7b6c'/></marker><marker id='ar-ink' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#5b6478'/></marker></defs><rect x='8' y='56' width='150' height='49' rx='7' fill='#fff' stroke='#1f2a44' stroke-width='1.2'/><text x='22' y='78' font-size='12.5' font-weight='700' fill='#1f2a44'>New tweet</text><text x='22' y='96' font-size='10.5' fill='#1f2a44'>~4.6K / s (2012)</text><rect x='236' y='48' width='170' height='64' rx='7' fill='#e3f3f0' stroke='#0f7b6c' stroke-width='1.6'/><text x='250' y='70' font-size='12.5' font-weight='700' fill='#1f2a44'>Fan-out on write</text><text x='250' y='88' font-size='10.5' fill='#1f2a44'>copy into every</text><text x='250' y='103' font-size='10.5' fill='#1f2a44'>follower&#x27;s timeline</text><rect x='486' y='10' width='146' height='34' rx='7' fill='#fff' stroke='#1f2a44' stroke-width='1.2'/><text x='500' y='32' font-size='12.5' font-weight='700' fill='#1f2a44'>Timeline 1</text><rect x='486' y='64' width='146' height='34' rx='7' fill='#fff' stroke='#1f2a44' stroke-width='1.2'/><text x='500' y='86' font-size='12.5' font-weight='700' fill='#1f2a44'>Timeline 2</text><rect x='486' y='118' width='146' height='34' rx='7' fill='#fff' stroke='#1f2a44' stroke-width='1.2'/><text x='500' y='140' font-size='12.5' font-weight='700' fill='#1f2a44'>Timeline 3</text><line x1='158' y1='80' x2='232' y2='80' stroke='#0f7b6c' stroke-width='1.6' marker-end='url(#ar-teal)'/><line x1='406' y1='80' x2='482' y2='27' stroke='#0f7b6c' stroke-width='1.6' marker-end='url(#ar-teal)'/><line x1='406' y1='80' x2='482' y2='81' stroke='#0f7b6c' stroke-width='1.6' marker-end='url(#ar-teal)'/><line x1='406' y1='80' x2='482' y2='135' stroke='#0f7b6c' stroke-width='1.6' marker-end='url(#ar-teal)'/><text x='320' y='162' text-anchor='middle' font-size='10' font-weight='400' fill='#5b6478' font-style='italic'>timeline reads ~300K / s are now cheap; celebrities are fetched at read time instead</text></svg>