<svg width='640' height='110' role='img' viewBox='0 0 640 110' xmlns='http://www.w3.org/2000/svg' font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"><title>Figure 1: Latency</title><desc>The four parts of latency. Queueing is the sneaky one: it grows fast near full utilization, even when your code doesn't get slower.</desc><rect x='0' y='0' width='640' height='110' rx='16' fill='#fbfbf9' stroke='#e4e4de'/><defs><marker id='ar-blue' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#2f6fdb'/></marker><marker id='ar-green' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#178a5e'/></marker><marker id='ar-purple' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#6f52c9'/></marker><marker id='ar-orange' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#d0702c'/></marker><marker id='ar-pink' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#c43d6e'/></marker><marker id='ar-grey' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#6b7280'/></marker><marker id='ar-teal' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#0f7b6c'/></marker><marker id='ar-ink' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#5b6478'/></marker></defs><rect x='8' y='20' width='142' height='49' rx='7' fill='#fff' stroke='#1f2a44' stroke-width='1.2'/><text x='22' y='42' font-size='12.5' font-weight='700' fill='#1f2a44'>Network</text><text x='22' y='60' font-size='10.5' fill='#1f2a44'>across the wire</text><rect x='162' y='20' width='122' height='49' rx='7' fill='#e3f3f0' stroke='#0f7b6c' stroke-width='1.6'/><text x='176' y='42' font-size='12.5' font-weight='700' fill='#1f2a44'>Queueing</text><text x='176' y='60' font-size='10.5' fill='#1f2a44'>waiting for a worker</text><rect x='296' y='20' width='132' height='49' rx='7' fill='#fff' stroke='#1f2a44' stroke-width='1.2'/><text x='310' y='42' font-size='12.5' font-weight='700' fill='#1f2a44'>Processing</text><text x='310' y='60' font-size='10.5' fill='#1f2a44'>running your code</text><rect x='440' y='20' width='162' height='49' rx='7' fill='#fff' stroke='#1f2a44' stroke-width='1.2'/><text x='454' y='42' font-size='12.5' font-weight='700' fill='#1f2a44'>I/O</text><text x='454' y='60' font-size='10.5' fill='#1f2a44'>disk, database</text><text x='320' y='100' text-anchor='middle' font-size='11' font-weight='600' fill='#1f2a44'>latency = network + queueing + processing + I/O</text></svg>