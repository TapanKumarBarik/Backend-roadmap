<svg width='640' height='190' role='img' viewBox='0 0 640 190' xmlns='http://www.w3.org/2000/svg' font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"><title>Figure 2: what is a network</title><desc>You give an order to the waiter, who carries it to the kitchen. The kitchen cooks and the waiter carries the plate back. You are the client, the waiter is the network, the kitchen is the server.</desc><rect x='0' y='0' width='640' height='190' rx='16' fill='#fbfbf9' stroke='#e4e4de'/><defs><marker id='ar-blue' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#2f6fdb'/></marker><marker id='ar-green' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#178a5e'/></marker><marker id='ar-purple' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#6f52c9'/></marker><marker id='ar-orange' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#d0702c'/></marker><marker id='ar-pink' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#c43d6e'/></marker><marker id='ar-grey' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#6b7280'/></marker><marker id='ar-teal' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#0f7b6c'/></marker><marker id='ar-ink' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#5b6478'/></marker></defs><rect x='10' y='20' width='120' height='50' rx='7' fill='#eee9fb' stroke='#6f52c9' stroke-width='1.6'/><text x='70.0' y='43.0' text-anchor='middle' font-size='12' font-weight='600' fill='#1f2a44'>You, the customer</text><text x='70.0' y='58.0' text-anchor='middle' font-size='10.5' fill='#5b6478'>= the client</text><rect x='260' y='20' width='120' height='50' rx='7' fill='#eee9fb' stroke='#6f52c9' stroke-width='1.6'/><text x='320.0' y='43.0' text-anchor='middle' font-size='12' font-weight='600' fill='#1f2a44'>Waiter</text><text x='320.0' y='58.0' text-anchor='middle' font-size='10.5' fill='#5b6478'>= the network</text><rect x='510' y='20' width='120' height='50' rx='7' fill='#eee9fb' stroke='#6f52c9' stroke-width='1.6'/><text x='570.0' y='43.0' text-anchor='middle' font-size='12' font-weight='600' fill='#1f2a44'>Kitchen</text><text x='570.0' y='58.0' text-anchor='middle' font-size='10.5' fill='#5b6478'>= the server</text><line x1='132' y1='38' x2='256' y2='38' stroke='#2f6fdb' stroke-width='1.5' marker-end='url(#ar-blue)'/><line x1='382' y1='38' x2='506' y2='38' stroke='#2f6fdb' stroke-width='1.5' marker-end='url(#ar-blue)'/><text x='194' y='32' text-anchor='middle' font-size='10.5' font-weight='700' fill='#2f6fdb'>order</text><text x='444' y='32' text-anchor='middle' font-size='10.5' font-weight='700' fill='#2f6fdb'>order</text><line x1='506' y1='60' x2='382' y2='60' stroke='#178a5e' stroke-width='1.5' marker-end='url(#ar-green)' stroke-dasharray='5 4'/><line x1='256' y1='60' x2='132' y2='60' stroke='#178a5e' stroke-width='1.5' marker-end='url(#ar-green)' stroke-dasharray='5 4'/><text x='444' y='76' text-anchor='middle' font-size='10.5' font-weight='700' fill='#178a5e'>plate</text><text x='194' y='76' text-anchor='middle' font-size='10.5' font-weight='700' fill='#178a5e'>plate</text><text x='10' y='112' text-anchor='start' font-size='11' font-weight='700' fill='#1f2a44'>Order = request · plate of food = response</text><text x='10' y='134' text-anchor='start' font-size='10.5' font-weight='600' fill='#d0702c'>Rule 1: you always speak first. The kitchen never sends food nobody ordered.</text><text x='10' y='154' text-anchor='start' font-size='10.5' font-weight='600' fill='#d0702c'>Rule 2: one kitchen cooks for many tables at the same time (one server, many clients).</text><text x='10' y='176' text-anchor='start' font-size='10.5' font-weight='400' fill='#5b6478' font-style='italic'>The waiter carries your order but never cooks: the network carries messages, it doesn&#x27;t answer them.</text></svg>