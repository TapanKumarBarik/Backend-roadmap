<svg width='640' height='182' role='img' viewBox='0 0 640 182' xmlns='http://www.w3.org/2000/svg' font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"><title>Figure 5: what is a network</title><desc>A timeline. The phone sends a request to the IRCTC server, which is busy, and no response comes back. The phone&#x27;s 10-second timer runs out: a timeout. After a short wait it retries, and this time a response arrives.</desc><rect x='0' y='0' width='640' height='182' rx='16' fill='#fbfbf9' stroke='#e4e4de'/><defs><marker id='ar-blue' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#2f6fdb'/></marker><marker id='ar-green' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#178a5e'/></marker><marker id='ar-purple' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#6f52c9'/></marker><marker id='ar-orange' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#d0702c'/></marker><marker id='ar-pink' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#c43d6e'/></marker><marker id='ar-grey' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#6b7280'/></marker><marker id='ar-teal' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#0f7b6c'/></marker><marker id='ar-ink' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#5b6478'/></marker></defs><text x='10' y='44' text-anchor='start' font-size='11' font-weight='700' fill='#2f6fdb'>Your phone</text><text x='10' y='124' text-anchor='start' font-size='11' font-weight='700' fill='#178a5e'>IRCTC server</text><line x1='96' y1='40' x2='630' y2='40' stroke='#2f6fdb' stroke-width='1.4'/><line x1='96' y1='120' x2='630' y2='120' stroke='#178a5e' stroke-width='1.4'/><line x1='110' y1='40' x2='160' y2='116' stroke='#2f6fdb' stroke-width='1.8' marker-end='url(#ar-blue)'/><text x='140' y='70' text-anchor='start' font-size='10' font-weight='700' fill='#2f6fdb'>request</text><text x='176' y='138' text-anchor='start' font-size='10' font-weight='700' fill='#c43d6e'>busy, crashed, or the message was lost:</text><text x='176' y='151' text-anchor='start' font-size='10' font-weight='700' fill='#c43d6e'>no response comes back</text><rect x='110' y='14' width='300' height='14' rx='4' fill='#fcefe4' stroke='#d0702c' stroke-width='1.3'/><text x='260' y='25' text-anchor='middle' font-size='9.5' font-weight='700' fill='#d0702c'>timer: 10 s</text><text x='416' y='25' text-anchor='start' font-size='10' font-weight='700' fill='#c43d6e'>timeout! show “something went wrong”</text><line x1='470' y1='40' x2='520' y2='116' stroke='#2f6fdb' stroke-width='1.8' marker-end='url(#ar-blue)'/><text x='470' y='70' text-anchor='end' font-size='10' font-weight='700' fill='#2f6fdb'>retry, after a short wait</text><line x1='530' y1='120' x2='580' y2='44' stroke='#178a5e' stroke-width='1.8' stroke-dasharray='5 4' marker-end='url(#ar-green)'/><text x='560' y='90' text-anchor='start' font-size='10' font-weight='700' fill='#178a5e'>response</text><text x='10' y='176' text-anchor='start' font-size='10.5' font-weight='400' fill='#5b6478' font-style='italic'>A retry must be safe: asking twice for a train list is harmless, paying twice is not.</text></svg>