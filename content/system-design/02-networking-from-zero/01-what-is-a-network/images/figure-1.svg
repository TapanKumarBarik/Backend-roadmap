<svg width='640' height='130' role='img' viewBox='0 0 640 130' xmlns='http://www.w3.org/2000/svg' font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"><title>Figure 1: what is a network</title><desc>A client on the left and a server on the right, with the network between them. A blue request arrow goes from the client to the server, and a green response arrow comes back.</desc><rect x='0' y='0' width='640' height='130' rx='16' fill='#fbfbf9' stroke='#e4e4de'/><defs><marker id='ar-blue' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#2f6fdb'/></marker><marker id='ar-green' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#178a5e'/></marker><marker id='ar-purple' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#6f52c9'/></marker><marker id='ar-orange' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#d0702c'/></marker><marker id='ar-pink' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#c43d6e'/></marker><marker id='ar-grey' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#6b7280'/></marker><marker id='ar-teal' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#0f7b6c'/></marker><marker id='ar-ink' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#5b6478'/></marker></defs><rect x='10' y='38' width='120' height='54' rx='7' fill='#e6eefc' stroke='#2f6fdb' stroke-width='1.6'/><text x='70.0' y='63.0' text-anchor='middle' font-size='13' font-weight='600' fill='#1f2a44'>Client</text><text x='70.0' y='78.0' text-anchor='middle' font-size='10.5' fill='#5b6478'>your phone&#x27;s app</text><rect x='510' y='38' width='120' height='54' rx='7' fill='#e2f4ec' stroke='#178a5e' stroke-width='1.6'/><text x='570.0' y='63.0' text-anchor='middle' font-size='13' font-weight='600' fill='#1f2a44'>Server</text><text x='570.0' y='78.0' text-anchor='middle' font-size='10.5' fill='#5b6478'>waits for requests</text><rect x='150' y='10' width='340' height='110' rx='9' fill='#f1f2f4' fill-opacity='0.45' stroke='#6b7280' stroke-opacity='0.5' stroke-dasharray='4 4'/><text x='160' y='26' font-size='10' font-weight='700' letter-spacing='0.06em' fill='#6b7280'>THE NETWORK (CARRIES MESSAGES)</text><line x1='132' y1='54' x2='506' y2='54' stroke='#2f6fdb' stroke-width='1.8' marker-end='url(#ar-blue)'/><text x='320' y='48' text-anchor='middle' font-size='11' font-weight='700' fill='#2f6fdb'>request: “send me running shoes”</text><line x1='508' y1='84' x2='134' y2='84' stroke='#178a5e' stroke-width='1.8' marker-end='url(#ar-green)' stroke-dasharray='5 4'/><text x='320' y='102' text-anchor='middle' font-size='11' font-weight='700' fill='#178a5e'>response: “here are 20 shoes”</text></svg>