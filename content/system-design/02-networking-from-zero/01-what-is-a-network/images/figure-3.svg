<svg width='640' height='214' role='img' viewBox='0 0 640 214' xmlns='http://www.w3.org/2000/svg' font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"><title>Figure 3: what is a network</title><desc>A sequence diagram with the Flipkart app on the left and Flipkart&#x27;s server on the right. Step 1 the app writes the request, step 2 it travels to the server, step 3 the server does the work, step 4 the response travels back, step 5 the app shows it.</desc><rect x='0' y='0' width='640' height='214' rx='16' fill='#fbfbf9' stroke='#e4e4de'/><defs><marker id='ar-blue' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#2f6fdb'/></marker><marker id='ar-green' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#178a5e'/></marker><marker id='ar-purple' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#6f52c9'/></marker><marker id='ar-orange' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#d0702c'/></marker><marker id='ar-pink' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#c43d6e'/></marker><marker id='ar-grey' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#6b7280'/></marker><marker id='ar-teal' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#0f7b6c'/></marker><marker id='ar-ink' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#5b6478'/></marker></defs><line x1='90' y1='40' x2='90' y2='206' stroke='#d9d4c7' stroke-width='1.2' stroke-dasharray='4 4'/><rect x='15.0' y='6' width='150' height='34' rx='6' fill='#e6eefc' stroke='#2f6fdb' stroke-width='1.5'/><text x='90' y='27' text-anchor='middle' font-size='12' font-weight='700' fill='#1f2a44'>Flipkart app (client)</text><line x1='330' y1='40' x2='330' y2='206' stroke='#d9d4c7' stroke-width='1.2' stroke-dasharray='4 4'/><rect x='255.0' y='6' width='150' height='34' rx='6' fill='#e2f4ec' stroke='#178a5e' stroke-width='1.5'/><text x='330' y='27' text-anchor='middle' font-size='12' font-weight='700' fill='#1f2a44'>Flipkart&#x27;s server</text><circle cx='22' cy='60' r='9' fill='#d0702c'/><text x='22' y='63.8' text-anchor='middle' font-size='10.5' font-weight='700' fill='#fff'>1</text><circle cx='90' cy='64' r='5' fill='#2f6fdb'/><text x='392' y='60' text-anchor='start' font-size='10' font-weight='600' fill='#1f2a44'>you tap Search: the app writes a request</text><text x='392' y='73' text-anchor='start' font-size='9.5' font-weight='600' fill='#d0702c'>job: say exactly what you want</text><circle cx='22' cy='90' r='9' fill='#d0702c'/><text x='22' y='93.8' text-anchor='middle' font-size='10.5' font-weight='700' fill='#fff'>2</text><line x1='90' y1='94' x2='326' y2='94' stroke='#2f6fdb' stroke-width='1.6' marker-end='url(#ar-blue)'/><text x='392' y='90' text-anchor='start' font-size='10' font-weight='600' fill='#1f2a44'>the request travels over Wi-Fi or mobile data</text><text x='392' y='103' text-anchor='start' font-size='9.5' font-weight='600' fill='#d0702c'>job of the network: carry it, not answer it</text><circle cx='22' cy='120' r='9' fill='#d0702c'/><text x='22' y='123.8' text-anchor='middle' font-size='10.5' font-weight='700' fill='#fff'>3</text><circle cx='330' cy='124' r='5' fill='#178a5e'/><text x='392' y='120' text-anchor='start' font-size='10' font-weight='600' fill='#1f2a44'>the server finds matching shoes, prices, photos</text><text x='392' y='133' text-anchor='start' font-size='9.5' font-weight='600' fill='#d0702c'>job: do the work (the thinking happens here)</text><circle cx='22' cy='150' r='9' fill='#d0702c'/><text x='22' y='153.8' text-anchor='middle' font-size='10.5' font-weight='700' fill='#fff'>4</text><line x1='330' y1='154' x2='94' y2='154' stroke='#178a5e' stroke-width='1.6' marker-end='url(#ar-green)' stroke-dasharray="5 4"/><text x='392' y='150' text-anchor='start' font-size='10' font-weight='600' fill='#1f2a44'>the response travels back: 20 shoes</text><text x='392' y='163' text-anchor='start' font-size='9.5' font-weight='600' fill='#d0702c'>job: answer what was asked</text><circle cx='22' cy='180' r='9' fill='#d0702c'/><text x='22' y='183.8' text-anchor='middle' font-size='10.5' font-weight='700' fill='#fff'>5</text><circle cx='90' cy='184' r='5' fill='#2f6fdb'/><text x='392' y='180' text-anchor='start' font-size='10' font-weight='600' fill='#1f2a44'>the app draws the shoes on your screen</text><text x='392' y='193' text-anchor='start' font-size='9.5' font-weight='600' fill='#d0702c'>job: show it</text></svg>