<svg width='640' height='124' role='img' viewBox='0 0 640 124' xmlns='http://www.w3.org/2000/svg' font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"><title>Figure 6: what is a network</title><desc>Your phone sends a request with hi to the WhatsApp server, which holds it and delivers it to your friend&#x27;s phone. Both phones are clients; there is no direct line between them.</desc><rect x='0' y='0' width='640' height='124' rx='16' fill='#fbfbf9' stroke='#e4e4de'/><defs><marker id='ar-blue' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#2f6fdb'/></marker><marker id='ar-green' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#178a5e'/></marker><marker id='ar-purple' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#6f52c9'/></marker><marker id='ar-orange' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#d0702c'/></marker><marker id='ar-pink' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#c43d6e'/></marker><marker id='ar-grey' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#6b7280'/></marker><marker id='ar-teal' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#0f7b6c'/></marker><marker id='ar-ink' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#5b6478'/></marker></defs><rect x='10' y='60' width='120' height='50' rx='7' fill='#e6eefc' stroke='#2f6fdb' stroke-width='1.6'/><text x='70.0' y='83.0' text-anchor='middle' font-size='12.5' font-weight='600' fill='#1f2a44'>Your phone</text><text x='70.0' y='98.0' text-anchor='middle' font-size='10.5' fill='#5b6478'>client</text><rect x='260' y='6' width='120' height='50' rx='7' fill='#e2f4ec' stroke='#178a5e' stroke-width='1.6'/><text x='320.0' y='29.0' text-anchor='middle' font-size='12' font-weight='600' fill='#1f2a44'>WhatsApp server</text><text x='320.0' y='44.0' text-anchor='middle' font-size='10.5' fill='#5b6478'>holds the message</text><rect x='510' y='60' width='120' height='50' rx='7' fill='#e6eefc' stroke='#2f6fdb' stroke-width='1.6'/><text x='570.0' y='83.0' text-anchor='middle' font-size='12.5' font-weight='600' fill='#1f2a44'>Friend&#x27;s phone</text><text x='570.0' y='98.0' text-anchor='middle' font-size='10.5' fill='#5b6478'>client too</text><path d='M130 72 L256 40' fill='none' stroke='#2f6fdb' stroke-width='1.5' marker-end='url(#ar-blue)'/><text x='150' y='46' text-anchor='start' font-size='10.5' font-weight='700' fill='#2f6fdb'>request: “hi”</text><path d='M382 40 L506 72' fill='none' stroke='#178a5e' stroke-width='1.5' marker-end='url(#ar-green)'/><text x='440' y='46' text-anchor='start' font-size='10.5' font-weight='700' fill='#178a5e'>delivers</text><line x1='136' y1='100' x2='504' y2='100' stroke='#c43d6e' stroke-width='1.4' stroke-dasharray='4 4'/><text x='320' y='105.0' text-anchor='middle' font-size='15' font-weight='700' fill='#c43d6e'>✕</text><text x='320' y='120' text-anchor='middle' font-size='10' font-weight='600' fill='#c43d6e'>the two phones don&#x27;t talk directly: the message goes through the server</text></svg>