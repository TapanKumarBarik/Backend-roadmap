<svg width='640' height='150' role='img' viewBox='0 0 640 150' xmlns='http://www.w3.org/2000/svg' font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"><title>Figure 5: Protocols and layers</title><desc>Left: a frame with a red damaged packet is dropped; a row of packets 5 to 8 shows packet 7 sent again. Right: a browser sends plain HTTP to a server port 443 that expects HTTPS and gets 400 Bad Request.</desc><rect x='0' y='0' width='640' height='150' rx='16' fill='#fbfbf9' stroke='#e4e4de'/><defs><marker id='ar-blue' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#2f6fdb'/></marker><marker id='ar-green' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#178a5e'/></marker><marker id='ar-purple' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#6f52c9'/></marker><marker id='ar-orange' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#d0702c'/></marker><marker id='ar-pink' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#c43d6e'/></marker><marker id='ar-grey' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#6b7280'/></marker><marker id='ar-teal' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#0f7b6c'/></marker><marker id='ar-ink' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#5b6478'/></marker></defs><rect x='14' y='20' width='64' height='28' fill='#f1f2f4' stroke='#6b7280' stroke-width='1.3'/><text x='46.0' y='37.5' text-anchor='middle' font-size='9' font-weight='700' fill='#6b7280'>to: router</text><rect x='78' y='20' width='150' height='28' fill='#fbe6ee' stroke='#c43d6e' stroke-width='1.3'/><text x='153.0' y='37.5' text-anchor='middle' font-size='9.8' font-weight='700' fill='#c43d6e'>packet (damaged)</text><rect x='228' y='20' width='56' height='28' fill='#f1f2f4' stroke='#6b7280' stroke-width='1.3'/><text x='256.0' y='37.5' text-anchor='middle' font-size='9' font-weight='700' fill='#6b7280'>check</text><text x='300' y='45.0' text-anchor='middle' font-size='15' font-weight='700' fill='#c43d6e'>✕</text><text x='14' y='68' text-anchor='start' font-size='10' font-weight='600' fill='#1f2a44'>Wi-Fi noise damages a frame: the check value doesn&#x27;t match,</text><text x='14' y='82' text-anchor='start' font-size='10' font-weight='600' fill='#1f2a44'>so the link layer drops it. TCP sees #7 missing and sends it again.</text><rect x='14' y='94' width='28' height='22' rx='4' fill='#e6eefc' stroke='#2f6fdb' stroke-width='1.4'/><text x='28.0' y='108.66666666666667' text-anchor='middle' font-size='11' font-weight='700' fill='#1f2a44'>5</text><rect x='48' y='94' width='28' height='22' rx='4' fill='#e6eefc' stroke='#2f6fdb' stroke-width='1.4'/><text x='62.0' y='108.66666666666667' text-anchor='middle' font-size='11' font-weight='700' fill='#1f2a44'>6</text><rect x='82' y='94' width='28' height='22' rx='4' fill='#fcefe4' stroke='#d0702c' stroke-width='1.4'/><text x='96.0' y='108.66666666666667' text-anchor='middle' font-size='11' font-weight='700' fill='#1f2a44'>7</text><rect x='116' y='94' width='28' height='22' rx='4' fill='#e6eefc' stroke='#2f6fdb' stroke-width='1.4'/><text x='130.0' y='108.66666666666667' text-anchor='middle' font-size='11' font-weight='700' fill='#1f2a44'>8</text><text x='156' y='104' text-anchor='start' font-size='10' font-weight='700' fill='#178a5e'>← #7 sent again;</text><text x='156' y='117' text-anchor='start' font-size='10' font-weight='700' fill='#178a5e'>the app never knows</text><line x1='330' y1='12' x2='330' y2='136' stroke='#d9d4c7' stroke-width='1'/><rect x='346' y='20' width='90' height='34' rx='7' fill='#e6eefc' stroke='#2f6fdb' stroke-width='1.6'/><text x='391.0' y='40.666666666666664' text-anchor='middle' font-size='11' font-weight='600' fill='#1f2a44'>browser</text><rect x='540' y='20' width='86' height='34' rx='7' fill='#e2f4ec' stroke='#178a5e' stroke-width='1.6'/><text x='583.0' y='40.5' text-anchor='middle' font-size='10.5' font-weight='600' fill='#1f2a44'>:443 HTTPS</text><line x1='440' y1='37' x2='536' y2='37' stroke='#2f6fdb' stroke-width='1.5' marker-end='url(#ar-blue)'/><text x='488' y='31' text-anchor='middle' font-size='9.5' font-weight='700' fill='#2f6fdb'>plain HTTP</text><text x='346' y='78' text-anchor='start' font-size='12' font-weight='700' fill='#c43d6e'>400 Bad Request</text><text x='346' y='96' text-anchor='start' font-size='10' font-weight='600' fill='#1f2a44'>Both sides must speak the same protocol,</text><text x='346' y='110' text-anchor='start' font-size='10' font-weight='600' fill='#1f2a44'>at every layer.</text><text x='14' y='142' text-anchor='start' font-size='10.2' font-weight='400' fill='#5b6478' font-style='italic'>Each layer handles its own problems: the link layer catches damage, TCP replaces what was lost.</text></svg>