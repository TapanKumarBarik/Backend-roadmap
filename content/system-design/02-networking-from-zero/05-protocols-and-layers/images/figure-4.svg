<svg width='640' height='168' role='img' viewBox='0 0 640 168' xmlns='http://www.w3.org/2000/svg' font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"><title>Figure 4: Protocols and layers</title><desc>Four numbered steps up the stack at the server: link, network, transport, application. Below, a bar of 1,500 bytes: IP header 20, TCP header 20, your data 1,460.</desc><rect x='0' y='0' width='640' height='168' rx='16' fill='#fbfbf9' stroke='#e4e4de'/><defs><marker id='ar-blue' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#2f6fdb'/></marker><marker id='ar-green' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#178a5e'/></marker><marker id='ar-purple' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#6f52c9'/></marker><marker id='ar-orange' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#d0702c'/></marker><marker id='ar-pink' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#c43d6e'/></marker><marker id='ar-grey' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#6b7280'/></marker><marker id='ar-teal' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#0f7b6c'/></marker><marker id='ar-ink' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#5b6478'/></marker></defs><text x='14' y='18' text-anchor='start' font-size='10.5' font-weight='700' fill='#1f2a44'>Up the stack at the server: each layer reads its own header, removes it, passes the rest up.</text><circle cx='24' cy='36' r='9' fill='#d0702c'/><text x='24' y='39.8' text-anchor='middle' font-size='10.5' font-weight='700' fill='#fff'>1</text><text x='40' y='40' text-anchor='start' font-size='10.5' font-weight='700' fill='#6b7280'>Link</text><text x='120' y='40' text-anchor='start' font-size='10' font-weight='600' fill='#1f2a44'>check the check value, remove the frame header and trailer</text><circle cx='24' cy='58' r='9' fill='#d0702c'/><text x='24' y='61.8' text-anchor='middle' font-size='10.5' font-weight='700' fill='#fff'>2</text><text x='40' y='62' text-anchor='start' font-size='10.5' font-weight='700' fill='#178a5e'>Network</text><text x='120' y='62' text-anchor='start' font-size='10' font-weight='600' fill='#1f2a44'>is the to-address mine? remove the IP header</text><circle cx='24' cy='80' r='9' fill='#d0702c'/><text x='24' y='83.8' text-anchor='middle' font-size='10.5' font-weight='700' fill='#fff'>3</text><text x='40' y='84' text-anchor='start' font-size='10.5' font-weight='700' fill='#d0702c'>Transport</text><text x='120' y='84' text-anchor='start' font-size='10' font-weight='600' fill='#1f2a44'>which port? in order? remove the TCP header</text><circle cx='24' cy='102' r='9' fill='#d0702c'/><text x='24' y='105.8' text-anchor='middle' font-size='10.5' font-weight='700' fill='#fff'>4</text><text x='40' y='106' text-anchor='start' font-size='10.5' font-weight='700' fill='#2f6fdb'>Application</text><text x='120' y='106' text-anchor='start' font-size='10' font-weight='600' fill='#1f2a44'>the web server reads GET /shoes</text><text x='14' y='134' text-anchor='start' font-size='10.5' font-weight='700' fill='#1f2a44'>On Ethernet, one packet is at most 1,500 bytes:</text><rect x='290' y='122' width='40' height='20' fill='#e2f4ec' stroke='#178a5e' stroke-width='1.3'/><text x='310.0' y='135.5' text-anchor='middle' font-size='9.3' font-weight='700' fill='#178a5e'>IP 20</text><rect x='330' y='122' width='40' height='20' fill='#fcefe4' stroke='#d0702c' stroke-width='1.3'/><text x='350.0' y='135.5' text-anchor='middle' font-size='9.3' font-weight='700' fill='#d0702c'>TCP 20</text><rect x='370' y='122' width='260' height='20' fill='#e6eefc' stroke='#2f6fdb' stroke-width='1.3'/><text x='500.0' y='135.5' text-anchor='middle' font-size='9.3' font-weight='700' fill='#2f6fdb'>your data: 1,460 bytes</text><text x='14' y='160' text-anchor='start' font-size='10.2' font-weight='400' fill='#5b6478' font-style='italic'>A 3 MB photo: 3,000,000 ÷ 1,460 ≈ 2,055 packets. The headers add 40 ÷ 1,460, under 3%.</text></svg>