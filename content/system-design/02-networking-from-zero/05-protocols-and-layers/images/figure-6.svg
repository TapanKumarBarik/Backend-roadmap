<svg width='640' height='140' role='img' viewBox='0 0 640 140' xmlns='http://www.w3.org/2000/svg' font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"><title>Figure 6: Protocols and layers</title><desc>A four-layer stack with the link layer in orange marked copper to fibre, and the network, transport and application layers marked unchanged. Text: no, only the link layer changed.</desc><rect x='0' y='0' width='640' height='140' rx='16' fill='#fbfbf9' stroke='#e4e4de'/><defs><marker id='ar-blue' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#2f6fdb'/></marker><marker id='ar-green' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#178a5e'/></marker><marker id='ar-purple' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#6f52c9'/></marker><marker id='ar-orange' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#d0702c'/></marker><marker id='ar-pink' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#c43d6e'/></marker><marker id='ar-grey' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#6b7280'/></marker><marker id='ar-teal' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#0f7b6c'/></marker><marker id='ar-ink' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#5b6478'/></marker></defs><rect x='14' y='12' width='260' height='24' rx='6' fill='#e6eefc' stroke='#2f6fdb' stroke-width='1.5'/><text x='24' y='28.0' text-anchor='start' font-size='10.5' font-weight='700' fill='#2f6fdb'>Application</text><text x='264' y='28.0' text-anchor='end' font-size='9.5' font-weight='600' fill='#2f6fdb'>HTTP</text><text x='284' y='28' text-anchor='start' font-size='10' font-weight='700' fill='#178a5e'>✓ unchanged</text><rect x='14' y='40' width='260' height='24' rx='6' fill='#fcefe4' stroke='#d0702c' stroke-width='1.5'/><text x='24' y='56.0' text-anchor='start' font-size='10.5' font-weight='700' fill='#d0702c'>Transport</text><text x='264' y='56.0' text-anchor='end' font-size='9.5' font-weight='600' fill='#d0702c'>TCP / UDP</text><text x='284' y='56' text-anchor='start' font-size='10' font-weight='700' fill='#178a5e'>✓ unchanged</text><rect x='14' y='68' width='260' height='24' rx='6' fill='#e2f4ec' stroke='#178a5e' stroke-width='1.5'/><text x='24' y='84.0' text-anchor='start' font-size='10.5' font-weight='700' fill='#178a5e'>Network</text><text x='264' y='84.0' text-anchor='end' font-size='9.5' font-weight='600' fill='#178a5e'>IP</text><text x='284' y='84' text-anchor='start' font-size='10' font-weight='700' fill='#178a5e'>✓ unchanged</text><rect x='14' y='96' width='260' height='24' rx='6' fill='#fcefe4' stroke='#d0702c' stroke-width='1.5'/><text x='24' y='112.0' text-anchor='start' font-size='10.5' font-weight='700' fill='#d0702c'>Link</text><text x='264' y='112.0' text-anchor='end' font-size='9.5' font-weight='600' fill='#d0702c'>copper → fibre</text><text x='380' y='36' text-anchor='start' font-size='10.5' font-weight='700' fill='#1f2a44'>Your home internet goes from</text><text x='380' y='50' text-anchor='start' font-size='10.5' font-weight='700' fill='#1f2a44'>copper to fibre. Does your browser</text><text x='380' y='64' text-anchor='start' font-size='10.5' font-weight='700' fill='#1f2a44'>need an update?</text><text x='380' y='90' text-anchor='start' font-size='10.5' font-weight='700' fill='#178a5e'>No. Only the link layer changed,</text><text x='380' y='104' text-anchor='start' font-size='10.5' font-weight='700' fill='#178a5e'>on that one link.</text><text x='14' y='132' text-anchor='start' font-size='10.2' font-weight='400' fill='#5b6478' font-style='italic'>That&#x27;s the whole point of layers: change one without touching the others.</text></svg>