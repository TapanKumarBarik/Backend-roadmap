<svg width='640' height='196' role='img' viewBox='0 0 640 196' xmlns='http://www.w3.org/2000/svg' font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"><title>Figure 3: Protocols and layers</title><desc>Four layers on the left. On the right, four rows: GET /shoes alone is the data; with a TCP header from port 51234 to 443 it is a segment; with an IP header in front it is a packet; with a link header to the router and a check value at the end it is a frame.</desc><rect x='0' y='0' width='640' height='196' rx='16' fill='#fbfbf9' stroke='#e4e4de'/><defs><marker id='ar-blue' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#2f6fdb'/></marker><marker id='ar-green' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#178a5e'/></marker><marker id='ar-purple' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#6f52c9'/></marker><marker id='ar-orange' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#d0702c'/></marker><marker id='ar-pink' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#c43d6e'/></marker><marker id='ar-grey' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#6b7280'/></marker><marker id='ar-teal' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#0f7b6c'/></marker><marker id='ar-ink' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#5b6478'/></marker></defs><rect x='14' y='14' width='96' height='30' rx='6' fill='#e6eefc' stroke='#2f6fdb' stroke-width='1.5'/><text x='24' y='33.0' text-anchor='start' font-size='10.5' font-weight='700' fill='#2f6fdb'>Application</text><text x='100' y='33.0' text-anchor='end' font-size='9.5' font-weight='600' fill='#2f6fdb'></text><rect x='14' y='54' width='96' height='30' rx='6' fill='#fcefe4' stroke='#d0702c' stroke-width='1.5'/><text x='24' y='73.0' text-anchor='start' font-size='10.5' font-weight='700' fill='#d0702c'>Transport</text><text x='100' y='73.0' text-anchor='end' font-size='9.5' font-weight='600' fill='#d0702c'></text><rect x='14' y='94' width='96' height='30' rx='6' fill='#e2f4ec' stroke='#178a5e' stroke-width='1.5'/><text x='24' y='113.0' text-anchor='start' font-size='10.5' font-weight='700' fill='#178a5e'>Network</text><text x='100' y='113.0' text-anchor='end' font-size='9.5' font-weight='600' fill='#178a5e'></text><rect x='14' y='134' width='96' height='30' rx='6' fill='#f1f2f4' stroke='#6b7280' stroke-width='1.5'/><text x='24' y='153.0' text-anchor='start' font-size='10.5' font-weight='700' fill='#6b7280'>Link</text><text x='100' y='153.0' text-anchor='end' font-size='9.5' font-weight='600' fill='#6b7280'></text><rect x='360' y='14' width='150' height='30' fill='#e6eefc' stroke='#2f6fdb' stroke-width='1.3'/><text x='435.0' y='32.5' text-anchor='middle' font-size='9.8' font-weight='700' fill='#2f6fdb'>GET /shoes</text><text x='520' y='33' text-anchor='start' font-size='10' font-weight='700' fill='#2f6fdb'>data</text><rect x='240' y='54' width='120' height='30' fill='#fcefe4' stroke='#d0702c' stroke-width='1.3'/><text x='300.0' y='72.5' text-anchor='middle' font-size='9.3' font-weight='700' fill='#d0702c'>TCP 51234→443 #1</text><rect x='360' y='54' width='150' height='30' fill='#e6eefc' stroke='#2f6fdb' stroke-width='1.3'/><text x='435.0' y='72.5' text-anchor='middle' font-size='9.8' font-weight='700' fill='#2f6fdb'>GET /shoes</text><text x='520' y='73' text-anchor='start' font-size='10' font-weight='700' fill='#d0702c'>= segment</text><rect x='180' y='94' width='60' height='30' fill='#e2f4ec' stroke='#178a5e' stroke-width='1.3'/><text x='210.0' y='112.5' text-anchor='middle' font-size='9.8' font-weight='700' fill='#178a5e'>IP</text><rect x='240' y='94' width='120' height='30' fill='#fcefe4' stroke='#d0702c' stroke-width='1.3'/><text x='300.0' y='112.5' text-anchor='middle' font-size='9.8' font-weight='700' fill='#d0702c'>TCP</text><rect x='360' y='94' width='150' height='30' fill='#e6eefc' stroke='#2f6fdb' stroke-width='1.3'/><text x='435.0' y='112.5' text-anchor='middle' font-size='9.8' font-weight='700' fill='#2f6fdb'>GET /shoes</text><text x='520' y='113' text-anchor='start' font-size='10' font-weight='700' fill='#178a5e'>= packet</text><rect x='116' y='134' width='64' height='30' fill='#f1f2f4' stroke='#6b7280' stroke-width='1.3'/><text x='148.0' y='152.5' text-anchor='middle' font-size='9' font-weight='700' fill='#6b7280'>to: router</text><rect x='180' y='134' width='60' height='30' fill='#e2f4ec' stroke='#178a5e' stroke-width='1.3'/><text x='210.0' y='152.5' text-anchor='middle' font-size='9.8' font-weight='700' fill='#178a5e'>IP</text><rect x='240' y='134' width='120' height='30' fill='#fcefe4' stroke='#d0702c' stroke-width='1.3'/><text x='300.0' y='152.5' text-anchor='middle' font-size='9.8' font-weight='700' fill='#d0702c'>TCP</text><rect x='360' y='134' width='150' height='30' fill='#e6eefc' stroke='#2f6fdb' stroke-width='1.3'/><text x='435.0' y='152.5' text-anchor='middle' font-size='9.8' font-weight='700' fill='#2f6fdb'>GET /shoes</text><rect x='510' y='134' width='50' height='30' fill='#f1f2f4' stroke='#6b7280' stroke-width='1.3'/><text x='535.0' y='152.5' text-anchor='middle' font-size='9' font-weight='700' fill='#6b7280'>check</text><text x='566' y='153' text-anchor='start' font-size='10' font-weight='700' fill='#6b7280'>= frame</text><line x1='628' y1='22' x2='628' y2='150' stroke='#5b6478' stroke-width='1.5' marker-end='url(#ar-ink)'/><text x=