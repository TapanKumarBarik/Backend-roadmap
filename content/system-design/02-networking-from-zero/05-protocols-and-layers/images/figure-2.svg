<svg width='640' height='186' role='img' viewBox='0 0 640 186' xmlns='http://www.w3.org/2000/svg' font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"><title>Figure 2: Protocols and layers</title><desc>Four purple analogy rows mapped by arrows onto four layers: the card to Application (HTTP), the tracking number to Transport (TCP), the city and street to Network (IP), and the van to Link (Wi-Fi, Ethernet).</desc><rect x='0' y='0' width='640' height='186' rx='16' fill='#fbfbf9' stroke='#e4e4de'/><defs><marker id='ar-blue' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#2f6fdb'/></marker><marker id='ar-green' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#178a5e'/></marker><marker id='ar-purple' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#6f52c9'/></marker><marker id='ar-orange' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#d0702c'/></marker><marker id='ar-pink' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#c43d6e'/></marker><marker id='ar-grey' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#6b7280'/></marker><marker id='ar-teal' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#0f7b6c'/></marker><marker id='ar-ink' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#5b6478'/></marker></defs><text x='14' y='18' text-anchor='start' font-size='11' font-weight='700' fill='#6f52c9'>Sending a gift</text><text x='390' y='18' text-anchor='start' font-size='11' font-weight='700' fill='#1f2a44'>The internet&#x27;s 4 layers</text><rect x='14' y='28' width='300' height='28' rx='6' fill='#eee9fb' stroke='#6f52c9' stroke-width='1.2'/><text x='24' y='46' text-anchor='start' font-size='10' font-weight='700' fill='#6f52c9'>the card, in a language your friend reads</text><line x1='318' y1='42' x2='386' y2='42' stroke='#6f52c9' stroke-width='1.5' marker-end='url(#ar-purple)'/><rect x='390' y='28' width='236' height='28' rx='6' fill='#e6eefc' stroke='#2f6fdb' stroke-width='1.5'/><text x='400' y='46.0' text-anchor='start' font-size='11' font-weight='700' fill='#2f6fdb'>Application</text><text x='616' y='46.0' text-anchor='end' font-size='10' font-weight='600' fill='#2f6fdb'>HTTP</text><rect x='14' y='64' width='300' height='28' rx='6' fill='#eee9fb' stroke='#6f52c9' stroke-width='1.2'/><text x='24' y='82' text-anchor='start' font-size='10' font-weight='700' fill='#6f52c9'>the tracking number, so nothing is lost</text><line x1='318' y1='78' x2='386' y2='78' stroke='#6f52c9' stroke-width='1.5' marker-end='url(#ar-purple)'/><rect x='390' y='64' width='236' height='28' rx='6' fill='#fcefe4' stroke='#d0702c' stroke-width='1.5'/><text x='400' y='82.0' text-anchor='start' font-size='11' font-weight='700' fill='#d0702c'>Transport</text><text x='616' y='82.0' text-anchor='end' font-size='10' font-weight='600' fill='#d0702c'>TCP</text><rect x='14' y='100' width='300' height='28' rx='6' fill='#eee9fb' stroke='#6f52c9' stroke-width='1.2'/><text x='24' y='118' text-anchor='start' font-size='10' font-weight='700' fill='#6f52c9'>the city and street address</text><line x1='318' y1='114' x2='386' y2='114' stroke='#6f52c9' stroke-width='1.5' marker-end='url(#ar-purple)'/><rect x='390' y='100' width='236' height='28' rx='6' fill='#e2f4ec' stroke='#178a5e' stroke-width='1.5'/><text x='400' y='118.0' text-anchor='start' font-size='11' font-weight='700' fill='#178a5e'>Network</text><text x='616' y='118.0' text-anchor='end' font-size='10' font-weight='600' fill='#178a5e'>IP</text><rect x='14' y='136' width='300' height='28' rx='6' fill='#eee9fb' stroke='#6f52c9' stroke-width='1.2'/><text x='24' y='154' text-anchor='start' font-size='10' font-weight='700' fill='#6f52c9'>the van, truck or plane, one stretch at a time</text><line x1='318' y1='150' x2='386' y2='150' stroke='#6f52c9' stroke-width='1.5' marker-end='url(#ar-purple)'/><rect x='390' y='136' width='236' height='28' rx='6' fill='#f1f2f4' stroke='#6b7280' stroke-width='1.5'/><text x='400' y='154.0' text-anchor='start' font-size='11' font-weight='700' fill='#6b7280'>Link</text><text x='616' y='154.0' text-anchor='end' font-size='10' font-weight='600' fill='#6b7280'>Wi-Fi, Ethernet</text><text x='14' y='178' text-anchor='start' font-size='10.2' font-weight='400' fill='#5b6478' font-style='italic'>Each person reads only their own label. Swap the truck for a train, and the card doesn&#x27;t change.</text></svg>