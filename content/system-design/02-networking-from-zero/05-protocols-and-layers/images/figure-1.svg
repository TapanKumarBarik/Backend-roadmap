<svg width='640' height='150' role='img' viewBox='0 0 640 150' xmlns='http://www.w3.org/2000/svg' font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"><title>Figure 1: Protocols and layers</title><desc>Left: a phone call in four numbered steps, hello, hi it&#x27;s Ravi, take turns to talk, bye. Right: a browser sends GET /shoes to a server, and the server answers 200 OK and the page.</desc><rect x='0' y='0' width='640' height='150' rx='16' fill='#fbfbf9' stroke='#e4e4de'/><defs><marker id='ar-blue' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#2f6fdb'/></marker><marker id='ar-green' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#178a5e'/></marker><marker id='ar-purple' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#6f52c9'/></marker><marker id='ar-orange' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#d0702c'/></marker><marker id='ar-pink' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#c43d6e'/></marker><marker id='ar-grey' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#6b7280'/></marker><marker id='ar-teal' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#0f7b6c'/></marker><marker id='ar-ink' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#5b6478'/></marker></defs><rect x='10' y='12' width='300' height='112' rx='9' fill='#eee9fb' fill-opacity='0.45' stroke='#6f52c9' stroke-opacity='0.5' stroke-dasharray='4 4'/><text x='20' y='28' font-size='10' font-weight='700' letter-spacing='0.06em' fill='#6f52c9'>A PHONE CALL</text><circle cx='34' cy='44' r='9' fill='#d0702c'/><text x='34' y='47.8' text-anchor='middle' font-size='10.5' font-weight='700' fill='#fff'>1</text><text x='50' y='48' text-anchor='start' font-size='10.5' font-weight='700' fill='#178a5e'>“Hello?”</text><circle cx='34' cy='65' r='9' fill='#d0702c'/><text x='34' y='68.8' text-anchor='middle' font-size='10.5' font-weight='700' fill='#fff'>2</text><text x='50' y='69' text-anchor='start' font-size='10.5' font-weight='700' fill='#2f6fdb'>“Hi, it&#x27;s Ravi.”</text><circle cx='34' cy='86' r='9' fill='#d0702c'/><text x='34' y='89.8' text-anchor='middle' font-size='10.5' font-weight='700' fill='#fff'>3</text><text x='50' y='90' text-anchor='start' font-size='10.5' font-weight='700' fill='#6b7280'>take turns to talk</text><circle cx='34' cy='107' r='9' fill='#d0702c'/><text x='34' y='110.8' text-anchor='middle' font-size='10.5' font-weight='700' fill='#fff'>4</text><text x='50' y='111' text-anchor='start' font-size='10.5' font-weight='700' fill='#6f52c9'>“Bye.” … “Bye.”</text><rect x='330' y='12' width='300' height='112' rx='9' fill='#e6eefc' fill-opacity='0.45' stroke='#2f6fdb' stroke-opacity='0.5' stroke-dasharray='4 4'/><text x='340' y='28' font-size='10' font-weight='700' letter-spacing='0.06em' fill='#2f6fdb'>HTTP, THE WEB&#x27;S PROTOCOL</text><rect x='342' y='36' width='74' height='34' rx='7' fill='#e6eefc' stroke='#2f6fdb' stroke-width='1.6'/><text x='379.0' y='56.666666666666664' text-anchor='middle' font-size='11' font-weight='600' fill='#1f2a44'>browser</text><rect x='544' y='36' width='76' height='34' rx='7' fill='#e2f4ec' stroke='#178a5e' stroke-width='1.6'/><text x='582.0' y='56.666666666666664' text-anchor='middle' font-size='11' font-weight='600' fill='#1f2a44'>server</text><line x1='420' y1='46' x2='540' y2='46' stroke='#2f6fdb' stroke-width='1.5' marker-end='url(#ar-blue)'/><text x='480' y='41' text-anchor='middle' font-size='9.5' font-weight='700' fill='#2f6fdb'>GET /shoes</text><line x1='540' y1='64' x2='420' y2='64' stroke='#178a5e' stroke-width='1.5' marker-end='url(#ar-green)'/><text x='480' y='80' text-anchor='middle' font-size='9.5' font-weight='700' fill='#178a5e'>200 OK + the page</text><text x='480' y='108' text-anchor='middle' font-size='10' font-weight='600' fill='#1f2a44'>same rulebook on both sides</text><text x='10' y='142' text-anchor='start' font-size='10.2' font-weight='400' fill='#5b6478' font-style='italic'>A protocol is agreed rules, so two sides understand each other. If one side breaks them, the conversation fails.</text></svg>