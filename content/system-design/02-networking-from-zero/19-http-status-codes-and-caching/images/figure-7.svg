<svg width='640' height='150' role='img' viewBox='0 0 640 150' xmlns='http://www.w3.org/2000/svg' font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"><title>Figure 7: HTTP part 2, status codes, 401 vs 403, caching and ETags</title><desc>A sequence diagram: the server sends 200 with ETag v7; later the browser sends If-None-Match v7; the server replies 304 Not Modified with no body.</desc><rect x='0' y='0' width='640' height='150' rx='16' fill='#fbfbf9' stroke='#e4e4de'/><defs><marker id='ar-blue' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#2f6fdb'/></marker><marker id='ar-green' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#178a5e'/></marker><marker id='ar-purple' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#6f52c9'/></marker><marker id='ar-orange' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#d0702c'/></marker><marker id='ar-pink' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#c43d6e'/></marker><marker id='ar-grey' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#6b7280'/></marker><marker id='ar-teal' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#0f7b6c'/></marker><marker id='ar-ink' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#5b6478'/></marker></defs><text x='60' y='16' text-anchor='middle' font-size='11' font-weight='700' fill='#2f6fdb'>browser</text><line x1='60' y1='22' x2='60' y2='124' stroke='#2f6fdb' stroke-width='1.4'/><text x='580' y='16' text-anchor='middle' font-size='11' font-weight='700' fill='#178a5e'>server</text><line x1='580' y1='22' x2='580' y2='124' stroke='#178a5e' stroke-width='1.4'/><line x1='578' y1='36' x2='64' y2='46' stroke='#178a5e' stroke-width='1.5' marker-end='url(#ar-green)'/><text x='320' y='34' text-anchor='middle' font-size='10.5' font-weight='700' fill='#178a5e'>200 OK + body · ETag: &quot;v7&quot;</text><line x1='62' y1='72' x2='576' y2='82' stroke='#2f6fdb' stroke-width='1.5' marker-end='url(#ar-blue)'/><text x='320' y='70' text-anchor='middle' font-size='10.5' font-weight='700' fill='#2f6fdb'>later: If-None-Match: &quot;v7&quot;</text><line x1='578' y1='104' x2='64' y2='114' stroke='#6f52c9' stroke-width='1.5' marker-end='url(#ar-purple)'/><text x='320' y='102' text-anchor='middle' font-size='10.5' font-weight='700' fill='#6f52c9'>304 Not Modified · no body</text><text x='14' y='144' text-anchor='start' font-size='9.8' font-weight='400' fill='#5b6478' font-style='italic'>A 200 KB image: first visit 200 KB; a 304 check a few hundred bytes and one round trip; while fresh, 0 bytes and 0 round trips.</text></svg>