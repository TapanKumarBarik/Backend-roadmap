<svg width='640' height='140' role='img' viewBox='0 0 640 140' xmlns='http://www.w3.org/2000/svg' font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"><title>Figure 5: HTTP part 2, status codes, 401 vs 403, caching and ETags</title><desc>Red cards 500 Internal Error, 502 Bad Gateway, 503 Unavailable, 504 Gateway Timeout, with the retry rule below.</desc><rect x='0' y='0' width='640' height='140' rx='16' fill='#fbfbf9' stroke='#e4e4de'/><defs><marker id='ar-blue' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#2f6fdb'/></marker><marker id='ar-green' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#178a5e'/></marker><marker id='ar-purple' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#6f52c9'/></marker><marker id='ar-orange' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#d0702c'/></marker><marker id='ar-pink' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#c43d6e'/></marker><marker id='ar-grey' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#6b7280'/></marker><marker id='ar-teal' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#0f7b6c'/></marker><marker id='ar-ink' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#5b6478'/></marker></defs><rect x='14' y='8' width='148' height='58' rx='7' fill='#fbe6ee' stroke='#c43d6e' stroke-width='1.3'/><text x='88.0' y='30' text-anchor='middle' font-size='17' font-weight='700' fill='#c43d6e'>500</text><text x='88.0' y='45' text-anchor='middle' font-size='9.8' font-weight='700' fill='#c43d6e'>Internal Error</text><text x='88.0' y='58' text-anchor='middle' font-size='8.6' font-weight='400' fill='#5b6478'>usually a bug</text><rect x='170' y='8' width='148' height='58' rx='7' fill='#fbe6ee' stroke='#c43d6e' stroke-width='1.3'/><text x='244.0' y='30' text-anchor='middle' font-size='17' font-weight='700' fill='#c43d6e'>502</text><text x='244.0' y='45' text-anchor='middle' font-size='9.8' font-weight='700' fill='#c43d6e'>Bad Gateway</text><text x='244.0' y='58' text-anchor='middle' font-size='8.6' font-weight='400' fill='#5b6478'>bad answer behind the proxy</text><rect x='326' y='8' width='148' height='58' rx='7' fill='#fbe6ee' stroke='#c43d6e' stroke-width='1.3'/><text x='400.0' y='30' text-anchor='middle' font-size='17' font-weight='700' fill='#c43d6e'>503</text><text x='400.0' y='45' text-anchor='middle' font-size='9.8' font-weight='700' fill='#c43d6e'>Unavailable</text><text x='400.0' y='58' text-anchor='middle' font-size='8.6' font-weight='400' fill='#5b6478'>overloaded / maintenance</text><rect x='482' y='8' width='148' height='58' rx='7' fill='#fbe6ee' stroke='#c43d6e' stroke-width='1.3'/><text x='556.0' y='30' text-anchor='middle' font-size='17' font-weight='700' fill='#c43d6e'>504</text><text x='556.0' y='45' text-anchor='middle' font-size='9.8' font-weight='700' fill='#c43d6e'>Gateway Timeout</text><text x='556.0' y='58' text-anchor='middle' font-size='8.6' font-weight='400' fill='#5b6478'>server behind too slow</text><text x='14' y='92' text-anchor='start' font-size='10.5' font-weight='700' fill='#178a5e'>Retry with a growing wait (backoff): 5xx and 429.</text><text x='14' y='110' text-anchor='start' font-size='10.5' font-weight='700' fill='#d0702c'>Don&#x27;t retry most 4xx: they won&#x27;t fix themselves. Fix the request.</text><text x='14' y='130' text-anchor='start' font-size='10' font-weight='400' fill='#5b6478' font-style='italic'>502 and 504 come from a proxy or load balancer: the problem is the server behind it.</text></svg>