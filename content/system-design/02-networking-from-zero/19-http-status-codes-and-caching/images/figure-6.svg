<svg width='640' height='110' role='img' viewBox='0 0 640 110' xmlns='http://www.w3.org/2000/svg' font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"><title>Figure 6: HTTP part 2, status codes, 401 vs 403, caching and ETags</title><desc>A Cache-Control max-age=3600 header, and four boxes: no-store never keep a copy, no-cache keep but check every time, private only the user&#x27;s browser, public CDNs may keep it too.</desc><rect x='0' y='0' width='640' height='110' rx='16' fill='#fbfbf9' stroke='#e4e4de'/><defs><marker id='ar-blue' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#2f6fdb'/></marker><marker id='ar-green' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#178a5e'/></marker><marker id='ar-purple' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#6f52c9'/></marker><marker id='ar-orange' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#d0702c'/></marker><marker id='ar-pink' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#c43d6e'/></marker><marker id='ar-grey' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#6b7280'/></marker><marker id='ar-teal' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#0f7b6c'/></marker><marker id='ar-ink' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#5b6478'/></marker></defs><rect x='14' y='8' width='300' height='26' rx='5' fill='#eee9fb' stroke='#6f52c9'/><text x='24' y='25' font-family='DejaVu Sans Mono, monospace' font-size='11' fill='#1f2a44'>Cache-Control: max-age=3600</text><text x='326' y='26' text-anchor='start' font-size='10' font-weight='700' fill='#6f52c9'>→ reuse for 1 hour, no request at all (like a DNS TTL)</text><rect x='14' y='46' width='148' height='44' rx='7' fill='#fbe6ee' stroke='#c43d6e' stroke-width='1.6'/><text x='88.0' y='66.0' text-anchor='middle' font-size='11' font-weight='600' fill='#1f2a44'>no-store</text><text x='88.0' y='81.0' text-anchor='middle' font-size='9' fill='#5b6478'>never keep a copy</text><rect x='170' y='46' width='148' height='44' rx='7' fill='#fcefe4' stroke='#d0702c' stroke-width='1.6'/><text x='244.0' y='66.0' text-anchor='middle' font-size='11' font-weight='600' fill='#1f2a44'>no-cache</text><text x='244.0' y='81.0' text-anchor='middle' font-size='9' fill='#5b6478'>keep, but check every time</text><rect x='326' y='46' width='148' height='44' rx='7' fill='#e6eefc' stroke='#2f6fdb' stroke-width='1.6'/><text x='400.0' y='66.0' text-anchor='middle' font-size='11' font-weight='600' fill='#1f2a44'>private</text><text x='400.0' y='81.0' text-anchor='middle' font-size='9' fill='#5b6478'>only the user&#x27;s browser</text><rect x='482' y='46' width='148' height='44' rx='7' fill='#e2f4ec' stroke='#178a5e' stroke-width='1.6'/><text x='556.0' y='66.0' text-anchor='middle' font-size='11' font-weight='600' fill='#1f2a44'>public</text><text x='556.0' y='81.0' text-anchor='middle' font-size='9' fill='#5b6478'>CDNs may keep it too</text></svg>