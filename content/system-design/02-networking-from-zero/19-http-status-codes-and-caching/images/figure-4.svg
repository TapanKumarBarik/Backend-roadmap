<svg width='640' height='150' role='img' viewBox='0 0 640 150' xmlns='http://www.w3.org/2000/svg' font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"><title>Figure 4: HTTP part 2, status codes, 401 vs 403, caching and ETags</title><desc>Orange cards 400, 404, 409, 429; below, 401 not authenticated, 403 I know you and no, 410 removed on purpose.</desc><rect x='0' y='0' width='640' height='150' rx='16' fill='#fbfbf9' stroke='#e4e4de'/><defs><marker id='ar-blue' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#2f6fdb'/></marker><marker id='ar-green' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#178a5e'/></marker><marker id='ar-purple' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#6f52c9'/></marker><marker id='ar-orange' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#d0702c'/></marker><marker id='ar-pink' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#c43d6e'/></marker><marker id='ar-grey' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#6b7280'/></marker><marker id='ar-teal' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#0f7b6c'/></marker><marker id='ar-ink' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#5b6478'/></marker></defs><rect x='14' y='8' width='148' height='58' rx='7' fill='#fcefe4' stroke='#d0702c' stroke-width='1.3'/><text x='88.0' y='30' text-anchor='middle' font-size='17' font-weight='700' fill='#d0702c'>400</text><text x='88.0' y='45' text-anchor='middle' font-size='9.8' font-weight='700' fill='#d0702c'>Bad Request</text><text x='88.0' y='58' text-anchor='middle' font-size='8.6' font-weight='400' fill='#5b6478'>the request is broken</text><rect x='170' y='8' width='148' height='58' rx='7' fill='#fcefe4' stroke='#d0702c' stroke-width='1.3'/><text x='244.0' y='30' text-anchor='middle' font-size='17' font-weight='700' fill='#d0702c'>404</text><text x='244.0' y='45' text-anchor='middle' font-size='9.8' font-weight='700' fill='#d0702c'>Not Found</text><text x='244.0' y='58' text-anchor='middle' font-size='8.6' font-weight='400' fill='#5b6478'>maybe never existed</text><rect x='326' y='8' width='148' height='58' rx='7' fill='#fcefe4' stroke='#d0702c' stroke-width='1.3'/><text x='400.0' y='30' text-anchor='middle' font-size='17' font-weight='700' fill='#d0702c'>409</text><text x='400.0' y='45' text-anchor='middle' font-size='9.8' font-weight='700' fill='#d0702c'>Conflict</text><text x='400.0' y='58' text-anchor='middle' font-size='8.6' font-weight='400' fill='#5b6478'>e.g. duplicate name</text><rect x='482' y='8' width='148' height='58' rx='7' fill='#fcefe4' stroke='#d0702c' stroke-width='1.3'/><text x='556.0' y='30' text-anchor='middle' font-size='17' font-weight='700' fill='#d0702c'>429</text><text x='556.0' y='45' text-anchor='middle' font-size='9.8' font-weight='700' fill='#d0702c'>Too Many Requests</text><text x='556.0' y='58' text-anchor='middle' font-size='8.6' font-weight='400' fill='#5b6478'>rate limit: Retry-After</text><rect x='14' y='76' width='200' height='58' rx='7' fill='#fcefe4' stroke='#d0702c' stroke-width='1.3'/><text x='114.0' y='98' text-anchor='middle' font-size='17' font-weight='700' fill='#d0702c'>401</text><text x='114.0' y='113' text-anchor='middle' font-size='9.8' font-weight='700' fill='#d0702c'>“Unauthorized”</text><text x='114.0' y='126' text-anchor='middle' font-size='8.6' font-weight='400' fill='#5b6478'>not authenticated: who are you?</text><rect x='222' y='76' width='200' height='58' rx='7' fill='#fcefe4' stroke='#d0702c' stroke-width='1.3'/><text x='322.0' y='98' text-anchor='middle' font-size='17' font-weight='700' fill='#d0702c'>403</text><text x='322.0' y='113' text-anchor='middle' font-size='9.8' font-weight='700' fill='#d0702c'>Forbidden</text><text x='322.0' y='126' text-anchor='middle' font-size='8.6' font-weight='400' fill='#5b6478'>known, but not allowed</text><rect x='430' y='76' width='200' height='58' rx='7' fill='#fcefe4' stroke='#d0702c' stroke-width='1.3'/><text x='530.0' y='98' text-anchor='middle' font-size='17' font-weight='700' fill='#d0702c'>410</text><text x='530.0' y='113' text-anchor='middle' font-size='9.8' font-weight='700' fill='#d0702c'>Gone</text><text x='530.0' y='126' text-anchor='middle' font-size='8.6' font-weight='400' fill='#5b6478'>removed on purpose</text></svg>