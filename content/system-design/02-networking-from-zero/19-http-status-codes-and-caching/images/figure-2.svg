<svg width='640' height='140' role='img' viewBox='0 0 640 140' xmlns='http://www.w3.org/2000/svg' font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"><title>Figure 2: HTTP part 2, status codes, 401 vs 403, caching and ETags</title><desc>Five coloured rows: 1xx information, 2xx success, 3xx go somewhere else, 4xx the client made a mistake, 5xx the server failed.</desc><rect x='0' y='0' width='640' height='140' rx='16' fill='#fbfbf9' stroke='#e4e4de'/><defs><marker id='ar-blue' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#2f6fdb'/></marker><marker id='ar-green' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#178a5e'/></marker><marker id='ar-purple' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#6f52c9'/></marker><marker id='ar-orange' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#d0702c'/></marker><marker id='ar-pink' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#c43d6e'/></marker><marker id='ar-grey' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#6b7280'/></marker><marker id='ar-teal' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#0f7b6c'/></marker><marker id='ar-ink' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#5b6478'/></marker></defs><rect x='14' y='8' width='420' height='20' rx='4' fill='#f1f2f4' stroke='#6b7280' stroke-width='1.2'/><text x='26' y='22.5' text-anchor='start' font-size='11' font-weight='700' fill='#6b7280'>1xx</text><text x='80' y='22.5' text-anchor='start' font-size='10.5' font-weight='700' fill='#6b7280'>information (rare)</text><rect x='14' y='32' width='420' height='20' rx='4' fill='#e2f4ec' stroke='#178a5e' stroke-width='1.2'/><text x='26' y='46.5' text-anchor='start' font-size='11' font-weight='700' fill='#178a5e'>2xx</text><text x='80' y='46.5' text-anchor='start' font-size='10.5' font-weight='700' fill='#178a5e'>success</text><rect x='14' y='56' width='420' height='20' rx='4' fill='#e6eefc' stroke='#2f6fdb' stroke-width='1.2'/><text x='26' y='70.5' text-anchor='start' font-size='11' font-weight='700' fill='#2f6fdb'>3xx</text><text x='80' y='70.5' text-anchor='start' font-size='10.5' font-weight='700' fill='#2f6fdb'>go somewhere else: a redirect</text><rect x='14' y='80' width='420' height='20' rx='4' fill='#fcefe4' stroke='#d0702c' stroke-width='1.2'/><text x='26' y='94.5' text-anchor='start' font-size='11' font-weight='700' fill='#d0702c'>4xx</text><text x='80' y='94.5' text-anchor='start' font-size='10.5' font-weight='700' fill='#d0702c'>the client made a mistake</text><rect x='14' y='104' width='420' height='20' rx='4' fill='#fbe6ee' stroke='#c43d6e' stroke-width='1.2'/><text x='26' y='118.5' text-anchor='start' font-size='11' font-weight='700' fill='#c43d6e'>5xx</text><text x='80' y='118.5' text-anchor='start' font-size='10.5' font-weight='700' fill='#c43d6e'>the server failed</text><text x='450' y='40' text-anchor='start' font-size='11' font-weight='700' fill='#1f2a44'>The first digit tells</text><text x='450' y='56' text-anchor='start' font-size='11' font-weight='700' fill='#1f2a44'>you who to look at:</text><text x='450' y='76' text-anchor='start' font-size='10.5' font-weight='700' fill='#d0702c'>4xx → the request,</text><text x='450' y='92' text-anchor='start' font-size='10.5' font-weight='700' fill='#c43d6e'>5xx → the server.</text></svg>