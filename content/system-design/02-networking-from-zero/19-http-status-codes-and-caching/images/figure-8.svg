<svg width='640' height='80' role='img' viewBox='0 0 640 80' xmlns='http://www.w3.org/2000/svg' font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"><title>Figure 8: HTTP part 2, status codes, 401 vs 403, caching and ETags</title><desc>Two cards: 403 Forbidden for a logged-in user on an admin page they aren&#x27;t allowed to see, and 401 Unauthorized for an expired token.</desc><rect x='0' y='0' width='640' height='80' rx='16' fill='#fbfbf9' stroke='#e4e4de'/><defs><marker id='ar-blue' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#2f6fdb'/></marker><marker id='ar-green' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#178a5e'/></marker><marker id='ar-purple' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#6f52c9'/></marker><marker id='ar-orange' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#d0702c'/></marker><marker id='ar-pink' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#c43d6e'/></marker><marker id='ar-grey' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#6b7280'/></marker><marker id='ar-teal' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#0f7b6c'/></marker><marker id='ar-ink' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#5b6478'/></marker></defs><rect x='14' y='8' width='300' height='58' rx='7' fill='#fcefe4' stroke='#d0702c' stroke-width='1.3'/><text x='164.0' y='30' text-anchor='middle' font-size='17' font-weight='700' fill='#d0702c'>403</text><text x='164.0' y='45' text-anchor='middle' font-size='9.8' font-weight='700' fill='#d0702c'>Forbidden</text><text x='164.0' y='58' text-anchor='middle' font-size='8.6' font-weight='400' fill='#5b6478'>admin page, logged in, not allowed</text><rect x='322' y='8' width='300' height='58' rx='7' fill='#fcefe4' stroke='#d0702c' stroke-width='1.3'/><text x='472.0' y='30' text-anchor='middle' font-size='17' font-weight='700' fill='#d0702c'>401</text><text x='472.0' y='45' text-anchor='middle' font-size='9.8' font-weight='700' fill='#d0702c'>Unauthorized</text><text x='472.0' y='58' text-anchor='middle' font-size='8.6' font-weight='400' fill='#5b6478'>token expired: log in again</text></svg>