<svg width='640' height='150' role='img' viewBox='0 0 640 150' xmlns='http://www.w3.org/2000/svg' font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"><title>Figure 3: HTTP part 2, status codes, 401 vs 403, caching and ETags</title><desc>Green cards 200 OK, 201 Created, 204 No Content; blue cards 301 Moved Permanently and 302 Found, with a note that the address bar changes.</desc><rect x='0' y='0' width='640' height='150' rx='16' fill='#fbfbf9' stroke='#e4e4de'/><defs><marker id='ar-blue' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#2f6fdb'/></marker><marker id='ar-green' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#178a5e'/></marker><marker id='ar-purple' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#6f52c9'/></marker><marker id='ar-orange' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#d0702c'/></marker><marker id='ar-pink' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#c43d6e'/></marker><marker id='ar-grey' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#6b7280'/></marker><marker id='ar-teal' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#0f7b6c'/></marker><marker id='ar-ink' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#5b6478'/></marker></defs><rect x='14' y='8' width='200' height='58' rx='7' fill='#e2f4ec' stroke='#178a5e' stroke-width='1.3'/><text x='114.0' y='30' text-anchor='middle' font-size='17' font-weight='700' fill='#178a5e'>200</text><text x='114.0' y='45' text-anchor='middle' font-size='9.8' font-weight='700' fill='#178a5e'>OK</text><text x='114.0' y='58' text-anchor='middle' font-size='8.6' font-weight='400' fill='#5b6478'>here&#x27;s what you asked for</text><rect x='222' y='8' width='200' height='58' rx='7' fill='#e2f4ec' stroke='#178a5e' stroke-width='1.3'/><text x='322.0' y='30' text-anchor='middle' font-size='17' font-weight='700' fill='#178a5e'>201</text><text x='322.0' y='45' text-anchor='middle' font-size='9.8' font-weight='700' fill='#178a5e'>Created</text><text x='322.0' y='58' text-anchor='middle' font-size='8.6' font-weight='400' fill='#5b6478'>new thing; see Location</text><rect x='430' y='8' width='200' height='58' rx='7' fill='#e2f4ec' stroke='#178a5e' stroke-width='1.3'/><text x='530.0' y='30' text-anchor='middle' font-size='17' font-weight='700' fill='#178a5e'>204</text><text x='530.0' y='45' text-anchor='middle' font-size='9.8' font-weight='700' fill='#178a5e'>No Content</text><text x='530.0' y='58' text-anchor='middle' font-size='8.6' font-weight='400' fill='#5b6478'>worked, nothing to send</text><rect x='14' y='76' width='200' height='58' rx='7' fill='#e6eefc' stroke='#2f6fdb' stroke-width='1.3'/><text x='114.0' y='98' text-anchor='middle' font-size='17' font-weight='700' fill='#2f6fdb'>301</text><text x='114.0' y='113' text-anchor='middle' font-size='9.8' font-weight='700' fill='#2f6fdb'>Moved Permanently</text><text x='114.0' y='126' text-anchor='middle' font-size='8.6' font-weight='400' fill='#5b6478'>browsers + search engines remember</text><rect x='222' y='76' width='200' height='58' rx='7' fill='#e6eefc' stroke='#2f6fdb' stroke-width='1.3'/><text x='322.0' y='98' text-anchor='middle' font-size='17' font-weight='700' fill='#2f6fdb'>302</text><text x='322.0' y='113' text-anchor='middle' font-size='9.8' font-weight='700' fill='#2f6fdb'>Found</text><text x='322.0' y='126' text-anchor='middle' font-size='8.6' font-weight='400' fill='#5b6478'>moved, but only for now</text><text x='430' y='98' text-anchor='start' font-size='9.8' font-weight='600' fill='#1f2a44'>The new URL is in the Location</text><text x='430' y='112' text-anchor='start' font-size='9.8' font-weight='600' fill='#1f2a44'>header and the address bar</text><text x='430' y='126' text-anchor='start' font-size='9.8' font-weight='600' fill='#1f2a44'>changes: unlike a CNAME.</text></svg>