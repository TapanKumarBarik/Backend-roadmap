<svg width='640' height='120' role='img' viewBox='0 0 640 120' xmlns='http://www.w3.org/2000/svg' font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"><title>Figure 1: HTTP part 2, status codes, 401 vs 403, caching and ETags</title><desc>A post office counter with four replies: accepted (2xx), they moved, send it to this new address (3xx), your form is filled in wrong (4xx), sorry, our system is down (5xx).</desc><rect x='0' y='0' width='640' height='120' rx='16' fill='#fbfbf9' stroke='#e4e4de'/><defs><marker id='ar-blue' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#2f6fdb'/></marker><marker id='ar-green' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#178a5e'/></marker><marker id='ar-purple' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#6f52c9'/></marker><marker id='ar-orange' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#d0702c'/></marker><marker id='ar-pink' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#c43d6e'/></marker><marker id='ar-grey' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#6b7280'/></marker><marker id='ar-teal' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#0f7b6c'/></marker><marker id='ar-ink' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#5b6478'/></marker></defs><rect x='14' y='30' width='110' height='44' rx='7' fill='#eee9fb' stroke='#6f52c9' stroke-width='1.6'/><text x='69.0' y='50.0' text-anchor='middle' font-size='11' font-weight='600' fill='#1f2a44'>post office</text><text x='69.0' y='65.0' text-anchor='middle' font-size='9' fill='#5b6478'>the counter</text><rect x='150' y='8' width='300' height='18' rx='4' fill='#e2f4ec' stroke='#178a5e' stroke-width='1.2'/><text x='300.0' y='20.6' text-anchor='middle' font-size='10' font-weight='700' fill='#178a5e'>“accepted”</text><text x='462' y='21' text-anchor='start' font-size='11' font-weight='700' fill='#178a5e'>2xx</text><rect x='150' y='32' width='300' height='18' rx='4' fill='#e6eefc' stroke='#2f6fdb' stroke-width='1.2'/><text x='300.0' y='44.6' text-anchor='middle' font-size='10' font-weight='700' fill='#2f6fdb'>“they moved: send it to this new address”</text><text x='462' y='45' text-anchor='start' font-size='11' font-weight='700' fill='#2f6fdb'>3xx</text><rect x='150' y='56' width='300' height='18' rx='4' fill='#fcefe4' stroke='#d0702c' stroke-width='1.2'/><text x='300.0' y='68.6' text-anchor='middle' font-size='10' font-weight='700' fill='#d0702c'>“your form is filled in wrong”</text><text x='462' y='69' text-anchor='start' font-size='11' font-weight='700' fill='#d0702c'>4xx</text><rect x='150' y='80' width='300' height='18' rx='4' fill='#fbe6ee' stroke='#c43d6e' stroke-width='1.2'/><text x='300.0' y='92.6' text-anchor='middle' font-size='10' font-weight='700' fill='#c43d6e'>“sorry, our system is down”</text><text x='462' y='93' text-anchor='start' font-size='11' font-weight='700' fill='#c43d6e'>5xx</text><text x='14' y='112' text-anchor='start' font-size='10' font-weight='400' fill='#5b6478' font-style='italic'>And “has it changed since this morning?” → “no, same as before”, with nothing handed over: that&#x27;s caching.</text></svg>