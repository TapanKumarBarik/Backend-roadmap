<svg width='640' height='176' role='img' viewBox='0 0 640 176' xmlns='http://www.w3.org/2000/svg' font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"><title>Figure 2: TCP part 2, the three-way handshake</title><desc>A sequence diagram between your phone and a server listening on port 443: SYN with seq 4,000; SYN-ACK with seq 9,000 and ack 4,001; ACK with ack 9,001. Both sides are then established.</desc><rect x='0' y='0' width='640' height='176' rx='16' fill='#fbfbf9' stroke='#e4e4de'/><defs><marker id='ar-blue' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#2f6fdb'/></marker><marker id='ar-green' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#178a5e'/></marker><marker id='ar-purple' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#6f52c9'/></marker><marker id='ar-orange' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#d0702c'/></marker><marker id='ar-pink' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#c43d6e'/></marker><marker id='ar-grey' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#6b7280'/></marker><marker id='ar-teal' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#0f7b6c'/></marker><marker id='ar-ink' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#5b6478'/></marker></defs><text x='60' y='16' text-anchor='middle' font-size='11' font-weight='700' fill='#2f6fdb'>your phone</text><line x1='60' y1='22' x2='60' y2='142' stroke='#2f6fdb' stroke-width='1.4'/><text x='580' y='16' text-anchor='middle' font-size='11' font-weight='700' fill='#178a5e'>server :443</text><line x1='580' y1='22' x2='580' y2='142' stroke='#178a5e' stroke-width='1.4'/><line x1='62' y1='42' x2='576' y2='48' stroke='#2f6fdb' stroke-width='1.5' marker-end='url(#ar-blue)'/><text x='320' y='39' text-anchor='middle' font-size='10.5' font-weight='700' fill='#2f6fdb'>1  SYN · seq 4,000</text><text x='320' y='59' text-anchor='middle' font-size='9.2' font-weight='400' fill='#5b6478' font-style='italic'>“I want to talk; my bytes start at 4,000”</text><line x1='578' y1='82' x2='64' y2='88' stroke='#178a5e' stroke-width='1.5' marker-end='url(#ar-green)'/><text x='320' y='79' text-anchor='middle' font-size='10.5' font-weight='700' fill='#178a5e'>2  SYN-ACK · seq 9,000 · ack 4,001</text><text x='320' y='99' text-anchor='middle' font-size='9.2' font-weight='400' fill='#5b6478' font-style='italic'>“got your number; my bytes start at 9,000”</text><line x1='62' y1='122' x2='576' y2='128' stroke='#2f6fdb' stroke-width='1.5' marker-end='url(#ar-blue)'/><text x='320' y='119' text-anchor='middle' font-size='10.5' font-weight='700' fill='#2f6fdb'>3  ACK · ack 9,001</text><text x='320' y='139' text-anchor='middle' font-size='9.2' font-weight='400' fill='#5b6478' font-style='italic'>“got your number too”</text><text x='14' y='166' text-anchor='start' font-size='10.2' font-weight='700' fill='#178a5e'>Now both sides are ESTABLISHED. The photo&#x27;s first byte is 4,001; the reply&#x27;s first byte is 9,001.</text></svg>