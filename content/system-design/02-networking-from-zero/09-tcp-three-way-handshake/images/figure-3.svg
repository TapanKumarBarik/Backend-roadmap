<svg width='640' height='128' role='img' viewBox='0 0 640 128' xmlns='http://www.w3.org/2000/svg' font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"><title>Figure 3: TCP part 2, the three-way handshake</title><desc>Four boxes: phone sends its number, server confirms it, server sends its number, phone confirms it. The middle two are braced as one segment, SYN-ACK; the first is SYN and the last is ACK.</desc><rect x='0' y='0' width='640' height='128' rx='16' fill='#fbfbf9' stroke='#e4e4de'/><defs><marker id='ar-blue' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#2f6fdb'/></marker><marker id='ar-green' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#178a5e'/></marker><marker id='ar-purple' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#6f52c9'/></marker><marker id='ar-orange' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#d0702c'/></marker><marker id='ar-pink' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#c43d6e'/></marker><marker id='ar-grey' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#6b7280'/></marker><marker id='ar-teal' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#0f7b6c'/></marker><marker id='ar-ink' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#5b6478'/></marker></defs><rect x='14' y='14' width='144' height='42' rx='7' fill='#e6eefc' stroke='#2f6fdb' stroke-width='1.6'/><text x='86.0' y='33.0' text-anchor='middle' font-size='11' font-weight='600' fill='#1f2a44'>phone sends</text><text x='86.0' y='48.0' text-anchor='middle' font-size='9.5' fill='#5b6478'>its number</text><rect x='170' y='14' width='144' height='42' rx='7' fill='#e2f4ec' stroke='#178a5e' stroke-width='1.6'/><text x='242.0' y='33.0' text-anchor='middle' font-size='11' font-weight='600' fill='#1f2a44'>server confirms</text><text x='242.0' y='48.0' text-anchor='middle' font-size='9.5' fill='#5b6478'>it</text><rect x='326' y='14' width='144' height='42' rx='7' fill='#e2f4ec' stroke='#178a5e' stroke-width='1.6'/><text x='398.0' y='33.0' text-anchor='middle' font-size='11' font-weight='600' fill='#1f2a44'>server sends</text><text x='398.0' y='48.0' text-anchor='middle' font-size='9.5' fill='#5b6478'>its number</text><rect x='482' y='14' width='144' height='42' rx='7' fill='#e6eefc' stroke='#2f6fdb' stroke-width='1.6'/><text x='554.0' y='33.0' text-anchor='middle' font-size='11' font-weight='600' fill='#1f2a44'>phone confirms</text><text x='554.0' y='48.0' text-anchor='middle' font-size='9.5' fill='#5b6478'>it</text><text x='86' y='76' text-anchor='middle' font-size='11' font-weight='700' fill='#2f6fdb'>SYN</text><path d='M170 62 Q170 70 178 70 L307.0 70 Q313.0 70 313.0 77 Q313.0 70 319.0 70 L448 70 Q456 70 456 62' fill='none' stroke='#178a5e' stroke-width='1.6'/><text x='313.0' y='92' text-anchor='middle' font-size='10.5' font-weight='700' fill='#178a5e'>one segment: SYN-ACK</text><text x='554' y='76' text-anchor='middle' font-size='11' font-weight='700' fill='#2f6fdb'>ACK</text><text x='14' y='118' text-anchor='start' font-size='10' font-weight='400' fill='#5b6478' font-style='italic'>Each direction needs its own number sent and confirmed: 4 jobs. The server does 2 of them in one segment, so 3 messages.</text></svg>