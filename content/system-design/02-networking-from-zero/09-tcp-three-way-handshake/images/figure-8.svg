<svg width='640' height='90' role='img' viewBox='0 0 640 90' xmlns='http://www.w3.org/2000/svg' font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"><title>Figure 8: TCP part 2, the three-way handshake</title><desc>A bar: one second of waiting for a reply that never comes, then 0.1 seconds for the resend and the handshake: about 1.1 seconds.</desc><rect x='0' y='0' width='640' height='90' rx='16' fill='#fbfbf9' stroke='#e4e4de'/><defs><marker id='ar-blue' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#2f6fdb'/></marker><marker id='ar-green' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#178a5e'/></marker><marker id='ar-purple' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#6f52c9'/></marker><marker id='ar-orange' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#d0702c'/></marker><marker id='ar-pink' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#c43d6e'/></marker><marker id='ar-grey' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#6b7280'/></marker><marker id='ar-teal' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#0f7b6c'/></marker><marker id='ar-ink' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#5b6478'/></marker></defs><rect x='14' y='26' width='520' height='30' fill='#fcefe4' stroke='#d0702c' stroke-width='1.3'/><text x='274.0' y='44.5' text-anchor='middle' font-size='10.5' font-weight='700' fill='#d0702c'>waiting for a reply that never comes: 1 s</text><rect x='536' y='26' width='90' height='30' fill='#e2f4ec' stroke='#178a5e' stroke-width='1.3'/><text x='581.0' y='44.5' text-anchor='middle' font-size='10.5' font-weight='700' fill='#178a5e'>0.1 s</text><text x='14' y='18' text-anchor='start' font-size='10.5' font-weight='700' fill='#1f2a44'>Round trip 100 ms, first SYN lost:</text><text x='626' y='72' text-anchor='end' font-size='9.5' font-weight='700' fill='#178a5e'>resend + handshake: 1 round trip</text><text x='14' y='86' text-anchor='start' font-size='10.5' font-weight='700' fill='#d0702c'>≈ 1.1 s until the connection is established: one lost packet, and the page feels stuck.</text></svg>