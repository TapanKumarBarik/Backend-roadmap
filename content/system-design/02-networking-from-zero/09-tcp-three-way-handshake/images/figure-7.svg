<svg width='640' height='140' role='img' viewBox='0 0 640 140' xmlns='http://www.w3.org/2000/svg' font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"><title>Figure 7: TCP part 2, the three-way handshake</title><desc>An attacker sends many SYNs into a server&#x27;s queue, which fills with half-open slots; a real user&#x27;s SYN is rejected. A note: fix, SYN cookies, the server keeps no slot and hides what it needs in its starting number.</desc><rect x='0' y='0' width='640' height='140' rx='16' fill='#fbfbf9' stroke='#e4e4de'/><defs><marker id='ar-blue' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#2f6fdb'/></marker><marker id='ar-green' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#178a5e'/></marker><marker id='ar-purple' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#6f52c9'/></marker><marker id='ar-orange' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#d0702c'/></marker><marker id='ar-pink' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#c43d6e'/></marker><marker id='ar-grey' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#6b7280'/></marker><marker id='ar-teal' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#0f7b6c'/></marker><marker id='ar-ink' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#5b6478'/></marker></defs><rect x='14' y='30' width='90' height='40' rx='7' fill='#fbe6ee' stroke='#c43d6e' stroke-width='1.6'/><text x='59.0' y='53.666666666666664' text-anchor='middle' font-size='11' font-weight='600' fill='#1f2a44'>attacker</text><line x1='106' y1='50' x2='300' y2='18' stroke='#c43d6e' stroke-width='1.1' marker-end='url(#ar-pink)'/><line x1='106' y1='50' x2='300' y2='34' stroke='#c43d6e' stroke-width='1.1' marker-end='url(#ar-pink)'/><line x1='106' y1='50' x2='300' y2='50' stroke='#c43d6e' stroke-width='1.1' marker-end='url(#ar-pink)'/><line x1='106' y1='50' x2='300' y2='66' stroke='#c43d6e' stroke-width='1.1' marker-end='url(#ar-pink)'/><line x1='106' y1='50' x2='300' y2='82' stroke='#c43d6e' stroke-width='1.1' marker-end='url(#ar-pink)'/><text x='200' y='14' text-anchor='middle' font-size='9.5' font-weight='700' fill='#c43d6e'>SYN, SYN, SYN … no final ACK</text><rect x='306' y='10' width='80' height='15' rx='4' fill='#fbe6ee' stroke='#c43d6e' stroke-width='1.4'/><text x='346.0' y='20.333333333333332' text-anchor='middle' font-size='8.5' font-weight='700' fill='#1f2a44'>half-open</text><rect x='306' y='27' width='80' height='15' rx='4' fill='#fbe6ee' stroke='#c43d6e' stroke-width='1.4'/><text x='346.0' y='37.333333333333336' text-anchor='middle' font-size='8.5' font-weight='700' fill='#1f2a44'>half-open</text><rect x='306' y='44' width='80' height='15' rx='4' fill='#fbe6ee' stroke='#c43d6e' stroke-width='1.4'/><text x='346.0' y='54.333333333333336' text-anchor='middle' font-size='8.5' font-weight='700' fill='#1f2a44'>half-open</text><rect x='306' y='61' width='80' height='15' rx='4' fill='#fbe6ee' stroke='#c43d6e' stroke-width='1.4'/><text x='346.0' y='71.33333333333333' text-anchor='middle' font-size='8.5' font-weight='700' fill='#1f2a44'>half-open</text><rect x='306' y='78' width='80' height='15' rx='4' fill='#fbe6ee' stroke='#c43d6e' stroke-width='1.4'/><text x='346.0' y='88.33333333333333' text-anchor='middle' font-size='8.5' font-weight='700' fill='#1f2a44'>half-open</text><rect x='306' y='95' width='80' height='15' rx='4' fill='#fbe6ee' stroke='#c43d6e' stroke-width='1.4'/><text x='346.0' y='105.33333333333333' text-anchor='middle' font-size='8.5' font-weight='700' fill='#1f2a44'>half-open</text><text x='346' y='120' text-anchor='middle' font-size='9.5' font-weight='700' fill='#c43d6e'>queue full</text><rect x='400' y='30' width='80' height='40' rx='7' fill='#e2f4ec' stroke='#178a5e' stroke-width='1.6'/><text x='440.0' y='53.666666666666664' text-anchor='middle' font-size='11' font-weight='600' fill='#1f2a44'>server</text><rect x='14' y='92' width='90' height='30' rx='7' fill='#e6eefc' stroke='#2f6fdb' stroke-width='1.6'/><text x='59.0' y='110.5' text-anchor='middle' font-size='10.5' font-weight='600' fill='#1f2a44'>real user</text><line x1='106' y1='107' x2='290' y2='107' stroke='#2f6fdb' stroke-width='1.5' marker-end='url(#ar-blue)'/><text x='298' y='112.0' text-anchor='middle' font-size='15' font-weight='700' fill='#c43d6e'>✕</text><text x='496' y='40' text-anchor='start' font-size='10.5' font-weight='700' fill='#178a5e'>Fix: SYN cookies.</text><text x='496' y='56' text-anchor='start' font-size='9.5' font-weight='600' fill='#1f2a44'>The server keeps no slot;</text><text x='496' y='70' text-anchor='start' font-size='9.5' font-weight='600' fill='#1f2a44'>what it needs is hidden</text><text x='496' y='84' text-anchor='start' font-size='9.5' font-weight='600' fill='#1f2a44'>in its own starting number.</text></svg>