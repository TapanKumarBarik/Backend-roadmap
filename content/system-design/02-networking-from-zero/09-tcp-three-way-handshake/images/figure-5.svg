<svg width='640' height='170' role='img' viewBox='0 0 640 170' xmlns='http://www.w3.org/2000/svg' font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"><title>Figure 5: TCP part 2, the three-way handshake</title><desc>Left: a ladder diagram, SYN, SYN-ACK and then ACK with the first data, with the first two braced as one round trip. Right: bars for one round trip, a few milliseconds in the same city, about 60 ms from India to Singapore, about 200 to 250 ms from India to the US east coast.</desc><rect x='0' y='0' width='640' height='170' rx='16' fill='#fbfbf9' stroke='#e4e4de'/><defs><marker id='ar-blue' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#2f6fdb'/></marker><marker id='ar-green' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#178a5e'/></marker><marker id='ar-purple' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#6f52c9'/></marker><marker id='ar-orange' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#d0702c'/></marker><marker id='ar-pink' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#c43d6e'/></marker><marker id='ar-grey' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#6b7280'/></marker><marker id='ar-teal' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#0f7b6c'/></marker><marker id='ar-ink' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#5b6478'/></marker></defs><text x='60' y='16' text-anchor='middle' font-size='11' font-weight='700' fill='#2f6fdb'>phone</text><line x1='60' y1='22' x2='60' y2='150' stroke='#2f6fdb' stroke-width='1.4'/><text x='300' y='16' text-anchor='middle' font-size='11' font-weight='700' fill='#178a5e'>server</text><line x1='300' y1='22' x2='300' y2='150' stroke='#178a5e' stroke-width='1.4'/><line x1='62' y1='32' x2='296' y2='60' stroke='#2f6fdb' stroke-width='1.5' marker-end='url(#ar-blue)'/><text x='180' y='38' text-anchor='middle' font-size='10' font-weight='700' fill='#2f6fdb'>SYN</text><line x1='298' y1='66' x2='64' y2='94' stroke='#178a5e' stroke-width='1.5' marker-end='url(#ar-green)'/><text x='180' y='72' text-anchor='middle' font-size='10' font-weight='700' fill='#178a5e'>SYN-ACK</text><line x1='62' y1='100' x2='296' y2='128' stroke='#2f6fdb' stroke-width='1.5' marker-end='url(#ar-blue)'/><text x='180' y='106' text-anchor='middle' font-size='10' font-weight='700' fill='#2f6fdb'>ACK + first data</text><path d='M48 32 Q40 32 40 40 L40 56 Q40 63 34 63 Q40 63 40 70 L40 86 Q40 94 48 94' fill='none' stroke='#d0702c' stroke-width='1.6'/><text x='30' y='67' text-anchor='end' font-size='9.5' font-weight='700' fill='#d0702c'>1 RTT</text><text x='346' y='54' text-anchor='start' font-size='10' font-weight='700' fill='#1f2a44'>same city</text><rect x='462' y='42' width='8' height='16' rx='3' fill='#e2f4ec' stroke='#178a5e' stroke-width='1.2'/><text x='476' y='54' text-anchor='start' font-size='9.8' font-weight='700' fill='#178a5e'>a few ms</text><text x='346' y='88' text-anchor='start' font-size='10' font-weight='700' fill='#1f2a44'>India → Singapore</text><rect x='462' y='76' width='40' height='16' rx='3' fill='#fcefe4' stroke='#d0702c' stroke-width='1.2'/><text x='508' y='88' text-anchor='start' font-size='9.8' font-weight='700' fill='#d0702c'>≈ 60 ms</text><text x='346' y='122' text-anchor='start' font-size='10' font-weight='700' fill='#1f2a44'>India → US east coast</text><rect x='462' y='110' width='150' height='16' rx='3' fill='#fbe6ee' stroke='#c43d6e' stroke-width='1.2'/><text x='466' y='140' text-anchor='start' font-size='9.8' font-weight='700' fill='#c43d6e'>≈ 200-250 ms</text><text x='14' y='166' text-anchor='start' font-size='10' font-weight='400' fill='#5b6478' font-style='italic'>The handshake costs one round trip, paid once per connection: that&#x27;s why reusing connections matters (lesson 29).</text></svg>