<svg width='640' height='150' role='img' viewBox='0 0 640 150' xmlns='http://www.w3.org/2000/svg' font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"><title>Figure 1: TCP part 2, the three-way handshake</title><desc>Two people on a call. You: hello, can you hear me? Your friend: yes, I can hear you, can you hear me? You: yes, I can. Three numbered messages.</desc><rect x='0' y='0' width='640' height='150' rx='16' fill='#fbfbf9' stroke='#e4e4de'/><defs><marker id='ar-blue' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#2f6fdb'/></marker><marker id='ar-green' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#178a5e'/></marker><marker id='ar-purple' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#6f52c9'/></marker><marker id='ar-orange' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#d0702c'/></marker><marker id='ar-pink' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#c43d6e'/></marker><marker id='ar-grey' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#6b7280'/></marker><marker id='ar-teal' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#0f7b6c'/></marker><marker id='ar-ink' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#5b6478'/></marker></defs><text x='60' y='16' text-anchor='middle' font-size='11' font-weight='700' fill='#2f6fdb'>you</text><line x1='60' y1='22' x2='60' y2='112' stroke='#2f6fdb' stroke-width='1.4'/><text x='580' y='16' text-anchor='middle' font-size='11' font-weight='700' fill='#178a5e'>your friend</text><line x1='580' y1='22' x2='580' y2='112' stroke='#178a5e' stroke-width='1.4'/><line x1='62' y1='40' x2='576' y2='46' stroke='#2f6fdb' stroke-width='1.5' marker-end='url(#ar-blue)'/><text x='320' y='38' text-anchor='middle' font-size='10' font-weight='700' fill='#2f6fdb'>“hello, can you hear me?”</text><circle cx='90' cy='34' r='9' fill='#d0702c'/><text x='90' y='37.8' text-anchor='middle' font-size='10.5' font-weight='700' fill='#fff'>1</text><line x1='578' y1='68' x2='64' y2='74' stroke='#178a5e' stroke-width='1.5' marker-end='url(#ar-green)'/><text x='320' y='66' text-anchor='middle' font-size='10' font-weight='700' fill='#178a5e'>“yes, I can hear you. Can you hear me?”</text><circle cx='90' cy='62' r='9' fill='#d0702c'/><text x='90' y='65.8' text-anchor='middle' font-size='10.5' font-weight='700' fill='#fff'>2</text><line x1='62' y1='96' x2='576' y2='102' stroke='#2f6fdb' stroke-width='1.5' marker-end='url(#ar-blue)'/><text x='320' y='94' text-anchor='middle' font-size='10' font-weight='700' fill='#2f6fdb'>“yes, I can.”</text><circle cx='90' cy='90' r='9' fill='#d0702c'/><text x='90' y='93.8' text-anchor='middle' font-size='10.5' font-weight='700' fill='#fff'>3</text><text x='14' y='132' text-anchor='start' font-size='10' font-weight='400' fill='#5b6478' font-style='italic'>After three messages both know: my voice reaches you, and your voice reaches me. With only two,</text><text x='14' y='145' text-anchor='start' font-size='10' font-weight='400' fill='#5b6478' font-style='italic'>your friend still doesn&#x27;t know that you can hear them.</text></svg>