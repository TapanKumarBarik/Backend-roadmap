<svg width='640' height='150' role='img' viewBox='0 0 640 150' xmlns='http://www.w3.org/2000/svg' font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"><title>Figure 6: TCP part 2, the three-way handshake</title><desc>A row of waits, 1, 2, 4, 8, 16, 32 and 64 seconds, with a SYN resent between each: about 127 seconds, then connection timed out. Below: phone sends SYN, the server answers RST, connection refused.</desc><rect x='0' y='0' width='640' height='150' rx='16' fill='#fbfbf9' stroke='#e4e4de'/><defs><marker id='ar-blue' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#2f6fdb'/></marker><marker id='ar-green' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#178a5e'/></marker><marker id='ar-purple' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#6f52c9'/></marker><marker id='ar-orange' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#d0702c'/></marker><marker id='ar-pink' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#c43d6e'/></marker><marker id='ar-grey' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#6b7280'/></marker><marker id='ar-teal' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#0f7b6c'/></marker><marker id='ar-ink' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#5b6478'/></marker></defs><text x='14' y='18' text-anchor='start' font-size='10.5' font-weight='700' fill='#1f2a44'>No reply (server down, or a firewall drops the SYN): wait, resend, and double the wait.</text><rect x='14' y='28' width='54' height='18' rx='4' fill='#fcefe4' stroke='#d0702c' stroke-width='1.2'/><text x='41.0' y='40.6' text-anchor='middle' font-size='10' font-weight='700' fill='#d0702c'>1 s</text><text x='81' y='41' text-anchor='middle' font-size='8' font-weight='700' fill='#2f6fdb'>SYN</text><rect x='94' y='28' width='54' height='18' rx='4' fill='#fcefe4' stroke='#d0702c' stroke-width='1.2'/><text x='121.0' y='40.6' text-anchor='middle' font-size='10' font-weight='700' fill='#d0702c'>2 s</text><text x='161' y='41' text-anchor='middle' font-size='8' font-weight='700' fill='#2f6fdb'>SYN</text><rect x='174' y='28' width='54' height='18' rx='4' fill='#fcefe4' stroke='#d0702c' stroke-width='1.2'/><text x='201.0' y='40.6' text-anchor='middle' font-size='10' font-weight='700' fill='#d0702c'>4 s</text><text x='241' y='41' text-anchor='middle' font-size='8' font-weight='700' fill='#2f6fdb'>SYN</text><rect x='254' y='28' width='54' height='18' rx='4' fill='#fcefe4' stroke='#d0702c' stroke-width='1.2'/><text x='281.0' y='40.6' text-anchor='middle' font-size='10' font-weight='700' fill='#d0702c'>8 s</text><text x='321' y='41' text-anchor='middle' font-size='8' font-weight='700' fill='#2f6fdb'>SYN</text><rect x='334' y='28' width='54' height='18' rx='4' fill='#fcefe4' stroke='#d0702c' stroke-width='1.2'/><text x='361.0' y='40.6' text-anchor='middle' font-size='10' font-weight='700' fill='#d0702c'>16 s</text><text x='401' y='41' text-anchor='middle' font-size='8' font-weight='700' fill='#2f6fdb'>SYN</text><rect x='414' y='28' width='54' height='18' rx='4' fill='#fcefe4' stroke='#d0702c' stroke-width='1.2'/><text x='441.0' y='40.6' text-anchor='middle' font-size='10' font-weight='700' fill='#d0702c'>32 s</text><text x='481' y='41' text-anchor='middle' font-size='8' font-weight='700' fill='#2f6fdb'>SYN</text><rect x='494' y='28' width='54' height='18' rx='4' fill='#fcefe4' stroke='#d0702c' stroke-width='1.2'/><text x='521.0' y='40.6' text-anchor='middle' font-size='10' font-weight='700' fill='#d0702c'>64 s</text><text x='14' y='68' text-anchor='start' font-size='10.5' font-weight='700' fill='#c43d6e'>Linux: 6 retries, 1 + 2 + 4 + … + 64 ≈ 127 s, then “connection timed out”.</text><text x='14' y='96' text-anchor='start' font-size='10.5' font-weight='700' fill='#1f2a44'>Nobody listening on the port: the server answers at once with a reset.</text><rect x='14' y='104' width='70' height='26' rx='7' fill='#e6eefc' stroke='#2f6fdb' stroke-width='1.6'/><text x='49.0' y='120.33333333333333' text-anchor='middle' font-size='10' font-weight='600' fill='#1f2a44'>phone</text><rect x='290' y='104' width='90' height='26' rx='7' fill='#e2f4ec' stroke='#178a5e' stroke-width='1.6'/><text x='335.0' y='120.33333333333333' text-anchor='middle' font-size='10' font-weight='600' fill='#1f2a44'>server</text><line x1='86' y1='110' x2='288' y2='110' stroke='#2f6fdb' stroke-width='1.5' marker-end='url(#ar-blue)'/><text x='186' y='106' text-anchor='middle' font-size='9' font-weight='700' fill='#2f6fdb'>SYN</text><line x1='288' y1='126' x2='86' y2='126' stroke='#c43d6e' stroke-width='1.5' marker-end='url(#ar-pink)'/><text x='186' y='142' text-anchor='middle' font-size='9' font-weight='700' fill='#c43d6e'>RST</text><text x='400' y='122' text-anchor='start' font-size='10.5' font-weight='700' fill='#c43d6e'>“connection refused”: fast</text></svg>