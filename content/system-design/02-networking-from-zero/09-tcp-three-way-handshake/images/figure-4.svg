<svg width='640' height='96' role='img' viewBox='0 0 640 96' xmlns='http://www.w3.org/2000/svg' font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"><title>Figure 4: TCP part 2, the three-way handshake</title><desc>A bar: IP header 20 bytes, TCP header 20 bytes, data up to 1,460 bytes, braced together as one 1,500-byte packet.</desc><rect x='0' y='0' width='640' height='96' rx='16' fill='#fbfbf9' stroke='#e4e4de'/><defs><marker id='ar-blue' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#2f6fdb'/></marker><marker id='ar-green' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#178a5e'/></marker><marker id='ar-purple' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#6f52c9'/></marker><marker id='ar-orange' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#d0702c'/></marker><marker id='ar-pink' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#c43d6e'/></marker><marker id='ar-grey' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#6b7280'/></marker><marker id='ar-teal' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#0f7b6c'/></marker><marker id='ar-ink' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#5b6478'/></marker></defs><rect x='14' y='26' width='70' height='30' fill='#e2f4ec' stroke='#178a5e' stroke-width='1.3'/><text x='49.0' y='44.5' text-anchor='middle' font-size='10.5' font-weight='700' fill='#178a5e'>IP 20</text><rect x='86' y='26' width='70' height='30' fill='#fcefe4' stroke='#d0702c' stroke-width='1.3'/><text x='121.0' y='44.5' text-anchor='middle' font-size='10.5' font-weight='700' fill='#d0702c'>TCP 20</text><rect x='158' y='26' width='468' height='30' fill='#e6eefc' stroke='#2f6fdb' stroke-width='1.3'/><text x='392.0' y='44.5' text-anchor='middle' font-size='10.5' font-weight='700' fill='#2f6fdb'>data: up to 1,460 bytes (the MSS)</text><text x='14' y='18' text-anchor='start' font-size='10.5' font-weight='700' fill='#1f2a44'>The SYN carries options. The maximum segment size (MSS) on Ethernet or Wi-Fi:</text><path d='M14 60 Q14 68 22 68 L314.0 68 Q320.0 68 320.0 75 Q320.0 68 326.0 68 L618 68 Q626 68 626 60' fill='none' stroke='#6b7280' stroke-width='1.6'/><text x='320.0' y='90' text-anchor='middle' font-size='10.5' font-weight='700' fill='#6b7280'>one packet: 1,500 bytes (lesson 6)</text></svg>