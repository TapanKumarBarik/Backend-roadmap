<svg width='640' height='134' role='img' viewBox='0 0 640 134' xmlns='http://www.w3.org/2000/svg' font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"><title>Figure 1: TCP sequence numbers and ACKs</title><desc>A phone on the left and a server on the right, with the network between them. One packet is lost at a busy router, one overtakes another, and one arrives twice.</desc><rect x='0' y='0' width='640' height='134' rx='16' fill='#fbfbf9' stroke='#e4e4de'/><defs><marker id='ar-blue' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#2f6fdb'/></marker><marker id='ar-green' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#178a5e'/></marker><marker id='ar-purple' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#6f52c9'/></marker><marker id='ar-orange' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#d0702c'/></marker><marker id='ar-pink' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#c43d6e'/></marker><marker id='ar-grey' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#6b7280'/></marker><marker id='ar-teal' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#0f7b6c'/></marker><marker id='ar-ink' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#5b6478'/></marker></defs><rect x='10' y='42' width='104' height='50' rx='7' fill='#e6eefc' stroke='#2f6fdb' stroke-width='1.6'/><text x='62.0' y='65.0' text-anchor='middle' font-size='12.5' font-weight='600' fill='#1f2a44'>Your phone</text><text x='62.0' y='80.0' text-anchor='middle' font-size='10.5' fill='#5b6478'>sender</text><rect x='526' y='42' width='104' height='50' rx='7' fill='#e2f4ec' stroke='#178a5e' stroke-width='1.6'/><text x='578.0' y='65.0' text-anchor='middle' font-size='12.5' font-weight='600' fill='#1f2a44'>Server</text><text x='578.0' y='80.0' text-anchor='middle' font-size='10.5' fill='#5b6478'>receiver</text><rect x='130' y='6' width='380' height='122' rx='9' fill='#f1f2f4' fill-opacity='0.45' stroke='#6b7280' stroke-opacity='0.5' stroke-dasharray='4 4'/><text x='140' y='22' font-size='10' font-weight='700' letter-spacing='0.06em' fill='#6b7280'>THE NETWORK (ROUTERS)</text><line x1='116' y1='44' x2='522' y2='44' stroke='#d9d4c7' stroke-width='1.2'/><line x1='116' y1='76' x2='522' y2='76' stroke='#d9d4c7' stroke-width='1.2'/><line x1='116' y1='108' x2='522' y2='108' stroke='#d9d4c7' stroke-width='1.2'/><line x1='116' y1='44' x2='250' y2='44' stroke='#2f6fdb' stroke-width='1.6'/><rect x='168' y='33' width='30' height='22' rx='4' fill='#e6eefc' stroke='#2f6fdb' stroke-width='1.5'/><text x='183.0' y='48.5' text-anchor='middle' font-size='12.5' font-weight='700' fill='#1f2a44'>3</text><text x='262' y='49.0' text-anchor='middle' font-size='15' font-weight='700' fill='#c43d6e'>✕</text><text x='282' y='40' text-anchor='start' font-size='10.5' font-weight='600' fill='#c43d6e'>lost: a busy router throws it away</text><rect x='168' y='65' width='30' height='22' rx='4' fill='#e6eefc' stroke='#2f6fdb' stroke-width='1.5'/><text x='183.0' y='80.5' text-anchor='middle' font-size='12.5' font-weight='700' fill='#1f2a44'>5</text><rect x='208' y='65' width='30' height='22' rx='4' fill='#e6eefc' stroke='#2f6fdb' stroke-width='1.5'/><text x='223.0' y='80.5' text-anchor='middle' font-size='12.5' font-weight='700' fill='#1f2a44'>4</text><text x='282' y='72' text-anchor='start' font-size='10.5' font-weight='600' fill='#d0702c'>reordered: 5 overtakes 4</text><rect x='168' y='97' width='30' height='22' rx='4' fill='#e6eefc' stroke='#2f6fdb' stroke-width='1.5'/><text x='183.0' y='112.5' text-anchor='middle' font-size='12.5' font-weight='700' fill='#1f2a44'>2</text><rect x='208' y='97' width='30' height='22' rx='4' fill='#e6eefc' stroke='#2f6fdb' stroke-width='1.5'/><text x='223.0' y='112.5' text-anchor='middle' font-size='12.5' font-weight='700' fill='#1f2a44'>2</text><text x='282' y='104' text-anchor='start' font-size='10.5' font-weight='600' fill='#d0702c'>duplicate: 2 arrives twice</text></svg>