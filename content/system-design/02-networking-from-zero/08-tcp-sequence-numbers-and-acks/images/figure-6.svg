<svg width='640' height='164' role='img' viewBox='0 0 640 164' xmlns='http://www.w3.org/2000/svg' font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"><title>Figure 6: TCP sequence numbers and ACKs</title><desc>A timeline: the last segment is lost, so no duplicate ACKs arrive. The sender&#x27;s timer, a little longer than one round trip, runs out; it retransmits, starts a timer twice as long, and the ACK comes back.</desc><rect x='0' y='0' width='640' height='164' rx='16' fill='#fbfbf9' stroke='#e4e4de'/><defs><marker id='ar-blue' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#2f6fdb'/></marker><marker id='ar-green' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#178a5e'/></marker><marker id='ar-purple' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#6f52c9'/></marker><marker id='ar-orange' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#d0702c'/></marker><marker id='ar-pink' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#c43d6e'/></marker><marker id='ar-grey' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#6b7280'/></marker><marker id='ar-teal' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#0f7b6c'/></marker><marker id='ar-ink' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#5b6478'/></marker></defs><text x='10' y='70' text-anchor='start' font-size='11' font-weight='700' fill='#2f6fdb'>Your phone</text><text x='10' y='132' text-anchor='start' font-size='11' font-weight='700' fill='#178a5e'>Server</text><line x1='96' y1='66' x2='630' y2='66' stroke='#2f6fdb' stroke-width='1.4'/><line x1='96' y1='128' x2='630' y2='128' stroke='#178a5e' stroke-width='1.4'/><line x1='110' y1='66' x2='140' y2='98' stroke='#c43d6e' stroke-width='1.6'/><text x='146' y='109.0' text-anchor='middle' font-size='15' font-weight='700' fill='#c43d6e'>✕</text><text x='160' y='100' text-anchor='start' font-size='9.5' font-weight='600' fill='#c43d6e'>last segment lost:</text><text x='160' y='112' text-anchor='start' font-size='9.5' font-weight='600' fill='#c43d6e'>no duplicate ACKs</text><rect x='110' y='26' width='170' height='16' rx='4' fill='#fcefe4' stroke='#d0702c' stroke-width='1.3'/><text x='195' y='38' text-anchor='middle' font-size='9' font-weight='600' fill='#d0702c'>timer ≈ a bit more than 1 round trip</text><text x='280' y='18' text-anchor='middle' font-size='10.5' font-weight='700' fill='#d0702c'>timeout!</text><line x1='280' y1='66' x2='336' y2='124' stroke='#2f6fdb' stroke-width='2.4' marker-end='url(#ar-blue)'/><text x='316' y='88' text-anchor='start' font-size='10' font-weight='700' fill='#2f6fdb'>retransmit</text><line x1='344' y1='128' x2='400' y2='70' stroke='#178a5e' stroke-width='1.8' stroke-dasharray='5 4' marker-end='url(#ar-green)'/><text x='388' y='106' text-anchor='start' font-size='10' font-weight='700' fill='#178a5e'>ACK arrives</text><rect x='280' y='46' width='340' height='12' rx='4' fill='#fff' stroke='#d0702c' stroke-width='1.2' stroke-dasharray='4 3'/><text x='624' y='40' text-anchor='end' font-size='9' font-weight='600' fill='#d0702c'>new timer, doubled: only fires if this copy is lost too</text><text x='10' y='156' text-anchor='start' font-size='10' font-weight='400' fill='#5b6478' font-style='italic'>round trip = data going there + the ACK coming back. Each timeout doubles the timer, in case the network is struggling.</text></svg>