<svg width='640' height='234' role='img' viewBox='0 0 640 234' xmlns='http://www.w3.org/2000/svg' font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"><title>Figure 2: TCP sequence numbers and ACKs</title><desc>You post five numbered envelopes. They arrive as 3, 1, 5, 2, 2: your friend throws away the spare page 2, sorts the rest, sees page 4 is missing and sends a postcard saying I have pages 1 to 3, send page 4 next.</desc><rect x='0' y='0' width='640' height='234' rx='16' fill='#fbfbf9' stroke='#e4e4de'/><defs><marker id='ar-blue' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#2f6fdb'/></marker><marker id='ar-green' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#178a5e'/></marker><marker id='ar-purple' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#6f52c9'/></marker><marker id='ar-orange' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#d0702c'/></marker><marker id='ar-pink' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#c43d6e'/></marker><marker id='ar-grey' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#6b7280'/></marker><marker id='ar-teal' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#0f7b6c'/></marker><marker id='ar-ink' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#5b6478'/></marker></defs><rect x='10' y='12' width='96' height='46' rx='7' fill='#e6eefc' stroke='#2f6fdb' stroke-width='1.6'/><text x='58.0' y='33.0' text-anchor='middle' font-size='12.5' font-weight='600' fill='#1f2a44'>You</text><text x='58.0' y='48.0' text-anchor='middle' font-size='10.5' fill='#5b6478'>send the letter</text><rect x='124' y='23' width='34' height='24' rx='3' fill='#e6eefc' stroke='#2f6fdb' stroke-width='1.5'/><path d='M124 23 L141.0 33.8 L158 23' fill='none' stroke='#2f6fdb' stroke-width='1.1'/><text x='141.0' y='43' text-anchor='middle' font-size='11' font-weight='700' fill='#1f2a44'>1</text><rect x='164' y='23' width='34' height='24' rx='3' fill='#e6eefc' stroke='#2f6fdb' stroke-width='1.5'/><path d='M164 23 L181.0 33.8 L198 23' fill='none' stroke='#2f6fdb' stroke-width='1.1'/><text x='181.0' y='43' text-anchor='middle' font-size='11' font-weight='700' fill='#1f2a44'>2</text><rect x='204' y='23' width='34' height='24' rx='3' fill='#e6eefc' stroke='#2f6fdb' stroke-width='1.5'/><path d='M204 23 L221.0 33.8 L238 23' fill='none' stroke='#2f6fdb' stroke-width='1.1'/><text x='221.0' y='43' text-anchor='middle' font-size='11' font-weight='700' fill='#1f2a44'>3</text><rect x='244' y='23' width='34' height='24' rx='3' fill='#e6eefc' stroke='#2f6fdb' stroke-width='1.5'/><path d='M244 23 L261.0 33.8 L278 23' fill='none' stroke='#2f6fdb' stroke-width='1.1'/><text x='261.0' y='43' text-anchor='middle' font-size='11' font-weight='700' fill='#1f2a44'>4</text><rect x='284' y='23' width='34' height='24' rx='3' fill='#e6eefc' stroke='#2f6fdb' stroke-width='1.5'/><path d='M284 23 L301.0 33.8 L318 23' fill='none' stroke='#2f6fdb' stroke-width='1.1'/><text x='301.0' y='43' text-anchor='middle' font-size='11' font-weight='700' fill='#1f2a44'>5</text><line x1='324' y1='35' x2='354' y2='35' stroke='#5b6478' stroke-width='1.5' marker-end='url(#ar-ink)'/><rect x='358' y='12' width='116' height='46' rx='7' fill='#eee9fb' stroke='#6f52c9' stroke-width='1.6'/><text x='416.0' y='33.0' text-anchor='middle' font-size='12.5' font-weight='600' fill='#1f2a44'>Post office</text><text x='416.0' y='48.0' text-anchor='middle' font-size='10.5' fill='#5b6478'>usually works</text><line x1='474' y1='35' x2='518' y2='35' stroke='#5b6478' stroke-width='1.5' marker-end='url(#ar-ink)'/><rect x='522' y='12' width='108' height='46' rx='7' fill='#e2f4ec' stroke='#178a5e' stroke-width='1.6'/><text x='576.0' y='33.0' text-anchor='middle' font-size='12.5' font-weight='600' fill='#1f2a44'>Friend</text><text x='576.0' y='48.0' text-anchor='middle' font-size='10.5' fill='#5b6478'>rebuilds the letter</text><text x='10' y='94' text-anchor='start' font-size='11' font-weight='700' fill='#1f2a44'>Arrives in any order</text><rect x='180' y='76' width='34' height='24' rx='3' fill='#e6eefc' stroke='#2f6fdb' stroke-width='1.5'/><path d='M180 76 L197.0 86.8 L214 76' fill='none' stroke='#2f6fdb' stroke-width='1.1'/><text x='197.0' y='96' text-anchor='middle' font-size='11' font-weight='700' fill='#1f2a44'>3</text><rect x='220' y='76' width='34' height='24' rx='3' fill='#e6eefc' stroke='#2f6fdb' stroke-width='1.5'/><path d='M220 76 L237.0 86.8 L254 76' fill='none' stroke='#2f6fdb' stroke-width='1.1'/><text x='237.0' y='96' text-anchor='middle' font-size='11' font-weight='700' fill='#1f2a44'>1</text><rect x='260' y='76' width='34' height='24' rx='3' fill='#e6eefc' stroke='#2f6fdb' stroke-width='1.5'/><path d='M260 76 L277.0 86.8 L294 76' fill='none' stroke='#2f6fdb' stroke-width='1.1'/><text x='277.0' y='96' text-anchor='middle' font-size='11' font-weight='700' fill='#1f2a44'>5</text><rect x='300' y='76' width='34' height='24' rx='3' fill='#e6eefc' stroke='#2f6fdb' stroke-width='1.5'/><path d='M300 76 L317.0 86.8 L334 76' fill='none' stroke='#2f6fdb' stroke-width='1.1'/><text x='317.0' y='96' text-anchor='middle' font-size='11' font-weight='700' fill='#1f2a44'>2</text><rect x='340' y='76' width='34' height='24' rx='3' fill='#e6eefc' stroke='#2f6fdb' stroke-width='1.5'/><path d='M340 76 L357.0 86.8 L374 76' fill='none' stroke='#2f6fdb' stroke-width='1.1'/><text x='357.0' y='96' text-anchor='middle' font-size='11' font-weight='700' fill='#1f2a44'>2</text><line x1='337' y1='103' x2='377' y2='73' stroke='#c43d6e' stroke-width='2'/><text x='392' y='92' text-anchor='start' font-size='10.5' font-weight='600' fill='#d0702c'>page 2 came twice: throw one copy away</text><text x='10' y='134' text-anchor='start' font-size='11' font-weight='700' fill='#1f2a44'>Sorted by page number</text><rect x='180' y='116' width='34' height='24' rx='3' fill='#e6eefc' stroke='#2f6fdb' stroke-width='1.5'/><path d='M180 116 L197.0 126.8 L214 116' fill='none' stroke='#2f6fdb' stroke-width='1.1'/><text x='197.0' y='136' text-anchor='middle' font-size='11' font-weight='700' fill='#1f2a44'>1</text><rect x='220' y='116' width='34' height='24' rx='3' fill='#e6eefc' stroke='#2f6fdb' stroke-width='1.5'/><path d='M220 116 L237.0 126.8 L254 116' fill='none' stroke='#2f6fdb' stroke-width='1.1'/><text x='237.0' y='136' text-anchor='middle' font-size='11' font-weight='700' fill='#1f2a44'>2</text><rect x='260' y='116' width='34' height='24' rx='3' fill='#e6eefc' stroke='#2f6fdb' stroke-width='1.5'/><path d='M260 116 L277.0 126.8 L294 116' fill='none' stroke='#2f6fdb' stroke-width='1.1'/><text x='277.0' y='136' text-anchor='middle' font-size='11' font-weight='700' fill='#1f2a44'>3</text><rect x='300' y='116' width='34' height='24' rx='3' fill='#fbe6ee' stroke='#c43d6e' stroke-width='1.5' stroke-dasharray='4 3'/><text x='317.0' y='136' text-anchor='middle' font-size='11' font-weight='700' fill='#1f2a44'>4 ?</text><rect x='340' y='116' width='34' height='24' rx='3' fill='#e6eefc' stroke='#2f6fdb' stroke-width='1.5'/><path d='M340 116 L357.0 126.8 L374 116' fill='none' stroke='#2f6fdb' stroke-width='1.1'/><text x='357.0' y='136' text-anchor='middle' font-size='11' font-weight='700' fill='#1f2a44'>5</text><text x='392' y='132' text-anchor='start' font-size='10.5' font-weight='700' fill='#c43d6e'>page 4 never arrived: a gap</text><text x='10' y='180' text-anchor='start' font-size='11' font-weight='700' fill='#1f2a44'>Friend replies</text><rect x='180' y='156' width='200' height='44' rx='5' fill='#e2f4ec' stroke='#178a5e' stroke-width='1.5'/><text x='192' y='174' text-anchor='start' font-size='10.5' font-weight='600' fill='#1f2a44'>Postcard: “I have pages 1 to 3.</text><text x='192' y='189' text-anchor='start' font-size='10.5' font-weight='600' fill='#1f2a44'>Send page 4 next.”</text><text x='392' y='182' text-anchor='start' font-size='11' font-weight='700' fill='#178a5e'>= the idea of an ACK</text><text x='10' y='222' text-anchor='start' font-size='10.5' font-weight='600' fill='#1f2a44'>No postcard after a few days? Post page 4 again.</text><text x='330' y='222' text-anchor='start' font-size='10.5' font-weight='600' fill='#d0702c'>waiting too long = timeout · posting again = retransmit</text></svg>