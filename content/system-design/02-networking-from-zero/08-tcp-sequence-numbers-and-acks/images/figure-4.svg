<svg width='640' height='184' role='img' viewBox='0 0 640 184' xmlns='http://www.w3.org/2000/svg' font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"><title>Figure 4: TCP sequence numbers and ACKs</title><desc>The phone sends segments with sequence numbers 1, 1,001 and 2,001. The server answers ACK 1,001, ACK 2,001 and ACK 3,001: each ACK names the next byte it expects.</desc><rect x='0' y='0' width='640' height='184' rx='16' fill='#fbfbf9' stroke='#e4e4de'/><defs><marker id='ar-blue' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#2f6fdb'/></marker><marker id='ar-green' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#178a5e'/></marker><marker id='ar-purple' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#6f52c9'/></marker><marker id='ar-orange' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#d0702c'/></marker><marker id='ar-pink' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#c43d6e'/></marker><marker id='ar-grey' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#6b7280'/></marker><marker id='ar-teal' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#0f7b6c'/></marker><marker id='ar-ink' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#5b6478'/></marker></defs><line x1='80' y1='40' x2='80' y2='176' stroke='#d9d4c7' stroke-width='1.2' stroke-dasharray='4 4'/><rect x='28.0' y='6' width='104' height='34' rx='6' fill='#e6eefc' stroke='#2f6fdb' stroke-width='1.5'/><text x='80' y='27' text-anchor='middle' font-size='12' font-weight='700' fill='#1f2a44'>Your phone</text><line x1='330' y1='40' x2='330' y2='176' stroke='#d9d4c7' stroke-width='1.2' stroke-dasharray='4 4'/><rect x='278.0' y='6' width='104' height='34' rx='6' fill='#e2f4ec' stroke='#178a5e' stroke-width='1.5'/><text x='330' y='27' text-anchor='middle' font-size='12' font-weight='700' fill='#1f2a44'>Server</text><line x1='80' y1='62' x2='326' y2='62' stroke='#2f6fdb' stroke-width='1.6' marker-end='url(#ar-blue)'/><text x='92' y='57' text-anchor='start' font-size='10' font-weight='600' fill='#2f6fdb'>seq 1 · bytes 1–1,000</text><line x1='330' y1='83' x2='84' y2='83' stroke='#178a5e' stroke-width='1.6' marker-end='url(#ar-green)' stroke-dasharray="5 4"/><text x='318' y='78' text-anchor='end' font-size='10' font-weight='700' fill='#178a5e'>ACK 1,001</text><line x1='80' y1='104' x2='326' y2='104' stroke='#2f6fdb' stroke-width='1.6' marker-end='url(#ar-blue)'/><text x='92' y='99' text-anchor='start' font-size='10' font-weight='600' fill='#2f6fdb'>seq 1,001 · bytes 1,001–2,000</text><line x1='330' y1='125' x2='84' y2='125' stroke='#178a5e' stroke-width='1.6' marker-end='url(#ar-green)' stroke-dasharray="5 4"/><text x='318' y='120' text-anchor='end' font-size='10' font-weight='700' fill='#178a5e'>ACK 2,001</text><line x1='80' y1='146' x2='326' y2='146' stroke='#2f6fdb' stroke-width='1.6' marker-end='url(#ar-blue)'/><text x='92' y='141' text-anchor='start' font-size='10' font-weight='600' fill='#2f6fdb'>seq 2,001 · bytes 2,001–3,000</text><line x1='330' y1='167' x2='84' y2='167' stroke='#178a5e' stroke-width='1.6' marker-end='url(#ar-green)' stroke-dasharray="5 4"/><text x='318' y='162' text-anchor='end' font-size='10' font-weight='700' fill='#178a5e'>ACK 3,001</text><text x='384' y='58' text-anchor='start' font-size='10.5' font-weight='700' fill='#1f2a44'>ACK 1,001 means:</text><text x='384' y='73' text-anchor='start' font-size='10.5' font-weight='400' fill='#5b6478'>“I have everything up to 1,000.</text><text x='384' y='88' text-anchor='start' font-size='10.5' font-weight='400' fill='#5b6478'>Send me 1,001 next.”</text><text x='384' y='116' text-anchor='start' font-size='10.5' font-weight='700' fill='#1f2a44'>Like a parcel tracking page:</text><text x='384' y='131' text-anchor='start' font-size='10.5' font-weight='400' fill='#5b6478'>one line, “everything up to here</text><text x='384' y='146' text-anchor='start' font-size='10.5' font-weight='400' fill='#5b6478'>has arrived”. No gaps.</text><text x='384' y='172' text-anchor='start' font-size='10.5' font-weight='700' fill='#178a5e'>the ACK number = the next byte expected</text></svg>