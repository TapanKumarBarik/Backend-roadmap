<svg width='640' height='282' role='img' viewBox='0 0 640 282' xmlns='http://www.w3.org/2000/svg' font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"><title>Figure 5: TCP sequence numbers and ACKs</title><desc>Five segments, sequence numbers 1 to 4,001. Segment 1,001 is lost. Segments 2,001, 3,001 and 4,001 each get a duplicate ACK 1,001. After three duplicates the phone resends segment 1,001, and the server answers ACK 5,001.</desc><rect x='0' y='0' width='640' height='282' rx='16' fill='#fbfbf9' stroke='#e4e4de'/><defs><marker id='ar-blue' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#2f6fdb'/></marker><marker id='ar-green' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#178a5e'/></marker><marker id='ar-purple' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#6f52c9'/></marker><marker id='ar-orange' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#d0702c'/></marker><marker id='ar-pink' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#c43d6e'/></marker><marker id='ar-grey' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#6b7280'/></marker><marker id='ar-teal' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#0f7b6c'/></marker><marker id='ar-ink' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#5b6478'/></marker></defs><line x1='92' y1='40' x2='92' y2='274' stroke='#d9d4c7' stroke-width='1.2' stroke-dasharray='4 4'/><rect x='40.0' y='6' width='104' height='34' rx='6' fill='#e6eefc' stroke='#2f6fdb' stroke-width='1.5'/><text x='92' y='27' text-anchor='middle' font-size='12' font-weight='700' fill='#1f2a44'>Your phone</text><line x1='342' y1='40' x2='342' y2='274' stroke='#d9d4c7' stroke-width='1.2' stroke-dasharray='4 4'/><rect x='290.0' y='6' width='104' height='34' rx='6' fill='#e2f4ec' stroke='#178a5e' stroke-width='1.5'/><text x='342' y='27' text-anchor='middle' font-size='12' font-weight='700' fill='#1f2a44'>Server</text><circle cx='22' cy='56' r='9' fill='#d0702c'/><text x='22' y='59.8' text-anchor='middle' font-size='10.5' font-weight='700' fill='#fff'>1</text><line x1='92' y1='58' x2='338' y2='58' stroke='#2f6fdb' stroke-width='1.6' marker-end='url(#ar-blue)'/><text x='104' y='53' text-anchor='start' font-size='10' font-weight='600' fill='#2f6fdb'>seq 1</text><line x1='342' y1='78' x2='96' y2='78' stroke='#178a5e' stroke-width='1.6' marker-end='url(#ar-green)' stroke-dasharray="5 4"/><text x='330' y='73' text-anchor='end' font-size='10' font-weight='700' fill='#178a5e'>ACK 1,001</text><circle cx='22' cy='96' r='9' fill='#d0702c'/><text x='22' y='99.8' text-anchor='middle' font-size='10.5' font-weight='700' fill='#fff'>2</text><line x1='92' y1='98' x2='206' y2='98' stroke='#c43d6e' stroke-width='1.6'/><text x='217' y='103.0' text-anchor='middle' font-size='15' font-weight='700' fill='#c43d6e'>✕</text><text x='104' y='93' text-anchor='start' font-size='10' font-weight='700' fill='#c43d6e'>seq 1,001</text><circle cx='22' cy='116' r='9' fill='#d0702c'/><text x='22' y='119.8' text-anchor='middle' font-size='10.5' font-weight='700' fill='#fff'>3</text><line x1='92' y1='118' x2='338' y2='118' stroke='#2f6fdb' stroke-width='1.6' marker-end='url(#ar-blue)'/><text x='104' y='113' text-anchor='start' font-size='10' font-weight='600' fill='#2f6fdb'>seq 2,001</text><line x1='342' y1='138' x2='96' y2='138' stroke='#d0702c' stroke-width='1.6' marker-end='url(#ar-orange)' stroke-dasharray="5 4"/><text x='330' y='133' text-anchor='end' font-size='10' font-weight='700' fill='#d0702c'>ACK 1,001 (duplicate 1)</text><circle cx='22' cy='156' r='9' fill='#d0702c'/><text x='22' y='159.8' text-anchor='middle' font-size='10.5' font-weight='700' fill='#fff'>4</text><line x1='92' y1='158' x2='338' y2='158' stroke='#2f6fdb' stroke-width='1.6' marker-end='url(#ar-blue)'/><text x='104' y='153' text-anchor='start' font-size='10' font-weight='600' fill='#2f6fdb'>seq 3,001</text><line x1='342' y1='178' x2='96' y2='178' stroke='#d0702c' stroke-width='1.6' marker-end='url(#ar-orange)' stroke-dasharray="5 4"/><text x='330' y='173' text-anchor='end' font-size='10' font-weight='700' fill='#d0702c'>ACK 1,001 (duplicate 2)</text><circle cx='22' cy='196' r='9' fill='#d0702c'/><text x='22' y='199.8' text-anchor='middle' font-size='10.5' font-weight='700' fill='#fff'>5</text><line x1='92' y1='198' x2='338' y2='198' stroke='#2f6fdb' stroke-width='1.6' marker-end='url(#ar-blue)'/><text x='104' y='193' text-anchor='start' font-size='10' font-weight='600' fill='#2f6fdb'>seq 4,001</text><line x1='342' y1='218' x2='96' y2='218' stroke='#d0702c' stroke-width='1.6' marker-end='url(#ar-orange)' stroke-dasharray="5 4"/><text x='330' y='213' text-anchor='end' font-size='10' font-weight='700' fill='#d0702c'>ACK 1,001 (duplicate 3)</text><circle cx='22' cy='236' r='9' fill='#d0702c'/><text x='22' y='239.8' text-anchor='middle' font-size='10.5' font-weight='700' fill='#fff'>6</text><line x1='92' y1='238' x2='338' y2='238' stroke='#2f6fdb' stroke-width='2.6' marker-end='url(#ar-blue)'/><text x='104' y='232' text-anchor='start' font-size='10' font-weight='700' fill='#2f6fdb'>resend seq 1,001</text><line x1='342' y1='258' x2='96' y2='258' stroke='#178a5e' stroke-width='2.6' marker-end='url(#ar-green)' stroke-dasharray="5 4"/><text x='330' y='252' text-anchor='end' font-size='10.5' font-weight='700' fill='#178a5e'>ACK 5,001</text><text x='392' y='62' text-anchor='start' font-size='10.5' font-weight='400' fill='#5b6478'>all good</text><text x='392' y='96' text-anchor='start' font-size='10.5' font-weight='600' fill='#c43d6e'>lost: nothing arrives,</text><text x='392' y='110' text-anchor='start' font-size='10.5' font-weight='600' fill='#c43d6e'>so the server says nothing</text><text x='392' y='128' text-anchor='start' font-size='10.5' font-weight='400' fill='#5b6478'>kept in memory, but bytes</text><text x='392' y='142' text-anchor='start' font-size='10.5' font-weight='400' fill='#5b6478'>1,001–2,000 are still missing:</text><text x='392' y='156' text-anchor='start' font-size='10.5' font-weight='600' fill='#d0702c'>“I still need 1,001”</text><text x='392' y='224' text-anchor='start' font-size='10.5' font-weight='700' fill='#2f6fdb'>3 duplicate ACKs: resend now,</text><text x='392' y='238' text-anchor='start' font-size='10.5' font-weight='700' fill='#2f6fdb'>no waiting (fast retransmit)</text><text x='392' y='254' text-anchor='start' font-size='10.5' font-weight='700' fill='#178a5e'>gap filled: every byte 1–5,000,</text><text x='392' y='268' text-anchor='start' font-size='10.5' font-weight='700' fill='#178a5e'>so the ACK jumps to 5,001</text></svg>