<svg width='640' height='172' role='img' viewBox='0 0 640 172' xmlns='http://www.w3.org/2000/svg' font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"><title>Figure 3: TCP sequence numbers and ACKs</title><desc>3,000 bytes split into three segments of 1,000 bytes. Each segment is a TCP header plus data, inside an IP packet, and its header carries sequence number 1, 1,001 or 2,001.</desc><rect x='0' y='0' width='640' height='172' rx='16' fill='#fbfbf9' stroke='#e4e4de'/><defs><marker id='ar-blue' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#2f6fdb'/></marker><marker id='ar-green' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#178a5e'/></marker><marker id='ar-purple' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#6f52c9'/></marker><marker id='ar-orange' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#d0702c'/></marker><marker id='ar-pink' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#c43d6e'/></marker><marker id='ar-grey' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#6b7280'/></marker><marker id='ar-teal' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#0f7b6c'/></marker><marker id='ar-ink' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#5b6478'/></marker></defs><text x='20' y='16' text-anchor='start' font-size='11' font-weight='700' fill='#1f2a44'>3,000 bytes of your photo</text><rect x='20' y='24' width='200' height='28' fill='#e6eefc' stroke='#2f6fdb' stroke-width='1.4'/><text x='120' y='42' text-anchor='middle' font-size='10.5' font-weight='600' fill='#1f2a44'>bytes 1 – 1,000</text><line x1='120' y1='54' x2='120' y2='76' stroke='#5b6478' stroke-width='1.5' marker-end='url(#ar-ink)'/><rect x='220' y='24' width='200' height='28' fill='#e6eefc' stroke='#2f6fdb' stroke-width='1.4'/><text x='320' y='42' text-anchor='middle' font-size='10.5' font-weight='600' fill='#1f2a44'>bytes 1,001 – 2,000</text><line x1='320' y1='54' x2='320' y2='76' stroke='#5b6478' stroke-width='1.5' marker-end='url(#ar-ink)'/><rect x='420' y='24' width='200' height='28' fill='#e6eefc' stroke='#2f6fdb' stroke-width='1.4'/><text x='520' y='42' text-anchor='middle' font-size='10.5' font-weight='600' fill='#1f2a44'>bytes 2,001 – 3,000</text><line x1='520' y1='54' x2='520' y2='76' stroke='#5b6478' stroke-width='1.5' marker-end='url(#ar-ink)'/><rect x='24' y='80' width='192' height='60' rx='7' fill='#fff' stroke='#5b6478' stroke-width='1' stroke-dasharray='4 3'/><text x='30' y='93' text-anchor='start' font-size='9' font-weight='600' fill='#1f2a44'>IP packet</text><rect x='30' y='100' width='70' height='32' rx='4' fill='#f1f2f4' stroke='#6b7280' stroke-width='1.3'/><text x='65' y='113' text-anchor='middle' font-size='8.5' font-weight='600' fill='#1f2a44'>TCP header</text><text x='65' y='126' text-anchor='middle' font-size='9.5' font-family='DejaVu Sans Mono, monospace' fill='#2f6fdb' font-weight='700'>seq 1</text><rect x='104' y='100' width='106' height='32' rx='4' fill='#e6eefc' stroke='#2f6fdb' stroke-width='1.3'/><text x='157' y='120' text-anchor='middle' font-size='9.5' font-weight='600' fill='#1f2a44'>1,000 bytes of data</text><rect x='224' y='80' width='192' height='60' rx='7' fill='#fff' stroke='#5b6478' stroke-width='1' stroke-dasharray='4 3'/><text x='230' y='93' text-anchor='start' font-size='9' font-weight='600' fill='#1f2a44'>IP packet</text><rect x='230' y='100' width='70' height='32' rx='4' fill='#f1f2f4' stroke='#6b7280' stroke-width='1.3'/><text x='265' y='113' text-anchor='middle' font-size='8.5' font-weight='600' fill='#1f2a44'>TCP header</text><text x='265' y='126' text-anchor='middle' font-size='9.5' font-family='DejaVu Sans Mono, monospace' fill='#2f6fdb' font-weight='700'>seq 1,001</text><rect x='304' y='100' width='106' height='32' rx='4' fill='#e6eefc' stroke='#2f6fdb' stroke-width='1.3'/><text x='357' y='120' text-anchor='middle' font-size='9.5' font-weight='600' fill='#1f2a44'>1,000 bytes of data</text><rect x='424' y='80' width='192' height='60' rx='7' fill='#fff' stroke='#5b6478' stroke-width='1' stroke-dasharray='4 3'/><text x='430' y='93' text-anchor='start' font-size='9' font-weight='600' fill='#1f2a44'>IP packet</text><rect x='430' y='100' width='70' height='32' rx='4' fill='#f1f2f4' stroke='#6b7280' stroke-width='1.3'/><text x='465' y='113' text-anchor='middle' font-size='8.5' font-weight='600' fill='#1f2a44'>TCP header</text><text x='465' y='126' text-anchor='middle' font-size='9.5' font-family='DejaVu Sans Mono, monospace' fill='#2f6fdb' font-weight='700'>seq 2,001</text><rect x='504' y='100' width='106' height='32' rx='4' fill='#e6eefc' stroke='#2f6fdb' stroke-width='1.3'/><text x='557' y='120' text-anchor='middle' font-size='9.5' font-weight='600' fill='#1f2a44'>1,000 bytes of data</text><text x='320' y='166' text-anchor='middle' font-size='10.5' font-weight='400' fill='#5b6478' font-style='italic'>the sequence number in the header = the number of the segment&#x27;s first byte</text></svg>