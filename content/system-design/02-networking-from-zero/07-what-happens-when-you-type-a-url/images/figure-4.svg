<svg width='640' height='180' role='img' viewBox='0 0 640 180' xmlns='http://www.w3.org/2000/svg' font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"><title>Figure 4: What happens when you type a URL</title><desc>A sequence diagram between laptop and server: SYN, SYN-ACK and ACK in orange open the connection; then two purple TLS messages, hello with options and the server&#x27;s choice with its certificate; then encrypted HTTP in blue.</desc><rect x='0' y='0' width='640' height='180' rx='16' fill='#fbfbf9' stroke='#e4e4de'/><defs><marker id='ar-blue' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#2f6fdb'/></marker><marker id='ar-green' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#178a5e'/></marker><marker id='ar-purple' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#6f52c9'/></marker><marker id='ar-orange' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#d0702c'/></marker><marker id='ar-pink' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#c43d6e'/></marker><marker id='ar-grey' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#6b7280'/></marker><marker id='ar-teal' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#0f7b6c'/></marker><marker id='ar-ink' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#5b6478'/></marker></defs><text x='60' y='16' text-anchor='middle' font-size='11' font-weight='700' fill='#2f6fdb'>laptop</text><line x1='60' y1='22' x2='60' y2='170' stroke='#2f6fdb' stroke-width='1.4'/><text x='580' y='16' text-anchor='middle' font-size='11' font-weight='700' fill='#178a5e'>server</text><line x1='580' y1='22' x2='580' y2='170' stroke='#178a5e' stroke-width='1.4'/><line x1='62' y1='36' x2='576' y2='42' stroke='#d0702c' stroke-width='1.5' marker-end='url(#ar-orange)'/><text x='320' y='34' text-anchor='middle' font-size='9.8' font-weight='700' fill='#d0702c'>SYN: can we talk?</text><line x1='578' y1='60' x2='64' y2='66' stroke='#d0702c' stroke-width='1.5' marker-end='url(#ar-orange)'/><text x='320' y='58' text-anchor='middle' font-size='9.8' font-weight='700' fill='#d0702c'>SYN-ACK: yes, can you hear me?</text><line x1='62' y1='84' x2='576' y2='90' stroke='#d0702c' stroke-width='1.5' marker-end='url(#ar-orange)'/><text x='320' y='82' text-anchor='middle' font-size='9.8' font-weight='700' fill='#d0702c'>ACK: yes (connection open)</text><line x1='62' y1='114' x2='576' y2='120' stroke='#6f52c9' stroke-width='1.5' marker-end='url(#ar-purple)'/><text x='320' y='112' text-anchor='middle' font-size='9.8' font-weight='700' fill='#6f52c9'>TLS: hello, here are my options</text><line x1='578' y1='138' x2='64' y2='144' stroke='#6f52c9' stroke-width='1.5' marker-end='url(#ar-purple)'/><text x='320' y='136' text-anchor='middle' font-size='9.8' font-weight='700' fill='#6f52c9'>TLS: my choice + my certificate</text><line x1='62' y1='162' x2='576' y2='168' stroke='#2f6fdb' stroke-width='1.5' marker-end='url(#ar-blue)'/><text x='320' y='160' text-anchor='middle' font-size='9.8' font-weight='700' fill='#2f6fdb'>encrypted HTTP from now on</text></svg>