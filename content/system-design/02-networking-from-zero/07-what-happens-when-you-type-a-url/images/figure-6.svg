<svg width='640' height='120' role='img' viewBox='0 0 640 120' xmlns='http://www.w3.org/2000/svg' font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"><title>Figure 6: What happens when you type a URL</title><desc>A bar of five 50-millisecond blocks: DNS, TCP, TLS 1.3, HTTP and the server&#x27;s work, about 250 milliseconds in all.</desc><rect x='0' y='0' width='640' height='120' rx='16' fill='#fbfbf9' stroke='#e4e4de'/><defs><marker id='ar-blue' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#2f6fdb'/></marker><marker id='ar-green' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#178a5e'/></marker><marker id='ar-purple' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#6f52c9'/></marker><marker id='ar-orange' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#d0702c'/></marker><marker id='ar-pink' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#c43d6e'/></marker><marker id='ar-grey' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#6b7280'/></marker><marker id='ar-teal' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#0f7b6c'/></marker><marker id='ar-ink' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#5b6478'/></marker></defs><rect x='14' y='30' width='118' height='30' fill='#f1f2f4' stroke='#6b7280' stroke-width='1.3'/><text x='73.0' y='48.5' text-anchor='middle' font-size='10.5' font-weight='700' fill='#6b7280'>DNS 50 ms</text><rect x='134' y='30' width='118' height='30' fill='#fcefe4' stroke='#d0702c' stroke-width='1.3'/><text x='193.0' y='48.5' text-anchor='middle' font-size='10.5' font-weight='700' fill='#d0702c'>TCP 50 ms</text><rect x='254' y='30' width='118' height='30' fill='#eee9fb' stroke='#6f52c9' stroke-width='1.3'/><text x='313.0' y='48.5' text-anchor='middle' font-size='10.5' font-weight='700' fill='#6f52c9'>TLS 1.3 50 ms</text><rect x='374' y='30' width='118' height='30' fill='#e6eefc' stroke='#2f6fdb' stroke-width='1.3'/><text x='433.0' y='48.5' text-anchor='middle' font-size='10.5' font-weight='700' fill='#2f6fdb'>HTTP 50 ms</text><rect x='494' y='30' width='118' height='30' fill='#e2f4ec' stroke='#178a5e' stroke-width='1.3'/><text x='553.0' y='48.5' text-anchor='middle' font-size='10.5' font-weight='700' fill='#178a5e'>server 50 ms</text><text x='14' y='20' text-anchor='start' font-size='10.5' font-weight='700' fill='#1f2a44'>One round trip to the server = 50 ms (a cold start, nothing cached):</text><text x='14' y='82' text-anchor='start' font-size='10.5' font-weight='700' fill='#d0702c'>4 round trips ≈ 200 ms before the first byte; plus the server&#x27;s work ≈ 250 ms, a quarter of a second.</text><text x='14' y='102' text-anchor='start' font-size='10' font-weight='400' fill='#5b6478' font-style='italic'>Most of the wait is waiting for replies, not data: distance decides it. CDNs (lesson 28) bring servers closer.</text></svg>