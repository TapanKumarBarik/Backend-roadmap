<svg width='640' height='150' role='img' viewBox='0 0 640 150' xmlns='http://www.w3.org/2000/svg' font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"><title>Figure 3: What happens when you type a URL</title><desc>A laptop asks a DNS resolver what the address of backendroadmap.com is; the resolver answers 198.51.100.10. On the right, a four-layer stack: application, DNS message; transport, UDP port 53; network, IP packets; link, Wi-Fi.</desc><rect x='0' y='0' width='640' height='150' rx='16' fill='#fbfbf9' stroke='#e4e4de'/><defs><marker id='ar-blue' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#2f6fdb'/></marker><marker id='ar-green' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#178a5e'/></marker><marker id='ar-purple' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#6f52c9'/></marker><marker id='ar-orange' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#d0702c'/></marker><marker id='ar-pink' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#c43d6e'/></marker><marker id='ar-grey' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#6b7280'/></marker><marker id='ar-teal' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#0f7b6c'/></marker><marker id='ar-ink' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#5b6478'/></marker></defs><rect x='14' y='30' width='96' height='40' rx='7' fill='#e6eefc' stroke='#2f6fdb' stroke-width='1.6'/><text x='62.0' y='53.666666666666664' text-anchor='middle' font-size='11' font-weight='600' fill='#1f2a44'>your laptop</text><rect x='230' y='30' width='110' height='40' rx='7' fill='#f1f2f4' stroke='#6b7280' stroke-width='1.6'/><text x='285.0' y='48.0' text-anchor='middle' font-size='11' font-weight='600' fill='#1f2a44'>DNS resolver</text><text x='285.0' y='63.0' text-anchor='middle' font-size='9' fill='#5b6478'>your provider&#x27;s</text><line x1='114' y1='40' x2='226' y2='40' stroke='#6b7280' stroke-width='1.5' marker-end='url(#ar-grey)'/><text x='170' y='24' text-anchor='middle' font-size='8.8' font-weight='600' fill='#1f2a44'>address of backendroadmap.com?</text><line x1='226' y1='62' x2='114' y2='62' stroke='#178a5e' stroke-width='1.5' marker-end='url(#ar-green)'/><text x='170' y='78' text-anchor='middle' font-size='10.5' font-weight='700' fill='#178a5e'>198.51.100.10</text><text x='14' y='104' text-anchor='start' font-size='10' font-weight='600' fill='#1f2a44'>The answer is cached for a while,</text><text x='14' y='118' text-anchor='start' font-size='10' font-weight='600' fill='#1f2a44'>so the next lookup is instant.</text><rect x='380' y='14' width='246' height='24' rx='6' fill='#f1f2f4' stroke='#6b7280' stroke-width='1.5'/><text x='390' y='30.0' text-anchor='start' font-size='10.5' font-weight='700' fill='#6b7280'>Application</text><text x='616' y='30.0' text-anchor='end' font-size='9.5' font-weight='600' fill='#6b7280'>DNS message</text><rect x='380' y='42' width='246' height='24' rx='6' fill='#fcefe4' stroke='#d0702c' stroke-width='1.5'/><text x='390' y='58.0' text-anchor='start' font-size='10.5' font-weight='700' fill='#d0702c'>Transport</text><text x='616' y='58.0' text-anchor='end' font-size='9.5' font-weight='600' fill='#d0702c'>UDP, port 53</text><rect x='380' y='70' width='246' height='24' rx='6' fill='#e2f4ec' stroke='#178a5e' stroke-width='1.5'/><text x='390' y='86.0' text-anchor='start' font-size='10.5' font-weight='700' fill='#178a5e'>Network</text><text x='616' y='86.0' text-anchor='end' font-size='9.5' font-weight='600' fill='#178a5e'>IP packets</text><rect x='380' y='98' width='246' height='24' rx='6' fill='#f1f2f4' stroke='#6b7280' stroke-width='1.5'/><text x='390' y='114.0' text-anchor='start' font-size='10.5' font-weight='700' fill='#6b7280'>Link</text><text x='616' y='114.0' text-anchor='end' font-size='9.5' font-weight='600' fill='#6b7280'>Wi-Fi</text><text x='14' y='144' text-anchor='start' font-size='9.8' font-weight='400' fill='#5b6478' font-style='italic'>The question is an application-layer DNS message, in UDP to port 53, inside IP packets, over Wi-Fi: the same stack as everything else.</text></svg>