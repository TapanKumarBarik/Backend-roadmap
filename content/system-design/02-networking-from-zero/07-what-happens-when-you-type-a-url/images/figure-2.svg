<svg width='640' height='96' role='img' viewBox='0 0 640 96' xmlns='http://www.w3.org/2000/svg' font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"><title>Figure 2: What happens when you type a URL</title><desc>The URL https://backendroadmap.com/system-design split into three braced parts: https in orange, the protocol, port 443; backendroadmap.com, the server&#x27;s name; /system-design in blue, the page.</desc><rect x='0' y='0' width='640' height='96' rx='16' fill='#fbfbf9' stroke='#e4e4de'/><defs><marker id='ar-blue' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#2f6fdb'/></marker><marker id='ar-green' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#178a5e'/></marker><marker id='ar-purple' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#6f52c9'/></marker><marker id='ar-orange' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#d0702c'/></marker><marker id='ar-pink' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#c43d6e'/></marker><marker id='ar-grey' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#6b7280'/></marker><marker id='ar-teal' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#0f7b6c'/></marker><marker id='ar-ink' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#5b6478'/></marker></defs><text x='30' y='34' text-anchor='start' font-size='18' font-weight='700' fill='#d0702c'>https://</text><text x='130' y='34' text-anchor='start' font-size='18' font-weight='700' fill='#1f2a44'>backendroadmap.com</text><text x='340' y='34' text-anchor='start' font-size='18' font-weight='700' fill='#2f6fdb'>/system-design</text><path d='M30 44 Q30 52 38 52 L64.0 52 Q70.0 52 70.0 59 Q70.0 52 76.0 52 L102 52 Q110 52 110 44' fill='none' stroke='#d0702c' stroke-width='1.6'/><text x='70.0' y='74' text-anchor='middle' font-size='10.5' font-weight='700' fill='#d0702c'>HTTPS → port 443</text><path d='M130 44 Q130 52 138 52 L218.0 52 Q224.0 52 224.0 59 Q224.0 52 230.0 52 L310 52 Q318 52 318 44' fill='none' stroke='#6b7280' stroke-width='1.6'/><text x='224.0' y='74' text-anchor='middle' font-size='10.5' font-weight='700' fill='#6b7280'>the server&#x27;s name</text><path d='M340 44 Q340 52 348 52 L404.0 52 Q410.0 52 410.0 59 Q410.0 52 416.0 52 L472 52 Q480 52 480 44' fill='none' stroke='#2f6fdb' stroke-width='1.6'/><text x='410.0' y='74' text-anchor='middle' font-size='10.5' font-weight='700' fill='#2f6fdb'>the page on that server</text><text x='14' y='90' text-anchor='start' font-size='10.2' font-weight='400' fill='#5b6478' font-style='italic'>Step 0: the browser reads the URL. Packets need an IP address, not a name, so step 1 is DNS.</text></svg>