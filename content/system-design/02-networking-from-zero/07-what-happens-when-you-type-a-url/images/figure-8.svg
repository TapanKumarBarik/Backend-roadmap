<svg width='640' height='96' role='img' viewBox='0 0 640 96' xmlns='http://www.w3.org/2000/svg' font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"><title>Figure 8: What happens when you type a URL</title><desc>Four boxes: DNS crossed out as cached, TCP and TLS handshakes crossed out as connection kept open, and HTTP still needed: one round trip instead of four.</desc><rect x='0' y='0' width='640' height='96' rx='16' fill='#fbfbf9' stroke='#e4e4de'/><defs><marker id='ar-blue' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#2f6fdb'/></marker><marker id='ar-green' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#178a5e'/></marker><marker id='ar-purple' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#6f52c9'/></marker><marker id='ar-orange' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#d0702c'/></marker><marker id='ar-pink' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#c43d6e'/></marker><marker id='ar-grey' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#6b7280'/></marker><marker id='ar-teal' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#0f7b6c'/></marker><marker id='ar-ink' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#5b6478'/></marker></defs><rect x='14' y='22' width='144' height='34' rx='6' fill='#f1f2f4' stroke='#6b7280' stroke-width='1.3' opacity='0.4'/><text x='86' y='44' text-anchor='middle' font-size='11' font-weight='700' fill='#6b7280'>DNS</text><line x1='20' y1='26' x2='152' y2='52' stroke='#5b6478' stroke-width='1.5'/><rect x='170' y='22' width='144' height='34' rx='6' fill='#fcefe4' stroke='#d0702c' stroke-width='1.3' opacity='0.4'/><text x='242' y='44' text-anchor='middle' font-size='11' font-weight='700' fill='#d0702c'>TCP handshake</text><line x1='176' y1='26' x2='308' y2='52' stroke='#5b6478' stroke-width='1.5'/><rect x='326' y='22' width='144' height='34' rx='6' fill='#eee9fb' stroke='#6f52c9' stroke-width='1.3' opacity='0.4'/><text x='398' y='44' text-anchor='middle' font-size='11' font-weight='700' fill='#6f52c9'>TLS handshake</text><line x1='332' y1='26' x2='464' y2='52' stroke='#5b6478' stroke-width='1.5'/><rect x='482' y='22' width='144' height='34' rx='6' fill='#e6eefc' stroke='#2f6fdb' stroke-width='1.3' opacity='1'/><text x='554' y='44' text-anchor='middle' font-size='11' font-weight='700' fill='#2f6fdb'>HTTP</text><text x='86' y='16' text-anchor='middle' font-size='9.5' font-weight='700' fill='#1f2a44'>cached</text><text x='320' y='16' text-anchor='middle' font-size='9.5' font-weight='700' fill='#1f2a44'>connection kept open</text><text x='14' y='82' text-anchor='start' font-size='10' font-weight='700' fill='#178a5e'>One minute later on the same site: usually only the HTTP request remains, 1 round trip instead of 4 (keep-alive: lesson 29).</text></svg>