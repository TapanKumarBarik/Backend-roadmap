<svg width='640' height='160' role='img' viewBox='0 0 640 160' xmlns='http://www.w3.org/2000/svg' font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"><title>Figure 5: What happens when you type a URL</title><desc>A blue box with an HTTP request, GET /system-design with Host, User-Agent and Accept headers, goes to a server that reads a database and replies 200 OK and the HTML. Tags below: style.css, app.js and photo.png, fetched over the same connection.</desc><rect x='0' y='0' width='640' height='160' rx='16' fill='#fbfbf9' stroke='#e4e4de'/><defs><marker id='ar-blue' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#2f6fdb'/></marker><marker id='ar-green' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#178a5e'/></marker><marker id='ar-purple' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#6f52c9'/></marker><marker id='ar-orange' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#d0702c'/></marker><marker id='ar-pink' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#c43d6e'/></marker><marker id='ar-grey' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#6b7280'/></marker><marker id='ar-teal' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#0f7b6c'/></marker><marker id='ar-ink' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#5b6478'/></marker></defs><rect x='14' y='12' width='250' height='76' rx='6' fill='#e6eefc' stroke='#2f6fdb' stroke-width='1.3'/><text x='24' y='32' font-family='DejaVu Sans Mono, monospace' font-size='10' fill='#1f2a44'>GET /system-design HTTP/1.1</text><text x='24' y='48' font-family='DejaVu Sans Mono, monospace' font-size='10' fill='#1f2a44'>Host: backendroadmap.com</text><text x='24' y='64' font-family='DejaVu Sans Mono, monospace' font-size='10' fill='#1f2a44'>User-Agent: (your browser)</text><text x='24' y='80' font-family='DejaVu Sans Mono, monospace' font-size='10' fill='#1f2a44'>Accept: text/html</text><line x1='268' y1='50' x2='318' y2='50' stroke='#2f6fdb' stroke-width='1.5' marker-end='url(#ar-blue)'/><rect x='322' y='30' width='90' height='40' rx='7' fill='#e2f4ec' stroke='#178a5e' stroke-width='1.6'/><text x='367.0' y='53.666666666666664' text-anchor='middle' font-size='11' font-weight='600' fill='#1f2a44'>server</text><path d='M430 33 A35.0 7 0 0 1 500 33 V67 A35.0 7 0 0 1 430 67 Z' fill='#e2f4ec' stroke='#178a5e' stroke-width='1.6'/><path d='M430 33 A35.0 7 0 0 0 500 33' fill='none' stroke='#178a5e' stroke-width='1.6'/><text x='465.0' y='58.0' text-anchor='middle' font-size='12.5' font-weight='600' fill='#1f2a44'>database</text><line x1='414' y1='44' x2='428' y2='44' stroke='#178a5e' stroke-width='1.5' marker-end='url(#ar-green)'/><rect x='520' y='30' width='106' height='40' rx='7' fill='#e2f4ec' stroke='#178a5e' stroke-width='1.6'/><text x='573.0' y='53.5' text-anchor='middle' font-size='10.5' font-weight='600' fill='#1f2a44'>200 OK + HTML</text><line x1='502' y1='50' x2='518' y2='50' stroke='#178a5e' stroke-width='1.5' marker-end='url(#ar-green)'/><rect x='330' y='100' width='88' height='18' rx='4' fill='#eee9fb' stroke='#6f52c9' stroke-width='1.2'/><text x='374.0' y='112.6' text-anchor='middle' font-size='10' font-weight='700' fill='#6f52c9'>style.css</text><rect x='428' y='100' width='88' height='18' rx='4' fill='#fcefe4' stroke='#d0702c' stroke-width='1.2'/><text x='472.0' y='112.6' text-anchor='middle' font-size='10' font-weight='700' fill='#d0702c'>app.js</text><rect x='526' y='100' width='88' height='18' rx='4' fill='#e2f4ec' stroke='#178a5e' stroke-width='1.2'/><text x='570.0' y='112.6' text-anchor='middle' font-size='10' font-weight='700' fill='#178a5e'>photo.png</text><text x='14' y='112' text-anchor='start' font-size='10' font-weight='600' fill='#1f2a44'>Step 6: the HTML asks for more files,</text><text x='14' y='126' text-anchor='start' font-size='10' font-weight='600' fill='#1f2a44'>usually over the same connection, then the page is drawn.</text><text x='14' y='152' text-anchor='start' font-size='10' font-weight='400' fill='#5b6478' font-style='italic'>Steps 4 and 5: the HTTP request with a few headers; the server does its work and replies with a status and the page.</text></svg>