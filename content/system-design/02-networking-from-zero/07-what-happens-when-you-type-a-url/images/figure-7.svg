<svg width='640' height='150' role='img' viewBox='0 0 640 150' xmlns='http://www.w3.org/2000/svg' font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"><title>Figure 7: What happens when you type a URL</title><desc>Four rows: DNS, server IP address could not be found; TCP handshake, connection refused or timed out; TLS handshake, your connection is not private; HTTP, 404 not found or 500 server error.</desc><rect x='0' y='0' width='640' height='150' rx='16' fill='#fbfbf9' stroke='#e4e4de'/><defs><marker id='ar-blue' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#2f6fdb'/></marker><marker id='ar-green' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#178a5e'/></marker><marker id='ar-purple' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#6f52c9'/></marker><marker id='ar-orange' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#d0702c'/></marker><marker id='ar-pink' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#c43d6e'/></marker><marker id='ar-grey' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#6b7280'/></marker><marker id='ar-teal' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#0f7b6c'/></marker><marker id='ar-ink' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#5b6478'/></marker></defs><rect x='14' y='16' width='110' height='18' rx='4' fill='#f1f2f4' stroke='#6b7280' stroke-width='1.2'/><text x='69.0' y='28.6' text-anchor='middle' font-size='10' font-weight='700' fill='#6b7280'>DNS</text><text x='136' y='29' text-anchor='start' font-size='10.5' font-weight='700' fill='#c43d6e'>“server IP address could not be found”</text><text x='420' y='29' text-anchor='start' font-size='10' font-weight='600' fill='#1f2a44'>the name has no answer</text><rect x='14' y='48' width='110' height='18' rx='4' fill='#fcefe4' stroke='#d0702c' stroke-width='1.2'/><text x='69.0' y='60.6' text-anchor='middle' font-size='10' font-weight='700' fill='#d0702c'>TCP handshake</text><text x='136' y='61' text-anchor='start' font-size='10.5' font-weight='700' fill='#c43d6e'>“connection refused” / “timed out”</text><text x='420' y='61' text-anchor='start' font-size='10' font-weight='600' fill='#1f2a44'>nothing answered on that port</text><rect x='14' y='80' width='110' height='18' rx='4' fill='#eee9fb' stroke='#6f52c9' stroke-width='1.2'/><text x='69.0' y='92.6' text-anchor='middle' font-size='10' font-weight='700' fill='#6f52c9'>TLS handshake</text><text x='136' y='93' text-anchor='start' font-size='10.5' font-weight='700' fill='#c43d6e'>“your connection is not private”</text><text x='420' y='93' text-anchor='start' font-size='10' font-weight='600' fill='#1f2a44'>certificate wrong or expired</text><rect x='14' y='112' width='110' height='18' rx='4' fill='#e6eefc' stroke='#2f6fdb' stroke-width='1.2'/><text x='69.0' y='124.6' text-anchor='middle' font-size='10' font-weight='700' fill='#2f6fdb'>HTTP</text><text x='136' y='125' text-anchor='start' font-size='10.5' font-weight='700' fill='#c43d6e'>404 not found · 500 server error</text><text x='420' y='125' text-anchor='start' font-size='10' font-weight='600' fill='#1f2a44'>the page, or the server&#x27;s code</text><text x='14' y='144' text-anchor='start' font-size='10.2' font-weight='400' fill='#5b6478' font-style='italic'>Each step fails in its own way, so the error message tells you which step, and which layer, to fix.</text></svg>