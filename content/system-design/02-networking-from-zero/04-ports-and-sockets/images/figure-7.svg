<svg width='640' height='168' role='img' viewBox='0 0 640 168' xmlns='http://www.w3.org/2000/svg' font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"><title>Figure 7: Ports and sockets</title><desc>Left: web server 1 listens on port 8080; web server 2, in red, also tries port 8080 and gets the error address already in use. Right: a busy app server opens many connections to a database, and a bar of about 28,000 ephemeral ports fills up in red, so new connections fail.</desc><rect x='0' y='0' width='640' height='168' rx='16' fill='#fbfbf9' stroke='#e4e4de'/><defs><marker id='ar-blue' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#2f6fdb'/></marker><marker id='ar-green' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#178a5e'/></marker><marker id='ar-purple' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#6f52c9'/></marker><marker id='ar-orange' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#d0702c'/></marker><marker id='ar-pink' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#c43d6e'/></marker><marker id='ar-grey' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#6b7280'/></marker><marker id='ar-teal' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#0f7b6c'/></marker><marker id='ar-ink' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#5b6478'/></marker></defs><rect x='14' y='14' width='120' height='30' rx='7' fill='#e2f4ec' stroke='#178a5e' stroke-width='1.6'/><text x='74.0' y='32.666666666666664' text-anchor='middle' font-size='11' font-weight='600' fill='#1f2a44'>web server 1</text><rect x='14' y='58' width='120' height='30' rx='7' fill='#fbe6ee' stroke='#c43d6e' stroke-width='1.6'/><text x='74.0' y='76.66666666666667' text-anchor='middle' font-size='11' font-weight='600' fill='#1f2a44'>web server 2</text><rect x='214' y='36' width='70' height='30' rx='7' fill='#fcefe4' stroke='#d0702c' stroke-width='1.6'/><text x='249.0' y='55.0' text-anchor='middle' font-size='12' font-weight='600' fill='#1f2a44'>:8080</text><line x1='136' y1='29' x2='210' y2='46' stroke='#178a5e' stroke-width='1.5' marker-end='url(#ar-green)'/><line x1='136' y1='73' x2='210' y2='58' stroke='#c43d6e' stroke-width='1.5' marker-end='url(#ar-pink)'/><text x='14' y='108' text-anchor='start' font-size='11' font-weight='700' fill='#c43d6e'>Error: address already in use</text><text x='14' y='124' text-anchor='start' font-size='10' font-weight='600' fill='#1f2a44'>One port, one listener. Fix: stop the old one,</text><text x='14' y='138' text-anchor='start' font-size='10' font-weight='600' fill='#1f2a44'>or pick another port (8081).</text><line x1='318' y1='12' x2='318' y2='140' stroke='#d9d4c7' stroke-width='1'/><rect x='336' y='14' width='96' height='40' rx='7' fill='#e6eefc' stroke='#2f6fdb' stroke-width='1.6'/><text x='384.0' y='32.0' text-anchor='middle' font-size='10.5' font-weight='600' fill='#1f2a44'>busy app server</text><text x='384.0' y='47.0' text-anchor='middle' font-size='9' fill='#5b6478'>the client here</text><path d='M540 19 A43.0 7 0 0 1 626 19 V51 A43.0 7 0 0 1 540 51 Z' fill='#e2f4ec' stroke='#178a5e' stroke-width='1.6'/><path d='M540 19 A43.0 7 0 0 0 626 19' fill='none' stroke='#178a5e' stroke-width='1.6'/><text x='583.0' y='43.0' text-anchor='middle' font-size='12.5' font-weight='600' fill='#1f2a44'>database</text><line x1='434' y1='22' x2='538' y2='22' stroke='#2f6fdb' stroke-width='1' stroke-dasharray='4 3'/><line x1='434' y1='31' x2='538' y2='31' stroke='#2f6fdb' stroke-width='1' stroke-dasharray='4 3'/><line x1='434' y1='40' x2='538' y2='40' stroke='#2f6fdb' stroke-width='1' stroke-dasharray='4 3'/><line x1='434' y1='49' x2='538' y2='49' stroke='#2f6fdb' stroke-width='1' stroke-dasharray='4 3'/><rect x='336' y='72' width='290' height='18' rx='3' fill='#fff' stroke='#c43d6e' stroke-width='1.3'/><rect x='337' y='73' width='288' height='16' rx='3' fill='#fbe6ee'/><text x='481' y='85' text-anchor='middle' font-size='10' font-weight='700' fill='#c43d6e'>about 28,000 ephemeral ports: all used</text><text x='336' y='108' text-anchor='start' font-size='10' font-weight='600' fill='#1f2a44'>A new connection per request, and closed ones stay</text><text x='336' y='122' text-anchor='start' font-size='10' font-weight='600' fill='#1f2a44'>reserved for a while: new connections fail.</text><text x='336' y='138' text-anchor='start' font-size='10' font-weight='700' fill='#6f52c9'>Why, and the fix (reuse connections): lessons 11 and 29.</text><text x='14' y='162' text-anchor='start' font-size='10' font-weight='400' fill='#5b6478' font-style='italic'>Both failures are about the same rule: each socket on a device must be unique.</text></svg>