<svg width='640' height='150' role='img' viewBox='0 0 640 150' xmlns='http://www.w3.org/2000/svg' font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"><title>Figure 4: Ports and sockets</title><desc>Your laptop with the socket 203.0.113.7:51234 in blue, a dashed line labelled one conversation, and the server with the socket 198.51.100.10:443 in green. Below, the four values: client IP 203.0.113.7, client port 51234, server IP 198.51.100.10, server port 443.</desc><rect x='0' y='0' width='640' height='150' rx='16' fill='#fbfbf9' stroke='#e4e4de'/><defs><marker id='ar-blue' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#2f6fdb'/></marker><marker id='ar-green' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#178a5e'/></marker><marker id='ar-purple' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#6f52c9'/></marker><marker id='ar-orange' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#d0702c'/></marker><marker id='ar-pink' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#c43d6e'/></marker><marker id='ar-grey' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#6b7280'/></marker><marker id='ar-teal' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#0f7b6c'/></marker><marker id='ar-ink' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#5b6478'/></marker></defs><rect x='14' y='14' width='92' height='40' rx='7' fill='#e6eefc' stroke='#2f6fdb' stroke-width='1.6'/><text x='60.0' y='37.833333333333336' text-anchor='middle' font-size='11.5' font-weight='600' fill='#1f2a44'>your laptop</text><rect x='14' y='62' width='86.6' height='24' rx='4' fill='#e6eefc' stroke='#2f6fdb' stroke-width='1.3'/><text x='57.3' y='77.66666666666667' text-anchor='middle' font-size='11' font-weight='700' fill='#2f6fdb'>203.0.113.7</text><text x='105.6' y='77.66666666666667' text-anchor='middle' font-size='13' font-weight='700' fill='#1f2a44'>:</text><rect x='110.6' y='62' width='48.1' height='24' rx='4' fill='#e6eefc' stroke='#2f6fdb' stroke-width='1.3'/><text x='134.65' y='77.66666666666667' text-anchor='middle' font-size='11' font-weight='700' fill='#2f6fdb'>51234</text><rect x='520' y='14' width='106' height='40' rx='7' fill='#e2f4ec' stroke='#178a5e' stroke-width='1.6'/><text x='573.0' y='37.833333333333336' text-anchor='middle' font-size='11.5' font-weight='600' fill='#1f2a44'>server</text><rect x='0' y='-200' width='99.8' height='24' rx='4' fill='#e2f4ec' stroke='#178a5e' stroke-width='1.3'/><text x='49.9' y='-184.33333333333334' text-anchor='middle' font-size='11' font-weight='700' fill='#178a5e'>198.51.100.10</text><text x='104.8' y='-184.33333333333334' text-anchor='middle' font-size='13' font-weight='700' fill='#1f2a44'>:</text><rect x='109.8' y='-200' width='34.46' height='24' rx='4' fill='#e2f4ec' stroke='#178a5e' stroke-width='1.3'/><text x='127.03' y='-184.33333333333334' text-anchor='middle' font-size='11' font-weight='700' fill='#178a5e'>443</text><rect x='481.74' y='62' width='99.8' height='24' rx='4' fill='#e2f4ec' stroke='#178a5e' stroke-width='1.3'/><text x='531.64' y='77.66666666666667' text-anchor='middle' font-size='11' font-weight='700' fill='#178a5e'>198.51.100.10</text><text x='586.54' y='77.66666666666667' text-anchor='middle' font-size='13' font-weight='700' fill='#1f2a44'>:</text><rect x='591.54' y='62' width='34.46' height='24' rx='4' fill='#e2f4ec' stroke='#178a5e' stroke-width='1.3'/><text x='608.77' y='77.66666666666667' text-anchor='middle' font-size='11' font-weight='700' fill='#178a5e'>443</text><line x1='110' y1='34' x2='516' y2='34' stroke='#5b6478' stroke-width='1.2' stroke-dasharray='5 4'/><text x='313' y='28' text-anchor='middle' font-size='10' font-weight='600' fill='#1f2a44'>one conversation = one connection</text><text x='14' y='104' text-anchor='start' font-size='10.5' font-weight='700' fill='#1f2a44'>socket = IP address + port (one end).   connection = a pair of sockets = four values:</text><rect x='14' y='116' width='150' height='18' rx='4' fill='#e6eefc' stroke='#2f6fdb' stroke-width='1.2'/><text x='89.0' y='128.6' text-anchor='middle' font-size='9.5' font-weight='700' fill='#2f6fdb'>1  client IP: 203.0.113.7</text><rect x='176' y='116' width='120' height='18' rx='4' fill='#e6eefc' stroke='#2f6fdb' stroke-width='1.2'/><text x='236.0' y='128.6' text-anchor='middle' font-size='9.5' font-weight='700' fill='#2f6fdb'>2  client port: 51234</text><rect x='308' y='116' width='160' height='18' rx='4' fill='#e2f4ec' stroke='#178a5e' stroke-width='1.2'/><text x='388.0' y='128.6' text-anchor='middle' font-size='9.5' font-weight='700' fill='#178a5e'>3  server IP: 198.51.100.10</text><rect x='480' y='116' width='120' height='18' rx='4' fill='#e2f4ec' stroke='#178a5e' stroke-width='1.2'/><text x='540.0' y='128.6' text-anchor='middle' font-size='9.5' font-weight='700' fill='#178a5e'>4  server port: 443</text></svg>