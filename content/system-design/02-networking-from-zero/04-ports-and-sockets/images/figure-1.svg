<svg width='640' height='172' role='img' viewBox='0 0 640 172' xmlns='http://www.w3.org/2000/svg' font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"><title>Figure 1: Ports and sockets</title><desc>A purple flat 5 with Mom, a kid and Grandpa. A bank letter says for: Mom and a parcel says for: kid. On the right: the flat is your device, found by its IP address; the people are the apps; the name on the envelope is the port number; someone at home waiting is an app listening on its port.</desc><rect x='0' y='0' width='640' height='172' rx='16' fill='#fbfbf9' stroke='#e4e4de'/><defs><marker id='ar-blue' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#2f6fdb'/></marker><marker id='ar-green' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#178a5e'/></marker><marker id='ar-purple' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#6f52c9'/></marker><marker id='ar-orange' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#d0702c'/></marker><marker id='ar-pink' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#c43d6e'/></marker><marker id='ar-grey' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#6b7280'/></marker><marker id='ar-teal' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#0f7b6c'/></marker><marker id='ar-ink' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#5b6478'/></marker></defs><rect x='10' y='14' width='380' height='132' rx='9' fill='#eee9fb' fill-opacity='0.45' stroke='#6f52c9' stroke-opacity='0.5' stroke-dasharray='4 4'/><text x='20' y='30' font-size='10' font-weight='700' letter-spacing='0.06em' fill='#6f52c9'>FLAT 5 (FOUND BY THE ADDRESS)</text><circle cx='50' cy='52' r='9.0' fill='#eee9fb' stroke='#6f52c9' stroke-width='1.5'/><path d='M50 61.0 V79.0 M39.0 68.0 H61.0 M50 79.0 L42.0 92.0 M50 79.0 L58.0 92.0' fill='none' stroke='#6f52c9' stroke-width='1.5'/><text x='50' y='105.0' text-anchor='middle' font-size='10.5' font-weight='700' fill='#6f52c9'>Mom</text><circle cx='205' cy='60' r='7.0200000000000005' fill='#eee9fb' stroke='#6f52c9' stroke-width='1.5'/><path d='M205 67.02 V81.06 M196.42 72.47999999999999 H213.58 M205 81.06 L198.76 91.2 M205 81.06 L211.24 91.2' fill='none' stroke='#6f52c9' stroke-width='1.5'/><text x='205' y='104.2' text-anchor='middle' font-size='10.5' font-weight='700' fill='#6f52c9'>kid</text><circle cx='345' cy='52' r='9.0' fill='#eee9fb' stroke='#6f52c9' stroke-width='1.5'/><path d='M345 61.0 V79.0 M334.0 68.0 H356.0 M345 79.0 L337.0 92.0 M345 79.0 L353.0 92.0' fill='none' stroke='#6f52c9' stroke-width='1.5'/><text x='345' y='105.0' text-anchor='middle' font-size='10.5' font-weight='700' fill='#6f52c9'>Grandpa</text><rect x='80' y='62' width='62' height='36' rx='3' fill='#eee9fb' stroke='#6f52c9' stroke-width='1.3'/><path d='M80 62 L111.0 78.2 L142 62' fill='none' stroke='#6f52c9' stroke-width='1.2'/><text x='111.0' y='93' text-anchor='middle' font-size='9.5' font-weight='700' fill='#6f52c9'>for: Mom</text><rect x='232' y='70' width='60' height='36' rx='3' fill='#eee9fb' stroke='#6f52c9' stroke-width='1.3'/><text x='262' y='99' text-anchor='middle' font-size='9.5' font-weight='700' fill='#6f52c9'>for: kid</text><text x='262' y='64' text-anchor='middle' font-size='9' font-weight='400' fill='#5b6478'>parcel</text><text x='111' y='56' text-anchor='middle' font-size='9' font-weight='400' fill='#5b6478'>bank letter</text><text x='410' y='40' text-anchor='start' font-size='11' font-weight='700' fill='#1f2a44'>In the network:</text><text x='410' y='62' text-anchor='start' font-size='10' font-weight='700' fill='#6f52c9'>the flat</text><text x='410' y='73' text-anchor='start' font-size='9.5' font-weight='700' fill='#2f6fdb'>→ your device, found by its IP address</text><text x='410' y='84' text-anchor='start' font-size='10' font-weight='700' fill='#6f52c9'>the people inside</text><text x='410' y='95' text-anchor='start' font-size='9.5' font-weight='700' fill='#2f6fdb'>→ the apps</text><text x='410' y='106' text-anchor='start' font-size='10' font-weight='700' fill='#6f52c9'>the name on the envelope</text><text x='410' y='117' text-anchor='start' font-size='9.5' font-weight='700' fill='#d0702c'>→ the port number, in the header</text><text x='410' y='128' text-anchor='start' font-size='10' font-weight='700' fill='#6f52c9'>someone at home, waiting</text><text x='410' y='139' text-anchor='start' font-size='9.5' font-weight='700' fill='#178a5e'>→ an app listening on its port</text><text x='10' y='164' text-anchor='start' font-size='9.6' font-weight='400' fill='#5b6478' font-style='italic'>The flat number gets the post to the door; the name says who inside wants it. No such person: it can&#x27;t be delivered.</text></svg>