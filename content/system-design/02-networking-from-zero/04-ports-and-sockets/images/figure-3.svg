<svg width='640' height='150' role='img' viewBox='0 0 640 150' xmlns='http://www.w3.org/2000/svg' font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"><title>Figure 3: Ports and sockets</title><desc>A number line from 0 to 65,535. A thin green band at the start is the well-known ports, 0 to 1023. A blue band from 49,152 to 65,535 is the official ephemeral range. A purple band below, from 32,768 to 60,999, is the Linux default. An orange marker shows 51,234.</desc><rect x='0' y='0' width='640' height='150' rx='16' fill='#fbfbf9' stroke='#e4e4de'/><defs><marker id='ar-blue' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#2f6fdb'/></marker><marker id='ar-green' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#178a5e'/></marker><marker id='ar-purple' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#6f52c9'/></marker><marker id='ar-orange' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#d0702c'/></marker><marker id='ar-pink' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#c43d6e'/></marker><marker id='ar-grey' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#6b7280'/></marker><marker id='ar-teal' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#0f7b6c'/></marker><marker id='ar-ink' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#5b6478'/></marker></defs><line x1='20' y1='82' x2='620' y2='82' stroke='#1f2a44' stroke-width='1.6'/><rect x='20' y='70' width='9.375' height='12' fill='#e2f4ec' stroke='#178a5e' stroke-width='1.2'/><text x='20' y='62' text-anchor='start' font-size='10' font-weight='700' fill='#178a5e'>0-1023: well-known</text><text x='129.86328125' y='62' text-anchor='start' font-size='10' font-weight='600' fill='#1f2a44'>1024-49,151: registered</text><rect x='470.0' y='64' width='150.0' height='18' fill='#e6eefc' stroke='#2f6fdb' stroke-width='1.3'/><text x='620' y='34' text-anchor='end' font-size='10' font-weight='700' fill='#2f6fdb'>official ephemeral range (IANA)</text><text x='620' y='48' text-anchor='end' font-size='11' font-weight='700' fill='#2f6fdb'>49,152 to 65,535</text><rect x='320.0' y='88' width='258.4716796875' height='16' fill='#eee9fb' stroke='#6f52c9' stroke-width='1.3'/><text x='449.23583984375' y='118' text-anchor='middle' font-size='10.5' font-weight='700' fill='#6f52c9'>Linux default: 32,768 to 60,999 (28,232 ports)</text><text x='20' y='100' text-anchor='start' font-size='10' font-weight='600' fill='#1f2a44'>0</text><text x='620' y='100' text-anchor='end' font-size='10' font-weight='600' fill='#1f2a44'>65,535</text><circle cx='489.061279296875' cy='82' r='4' fill='#d0702c'/><text x='483.061279296875' y='16' text-anchor='end' font-size='10' font-weight='700' fill='#d0702c'>51,234</text><line x1='489.061279296875' y1='20' x2='489.061279296875' y2='78' stroke='#d0702c' stroke-width='1' stroke-dasharray='3 3'/><text x='10' y='142' text-anchor='start' font-size='10' font-weight='400' fill='#5b6478' font-style='italic'>Servers listen on well-known ports. Clients are lent a high random (ephemeral) port, such as 51,234, for one conversation.</text></svg>