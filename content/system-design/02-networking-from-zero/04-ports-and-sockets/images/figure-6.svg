<svg width='640' height='172' role='img' viewBox='0 0 640 172' xmlns='http://www.w3.org/2000/svg' font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"><title>Figure 6: Ports and sockets</title><desc>Left: a laptop at 203.0.113.7 running a browser, WhatsApp and Spotify; the browser has port 51234. Middle: the internet. Right: a server at 198.51.100.10 with a web server listening on port 443. A blue request arrow goes right and a green reply arrow comes back. Four numbered steps are listed below.</desc><rect x='0' y='0' width='640' height='172' rx='16' fill='#fbfbf9' stroke='#e4e4de'/><defs><marker id='ar-blue' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#2f6fdb'/></marker><marker id='ar-green' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#178a5e'/></marker><marker id='ar-purple' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#6f52c9'/></marker><marker id='ar-orange' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#d0702c'/></marker><marker id='ar-pink' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#c43d6e'/></marker><marker id='ar-grey' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#6b7280'/></marker><marker id='ar-teal' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#0f7b6c'/></marker><marker id='ar-ink' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#5b6478'/></marker></defs><rect x='10' y='30' width='80' height='40' rx='7' fill='#e6eefc' stroke='#2f6fdb' stroke-width='1.6'/><text x='50.0' y='48.0' text-anchor='middle' font-size='11.5' font-weight='600' fill='#1f2a44'>laptop</text><text x='50.0' y='63.0' text-anchor='middle' font-size='10.5' fill='#5b6478'>203.0.113.7</text><rect x='100' y='14' width='76' height='22' rx='7' fill='#e6eefc' stroke='#2f6fdb' stroke-width='1.6'/><text x='138.0' y='28.333333333333332' text-anchor='middle' font-size='10' font-weight='600' fill='#1f2a44'>browser</text><rect x='100' y='40' width='76' height='22' rx='7' fill='#e6eefc' stroke='#2f6fdb' stroke-width='1.6'/><text x='138.0' y='54.333333333333336' text-anchor='middle' font-size='10' font-weight='600' fill='#1f2a44'>WhatsApp</text><rect x='100' y='66' width='76' height='22' rx='7' fill='#e6eefc' stroke='#2f6fdb' stroke-width='1.6'/><text x='138.0' y='80.33333333333333' text-anchor='middle' font-size='10' font-weight='600' fill='#1f2a44'>Spotify</text><rect x='180' y='16' width='52' height='18' rx='4' fill='#e6eefc' stroke='#2f6fdb' stroke-width='1.2'/><text x='206.0' y='28.6' text-anchor='middle' font-size='9.5' font-weight='700' fill='#2f6fdb'>:51234</text><rect x='250' y='14' width='140' height='74' rx='9' fill='#f1f2f4' fill-opacity='0.45' stroke='#6b7280' stroke-opacity='0.5' stroke-dasharray='4 4'/><text x='260' y='30' font-size='10' font-weight='700' letter-spacing='0.06em' fill='#6b7280'>THE INTERNET</text><rect x='440' y='14' width='82' height='26' rx='7' fill='#e2f4ec' stroke='#178a5e' stroke-width='1.6'/><text x='481.0' y='30.666666666666668' text-anchor='middle' font-size='11' font-weight='600' fill='#1f2a44'>:443</text><rect x='526' y='14' width='104' height='26' rx='7' fill='#e2f4ec' stroke='#178a5e' stroke-width='1.6'/><text x='578.0' y='30.666666666666668' text-anchor='middle' font-size='11' font-weight='600' fill='#1f2a44'>web server</text><rect x='526' y='48' width='104' height='36' rx='7' fill='#e2f4ec' stroke='#178a5e' stroke-width='1.6'/><text x='578.0' y='64.0' text-anchor='middle' font-size='11' font-weight='600' fill='#1f2a44'>server</text><text x='578.0' y='79.0' text-anchor='middle' font-size='10.5' fill='#5b6478'>198.51.100.10</text><line x1='236' y1='46' x2='436' y2='30' stroke='#2f6fdb' stroke-width='1.5' marker-end='url(#ar-blue)'/><line x1='436' y1='58' x2='236' y2='70' stroke='#178a5e' stroke-width='1.5' marker-end='url(#ar-green)'/><text x='330' y='55' text-anchor='middle' font-size='9.5' font-weight='700' fill='#2f6fdb'>request</text><text x='320' y='82' text-anchor='middle' font-size='9.5' font-weight='700' fill='#178a5e'>reply (ports swapped)</text><text x='10' y='108' text-anchor='start' font-size='9.8' font-weight='600' fill='#1f2a44'>1  Listen. The web server starts and listens on 443. Job: be ready before anyone calls.</text><text x='10' y='124' text-anchor='start' font-size='9.8' font-weight='600' fill='#1f2a44'>2  Get a port. The browser asks for a socket and is lent port 51234. Job: give the reply a way back to this one app.</text><text x='10' y='140' text-anchor='start' font-size='9.8' font-weight='600' fill='#1f2a44'>3  Send. From 203.0.113.7:51234 to 198.51.100.10:443; the server reads port 443 and hands it to the web server.</text><text x='10' y='156' text-anchor='start' font-size='9.8' font-weight='600' fill='#1f2a44'>4  Reply. From 198.51.100.10:443 to 203.0.113.7:51234; the laptop reads 51234 and gives it to the browser, not WhatsApp.</text></svg>