<svg width='640' height='140' role='img' viewBox='0 0 640 140' xmlns='http://www.w3.org/2000/svg' font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"><title>Figure 1: TCP part 4, closing, RST, TIME_WAIT and ports</title><desc>Two people on a call: you say that&#x27;s all from me, your friend says okay, your friend says that&#x27;s all from me too, you say okay, bye. Four numbered messages.</desc><rect x='0' y='0' width='640' height='140' rx='16' fill='#fbfbf9' stroke='#e4e4de'/><defs><marker id='ar-blue' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#2f6fdb'/></marker><marker id='ar-green' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#178a5e'/></marker><marker id='ar-purple' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#6f52c9'/></marker><marker id='ar-orange' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#d0702c'/></marker><marker id='ar-pink' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#c43d6e'/></marker><marker id='ar-grey' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#6b7280'/></marker><marker id='ar-teal' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#0f7b6c'/></marker><marker id='ar-ink' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#5b6478'/></marker></defs><text x='60' y='16' text-anchor='middle' font-size='11' font-weight='700' fill='#2f6fdb'>you</text><line x1='60' y1='22' x2='60' y2='116' stroke='#2f6fdb' stroke-width='1.4'/><text x='580' y='16' text-anchor='middle' font-size='11' font-weight='700' fill='#178a5e'>your friend</text><line x1='580' y1='22' x2='580' y2='116' stroke='#178a5e' stroke-width='1.4'/><line x1='62' y1='36' x2='576' y2='40' stroke='#2f6fdb' stroke-width='1.5' marker-end='url(#ar-blue)'/><text x='320' y='34' text-anchor='middle' font-size='10' font-weight='700' fill='#2f6fdb'>“that&#x27;s all from me”</text><circle cx='90' cy='30' r='9' fill='#d0702c'/><text x='90' y='33.8' text-anchor='middle' font-size='10.5' font-weight='700' fill='#fff'>1</text><line x1='578' y1='58' x2='64' y2='62' stroke='#178a5e' stroke-width='1.5' marker-end='url(#ar-green)'/><text x='320' y='56' text-anchor='middle' font-size='10' font-weight='700' fill='#178a5e'>“okay”</text><circle cx='90' cy='52' r='9' fill='#d0702c'/><text x='90' y='55.8' text-anchor='middle' font-size='10.5' font-weight='700' fill='#fff'>2</text><line x1='578' y1='80' x2='64' y2='84' stroke='#178a5e' stroke-width='1.5' marker-end='url(#ar-green)'/><text x='320' y='78' text-anchor='middle' font-size='10' font-weight='700' fill='#178a5e'>“that&#x27;s all from me too”</text><circle cx='90' cy='74' r='9' fill='#d0702c'/><text x='90' y='77.8' text-anchor='middle' font-size='10.5' font-weight='700' fill='#fff'>3</text><line x1='62' y1='102' x2='576' y2='106' stroke='#2f6fdb' stroke-width='1.5' marker-end='url(#ar-blue)'/><text x='320' y='100' text-anchor='middle' font-size='10' font-weight='700' fill='#2f6fdb'>“okay, bye”</text><circle cx='90' cy='96' r='9' fill='#d0702c'/><text x='90' y='99.8' text-anchor='middle' font-size='10.5' font-weight='700' fill='#fff'>4</text><text x='14' y='134' text-anchor='start' font-size='10' font-weight='400' fill='#5b6478' font-style='italic'>Each side says it&#x27;s done and the other confirms: 4 messages, 2 directions. The rude way: just hang up (a reset).</text></svg>