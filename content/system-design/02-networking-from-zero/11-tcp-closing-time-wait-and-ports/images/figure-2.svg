<svg width='640' height='170' role='img' viewBox='0 0 640 170' xmlns='http://www.w3.org/2000/svg' font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"><title>Figure 2: TCP part 4, closing, RST, TIME_WAIT and ports</title><desc>A sequence diagram: your phone sends FIN, the server ACKs, then sends its own FIN, and the phone ACKs. CLOSE_WAIT is marked on the server between the halves, TIME_WAIT on the phone at the end.</desc><rect x='0' y='0' width='640' height='170' rx='16' fill='#fbfbf9' stroke='#e4e4de'/><defs><marker id='ar-blue' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#2f6fdb'/></marker><marker id='ar-green' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#178a5e'/></marker><marker id='ar-purple' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#6f52c9'/></marker><marker id='ar-orange' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#d0702c'/></marker><marker id='ar-pink' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#c43d6e'/></marker><marker id='ar-grey' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#6b7280'/></marker><marker id='ar-teal' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#0f7b6c'/></marker><marker id='ar-ink' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#5b6478'/></marker></defs><text x='60' y='16' text-anchor='middle' font-size='11' font-weight='700' fill='#2f6fdb'>your phone</text><line x1='60' y1='22' x2='60' y2='150' stroke='#2f6fdb' stroke-width='1.4'/><text x='580' y='16' text-anchor='middle' font-size='11' font-weight='700' fill='#178a5e'>server</text><line x1='580' y1='22' x2='580' y2='150' stroke='#178a5e' stroke-width='1.4'/><line x1='62' y1='38' x2='576' y2='44' stroke='#2f6fdb' stroke-width='1.5' marker-end='url(#ar-blue)'/><text x='320' y='36' text-anchor='middle' font-size='10.5' font-weight='700' fill='#2f6fdb'>FIN  (“I&#x27;m done sending”)</text><line x1='578' y1='62' x2='64' y2='68' stroke='#178a5e' stroke-width='1.5' marker-end='url(#ar-green)'/><text x='320' y='60' text-anchor='middle' font-size='10.5' font-weight='700' fill='#178a5e'>ACK</text><line x1='578' y1='106' x2='64' y2='112' stroke='#178a5e' stroke-width='1.5' marker-end='url(#ar-green)'/><text x='320' y='104' text-anchor='middle' font-size='10.5' font-weight='700' fill='#178a5e'>FIN</text><line x1='62' y1='130' x2='576' y2='136' stroke='#2f6fdb' stroke-width='1.5' marker-end='url(#ar-blue)'/><text x='320' y='128' text-anchor='middle' font-size='10.5' font-weight='700' fill='#2f6fdb'>ACK</text><text x='572' y='88' text-anchor='end' font-size='9.5' font-weight='700' fill='#6f52c9'>CLOSE_WAIT</text><text x='320' y='88' text-anchor='middle' font-size='9.2' font-weight='400' fill='#5b6478' font-style='italic'>the server may still send data</text><text x='70' y='146' text-anchor='start' font-size='9.5' font-weight='700' fill='#d0702c'>TIME_WAIT: 60 s on Linux</text><text x='14' y='166' text-anchor='start' font-size='10' font-weight='400' fill='#5b6478' font-style='italic'>Each direction closes on its own. The server&#x27;s ACK and FIN often travel together: 3 segments, not 4.</text></svg>