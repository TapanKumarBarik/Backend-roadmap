<svg width='640' height='130' role='img' viewBox='0 0 640 130' xmlns='http://www.w3.org/2000/svg' font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"><title>Figure 3: TCP part 4, closing, RST, TIME_WAIT and ports</title><desc>Left: the final ACK is lost, the server sends FIN again, and the phone answers with ACK. Right: an old, delayed segment, with a note that waiting lets it expire.</desc><rect x='0' y='0' width='640' height='130' rx='16' fill='#fbfbf9' stroke='#e4e4de'/><defs><marker id='ar-blue' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#2f6fdb'/></marker><marker id='ar-green' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#178a5e'/></marker><marker id='ar-purple' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#6f52c9'/></marker><marker id='ar-orange' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#d0702c'/></marker><marker id='ar-pink' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#c43d6e'/></marker><marker id='ar-grey' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#6b7280'/></marker><marker id='ar-teal' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#0f7b6c'/></marker><marker id='ar-ink' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#5b6478'/></marker></defs><text x='14' y='16' text-anchor='start' font-size='10.5' font-weight='700' fill='#d0702c'>1. The final ACK may be lost</text><text x='40' y='34' text-anchor='middle' font-size='11' font-weight='700' fill='#2f6fdb'>your phone</text><line x1='40' y1='40' x2='40' y2='114' stroke='#2f6fdb' stroke-width='1.4'/><text x='280' y='34' text-anchor='middle' font-size='11' font-weight='700' fill='#178a5e'>server</text><line x1='280' y1='40' x2='280' y2='114' stroke='#178a5e' stroke-width='1.4'/><line x1='42' y1='48' x2='200' y2='58' stroke='#2f6fdb' stroke-width='1.5' marker-end='url(#ar-blue)'/><text x='210' y='64.0' text-anchor='middle' font-size='15' font-weight='700' fill='#c43d6e'>✕</text><text x='120' y='48' text-anchor='middle' font-size='9' font-weight='700' fill='#2f6fdb'>final ACK</text><line x1='278' y1='70' x2='44' y2='84' stroke='#178a5e' stroke-width='1.5' marker-end='url(#ar-green)'/><text x='160' y='72' text-anchor='middle' font-size='9' font-weight='700' fill='#178a5e'>FIN again</text><line x1='42' y1='92' x2='276' y2='106' stroke='#2f6fdb' stroke-width='1.5' marker-end='url(#ar-blue)'/><text x='160' y='95' text-anchor='middle' font-size='9' font-weight='700' fill='#2f6fdb'>ACK</text><text x='340' y='16' text-anchor='start' font-size='10.5' font-weight='700' fill='#d0702c'>2. Old segments must die out</text><rect x='340' y='34' width='150' height='18' rx='4' fill='#f1f2f4' stroke='#6b7280' stroke-width='1.2'/><text x='415.0' y='46.6' text-anchor='middle' font-size='9.5' font-weight='700' fill='#6b7280'>old, delayed segment</text><text x='340' y='72' text-anchor='start' font-size='10' font-weight='600' fill='#1f2a44'>Waiting lets segments still wandering the</text><text x='340' y='86' text-anchor='start' font-size='10' font-weight='600' fill='#1f2a44'>network expire, so they are never mistaken</text><text x='340' y='100' text-anchor='start' font-size='10' font-weight='600' fill='#1f2a44'>for a new connection on the same ports.</text><text x='14' y='126' text-anchor='start' font-size='10' font-weight='400' fill='#5b6478' font-style='italic'>TIME_WAIT keeps the closer around long enough to answer a repeated FIN, and to let old segments vanish.</text></svg>