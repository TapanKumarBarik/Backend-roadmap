<svg width='640' height='96' role='img' viewBox='0 0 640 96' xmlns='http://www.w3.org/2000/svg' font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"><title>Figure 8: TCP part 4, closing, RST, TIME_WAIT and ports</title><desc>Two bars: 28,000 ports available, and a bar twice as long, 60,000 ports needed. A note: runs out after about 28 seconds; fix, a pool of about 20 open connections.</desc><rect x='0' y='0' width='640' height='96' rx='16' fill='#fbfbf9' stroke='#e4e4de'/><defs><marker id='ar-blue' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#2f6fdb'/></marker><marker id='ar-green' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#178a5e'/></marker><marker id='ar-purple' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#6f52c9'/></marker><marker id='ar-orange' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#d0702c'/></marker><marker id='ar-pink' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#c43d6e'/></marker><marker id='ar-grey' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#6b7280'/></marker><marker id='ar-teal' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#0f7b6c'/></marker><marker id='ar-ink' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#5b6478'/></marker></defs><text x='14' y='18' text-anchor='start' font-size='10.5' font-weight='700' fill='#1f2a44'>1,000 new connections per second, each held 60 s in TIME_WAIT:</text><rect x='14' y='28' width='286' height='26' fill='#fcefe4' stroke='#d0702c' stroke-width='1.3'/><text x='157.0' y='44.5' text-anchor='middle' font-size='10.5' font-weight='700' fill='#d0702c'>28,000 available</text><rect x='14' y='58' width='612' height='26' fill='#fbe6ee' stroke='#c43d6e' stroke-width='1.3'/><text x='320.0' y='74.5' text-anchor='middle' font-size='10.5' font-weight='700' fill='#c43d6e'>60,000 ports needed</text><text x='320' y='46' text-anchor='start' font-size='10.5' font-weight='700' fill='#178a5e'>runs out after ≈ 28 s. Fix: a pool of ~20 open connections.</text></svg>