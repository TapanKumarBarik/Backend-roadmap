<svg width='640' height='118' role='img' viewBox='0 0 640 118' xmlns='http://www.w3.org/2000/svg' font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"><title>Figure 6: TCP part 4, closing, RST, TIME_WAIT and ports</title><desc>A bar for the port range 32,768 to 60,999, about 28,000 ports, and the arithmetic: 28,000 ports divided by 60 seconds is about 470 new connections per second.</desc><rect x='0' y='0' width='640' height='118' rx='16' fill='#fbfbf9' stroke='#e4e4de'/><defs><marker id='ar-blue' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#2f6fdb'/></marker><marker id='ar-green' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#178a5e'/></marker><marker id='ar-purple' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#6f52c9'/></marker><marker id='ar-orange' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#d0702c'/></marker><marker id='ar-pink' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#c43d6e'/></marker><marker id='ar-grey' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#6b7280'/></marker><marker id='ar-teal' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#0f7b6c'/></marker><marker id='ar-ink' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#5b6478'/></marker></defs><rect x='14' y='24' width='612' height='28' fill='#fcefe4' stroke='#d0702c' stroke-width='1.3'/><text x='320.0' y='41.5' text-anchor='middle' font-size='10.5' font-weight='700' fill='#d0702c'>client ports 32,768 → 60,999: about 28,000</text><text x='14' y='16' text-anchor='start' font-size='10.5' font-weight='700' fill='#1f2a44'>Linux&#x27;s ephemeral port range:</text><text x='14' y='76' text-anchor='start' font-size='10.5' font-weight='600' fill='#1f2a44'>Each closed connection holds its port in TIME_WAIT for 60 s, so:</text><text x='14' y='94' text-anchor='start' font-size='10.5' font-weight='700' fill='#c43d6e'>28,000 ports ÷ 60 s ≈ 470 new connections per second, to one address and port.</text><text x='14' y='108' text-anchor='start' font-size='10.5' font-weight='700' fill='#c43d6e'>Faster than that → “cannot assign requested address”.</text></svg>