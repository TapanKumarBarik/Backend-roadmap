<svg width='640' height='100' role='img' viewBox='0 0 640 100' xmlns='http://www.w3.org/2000/svg' font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"><title>Figure 4: TCP part 4, closing, RST, TIME_WAIT and ports</title><desc>The server sends RST to the phone. Notes: one segment, gone at once, unread data thrown away, connection reset by peer. Causes listed below.</desc><rect x='0' y='0' width='640' height='100' rx='16' fill='#fbfbf9' stroke='#e4e4de'/><defs><marker id='ar-blue' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#2f6fdb'/></marker><marker id='ar-green' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#178a5e'/></marker><marker id='ar-purple' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#6f52c9'/></marker><marker id='ar-orange' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#d0702c'/></marker><marker id='ar-pink' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#c43d6e'/></marker><marker id='ar-grey' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#6b7280'/></marker><marker id='ar-teal' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#0f7b6c'/></marker><marker id='ar-ink' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#5b6478'/></marker></defs><rect x='14' y='20' width='90' height='36' rx='7' fill='#e6eefc' stroke='#2f6fdb' stroke-width='1.6'/><text x='59.0' y='41.5' text-anchor='middle' font-size='10.5' font-weight='600' fill='#1f2a44'>your phone</text><rect x='270' y='20' width='90' height='36' rx='7' fill='#e2f4ec' stroke='#178a5e' stroke-width='1.6'/><text x='315.0' y='41.5' text-anchor='middle' font-size='10.5' font-weight='600' fill='#1f2a44'>server</text><line x1='268' y1='38' x2='106' y2='38' stroke='#c43d6e' stroke-width='1.5' marker-end='url(#ar-pink)'/><text x='186' y='32' text-anchor='middle' font-size='11' font-weight='700' fill='#c43d6e'>RST</text><text x='380' y='30' text-anchor='start' font-size='10' font-weight='700' fill='#1f2a44'>One segment, no goodbye: gone at once.</text><text x='380' y='46' text-anchor='start' font-size='10' font-weight='600' fill='#1f2a44'>Unread data is thrown away.</text><text x='380' y='62' text-anchor='start' font-size='10' font-weight='700' fill='#c43d6e'>You see “connection reset by peer”.</text><text x='14' y='90' text-anchor='start' font-size='9.8' font-weight='400' fill='#5b6478' font-style='italic'>Causes: a program crashed or was killed; a load balancer or firewall dropped an idle connection; nobody listening on the port.</text></svg>