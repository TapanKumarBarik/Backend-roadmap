<svg width='640' height='150' role='img' viewBox='0 0 640 150' xmlns='http://www.w3.org/2000/svg' font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"><title>Figure 7: TCP part 4, closing, RST, TIME_WAIT and ports</title><desc>Left: four numbered fixes, reuse connections, widen the port range, tcp_tw_reuse, more server addresses. Right: a checklist of symptoms and what they mean.</desc><rect x='0' y='0' width='640' height='150' rx='16' fill='#fbfbf9' stroke='#e4e4de'/><defs><marker id='ar-blue' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#2f6fdb'/></marker><marker id='ar-green' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#178a5e'/></marker><marker id='ar-purple' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#6f52c9'/></marker><marker id='ar-orange' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#d0702c'/></marker><marker id='ar-pink' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#c43d6e'/></marker><marker id='ar-grey' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#6b7280'/></marker><marker id='ar-teal' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#0f7b6c'/></marker><marker id='ar-ink' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#5b6478'/></marker></defs><text x='14' y='16' text-anchor='start' font-size='11' font-weight='700' fill='#178a5e'>Fixes, best first</text><circle cx='24' cy='34' r='9' fill='#178a5e'/><text x='24' y='37.8' text-anchor='middle' font-size='10.5' font-weight='700' fill='#fff'>1</text><text x='40' y='38' text-anchor='start' font-size='10' font-weight='600' fill='#1f2a44'>reuse connections: keep-alive, pools (lesson 29)</text><circle cx='24' cy='56' r='9' fill='#178a5e'/><text x='24' y='59.8' text-anchor='middle' font-size='10.5' font-weight='700' fill='#fff'>2</text><text x='40' y='60' text-anchor='start' font-size='10' font-weight='600' fill='#1f2a44'>widen the port range</text><circle cx='24' cy='78' r='9' fill='#178a5e'/><text x='24' y='81.8' text-anchor='middle' font-size='10.5' font-weight='700' fill='#fff'>3</text><text x='40' y='82' text-anchor='start' font-size='10' font-weight='600' fill='#1f2a44'>tcp_tw_reuse: reuse TIME_WAIT ports safely</text><circle cx='24' cy='100' r='9' fill='#178a5e'/><text x='24' y='103.8' text-anchor='middle' font-size='10.5' font-weight='700' fill='#fff'>4</text><text x='40' y='104' text-anchor='start' font-size='10' font-weight='600' fill='#1f2a44'>spread calls over more server addresses</text><text x='340' y='16' text-anchor='start' font-size='11' font-weight='700' fill='#c43d6e'>You see → it means</text><text x='340' y='38' text-anchor='start' font-size='10' font-weight='700' fill='#1f2a44'>many TIME_WAIT (client)</text><text x='500' y='38' text-anchor='start' font-size='9.5' font-weight='600' fill='#1f2a44'>too many short connections</text><text x='340' y='60' text-anchor='start' font-size='10' font-weight='700' fill='#1f2a44'>many CLOSE_WAIT</text><text x='500' y='60' text-anchor='start' font-size='9.5' font-weight='600' fill='#1f2a44'>your app forgets to close</text><text x='340' y='82' text-anchor='start' font-size='10' font-weight='700' fill='#1f2a44'>connection reset by peer</text><text x='500' y='82' text-anchor='start' font-size='9.5' font-weight='600' fill='#1f2a44'>crash, idle timeout or refused</text><text x='14' y='144' text-anchor='start' font-size='10' font-weight='400' fill='#5b6478' font-style='italic'>Pooling fixes the cause: a few long-lived connections carry many requests each.</text></svg>