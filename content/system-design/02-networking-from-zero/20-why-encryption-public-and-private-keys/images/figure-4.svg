<svg width='640' height='130' role='img' viewBox='0 0 640 130' xmlns='http://www.w3.org/2000/svg' font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"><title>Figure 4: Why encryption, public and private keys, the padlock picture</title><desc>A bank with the only key, three open green padlocks handed out to anyone, and a box with your message locked by one of them.</desc><rect x='0' y='0' width='640' height='130' rx='16' fill='#fbfbf9' stroke='#e4e4de'/><defs><marker id='ar-blue' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#2f6fdb'/></marker><marker id='ar-green' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#178a5e'/></marker><marker id='ar-purple' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#6f52c9'/></marker><marker id='ar-orange' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#d0702c'/></marker><marker id='ar-pink' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#c43d6e'/></marker><marker id='ar-grey' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#6b7280'/></marker><marker id='ar-teal' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#0f7b6c'/></marker><marker id='ar-ink' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#5b6478'/></marker></defs><rect x='14' y='30' width='90' height='44' rx='7' fill='#e2f4ec' stroke='#178a5e' stroke-width='1.6'/><text x='59.0' y='56.0' text-anchor='middle' font-size='12' font-weight='600' fill='#1f2a44'>bank</text><circle cx='32' cy='96' r='6.6000000000000005' fill='none' stroke='#6f52c9' stroke-width='2'/><path d='M 38.6 96 H 62.800000000000004 M 55.1 96 V 101.5 M 61.7 96 V 101.5' fill='none' stroke='#6f52c9' stroke-width='2'/><text x='14' y='120' text-anchor='start' font-size='9.5' font-weight='700' fill='#6f52c9'>only the bank has the key</text><rect x='158.0' y='46' width='24.0' height='19.0' rx='3' fill='#e2f4ec' stroke='#178a5e' stroke-width='1.5'/><path d='M 178.0 34.0 V 31.0 A 8.0 8.0 0 0 0 162.0 31.0 V 46' fill='none' stroke='#178a5e' stroke-width='2'/><circle cx='170' cy='55.0' r='2.4' fill='#178a5e'/><rect x='204.0' y='46' width='24.0' height='19.0' rx='3' fill='#e2f4ec' stroke='#178a5e' stroke-width='1.5'/><path d='M 224.0 34.0 V 31.0 A 8.0 8.0 0 0 0 208.0 31.0 V 46' fill='none' stroke='#178a5e' stroke-width='2'/><circle cx='216' cy='55.0' r='2.4' fill='#178a5e'/><rect x='250.0' y='46' width='24.0' height='19.0' rx='3' fill='#e2f4ec' stroke='#178a5e' stroke-width='1.5'/><path d='M 270.0 34.0 V 31.0 A 8.0 8.0 0 0 0 254.0 31.0 V 46' fill='none' stroke='#178a5e' stroke-width='2'/><circle cx='262' cy='55.0' r='2.4' fill='#178a5e'/><text x='216' y='84' text-anchor='middle' font-size='9.8' font-weight='700' fill='#178a5e'>open padlocks, free, to anyone</text><line x1='290' y1='56' x2='380' y2='56' stroke='#6b7280' stroke-width='1.5' marker-end='url(#ar-grey)'/><rect x='390' y='28' width='120' height='56' rx='7' fill='#eee9fb' stroke='#6f52c9' stroke-width='1.6'/><text x='450.0' y='60.333333333333336' text-anchor='middle' font-size='13' font-weight='600' fill='#1f2a44'></text><text x='450' y='41' text-anchor='middle' font-size='9.5' font-weight='700' fill='#6f52c9'>your message</text><rect x='439.2' y='61' width='21.6' height='17.1' rx='3' fill='#e2f4ec' stroke='#178a5e' stroke-width='1.5'/><path d='M 457.2 61 V 53.8 A 7.2 7.2 0 0 0 442.8 53.8 V 61' fill='none' stroke='#178a5e' stroke-wid