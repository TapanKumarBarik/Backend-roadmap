<svg width='640' height='136' role='img' viewBox='0 0 640 136' xmlns='http://www.w3.org/2000/svg' font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"><title>Figure 3: Why encryption, public and private keys, the padlock picture</title><desc>You and a server need the same blue key; sending it over the Wi-Fi lets a snooper copy it, shown as a red copy of the key.</desc><rect x='0' y='0' width='640' height='136' rx='16' fill='#fbfbf9' stroke='#e4e4de'/><defs><marker id='ar-blue' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#2f6fdb'/></marker><marker id='ar-green' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#178a5e'/></marker><marker id='ar-purple' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#6f52c9'/></marker><marker id='ar-orange' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#d0702c'/></marker><marker id='ar-pink' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#c43d6e'/></marker><marker id='ar-grey' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#6b7280'/></marker><marker id='ar-teal' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#0f7b6c'/></marker><marker id='ar-ink' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#5b6478'/></marker></defs><rect x='14' y='20' width='90' height='40' rx='7' fill='#e6eefc' stroke='#2f6fdb' stroke-width='1.6'/><text x='59.0' y='43.666666666666664' text-anchor='middle' font-size='11' font-weight='600' fill='#1f2a44'>you</text><rect x='536' y='20' width='90' height='40' rx='7' fill='#e2f4ec' stroke='#178a5e' stroke-width='1.6'/><text x='581.0' y='43.666666666666664' text-anchor='middle' font-size='11' font-weight='600' fill='#1f2a44'>server</text><circle cx='300' cy='22' r='7.199999999999999' fill='none' stroke='#2f6fdb' stroke-width='2'/><path d='M 307.2 22 H 333.6 M 325.2 22 V 28.0 M 332.4 22 V 28.0' fill='none' stroke='#2f6fdb' stroke-width='2'/><line x1='108' y1='40' x2='530' y2='40' stroke='#2f6fdb' stroke-width='1.5' marker-end='url(#ar-blue)' stroke-dasharray='5 4'/><text x='320' y='58' text-anchor='middle' font-size='10' font-weight='700' fill='#2f6fdb'>the same key must reach both sides…</text><circle cx='300' cy='96' r='7.199999999999999' fill='none' stroke='#c43d6e' stroke-width='2'/><path d='M 307.2 96 H 333.6 M 325.2 96 V 102.0 M 332.4 96 V 102.0' fill='none' stroke='#c43d6e' stroke-width='2'/><text x='345' y='100' text-anchor='start' font-size='10' font-weight='700' fill='#c43d6e'>…but the snooper on the Wi-Fi copies it too</text><text x='14' y='128' text-anchor='start' font-size='9.8' font-weight='400' fill='#5b6478' font-style='italic'>Symmetric encryption (AES): one key locks and unlocks. Very fast, but how do you share the key? The key distribution problem.</text></svg>