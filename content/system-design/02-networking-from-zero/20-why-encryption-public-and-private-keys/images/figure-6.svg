<svg width='640' height='176' role='img' viewBox='0 0 640 176' xmlns='http://www.w3.org/2000/svg' font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"><title>Figure 6: Why encryption, public and private keys, the padlock picture</title><desc>A sequence diagram: the browser makes a random key, sends it locked with the server&#x27;s public key, the server unlocks it with its private key, then both use fast AES.</desc><rect x='0' y='0' width='640' height='176' rx='16' fill='#fbfbf9' stroke='#e4e4de'/><defs><marker id='ar-blue' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#2f6fdb'/></marker><marker id='ar-green' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#178a5e'/></marker><marker id='ar-purple' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#6f52c9'/></marker><marker id='ar-orange' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#d0702c'/></marker><marker id='ar-pink' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#c43d6e'/></marker><marker id='ar-grey' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#6b7280'/></marker><marker id='ar-teal' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#0f7b6c'/></marker><marker id='ar-ink' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#5b6478'/></marker></defs><text x='60' y='16' text-anchor='middle' font-size='11' font-weight='700' fill='#2f6fdb'>browser</text><line x1='60' y1='22' x2='60' y2='140' stroke='#2f6fdb' stroke-width='1.4'/><text x='580' y='16' text-anchor='middle' font-size='11' font-weight='700' fill='#178a5e'>server</text><line x1='580' y1='22' x2='580' y2='140' stroke='#178a5e' stroke-width='1.4'/><circle cx='76' cy='36' r='5.4' fill='none' stroke='#2f6fdb' stroke-width='2'/><path d='M 81.4 36 H 101.2 M 94.9 36 V 40.5 M 100.3 36 V 40.5' fill='none' stroke='#2f6fdb' stroke-width='2'/><text x='110' y='40' text-anchor='start' font-size='10.5' font-weight='700' fill='#2f6fdb'>1  make a random secret key</text><line x1='62' y1='68' x2='576' y2='68' stroke='#178a5e' stroke-width='1.5' marker-end='url(#ar-green)'/><text x='320' y='62' text-anchor='middle' font-size='10.5' font-weight='700' fill='#178a5e'>2  send it locked with the server&#x27;s public key</text><circle cx='532' cy='92' r='5.4' fill='none' stroke='#6f52c9' stroke-width='2'/><path d='M 537.4 92 H 557.2 M 550.9 92 V 96.5 M 556.3 92 V 96.5' fill='none' stroke='#6f52c9' stroke-width='2'/><text x='524' y='96' text-anchor='end' font-size='10.5' font-weight='700' fill='#6f52c9'>3  unlock with the private key</text><line x1='62' y1='120' x2='576' y2='120' stroke='#2f6fdb' stroke-width='1.5' marker-end='url(#ar-blue)'/><line x1='576' y1='130' x2='62' y2='130' stroke='#2f6fdb' stroke-width='1.5' marker-end='url(#ar-blue)'/><text x='320' y='114' text-anchor='middle' font-size='10.5' font-weight='700' fill='#2f6fdb'>4  one shared secret → fast AES for everything else</text><text x='14' y='160' text-anchor='start' font-size='9.8' font-weight='400' fill='#5b6478' font-style='italic'>TLS 1.3 uses a cousin, a Diffie-Hellman key exchange: each side sends only a public part, and both</text><text x='14' y='172' text-anchor='start' font-size='9.8' font-weight='400' fill='#5b6478' font-style='italic'>compute the same key, which is never sent at all.</text></svg>