<svg width='640' height='136' role='img' viewBox='0 0 640 136' xmlns='http://www.w3.org/2000/svg' font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"><title>Figure 8: Why encryption, public and private keys, the padlock picture</title><desc>You, an attacker and a server: the attacker takes the server&#x27;s real padlock and hands you their own, so your secret is locked for the attacker.</desc><rect x='0' y='0' width='640' height='136' rx='16' fill='#fbfbf9' stroke='#e4e4de'/><defs><marker id='ar-blue' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#2f6fdb'/></marker><marker id='ar-green' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#178a5e'/></marker><marker id='ar-purple' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#6f52c9'/></marker><marker id='ar-orange' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#d0702c'/></marker><marker id='ar-pink' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#c43d6e'/></marker><marker id='ar-grey' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#6b7280'/></marker><marker id='ar-teal' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#0f7b6c'/></marker><marker id='ar-ink' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#5b6478'/></marker></defs><rect x='14' y='36' width='90' height='40' rx='7' fill='#e6eefc' stroke='#2f6fdb' stroke-width='1.6'/><text x='59.0' y='59.666666666666664' text-anchor='middle' font-size='11' font-weight='600' fill='#1f2a44'>you</text><rect x='270' y='36' width='100' height='40' rx='7' fill='#fbe6ee' stroke='#c43d6e' stroke-width='1.6'/><text x='320.0' y='59.666666666666664' text-anchor='middle' font-size='11' font-weight='600' fill='#1f2a44'>attacker</text><rect x='536' y='36' width='90' height='40' rx='7' fill='#e2f4ec' stroke='#178a5e' stroke-width='1.6'/><text x='581.0' y='59.666666666666664' text-anchor='middle' font-size='11' font-weight='600' fill='#1f2a44'>server</text><rect x='445.4' y='26' width='19.200000000000003' height='15.200000000000001' rx='3' fill='#e2f4ec' stroke='#178a5e' stroke-width='1.5'/><path d='M 461.4 16.4 V 14.0 A 6.4 6.4 0 0 0 448.6 14.0 V 26' fill='none' stroke='#178a5e' stroke-width='2'/><circle cx='455' cy='33.2' r='1.92' fill='#178a5e'/><text x='455' y='72' text-anchor='middle' font-size='9' font-weight='700' fill='#178a5e'>the real padlock</text><line x1='530' y1='56' x2='374' y2='56' stroke='#178a5e' stroke-width='1.5' marker-end='url(#ar-green)' stroke-dasharray='5 4'/><rect x='175.4' y='26' width='19.200000000000003' height='15.200000000000001' rx='3' fill='#fbe6ee' stroke='#c43d6e' stroke-width='1.5'/><path d='M 191.4 16.4 V 14.0 A 6.4 6.4 0 0 0 178.6 14.0 V 26' fill='none' stroke='#c43d6e' stroke-width='2'/><circle cx='185' cy='33.2' r='1.92' fill='#c43d6e'/><text x='185' y='72' text-anchor='middle' font-size='9' font-weight='700' fill='#c43d6e'>swapped in</text><line x1='266' y1='56' x2='108' y2='56' stroke='#c43d6e' stroke-width='1.5' marker-end='url(#ar-pink)'/><text x='14' y='108' text-anchor='start' font-size='9.8' font-weight='400' fill='#5b6478' font-style='italic'>You lock your secret with the attacker&#x27;s padlock: they read it, then pass it on. Encryption alone doesn&#x27;t say who</text><text x='14' y='122' text-anchor='start' font-size='9.8' font-weight='400' fill='#5b6478' font-style='italic'>you&#x27;re talking to. Certificates (lesson 22) let the browser check who the public key belongs to.</text></svg>