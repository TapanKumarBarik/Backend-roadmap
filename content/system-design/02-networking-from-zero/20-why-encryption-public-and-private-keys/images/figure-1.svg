<svg width='640' height='130' role='img' viewBox='0 0 640 130' xmlns='http://www.w3.org/2000/svg' font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"><title>Figure 1: Why encryption, public and private keys, the padlock picture</title><desc>A postcard reading my password: sunny42, and a chain of hops (café router, your internet provider, two routers), each marked can read it.</desc><rect x='0' y='0' width='640' height='130' rx='16' fill='#fbfbf9' stroke='#e4e4de'/><defs><marker id='ar-blue' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#2f6fdb'/></marker><marker id='ar-green' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#178a5e'/></marker><marker id='ar-purple' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#6f52c9'/></marker><marker id='ar-orange' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#d0702c'/></marker><marker id='ar-pink' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#c43d6e'/></marker><marker id='ar-grey' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#6b7280'/></marker><marker id='ar-teal' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#0f7b6c'/></marker><marker id='ar-ink' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#5b6478'/></marker></defs><rect x='14' y='8' width='180' height='56' rx='7' fill='#eee9fb' stroke='#6f52c9' stroke-width='1.6'/><text x='104.0' y='34.0' text-anchor='middle' font-size='11' font-weight='600' fill='#1f2a44'>my password: sunny42</text><text x='104.0' y='49.0' text-anchor='middle' font-size='8.6' fill='#5b6478'>a postcard: anyone holding it can read it</text><rect x='14' y='80' width='96' height='26' rx='7' fill='#f1f2f4' stroke='#6b7280' stroke-width='1.6'/><text x='62.0' y='96.33333333333333' text-anchor='middle' font-size='10' font-weight='600' fill='#1f2a44'>café router</text><text x='62.0' y='122' text-anchor='middle' font-size='9.5' font-weight='700' fill='#c43d6e'>can read it</text><line x1='112' y1='93' x2='134' y2='93' stroke='#6b7280' stroke-width='1.5' marker-end='url(#ar-grey)'/><rect x='138' y='80' width='150' height='26' rx='7' fill='#f1f2f4' stroke='#6b7280' stroke-width='1.6'/><text x='213.0' y='96.33333333333333' text-anchor='middle' font-size='10' font-weight='600' fill='#1f2a44'>your internet provider</text><text x='213.0' y='122' text-anchor='middle' font-size='9.5' font-weight='700' fill='#c43d6e'>can read it</text><line x1='290' y1='93' x2='312' y2='93' stroke='#6b7280' stroke-width='1.5' marker-end='url(#ar-grey)'/><rect x='316' y='80' width='80' height='26' rx='7' fill='#f1f2f4' stroke='#6b7280' stroke-width='1.6'/><text x='356.0' y='96.33333333333333' text-anchor='middle' font-size='10' font-weight='600' fill='#1f2a44'>router</text><text x='356.0' y='122' text-anchor='middle' font-size='9.5' font-weight='700' fill='#c43d6e'>can read it</text><line x1='398' y1='93' x2='420' y2='93' stroke='#6b7280' stroke-width='1.5' marker-end='url(#ar-grey)'/><rect x='424' y='80' width='80' height='26' rx='7' fill='#f1f2f4' stroke='#6b7280' stroke-width='1.6'/><text x='464.0' y='96.33333333333333' text-anchor='middle' font-size='10' font-weight='600' fill='#1f2a44'>router</text><text x='464.0' y='122' text-anchor='middle' font-size='9.5' font-weight='700' fill='#c43d6e'>can read it</text><text x='230' y='30' text-anchor='start' font-size='10.5' font-weight='700' fill='#1f2a44'>Without encryption, every packet is a postcard.</text><text x='230' y='46' text-anchor='start' font-size='9.8' font-weight='400' fill='#5b6478'>It passes the café router, your provider and many routers after that.</text></svg>