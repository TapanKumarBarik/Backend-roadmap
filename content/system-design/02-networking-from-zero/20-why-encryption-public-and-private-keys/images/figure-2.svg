text x='113.0' y='30.0' text-anchor='middle' font-size='13' font-weight='600' fill='#1f2a44'>privacy</text><text x='113.0' y='45.0' text-anchor='middle' font-size='9.5' fill='#5b6478'>someone reads it</text><text x='113' y='74' text-anchor='middle' font-size='10' font-weight='700' fill='#2f6fdb'>today</text><rect x='220' y='8' width='198' height='48' rx='7' fill='#fcefe4' stroke='#d0702c' stroke-width='1.6'/><text x='319.0' y='30.0' text-anchor='middle' font-size='13' font-weight='600' fill='#1f2a44'>integrity</text><text x='319.0' y='45.0' text-anchor='middle' font-size='9.5' fill='#5b6478'>someone changes it</text><text x='319' y='74' text-anchor='middle' font-size='10' font-weight='700' fill='#d0702c'>lesson 21</text><rect x='426' y='8' width='198' height='48' rx='7' fill='#fbe6ee' stroke='#c43d6e' stroke-width='1.6'/><text x='525.0' y='30.0' text-anchor='middle' font-size='13' font-weight='600' fill='#1f2a44'>authenticity</text><text x='525.0' y='45.0' text-anchor='middle' font-size='9.5' fill='#5b6478'>someone pretends to be your bank</text><text x='525' y='74' text-anchor='middle' font-size='10' font-weight='700' fill='#c43d6e'>lessons 21 and 22</text></svg>