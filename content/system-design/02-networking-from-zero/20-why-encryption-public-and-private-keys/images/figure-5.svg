<svg width='640' height='150' role='img' viewBox='0 0 640 150' xmlns='http://www.w3.org/2000/svg' font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"><title>Figure 5: Why encryption, public and private keys, the padlock picture</title><desc>An open green padlock labelled public key, a purple key labelled private key, and two bars: AES long and fast, public key tiny and much slower.</desc><rect x='0' y='0' width='640' height='150' rx='16' fill='#fbfbf9' stroke='#e4e4de'/><defs><marker id='ar-blue' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#2f6fdb'/></marker><marker id='ar-green' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#178a5e'/></marker><marker id='ar-purple' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#6f52c9'/></marker><marker id='ar-orange' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#d0702c'/></marker><marker id='ar-pink' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#c43d6e'/></marker><marker id='ar-grey' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#6b7280'/></marker><marker id='ar-teal' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#0f7b6c'/></marker><marker id='ar-ink' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#5b6478'/></marker></defs><rect x='26.799999999999997' y='30' width='26.400000000000002' height='20.900000000000002' rx='3' fill='#e2f4ec' stroke='#178a5e' stroke-width='1.5'/><path d='M 48.8 16.799999999999997 V 13.499999999999998 A 8.8 8.8 0 0 0 31.2 13.499999999999998 V 30' fill='none' stroke='#178a5e' stroke-width='2'/><circle cx='40' cy='39.9' r='2.64' fill='#178a5e'/><text x='64' y='44' text-anchor='start' font-size='11' font-weight='700' fill='#178a5e'>public key: shared with the whole world</text><circle cx='30' cy='80' r='6.6000000000000005' fill='none' stroke='#6f52c9' stroke-width='2'/><path d='M 36.6 80 H 60.800000000000004 M 53.1 80 V 85.5 M 59.7 80 V 85.5' fill='none' stroke='#6f52c9' stroke-width='2'/><text x='70' y='84' text-anchor='start' font-size='11' font-weight='700' fill='#6f52c9'>private key: never leaves the server</text><text x='14' y='112' text-anchor='start' font-size='10.5' font-weight='700' fill='#1f2a44'>What the public key locks, only the private key can unlock.</text><rect x='380' y='16' width='240' height='18' rx='4' fill='#e6eefc' stroke='#2f6fdb'/><text x='386' y='29' text-anchor='start' font-size='9.8' font-weight='700' fill='#2f6fdb'>AES: fast, gigabytes per second</text><rect x='380' y='46' width='6' height='18' rx='2' fill='#fcefe4' stroke='#d0702c'/><text x='394' y='59' text-anchor='start' font-size='9.8' font-weight='700' fill='#d0702c'>public key: 100s–1000s× slower</text><text x='380' y='84' text-anchor='start' font-size='9.8' font-weight='400' fill='#5b6478'>Fine for a few bytes,</text><text x='380' y='98' text-anchor='start' font-size='9.8' font-weight='400' fill='#5b6478'>too slow for a whole video.</text><text x='14' y='138' text-anchor='start' font-size='9.8' font-weight='400' fill='#5b6478' font-style='italic'>The snooper sees the public key and the locked box. Neither helps: a public key can only lock.</text></svg>