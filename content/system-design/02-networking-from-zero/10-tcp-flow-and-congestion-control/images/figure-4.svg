<svg width='640' height='100' role='img' viewBox='0 0 640 100' xmlns='http://www.w3.org/2000/svg' font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"><title>Figure 4: TCP part 3, flow and congestion control</title><desc>Three boxes: receive window from the receiver, congestion window the sender&#x27;s guess, and in between, in flight: the smaller of the two.</desc><rect x='0' y='0' width='640' height='100' rx='16' fill='#fbfbf9' stroke='#e4e4de'/><defs><marker id='ar-blue' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#2f6fdb'/></marker><marker id='ar-green' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#178a5e'/></marker><marker id='ar-purple' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#6f52c9'/></marker><marker id='ar-orange' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#d0702c'/></marker><marker id='ar-pink' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#c43d6e'/></marker><marker id='ar-grey' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#6b7280'/></marker><marker id='ar-teal' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#0f7b6c'/></marker><marker id='ar-ink' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#5b6478'/></marker></defs><rect x='14' y='22' width='190' height='46' rx='7' fill='#e2f4ec' stroke='#178a5e' stroke-width='1.6'/><text x='109.0' y='43.0' text-anchor='middle' font-size='11' font-weight='600' fill='#1f2a44'>receive window</text><text x='109.0' y='58.0' text-anchor='middle' font-size='9' fill='#5b6478'>from the receiver: its free space</text><rect x='436' y='22' width='190' height='46' rx='7' fill='#fcefe4' stroke='#d0702c' stroke-width='1.6'/><text x='531.0' y='43.0' text-anchor='middle' font-size='11' font-weight='600' fill='#1f2a44'>congestion window</text><text x='531.0' y='58.0' text-anchor='middle' font-size='9' fill='#5b6478'>the sender&#x27;s own guess for the network</text><rect x='240' y='22' width='160' height='46' rx='7' fill='#e6eefc' stroke='#2f6fdb' stroke-width='1.6'/><text x='320.0' y='43.0' text-anchor='middle' font-size='11' font-weight='600' fill='#1f2a44'>in flight</text><text x='320.0' y='58.0' text-anchor='middle' font-size='9.5' fill='#5b6478'>the smaller of the two</text><line x1='206' y1='45' x2='238' y2='45' stroke='#178a5e' stroke-width='1.5' marker-end='url(#ar-green)'/><line x1='434' y1='45' x2='402' y2='45' stroke='#d0702c' stroke-width='1.5' marker-end='url(#ar-orange)'/><text x='14' y='90' text-anchor='start' font-size='10' font-weight='400' fill='#5b6478' font-style='italic'>The sender can&#x27;t see the routers in between, so it keeps its own guess, and sends whichever window is smaller.</text></svg>