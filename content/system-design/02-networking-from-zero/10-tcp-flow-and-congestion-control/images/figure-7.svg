<svg width='640' height='140' role='img' viewBox='0 0 640 140' xmlns='http://www.w3.org/2000/svg' font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"><title>Figure 7: TCP part 3, flow and congestion control</title><desc>A formula box: speed is at most window divided by round trip. Three examples: 64 KB over 100 ms is about 5 megabits; filling 100 megabits at 100 ms needs 1.25 MB in flight; a 100 KB page needs about 3 round trips of slow start.</desc><rect x='0' y='0' width='640' height='140' rx='16' fill='#fbfbf9' stroke='#e4e4de'/><defs><marker id='ar-blue' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#2f6fdb'/></marker><marker id='ar-green' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#178a5e'/></marker><marker id='ar-purple' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#6f52c9'/></marker><marker id='ar-orange' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#d0702c'/></marker><marker id='ar-pink' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#c43d6e'/></marker><marker id='ar-grey' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#6b7280'/></marker><marker id='ar-teal' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#0f7b6c'/></marker><marker id='ar-ink' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#5b6478'/></marker></defs><rect x='14' y='10' width='300' height='30' rx='6' fill='#e6eefc' stroke='#2f6fdb' stroke-width='1.3'/><text x='164' y='30' text-anchor='middle' font-size='13' font-weight='700' fill='#2f6fdb'>speed ≤ window ÷ round trip</text><text x='14' y='64' text-anchor='start' font-size='10.5' font-weight='700' fill='#1f2a44'>64 KB ÷ 100 ms</text><text x='200' y='64' text-anchor='start' font-size='10.5' font-weight='700' fill='#d0702c'>640 KB/s ≈ 5 Mbit/s, even on a gigabit link</text><text x='14' y='88' text-anchor='start' font-size='10.5' font-weight='700' fill='#1f2a44'>100 Mbit/s × 100 ms</text><text x='200' y='88' text-anchor='start' font-size='10.5' font-weight='700' fill='#d0702c'>1.25 MB must be in flight: window scaling</text><text x='14' y='112' text-anchor='start' font-size='10.5' font-weight='700' fill='#1f2a44'>a 100 KB page, cold start</text><text x='200' y='112' text-anchor='start' font-size='10.5' font-weight='700' fill='#178a5e'>14 + 29 + 58 KB: about 3 round trips</text><text x='14' y='134' text-anchor='start' font-size='10' font-weight='400' fill='#5b6478' font-style='italic'>Most short transfers never reach full speed: the window and the round trip decide.</text></svg>