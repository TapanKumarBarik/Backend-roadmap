<svg width='640' height='150' role='img' viewBox='0 0 640 150' xmlns='http://www.w3.org/2000/svg' font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"><title>Figure 5: TCP part 3, flow and congestion control</title><desc>Bars for five round trips with congestion windows of 10, 20, 40, 80 and 160 segments, each double the one before.</desc><rect x='0' y='0' width='640' height='150' rx='16' fill='#fbfbf9' stroke='#e4e4de'/><defs><marker id='ar-blue' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#2f6fdb'/></marker><marker id='ar-green' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#178a5e'/></marker><marker id='ar-purple' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#6f52c9'/></marker><marker id='ar-orange' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#d0702c'/></marker><marker id='ar-pink' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#c43d6e'/></marker><marker id='ar-grey' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#6b7280'/></marker><marker id='ar-teal' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#0f7b6c'/></marker><marker id='ar-ink' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#5b6478'/></marker></defs><line x1='30' y1='124' x2='420' y2='124' stroke='#5b6478'/><rect x='50' y='117.8' width='46' height='6.2' rx='3' fill='#fcefe4' stroke='#d0702c' stroke-width='1.3'/><text x='73' y='113.8' text-anchor='middle' font-size='10' font-weight='700' fill='#d0702c'>10</text><text x='73' y='137' text-anchor='middle' font-size='9' font-weight='600' fill='#1f2a44'>RTT 1</text><rect x='122' y='111.6' width='46' height='12.4' rx='3' fill='#fcefe4' stroke='#d0702c' stroke-width='1.3'/><text x='145' y='107.6' text-anchor='middle' font-size='10' font-weight='700' fill='#d0702c'>20</text><text x='145' y='137' text-anchor='middle' font-size='9' font-weight='600' fill='#1f2a44'>RTT 2</text><rect x='194' y='99.2' width='46' height='24.8' rx='3' fill='#fcefe4' stroke='#d0702c' stroke-width='1.3'/><text x='217' y='95.2' text-anchor='middle' font-size='10' font-weight='700' fill='#d0702c'>40</text><text x='217' y='137' text-anchor='middle' font-size='9' font-weight='600' fill='#1f2a44'>RTT 3</text><rect x='266' y='74.4' width='46' height='49.6' rx='3' fill='#fcefe4' stroke='#d0702c' stroke-width='1.3'/><text x='289' y='70.4' text-anchor='middle' font-size='10' font-weight='700' fill='#d0702c'>80</text><text x='289' y='137' text-anchor='middle' font-size='9' font-weight='600' fill='#1f2a44'>RTT 4</text><rect x='338' y='24.799999999999997' width='46' height='99.2' rx='3' fill='#fcefe4' stroke='#d0702c' stroke-width='1.3'/><text x='361' y='20.799999999999997' text-anchor='middle' font-size='10' font-weight='700' fill='#d0702c'>160</text><text x='361' y='137' text-anchor='middle' font-size='9' font-weight='600' fill='#1f2a44'>RTT 5</text><text x='440' y='30' text-anchor='start' font-size='11' font-weight='700' fill='#d0702c'>Slow start:</text><text x='440' y='46' text-anchor='start' font-size='10' font-weight='600' fill='#1f2a44'>begin with 10 segments</text><text x='440' y='60' text-anchor='start' font-size='10' font-weight='600' fill='#1f2a44'>(≈ 14 KB), and double</text><text x='440' y='74' text-anchor='start' font-size='10' font-weight='600' fill='#1f2a44'>every round trip in which</text><text x='440' y='88' text-anchor='start' font-size='1