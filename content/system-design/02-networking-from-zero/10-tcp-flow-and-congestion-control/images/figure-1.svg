<svg width='640' height='120' role='img' viewBox='0 0 640 120' xmlns='http://www.w3.org/2000/svg' font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"><title>Figure 1: TCP part 3, flow and congestion control</title><desc>You send boxes along a dashed road to a friend&#x27;s shop. The shop&#x27;s storeroom has space for 10 boxes, labelled flow control; the road is labelled congestion control.</desc><rect x='0' y='0' width='640' height='120' rx='16' fill='#fbfbf9' stroke='#e4e4de'/><defs><marker id='ar-blue' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#2f6fdb'/></marker><marker id='ar-green' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#178a5e'/></marker><marker id='ar-purple' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#6f52c9'/></marker><marker id='ar-orange' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#d0702c'/></marker><marker id='ar-pink' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#c43d6e'/></marker><marker id='ar-grey' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#6b7280'/></marker><marker id='ar-teal' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#0f7b6c'/></marker><marker id='ar-ink' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#5b6478'/></marker></defs><rect x='14' y='30' width='80' height='40' rx='7' fill='#eee9fb' stroke='#6f52c9' stroke-width='1.6'/><text x='54.0' y='53.666666666666664' text-anchor='middle' font-size='11' font-weight='600' fill='#1f2a44'>you</text><rect x='110' y='40' width='54' height='18' rx='4' fill='#eee9fb' stroke='#6f52c9' stroke-width='1.2'/><text x='137.0' y='52.6' text-anchor='middle' font-size='9.5' font-weight='700' fill='#6f52c9'>box</text><rect x='172' y='40' width='54' height='18' rx='4' fill='#eee9fb' stroke='#6f52c9' stroke-width='1.2'/><text x='199.0' y='52.6' text-anchor='middle' font-size='9.5' font-weight='700' fill='#6f52c9'>box</text><rect x='234' y='40' width='54' height='18' rx='4' fill='#eee9fb' stroke='#6f52c9' stroke-width='1.2'/><text x='261.0' y='52.6' text-anchor='middle' font-size='9.5' font-weight='700' fill='#6f52c9'>box</text><rect x='296' y='40' width='54' height='18' rx='4' fill='#eee9fb' stroke='#6f52c9' stroke-width='1.2'/><text x='323.0' y='52.6' text-anchor='middle' font-size='9.5' font-weight='700' fill='#6f52c9'>box</text><rect x='358' y='40' width='54' height='18' rx='4' fill='#eee9fb' stroke='#6f52c9' stroke-width='1.2'/><text x='385.0' y='52.6' text-anchor='middle' font-size='9.5' font-weight='700' fill='#6f52c9'>box</text><line x1='104' y1='72' x2='420' y2='72' stroke='#5b6478' stroke-dasharray='5 4'/><text x='262' y='88' text-anchor='middle' font-size='9.8' font-weight='700' fill='#d0702c'>the road: you can&#x27;t see the traffic (congestion control)</text><rect x='430' y='22' width='196' height='56' rx='7' fill='#e2f4ec' stroke='#178a5e' stroke-width='1.6'/><text x='528.0' y='48.0' text-anchor='middle' font-size='11' font-weight='600' fill='#1f2a44'>friend&#x27;s shop</text><text x='528.0' y='63.0' text-anchor='middle' font-size='9.5' fill='#5b6478'>storeroom: space for 10 boxes</text><text x='528' y='94' text-anchor='middle' font-size='9.8' font-weight='700' fill='#178a5e'>their limit (flow control)</text><text x='14' y='114' text-anchor='start' font-size='10' font-weight='400' fill='#5b6478' font-style='italic'>Send many boxes at once, but never more than the storeroom holds, and fewer when the road jams.</text></svg>