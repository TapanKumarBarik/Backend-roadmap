<svg width='640' height='96' role='img' viewBox='0 0 640 96' xmlns='http://www.w3.org/2000/svg' font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"><title>Figure 8: TCP part 3, flow and congestion control</title><desc>A long empty bar for a gigabit link with a tiny red sliver used: 64 KB per 0.2 seconds is about 320 KB per second, 2.6 megabits.</desc><rect x='0' y='0' width='640' height='96' rx='16' fill='#fbfbf9' stroke='#e4e4de'/><defs><marker id='ar-blue' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#2f6fdb'/></marker><marker id='ar-green' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#178a5e'/></marker><marker id='ar-purple' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#6f52c9'/></marker><marker id='ar-orange' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#d0702c'/></marker><marker id='ar-pink' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#c43d6e'/></marker><marker id='ar-grey' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#6b7280'/></marker><marker id='ar-teal' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#0f7b6c'/></marker><marker id='ar-ink' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#5b6478'/></marker></defs><text x='14' y='18' text-anchor='start' font-size='10.5' font-weight='700' fill='#1f2a44'>Round trip 200 ms · receive window 64 KB · no window scaling · 1 gigabit link:</text><rect x='14' y='28' width='612' height='26' rx='4' fill='#fff' stroke='#5b6478' stroke-width='1.2'/><rect x='14' y='28' width='3' height='26' fill='#c43d6e'/><text x='320' y='46' text-anchor='middle' font-size='10' font-weight='600' fill='#1f2a44'>the gigabit link: about 0.26% used</text><text x='14' y='76' text-anchor='start' font-size='11' font-weight='700' fill='#178a5e'>64 KB ÷ 0.2 s ≈ 320 KB/s ≈ 2.6 megabits.</text><text x='14' y='92' text-anchor='start' font-size='10' font-weight='400' fill='#5b6478' font-style='italic'>Fix: a bigger window (window scaling), or a server closer to the user.</text></svg>