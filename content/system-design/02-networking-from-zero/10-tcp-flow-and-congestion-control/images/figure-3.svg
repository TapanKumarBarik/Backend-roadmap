<svg width='640' height='130' role='img' viewBox='0 0 640 130' xmlns='http://www.w3.org/2000/svg' font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"><title>Figure 3: TCP part 3, flow and congestion control</title><desc>A receiver sends ACK 5,001 with window 64,000 to the sender. Below, three buffer rows filling up: window 64,000, window 24,000, and window 0, where the sender stops.</desc><rect x='0' y='0' width='640' height='130' rx='16' fill='#fbfbf9' stroke='#e4e4de'/><defs><marker id='ar-blue' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#2f6fdb'/></marker><marker id='ar-green' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#178a5e'/></marker><marker id='ar-purple' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#6f52c9'/></marker><marker id='ar-orange' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#d0702c'/></marker><marker id='ar-pink' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#c43d6e'/></marker><marker id='ar-grey' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#6b7280'/></marker><marker id='ar-teal' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#0f7b6c'/></marker><marker id='ar-ink' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#5b6478'/></marker></defs><rect x='14' y='20' width='90' height='40' rx='7' fill='#e6eefc' stroke='#2f6fdb' stroke-width='1.6'/><text x='59.0' y='43.666666666666664' text-anchor='middle' font-size='11' font-weight='600' fill='#1f2a44'>sender</text><rect x='536' y='20' width='90' height='40' rx='7' fill='#e2f4ec' stroke='#178a5e' stroke-width='1.6'/><text x='581.0' y='43.666666666666664' text-anchor='middle' font-size='11' font-weight='600' fill='#1f2a44'>receiver</text><line x1='534' y1='40' x2='106' y2='40' stroke='#178a5e' stroke-width='1.5' marker-end='url(#ar-green)'/><text x='320' y='34' text-anchor='middle' font-size='10' font-weight='700' fill='#178a5e'>ACK 5,001 · window 64,000  (“I have 64,000 bytes free”)</text><rect x='300' y='72' width='20' height='14' rx='4' fill='#e2f4ec' stroke='#178a5e' stroke-width='1.4'/><text x='310.0' y='82.5' text-anchor='middle' font-size='10.5' font-weight='700' fill='#1f2a44'></text><rect x='322' y='72' width='20' height='14' rx='4' fill='#e2f4ec' stroke='#178a5e' stroke-width='1.4'/><text x='332.0' y='82.5' text-anchor='middle' font-size='10.5' font-weight='700' fill='#1f2a44'></text><rect x='344' y='72' width='20' height='14' rx='4' fill='#fff' stroke='#178a5e' stroke-width='1.4'/><text x='354.0' y='82.5' text-anchor='middle' font-size='10.5' font-weight='700' fill='#5b6478'></text><rect x='366' y='72' width='20' height='14' rx='4' fill='#fff' stroke='#178a5e' stroke-width='1.4'/><text x='376.0' y='82.5' text-anchor='middle' font-size='10.5' font-weight='700' fill='#5b6478'></text><rect x='388' y='72' width='20' height='14' rx='4' fill='#fff' stroke='#178a5e' stroke-width='1.4'/><text x='398.0' y='82.5' text-anchor='middle' font-size='10.5' font-weight='700' fill='#5b6478'></text><rect x='410' y='72' width='20' height='14' rx='4' fill='#fff' stroke='#178a5e' stroke-width='1.4'/><text x='420.0' y='82.5' text-anchor='middle' font-size='10.5' font-weight='700' fill='#5b6478'></text><rect x='432' y='72' width='20' height='14' rx='4' fill='#fff' stroke='#178a5e' stroke-width='1.4'/><text x='442.0' y='82.5' text-anchor='middle' font-size='10.5' font-weigh