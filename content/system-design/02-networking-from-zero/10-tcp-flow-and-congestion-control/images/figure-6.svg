<svg width='640' height='150' role='img' viewBox='0 0 640 150' xmlns='http://www.w3.org/2000/svg' font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"><title>Figure 6: TCP part 3, flow and congestion control</title><desc>A line graph of the congestion window: a dashed slow-start curve, then a sawtooth that rises slowly and halves at each loss, then a drop to one segment at a timeout and a new slow start.</desc><rect x='0' y='0' width='640' height='150' rx='16' fill='#fbfbf9' stroke='#e4e4de'/><defs><marker id='ar-blue' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#2f6fdb'/></marker><marker id='ar-green' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#178a5e'/></marker><marker id='ar-purple' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#6f52c9'/></marker><marker id='ar-orange' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#d0702c'/></marker><marker id='ar-pink' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#c43d6e'/></marker><marker id='ar-grey' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#6b7280'/></marker><marker id='ar-teal' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#0f7b6c'/></marker><marker id='ar-ink' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#5b6478'/></marker></defs><line x1='30' y1='130' x2='626' y2='130' stroke='#5b6478'/><line x1='30' y1='130' x2='30' y2='10' stroke='#5b6478'/><text x='36' y='18' text-anchor='start' font-size='9' font-weight='600' fill='#1f2a44'>congestion window</text><text x='620' y='144' text-anchor='end' font-size='9' font-weight='600' fill='#1f2a44'>time</text><path d='M32 128 L52 120 L72 104 L92 76 L112 30' fill='none' stroke='#6b7280' stroke-width='1.8' stroke-dasharray="4 3"/><path d='M112 30 L112 80 L220 50 L220 88 L330 58 L330 92 L430 64' fill='none' stroke='#d0702c' stroke-width='1.8'/><path d='M430 64 L430 128' fill='none' stroke='#c43d6e' stroke-width='1.8'/><path d='M430 128 L450 124 L470 114 L490 96 L510 76 L620 54' fill='none' stroke='#d0702c' stroke-width='1.8'/><text x='118' y='44' text-anchor='start' font-size='9.5' font-weight='700' fill='#c43d6e'>3 duplicate ACKs: cut in half</text><text x='240' y='44' text-anchor='start' font-size='9.5' font-weight='700' fill='#d0702c'>+1 segment per round trip</text><text x='438' y='60' text-anchor='start' font-size='9.5' font-weight='700' fill='#c43d6e'>timeout: back to 1</text><text x='50' y='146' text-anchor='start' font-size='9' font-weight='600' fill='#6b7280'>slow start</text></svg>