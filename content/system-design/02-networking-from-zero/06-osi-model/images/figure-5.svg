<svg width='640' height='124' role='img' viewBox='0 0 640 124' xmlns='http://www.w3.org/2000/svg' font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"><title>Figure 5: The OSI model</title><desc>Six boxes 3C, 22, FB, 9A, 10, 7E form a MAC address. Below, a frame bar: header 14 bytes, packet up to 1,500 bytes, check 4 bytes, 1,518 in total.</desc><rect x='0' y='0' width='640' height='124' rx='16' fill='#fbfbf9' stroke='#e4e4de'/><defs><marker id='ar-blue' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#2f6fdb'/></marker><marker id='ar-green' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#178a5e'/></marker><marker id='ar-purple' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#6f52c9'/></marker><marker id='ar-orange' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#d0702c'/></marker><marker id='ar-pink' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#c43d6e'/></marker><marker id='ar-grey' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#6b7280'/></marker><marker id='ar-teal' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#0f7b6c'/></marker><marker id='ar-ink' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#5b6478'/></marker></defs><rect x='14' y='14' width='32' height='24' rx='4' fill='#f1f2f4' stroke='#6b7280' stroke-width='1.4'/><text x='30.0' y='29.833333333333332' text-anchor='middle' font-size='11.5' font-weight='700' fill='#1f2a44'>3C</text><text x='50' y='31' text-anchor='start' font-size='12' font-weight='700' fill='#1f2a44'>:</text><rect x='54' y='14' width='32' height='24' rx='4' fill='#f1f2f4' stroke='#6b7280' stroke-width='1.4'/><text x='70.0' y='29.833333333333332' text-anchor='middle' font-size='11.5' font-weight='700' fill='#1f2a44'>22</text><text x='90' y='31' text-anchor='start' font-size='12' font-weight='700' fill='#1f2a44'>:</text><rect x='94' y='14' width='32' height='24' rx='4' fill='#f1f2f4' stroke='#6b7280' stroke-width='1.4'/><text x='110.0' y='29.833333333333332' text-anchor='middle' font-size='11.5' font-weight='700' fill='#1f2a44'>FB</text><text x='130' y='31' text-anchor='start' font-size='12' font-weight='700' fill='#1f2a44'>:</text><rect x='134' y='14' width='32' height='24' rx='4' fill='#f1f2f4' stroke='#6b7280' stroke-width='1.4'/><text x='150.0' y='29.833333333333332' text-anchor='middle' font-size='11.5' font-weight='700' fill='#1f2a44'>9A</text><text x='170' y='31' text-anchor='start' font-size='12' font-weight='700' fill='#1f2a44'>:</text><rect x='174' y='14' width='32' height='24' rx='4' fill='#f1f2f4' stroke='#6b7280' stroke-width='1.4'/><text x='190.0' y='29.833333333333332' text-anchor='middle' font-size='11.5' font-weight='700' fill='#1f2a44'>10</text><text x='210' y='31' text-anchor='start' font-size='12' font-weight='700' fill='#1f2a44'>:</text><rect x='214' y='14' width='32' height='24' rx='4' fill='#f1f2f4' stroke='#6b7280' stroke-width='1.4'/><text x='230.0' y='29.833333333333332' text-anchor='middle' font-size='11.5' font-weight='700' fill='#1f2a44'>7E</text><text x='262' y='24' text-anchor='start' font-size='10' font-weight='600' fill='#1f2a44'>a MAC address: 48 bits = 6 pairs of 8 bits,</text><text x='262' y='38' text-anchor='start' font-size='10' font-weight='600' fill='#1f2a44'>given to each network card by its maker</text><rect x='14' y='62' width='60' height='24' fill='#f1f2f4' stroke='#6b7280' stroke-width='1.3'/><text x='44.0' y='77.5' text-anchor='middle' font-size='9.8' font-weight='700' fill='#6b7280'>header 14</text><rect x='74' y='62' width='470' height='24' fill='#e2f4ec' stroke='#178a5e' stroke-width='1.3'/><text x='309.0' y='77.5' text-anchor='middle' font-size='9.8' font-weight='700' fill='#178a5e'>packet: up to 1,500 bytes</text><rect x='544' y='62' width='70' height='24' fill='#f1f2f4' stroke='#6b7280' stroke-width='1.3'/><text x='579.0' y='77.5' text-anchor='middle' font-size='9.8' font-weight='700' fill='#6b7280'>check 4</text><text x='14' y='108' text-anchor='start' font-size='10.2' font-weight='400' fill='#5b6478' font-style='italic'>The largest normal Ethernet frame: 14 + 1,500 + 4 = 1,518 bytes (a VLAN tag adds 4 more).</text></svg>