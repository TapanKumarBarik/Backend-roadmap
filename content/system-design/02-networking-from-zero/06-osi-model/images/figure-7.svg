<svg width='640' height='160' role='img' viewBox='0 0 640 160' xmlns='http://www.w3.org/2000/svg' font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"><title>Figure 7: The OSI model</title><desc>Five checks stacked from the bottom: layer 1 cable or Wi-Fi on, ticked; layer 2 right network, ticked; layer 3 got an IP address, crossed, with 169.254.x.x meaning no address; layer 4 firewall and layer 7 site error, unchecked.</desc><rect x='0' y='0' width='640' height='160' rx='16' fill='#fbfbf9' stroke='#e4e4de'/><defs><marker id='ar-blue' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#2f6fdb'/></marker><marker id='ar-green' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#178a5e'/></marker><marker id='ar-purple' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#6f52c9'/></marker><marker id='ar-orange' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#d0702c'/></marker><marker id='ar-pink' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#c43d6e'/></marker><marker id='ar-grey' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#6b7280'/></marker><marker id='ar-teal' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#0f7b6c'/></marker><marker id='ar-ink' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#5b6478'/></marker></defs><rect x='14' y='130' width='380' height='20' rx='5' fill='#f1f2f4' stroke='#6b7280' stroke-width='1.4'/><circle cx='26' cy='140.0' r='8' fill='#fff' stroke='#6b7280' stroke-width='1.3'/><text x='26' y='143.6' text-anchor='middle' font-size='9.5' font-weight='700' fill='#6b7280'>1</text><text x='40' y='143.8' text-anchor='start' font-size='10' font-weight='700' fill='#6b7280'>cable plugged in? Wi-Fi on?</text><text x='404' y='144' text-anchor='start' font-size='12' font-weight='700' fill='#178a5e'>✓</text><rect x='14' y='105' width='380' height='20' rx='5' fill='#f1f2f4' stroke='#6b7280' stroke-width='1.4'/><circle cx='26' cy='115.0' r='8' fill='#fff' stroke='#6b7280' stroke-width='1.3'/><text x='26' y='118.6' text-anchor='middle' font-size='9.5' font-weight='700' fill='#6b7280'>2</text><text x='40' y='118.8' text-anchor='start' font-size='10' font-weight='700' fill='#6b7280'>joined the right network?</text><text x='404' y='119' text-anchor='start' font-size='12' font-weight='700' fill='#178a5e'>✓</text><rect x='14' y='80' width='380' height='20' rx='5' fill='#e2f4ec' stroke='#178a5e' stroke-width='1.4'/><circle cx='26' cy='90.0' r='8' fill='#fff' stroke='#178a5e' stroke-width='1.3'/><text x='26' y='93.6' text-anchor='middle' font-size='9.5' font-weight='700' fill='#178a5e'>3</text><text x='40' y='93.8' text-anchor='start' font-size='10' font-weight='700' fill='#178a5e'>got an IP address? (169.254.x.x = no)</text><text x='404' y='94' text-anchor='start' font-size='12' font-weight='700' fill='#c43d6e'>✗</text><rect x='14' y='55' width='380' height='20' rx='5' fill='#fcefe4' stroke='#d0702c' stroke-width='1.4'/><circle cx='26' cy='65.0' r='8' fill='#fff' stroke='#d0702c' stroke-width='1.3'/><text x='26' y='68.6' text-anchor='middle' font-size='9.5' font-weight='700' fill='#d0702c'>4</text><text x='40' y='68.8' text-anchor='start' font-size='10' font-weight='700' fill='#d0702c'>a firewall blocking the port?</text><text x='404' y='69' text-anchor='start' font-size='12' font-weight='700' fill='#1f2a44'>?</text><rect x='14' y='30' width='380' height='20' rx='5' fill='#e6eefc' stroke='#2f6fdb' stroke-width='1.4'/><circle cx='26' cy='40.0' r='8' fill='#fff' stroke='#2f6fdb' stroke-width='1.3'/><text x='26' y='43.6' text-anchor='middle' font-size='9.5' font-weight='700' fill='#2f6fdb'>7</text><text x='40' y='43.8' text-anchor='start' font-size='10' font-weight='700' fill='#2f6fdb'>does the site return an error, like 500?</text><text x='404' y='44' text-anchor='start' font-size='12' font-weight='700' fill='#1f2a44'>?</text><text x='430' y='80' text-anchor='start' font-size='10.5' font-weight='700' fill='#c43d6e'>The first layer that fails</text><text x='430' y='94' text-anchor='start' font-size='10.5' font-weight='700' fill='#c43d6e'>is your problem; everything</text><text x='430' y='108' text-anchor='start' font-size='10.5' font-weight='700' fill='#c43d6e'>above it fails too.</text><text x='14' y='16' text-anchor='start' font-size='10.5' font-weight='700' fill='#1f2a44'>“Connected, no internet”: check from the bottom up.</text></svg>