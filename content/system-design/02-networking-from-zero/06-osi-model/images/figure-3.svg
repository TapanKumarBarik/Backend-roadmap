<svg width='640' height='214' role='img' viewBox='0 0 640 214' xmlns='http://www.w3.org/2000/svg' font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"><title>Figure 3: The OSI model</title><desc>Left: the seven OSI layers. Right: the four TCP/IP layers, with dashed lines showing OSI 5, 6 and 7 joining into application, 4 into transport, 3 into network, and 2 and 1 into link.</desc><rect x='0' y='0' width='640' height='214' rx='16' fill='#fbfbf9' stroke='#e4e4de'/><defs><marker id='ar-blue' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#2f6fdb'/></marker><marker id='ar-green' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#178a5e'/></marker><marker id='ar-purple' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#6f52c9'/></marker><marker id='ar-orange' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#d0702c'/></marker><marker id='ar-pink' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#c43d6e'/></marker><marker id='ar-grey' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#6b7280'/></marker><marker id='ar-teal' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#0f7b6c'/></marker><marker id='ar-ink' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#5b6478'/></marker></defs><text x='14' y='14' text-anchor='start' font-size='10.5' font-weight='700' fill='#d0702c'>OSI: a map with 7</text><text x='400' y='14' text-anchor='start' font-size='10.5' font-weight='700' fill='#178a5e'>The real internet: TCP/IP, 4</text><rect x='14' y='22' width='220' height='20' rx='5' fill='#e6eefc' stroke='#2f6fdb' stroke-width='1.4'/><circle cx='26' cy='32.0' r='8' fill='#fff' stroke='#2f6fdb' stroke-width='1.3'/><text x='26' y='35.6' text-anchor='middle' font-size='9.5' font-weight='700' fill='#2f6fdb'>7</text><text x='40' y='35.8' text-anchor='start' font-size='10' font-weight='700' fill='#2f6fdb'>Application</text><rect x='14' y='46' width='220' height='20' rx='5' fill='#e6eefc' stroke='#2f6fdb' stroke-width='1.4'/><circle cx='26' cy='56.0' r='8' fill='#fff' stroke='#2f6fdb' stroke-width='1.3'/><text x='26' y='59.6' text-anchor='middle' font-size='9.5' font-weight='700' fill='#2f6fdb'>6</text><text x='40' y='59.8' text-anchor='start' font-size='10' font-weight='700' fill='#2f6fdb'>Presentation</text><rect x='14' y='70' width='220' height='20' rx='5' fill='#e6eefc' stroke='#2f6fdb' stroke-width='1.4'/><circle cx='26' cy='80.0' r='8' fill='#fff' stroke='#2f6fdb' stroke-width='1.3'/><text x='26' y='83.6' text-anchor='middle' font-size='9.5' font-weight='700' fill='#2f6fdb'>5</text><text x='40' y='83.8' text-anchor='start' font-size='10' font-weight='700' fill='#2f6fdb'>Session</text><rect x='14' y='94' width='220' height='20' rx='5' fill='#fcefe4' stroke='#d0702c' stroke-width='1.4'/><circle cx='26' cy='104.0' r='8' fill='#fff' stroke='#d0702c' stroke-width='1.3'/><text x='26' y='107.6' text-anchor='middle' font-size='9.5' font-weight='700' fill='#d0702c'>4</text><text x='40' y='107.8' text-anchor='start' font-size='10' font-weight='700' fill='#d0702c'>Transport</text><rect x='14' y='118' width='220' height='20' rx='5' fill='#e2f4ec' stroke='#178a5e' stroke-width='1.4'/><circle cx='26' cy='128.0' r='8' fill='#fff' stroke='#178a5e' stroke-width='1.3'/><text x='26' y='131.6' text-anchor='middle' font-size='9.5' font-weight='700' fill='#178a5e'>3</text><text x='40' y='131.8' text-anchor='start' font-size='10' font-weight='700' fill='#178a5e'>Network</text><rect x='14' y='142' width='220' height='20' rx='5' fill='#f1f2f4' stroke='#6b7280' stroke-width='1.4'/><circle cx='26' cy='152.0' r='8' fill='#fff' stroke='#6b7280' stroke-width='1.3'/><text x='26' y='155.6' text-anchor='middle' font-size='9.5' font-weight='700' fill='#6b7280'>2</text><text x='40' y='155.8' text-anchor='start' font-size='10' font-weight='700' fill='#6b7280'>Data link</text><rect x='14' y='166' width='220' height='20' rx='5' fill='#f1f2f4' stroke='#6b7280' stroke-width='1.4'/><circle cx='26' cy='176.0' r='8' fill='#fff' stroke='#6b7280' stroke-width='1.3'/><text x='26' y='179.6' text-anchor='middle' font-size='9.5' font-weight='700' fill='#6b7280'>1</text><text x='40' y='179.8' text-anchor='start' font-size='10' font-weight='700' fill='#6b7280'>Physical</text><rect x='400' y='22' width='226' height='68' rx='6' fill='#e6eefc' stroke='#2f6fdb' stroke-width='1.5'/><text x='410' y='60.0' text-anchor='start' font-size='10.5' font-weight='700' fill='#2f6fdb'>Application</text><text x='616' y='60.0' text-anchor='end' font-size='9.5' font-weight='600' fill='#2f6fdb'>HTTP, DNS, TLS</text><path d='M236 24 L396 24 M236 88 L396 88' fill='none' stroke='#2f6fdb' stroke-width='1' stroke-dasharray='5 4'/><rect x='400' y='94' width='226' height='20' rx='6' fill='#fcefe4' stroke='#d0702c' stroke-width='1.5'/><text x='410' y='108.0' text-anchor='start' font-size='10.5' font-weight='700' fill='#d0702c'>Transport</text><text x='616' y='108.0' text-anchor='end' font-size='9.5' font-weight='600' fill='#d0702c'>TCP, UDP</text><path d='M236 96 L396 96 M236 112 L396 112' fill='none' stroke='#d0702c' stroke-width='1' stroke-dasharray='5 4'/><rect x='400' y='118' width='226' height='20' rx='6' fill='#e2f4ec' stroke='#178a5e' stroke-width='1.5'/><text x='410' y='132.0' text-anchor='start' font-size='10.5' font-weight='700' fill='#178a5e'>Network</text><text x='616' y='132.0' text-anchor='end' font-size='9.5' font-weight='600' fill='#178a5e'>IP</text><path d='M236 120 L396 120 M236 136 L396 136' fill='none' stroke='#178a5e' stroke-width='1' stroke-dasharray='5 4'/><rect x='400' y='142' width='226' height='44' rx='6' fill='#f1f2f4' stroke='#6b7280' stroke-width='1.5'/><text x='410' y='168.0' text-anchor='start' font-size='10.5' font-weight='700' fill='#6b7280'>Link</text><text x='616' y='168.0' text-anchor='end' font-size='9.5' font-weight='600' fill='#6b7280'>Ethernet, Wi-Fi</text><path d='M236 144 L396 144 M236 184 L396 184' fill='none' stroke='#6b7280' stroke-width='1' stroke-dasharray='5 4'/><text x='14' y='206' text-anchor='start' font-size='10' font-weight='400' fill='#5b6478' font-style='italic'>OSI 5-7 = application layer, 4 = transport, 3 = network, 1-2 = link. TLS does layer 6&#x27;s job (encryption), inside the app.</text></svg>