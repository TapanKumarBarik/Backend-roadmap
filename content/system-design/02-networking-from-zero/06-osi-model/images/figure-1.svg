<svg width='640' height='208' role='img' viewBox='0 0 640 208' xmlns='http://www.w3.org/2000/svg' font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"><title>Figure 1: The OSI model</title><desc>Seven purple rows, director, translator, assistant, shipping desk, post office, local driver and the road, each with its job, mapped by arrows onto the seven OSI layers from 7 application down to 1 physical.</desc><rect x='0' y='0' width='640' height='208' rx='16' fill='#fbfbf9' stroke='#e4e4de'/><defs><marker id='ar-blue' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#2f6fdb'/></marker><marker id='ar-green' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#178a5e'/></marker><marker id='ar-purple' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#6f52c9'/></marker><marker id='ar-orange' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#d0702c'/></marker><marker id='ar-pink' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#c43d6e'/></marker><marker id='ar-grey' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#6b7280'/></marker><marker id='ar-teal' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#0f7b6c'/></marker><marker id='ar-ink' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#5b6478'/></marker></defs><text x='14' y='16' text-anchor='start' font-size='11' font-weight='700' fill='#6f52c9'>A contract, Mumbai to Berlin: seven people, one job each</text><rect x='14' y='24' width='330' height='20' rx='5' fill='#eee9fb' stroke='#6f52c9' stroke-width='1.1'/><text x='22' y='38' text-anchor='start' font-size='10' font-weight='700' fill='#6f52c9'>director</text><text x='112' y='38' text-anchor='start' font-size='9.5' font-weight='600' fill='#6f52c9'>decides what to say: the message</text><line x1='348' y1='34' x2='398' y2='34' stroke='#6f52c9' stroke-width='1.5' marker-end='url(#ar-purple)'/><rect x='402' y='24' width='224' height='20' rx='5' fill='#e6eefc' stroke='#2f6fdb' stroke-width='1.4'/><circle cx='414' cy='34.0' r='8' fill='#fff' stroke='#2f6fdb' stroke-width='1.3'/><text x='414' y='37.6' text-anchor='middle' font-size='9.5' font-weight='700' fill='#2f6fdb'>7</text><text x='428' y='37.8' text-anchor='start' font-size='10' font-weight='700' fill='#2f6fdb'>Application</text><rect x='14' y='48' width='330' height='20' rx='5' fill='#eee9fb' stroke='#6f52c9' stroke-width='1.1'/><text x='22' y='62' text-anchor='start' font-size='10' font-weight='700' fill='#6f52c9'>translator</text><text x='112' y='62' text-anchor='start' font-size='9.5' font-weight='600' fill='#6f52c9'>turns it into German, and seals it</text><line x1='348' y1='58' x2='398' y2='58' stroke='#6f52c9' stroke-width='1.5' marker-end='url(#ar-purple)'/><rect x='402' y='48' width='224' height='20' rx='5' fill='#e6eefc' stroke='#2f6fdb' stroke-width='1.4'/><circle cx='414' cy='58.0' r='8' fill='#fff' stroke='#2f6fdb' stroke-width='1.3'/><text x='414' y='61.6' text-anchor='middle' font-size='9.5' font-weight='700' fill='#2f6fdb'>6</text><text x='428' y='61.8' text-anchor='start' font-size='10' font-weight='700' fill='#2f6fdb'>Presentation</text><rect x='14' y='72' width='330' height='20' rx='5' fill='#eee9fb' stroke='#6f52c9' stroke-width='1.1'/><text x='22' y='86' text-anchor='start' font-size='10' font-weight='700' fill='#6f52c9'>assistant</text><text x='112' y='86' text-anchor='start' font-size='9.5' font-weight='600' fill='#6f52c9'>keeps track of which conversation</text><line x1='348' y1='82' x2='398' y2='82' stroke='#6f52c9' stroke-width='1.5' marker-end='url(#ar-purple)'/><rect x='402' y='72' width='224' height='20' rx='5' fill='#e6eefc' stroke='#2f6fdb' stroke-width='1.4'/><circle cx='414' cy='82.0' r='8' fill='#fff' stroke='#2f6fdb' stroke-width='1.3'/><text x='414' y='85.6' text-anchor='middle' font-size='9.5' font-weight='700' fill='#2f6fdb'>5</text><text x='428' y='85.8' text-anchor='start' font-size='10' font-weight='700' fill='#2f6fdb'>Session</text><rect x='14' y='96' width='330' height='20' rx='5' fill='#eee9fb' stroke='#6f52c9' stroke-width='1.1'/><text x='22' y='110' text-anchor='start' font-size='10' font-weight='700' fill='#6f52c9'>shipping desk</text><text x='112' y='110' text-anchor='start' font-size='9.5' font-weight='600' fill='#6f52c9'>numbered parcels; checks each arrives</text><line x1='348' y1='106' x2='398' y2='106' stroke='#6f52c9' stroke-width='1.5' marker-end='url(#ar-purple)'/><rect x='402' y='96' width='224' height='20' rx='5' fill='#fcefe4' stroke='#d0702c' stroke-width='1.4'/><circle cx='414' cy='106.0' r='8' fill='#fff' stroke='#d0702c' stroke-width='1.3'/><text x='414' y='109.6' text-anchor='middle' font-size='9.5' font-weight='700' fill='#d0702c'>4</text><text x='428' y='109.8' text-anchor='start' font-size='10' font-weight='700' fill='#d0702c'>Transport</text><rect x='14' y='120' width='330' height='20' rx='5' fill='#eee9fb' stroke='#6f52c9' stroke-width='1.1'/><text x='22' y='134' text-anchor='start' font-size='10' font-weight='700' fill='#6f52c9'>post office</text><text x='112' y='134' text-anchor='start' font-size='9.5' font-weight='600' fill='#6f52c9'>writes the city address</text><line x1='348' y1='130' x2='398' y2='130' stroke='#6f52c9' stroke-width='1.5' marker-end='url(#ar-purple)'/><rect x='402' y='120' width='224' height='20' rx='5' fill='#e2f4ec' stroke='#178a5e' stroke-width='1.4'/><circle cx='414' cy='130.0' r='8' fill='#fff' stroke='#178a5e' stroke-width='1.3'/><text x='414' y='133.6' text-anchor='middle' font-size='9.5' font-weight='700' fill='#178a5e'>3</text><text x='428' y='133.8' text-anchor='start' font-size='10' font-weight='700' fill='#178a5e'>Network</text><rect x='14' y='144' width='330' height='20' rx='5' fill='#eee9fb' stroke='#6f52c9' stroke-width='1.1'/><text x='22' y='158' text-anchor='start' font-size='10' font-weight='700' fill='#6f52c9'>local driver</text><text x='112' y='158' text-anchor='start' font-size='9.5' font-weight='600' fill='#6f52c9'>takes it to the next depot</text><line x1='348' y1='154' x2='398' y2='154' stroke='#6f52c9' stroke-width='1.5' marker-end='url(#ar-purple)'/><rect x='402' y='144' width='224' height='20' rx='5' fill='#f1f2f4' stroke='#6b7280' stroke-width='1.4'/><circle cx='414' cy='154.0' r='8' fill='#fff' stroke='#6b7280' stroke-width='1.3'/><text x='414' y='157.6' text-anchor='middle' font-size='9.5' font-weight='700' fill='#6b7280'>2</text><text x='428' y='157.8' text-anchor='start' font-size='10' font-weight='700' fill='#6b7280'>Data link</text><rect x='14' y='168' width='330' height='20' rx='5' fill='#eee9fb' stroke='#6f52c9' stroke-width='1.1'/><text x='22' y='182' text-anchor='start' font-size='10' font-weight='700' fill='#6f52c9'>the road</text><text x='112' y='182' text-anchor='start' font-size='9.5' font-weight='600' fill='#6f52c9'>carries the truck</text><line x1='348' y1='178' x2='398' y2='178' stroke='#6f52c9' stroke-width='1.5' marker-end='url(#ar-purple)'/><rect x='402' y='168' width='224' height='20' rx='5' fill='#f1f2f4' stroke='#6b7280' stroke-width='1.4'/><circle cx='414' cy='178.0' r='8' fill='#fff' stroke='#6b7280' stroke-width='1.3'/><text x='414' y='181.6' text-anchor='middle' font-size='9.5' font-weight='700' fill='#6b7280'>1</text><text x='428' y='181.8' text-anchor='start' font-size='10' font-weight='700' fill='#6b7280'>Physical</text><text x='14' y='202' text-anchor='start' font-size='10' font-weight='400' fill='#5b6478' font-style='italic'>Each person reads only their own part, from the top down at Mumbai and from the bottom up at Berlin.</text></svg>