<svg width='640' height='166' role='img' viewBox='0 0 640 166' xmlns='http://www.w3.org/2000/svg' font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"><title>Figure 6: The OSI model</title><desc>Left, orange: a layer 4 load balancer sees only IP addresses and ports; fast, but it can&#x27;t read the request. Right, blue: a layer 7 load balancer reads the path and sends /api to one server group and /images to another.</desc><rect x='0' y='0' width='640' height='166' rx='16' fill='#fbfbf9' stroke='#e4e4de'/><defs><marker id='ar-blue' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#2f6fdb'/></marker><marker id='ar-green' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#178a5e'/></marker><marker id='ar-purple' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#6f52c9'/></marker><marker id='ar-orange' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#d0702c'/></marker><marker id='ar-pink' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#c43d6e'/></marker><marker id='ar-grey' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#6b7280'/></marker><marker id='ar-teal' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#0f7b6c'/></marker><marker id='ar-ink' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#5b6478'/></marker></defs><rect x='10' y='10' width='300' height='128' rx='9' fill='#fcefe4' fill-opacity='0.45' stroke='#d0702c' stroke-opacity='0.5' stroke-dasharray='4 4'/><text x='20' y='26' font-size='10' font-weight='700' letter-spacing='0.06em' fill='#d0702c'>LAYER 4 LOAD BALANCER</text><text x='24' y='48' text-anchor='start' font-size='10.5' font-weight='700' fill='#d0702c'>Sees only: IP addresses and ports</text><text x='24' y='66' text-anchor='start' font-size='10' font-weight='600' fill='#1f2a44'>203.0.113.7:51234 → 198.51.100.10:443</text><text x='24' y='92' text-anchor='start' font-size='10.5' font-weight='700' fill='#178a5e'>✓ fast and simple</text><text x='24' y='110' text-anchor='start' font-size='10.5' font-weight='700' fill='#c43d6e'>✗ can&#x27;t read the request</text><rect x='330' y='10' width='300' height='128' rx='9' fill='#e6eefc' fill-opacity='0.45' stroke='#2f6fdb' stroke-opacity='0.5' stroke-dasharray='4 4'/><text x='340' y='26' font-size='10' font-weight='700' letter-spacing='0.06em' fill='#2f6fdb'>LAYER 7 LOAD BALANCER</text><text x='344' y='48' text-anchor='start' font-size='10.5' font-weight='700' fill='#2f6fdb'>Reads HTTP: the path, headers, cookies</text><rect x='344' y='62' width='96' height='30' rx='7' fill='#e6eefc' stroke='#2f6fdb' stroke-width='1.6'/><text x='392.0' y='80.5' text-anchor='middle' font-size='10.5' font-weight='600' fill='#1f2a44'>layer 7 LB</text><rect x='530' y='50' width='90' height='24' rx='7' fill='#e2f4ec' stroke='#178a5e' stroke-width='1.6'/><text x='575.0' y='65.16666666666667' text-anchor='middle' font-size='9.5' font-weight='600' fill='#1f2a44'>/api servers</text><rect x='530' y='90' width='90' height='24' rx='7' fill='#e2f4ec' stroke='#178a5e' stroke-width='1.6'/><text x='575.0' y='105.16666666666667' text-anchor='middle' font-size='9.5' font-weight='600' fill='#1f2a44'>/images servers</text><line x1='442' y1='72' x2='526' y2='62' stroke='#2f6fdb' stroke-width='1.5' marker-end='url(#ar-blue)'/><line x1='442' y1='82' x2='526' y2='102' stroke='#2f6fdb' stroke-width='1.5' marker-end='url(#ar-blue)'/><text x='344' y='124' text-anchor='start' font-size='9.6' font-weight='600' fill='#1f2a44'>more work (and with HTTPS it must decrypt), but smarter</text><text x='14' y='158' text-anchor='start' font-size='10.2' font-weight='400' fill='#5b6478' font-style='italic'>Routing /api and /images to different servers needs the path, which is inside the HTTP request: layer 7.</text></svg>