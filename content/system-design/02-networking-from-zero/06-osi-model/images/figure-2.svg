<svg width='640' height='214' role='img' viewBox='0 0 640 214' xmlns='http://www.w3.org/2000/svg' font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"><title>Figure 2: The OSI model</title><desc>Seven stacked rows: 7 application (HTTP, DNS), 6 presentation (format, encryption), 5 session (the conversation), 4 transport (TCP, UDP), 3 network (IP), 2 data link (Ethernet, Wi-Fi, MAC), 1 physical (cables, radio, bits). Tags: switch at 2, router at 3, layer 4 load balancer at 4, layer 7 load balancer at 7.</desc><rect x='0' y='0' width='640' height='214' rx='16' fill='#fbfbf9' stroke='#e4e4de'/><defs><marker id='ar-blue' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#2f6fdb'/></marker><marker id='ar-green' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#178a5e'/></marker><marker id='ar-purple' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#6f52c9'/></marker><marker id='ar-orange' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#d0702c'/></marker><marker id='ar-pink' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#c43d6e'/></marker><marker id='ar-grey' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#6b7280'/></marker><marker id='ar-teal' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#0f7b6c'/></marker><marker id='ar-ink' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#5b6478'/></marker></defs><rect x='14' y='12' width='380' height='22' rx='5' fill='#e6eefc' stroke='#2f6fdb' stroke-width='1.4'/><circle cx='26' cy='23.0' r='8' fill='#fff' stroke='#2f6fdb' stroke-width='1.3'/><text x='26' y='26.6' text-anchor='middle' font-size='9.5' font-weight='700' fill='#2f6fdb'>7</text><text x='40' y='26.8' text-anchor='start' font-size='10.5' font-weight='700' fill='#2f6fdb'>Application</text><text x='386' y='26.6' text-anchor='end' font-size='9.0' font-weight='600' fill='#2f6fdb'>HTTP, DNS</text><rect x='404' y='14' width='201.33999999999997' height='18' rx='4' fill='#e6eefc' stroke='#2f6fdb' stroke-width='1.2'/><text x='504.66999999999996' y='26.6' text-anchor='middle' font-size='9.5' font-weight='700' fill='#2f6fdb'>layer 7 load balancer, API gateway</text><rect x='14' y='38' width='380' height='22' rx='5' fill='#e6eefc' stroke='#2f6fdb' stroke-width='1.4'/><circle cx='26' cy='49.0' r='8' fill='#fff' stroke='#2f6fdb' stroke-width='1.3'/><text x='26' y='52.6' text-anchor='middle' font-size='9.5' font-weight='700' fill='#2f6fdb'>6</text><text x='40' y='52.8' text-anchor='start' font-size='10.5' font-weight='700' fill='#2f6fdb'>Presentation</text><text x='386' y='52.6' text-anchor='end' font-size='9.0' font-weight='600' fill='#2f6fdb'>format, encryption</text><rect x='14' y='64' width='380' height='22' rx='5' fill='#e6eefc' stroke='#2f6fdb' stroke-width='1.4'/><circle cx='26' cy='75.0' r='8' fill='#fff' stroke='#2f6fdb' stroke-width='1.3'/><text x='26' y='78.6' text-anchor='middle' font-size='9.5' font-weight='700' fill='#2f6fdb'>5</text><text x='40' y='78.8' text-anchor='start' font-size='10.5' font-weight='700' fill='#2f6fdb'>Session</text><text x='386' y='78.6' text-anchor='end' font-size='9.0' font-weight='600' fill='#2f6fdb'>the conversation</text><rect x='14' y='90' width='380' height='22' rx='5' fill='#fcefe4' stroke='#d0702c' stroke-width='1.4'/><circle cx='26' cy='101.0' r='8' fill='#fff' stroke='#d0702c' stroke-width='1.3'/><text x='26' y='104.6' text-anchor='middle' font-size='9.5' font-weight='700' fill='#d0702c'>4</text><text x='40' y='104.8' text-anchor='start' font-size='10.5' font-weight='700' fill='#d0702c'>Transport</text><text x='386' y='104.6' text-anchor='end' font-size='9.0' font-weight='600' fill='#d0702c'>TCP, UDP</text><rect x='404' y='92' width='129.70999999999998' height='18' rx='4' fill='#fcefe4' stroke='#d0702c' stroke-width='1.2'/><text x='468.855' y='104.6' text-anchor='middle' font-size='9.5' font-weight='700' fill='#d0702c'>layer 4 load balancer</text><rect x='14' y='116' width='380' height='22' rx='5' fill='#e2f4ec' stroke='#178a5e' stroke-width='1.4'/><circle cx='26' cy='127.0' r='8' fill='#fff' stroke='#178a5e' stroke-width='1.3'/><text x='26' y='130.6' text-anchor='middle' font-size='9.5' font-weight='700' fill='#178a5e'>3</text><text x='40' y='130.8' text-anchor='start' font-size='10.5' font-weight='700' fill='#178a5e'>Network</text><text x='386' y='130.6' text-anchor='end' font-size='9.0' font-weight='600' fill='#178a5e'>IP</text><rect x='404' y='118' width='47.059999999999995' height='18' rx='4' fill='#e2f4ec' stroke='#178a5e' stroke-width='1.2'/><text x='427.53' y='130.6' text-anchor='middle' font-size='9.5' font-weight='700' fill='#178a5e'>router</text><rect x='14' y='142' width='380' height='22' rx='5' fill='#f1f2f4' stroke='#6b7280' stroke-width='1.4'/><circle cx='26' cy='153.0' r='8' fill='#fff' stroke='#6b7280' stroke-width='1.3'/><text x='26' y='156.6' text-anchor='middle' font-size='9.5' font-weight='700' fill='#6b7280'>2</text><text x='40' y='156.8' text-anchor='start' font-size='10.5' font-weight='700' fill='#6b7280'>Data link</text><text x='386' y='156.6' text-anchor='end' font-size='9.0' font-weight='600' fill='#6b7280'>Ethernet, Wi-Fi, MAC</text><rect x='404' y='144' width='47.059999999999995' height='18' rx='4' fill='#f1f2f4' stroke='#6b7280' stroke-width='1.2'/><text x='427.53' y='156.6' text-anchor='middle' font-size='9.5' font-weight='700' fill='#6b7280'>switch</text><rect x='14' y='168' width='380' height='22' rx='5' fill='#f1f2f4' stroke='#6b7280' stroke-width='1.4'/><circle cx='26' cy='179.0' r='8' fill='#fff' stroke='#6b7280' stroke-width='1.3'/><text x='26' y='182.6' text-anchor='middle' font-size='9.5' font-weight='700' fill='#6b7280'>1</text><text x='40' y='182.8' text-anchor='start' font-size='10.5' font-weight='700' fill='#6b7280'>Physical</text><text x='386' y='182.6' text-anchor='end' font-size='9.0' font-weight='600' fill='#6b7280'>cables, radio, bits</text><text x='14' y='204' text-anchor='start' font-size='10' font-weight='400' fill='#5b6478' font-style='italic'>Remember 1 to 7: Please Do Not Throw Sausage Pizza Away. Note: layer 7 is HTTP, not the app (Chrome) itself.</text></svg>