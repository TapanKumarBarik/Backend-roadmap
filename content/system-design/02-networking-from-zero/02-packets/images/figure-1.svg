<svg width='640' height='150' role='img' viewBox='0 0 640 150' xmlns='http://www.w3.org/2000/svg' font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"><title>Figure 1: packets</title><desc>A 3 MB photo is cut into four numbered packets, each with an orange header in front of a blue payload. They cross the network on different roads and arrive in the order 2, 1, 4, 3. The receiver sorts them by number and rebuilds the photo.</desc><rect x='0' y='0' width='640' height='150' rx='16' fill='#fbfbf9' stroke='#e4e4de'/><defs><marker id='ar-blue' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#2f6fdb'/></marker><marker id='ar-green' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#178a5e'/></marker><marker id='ar-purple' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#6f52c9'/></marker><marker id='ar-orange' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#d0702c'/></marker><marker id='ar-pink' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#c43d6e'/></marker><marker id='ar-grey' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#6b7280'/></marker><marker id='ar-teal' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#0f7b6c'/></marker><marker id='ar-ink' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#5b6478'/></marker></defs><rect x='10' y='46' width='96' height='56' rx='7' fill='#e6eefc' stroke='#2f6fdb' stroke-width='1.6'/><text x='58.0' y='72.0' text-anchor='middle' font-size='13' font-weight='600' fill='#1f2a44'>Photo</text><text x='58.0' y='87.0' text-anchor='middle' font-size='10.5' fill='#5b6478'>3 MB</text><rect x='138' y='22' width='22' height='20' rx='3' fill='#fcefe4' stroke='#d0702c' stroke-width='1.3'/><text x='149' y='36' text-anchor='middle' font-size='9' font-weight='700' fill='#d0702c'>#1</text><rect x='160' y='22' width='46' height='20' rx='3' fill='#e6eefc' stroke='#2f6fdb' stroke-width='1.3'/><rect x='138' y='50' width='22' height='20' rx='3' fill='#fcefe4' stroke='#d0702c' stroke-width='1.3'/><text x='149' y='64' text-anchor='middle' font-size='9' font-weight='700' fill='#d0702c'>#2</text><rect x='160' y='50' width='46' height='20' rx='3' fill='#e6eefc' stroke='#2f6fdb' stroke-width='1.3'/><rect x='138' y='78' width='22' height='20' rx='3' fill='#fcefe4' stroke='#d0702c' stroke-width='1.3'/><text x='149' y='92' text-anchor='middle' font-size='9' font-weight='700' fill='#d0702c'>#3</text><rect x='160' y='78' width='46' height='20' rx='3' fill='#e6eefc' stroke='#2f6fdb' stroke-width='1.3'/><rect x='138' y='106' width='22' height='20' rx='3' fill='#fcefe4' stroke='#d0702c' stroke-width='1.3'/><text x='149' y='120' text-anchor='middle' font-size='9' font-weight='700' fill='#d0702c'>#4</text><rect x='160' y='106' width='46' height='20' rx='3' fill='#e6eefc' stroke='#2f6fdb' stroke-width='1.3'/><line x1='108' y1='74' x2='134' y2='74' stroke='#5b6478' stroke-width='1.5' marker-end='url(#ar-ink)'/><rect x='232' y='8' width='220' height='122' rx='9' fill='#f1f2f4' fill-opacity='0.45' stroke='#6b7280' stroke-opacity='0.5' stroke-dasharray='4 4'/><text x='342' y='124' text-anchor='middle' font-size='10' font-weight='700' fill='#6b7280'>THE NETWORK</text><path d='M210 40 C 280 20, 380 20, 456 52' fill='none' stroke='#2f6fdb' stroke-width='1.5' marker-end='url(#ar-blue)' stroke-dasharray='5 4'/><path d='M210 104 C 280 124, 380 124, 456 92' fill='none' stroke='#2f6fdb' stroke-width='1.5' marker-end='url(#ar-blue)' stroke-dasharray='5 4'/><text x='342' y='60' text-anchor='middle' font-size='10' font-weight='600' fill='#1f2a44'>each packet travels on its own;</text><text x='342' y='74' text-anchor='middle' font-size='10' font-weight='600' fill='#1f2a44'>some take a longer road</text><rect x='466' y='22' width='26' height='22' rx='4' fill='#e6eefc' stroke='#2f6fdb' stroke-width='1.4'/><text x='479.0' y='36.5' text-anchor='middle' font-size='10.5' font-weight='700' fill='#1f2a44'>2</text><rect x='466' y='50' width='26' height='22' rx='4' fill='#e6eefc' stroke='#2f6fdb' stroke-width='1.4'/><text x='479.0' y='64.5' text-anchor='middle' font-size='10.5' font-weight='700' fill='#1f2a44'>1</text><rect x='466' y='78' width='26' height='22' rx='4' fill='#e6eefc' stroke='#2f6fdb' stroke-width='1.4'/><text x='479.0' y='92.5' text-anchor='middle' font-size='10.5' font-weight='700' fill='#1f2a44'>4</text><rect x='466' y='106' width='26' height='22' rx='4' fill='#e6eefc' stroke='#2f6fdb' stroke-width='1.4'/><text x='479.0' y='120.5' text-anchor='middle' font-size='10.5' font-weight='700' fill='#1f2a44'>3</text><line x1='500' y1='74' x2='524' y2='74' stroke='#5b6478' stroke-width='1.5' marker-end='url(#ar-ink)'/><rect x='530' y='46' width='100' height='56' rx='7' fill='#e2f4ec' stroke='#178a5e' stroke-width='1.6'/><text x='580.0' y='72.0' text-anchor='middle' font-size='12' font-weight='600' fill='#1f2a44'>Photo again</text><text x='580.0' y='87.0' text-anchor='middle' font-size='10.5' fill='#5b6478'>sorted by number</text><text x='10' y='144' text-anchor='start' font-size='10.5' font-weight='700' fill='#d0702c'>1 cut  ·  2 label (header in front)  ·  3 send  ·  4 reassemble</text></svg>