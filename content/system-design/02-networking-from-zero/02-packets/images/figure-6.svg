<svg width='640' height='96' role='img' viewBox='0 0 640 96' xmlns='http://www.w3.org/2000/svg' font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"><title>Figure 6: packets</title><desc>A row of packets 497 to 503 with 500 missing. The voice note is 1,000 packets; only packet 500, 1,460 bytes, is resent while 501 onwards wait.</desc><rect x='0' y='0' width='640' height='96' rx='16' fill='#fbfbf9' stroke='#e4e4de'/><defs><marker id='ar-blue' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#2f6fdb'/></marker><marker id='ar-green' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#178a5e'/></marker><marker id='ar-purple' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#6f52c9'/></marker><marker id='ar-orange' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#d0702c'/></marker><marker id='ar-pink' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#c43d6e'/></marker><marker id='ar-grey' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#6b7280'/></marker><marker id='ar-teal' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#0f7b6c'/></marker><marker id='ar-ink' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#5b6478'/></marker></defs><text x='10' y='18' text-anchor='start' font-size='11' font-weight='700' fill='#2f6fdb'>1.46 MB voice note = 1,460,000 bytes ÷ 1,460 bytes per packet = 1,000 packets</text><rect x='10' y='34' width='40' height='22' rx='4' fill='#e6eefc' stroke='#2f6fdb' stroke-width='1.4'/><text x='30.0' y='48.5' text-anchor='middle' font-size='10.5' font-weight='700' fill='#1f2a44'>497</text><rect x='56' y='34' width='40' height='22' rx='4' fill='#e6eefc' stroke='#2f6fdb' stroke-width='1.4'/><text x='76.0' y='48.5' text-anchor='middle' font-size='10.5' font-weight='700' fill='#1f2a44'>498</text><rect x='102' y='34' width='40' height='22' rx='4' fill='#e6eefc' stroke='#2f6fdb' stroke-width='1.4'/><text x='122.0' y='48.5' text-anchor='middle' font-size='10.5' font-weight='700' fill='#1f2a44'>499</text><rect x='148' y='34' width='40' height='22' rx='4' fill='#fbe6ee' stroke='#c43d6e' stroke-width='1.4' stroke-dasharray="4 3"/><text x='168.0' y='48.5' text-anchor='middle' font-size='10.5' font-weight='700' fill='#1f2a44'>500</text><rect x='194' y='34' width='40' height='22' rx='4' fill='#e6eefc' stroke='#2f6fdb' stroke-width='1.4'/><text x='214.0' y='48.5' text-anchor='middle' font-size='10.5' font-weight='700' fill='#1f2a44'>501</text><rect x='240' y='34' width='40' height='22' rx='4' fill='#e6eefc' stroke='#2f6fdb' stroke-width='1.4'/><text x='260.0' y='48.5' text-anchor='middle' font-size='10.5' font-weight='700' fill='#1f2a44'>502</text><rect x='286' y='34' width='40' height='22' rx='4' fill='#e6eefc' stroke='#2f6fdb' stroke-width='1.4'/><text x='306.0' y='48.5' text-anchor='middle' font-size='10.5' font-weight='700' fill='#1f2a44'>503</text><text x='340' y='50' text-anchor='start' font-size='10.5' font-weight='700' fill='#c43d6e'>packet 500 lost: only it is sent again (1,460 bytes)</text><text x='10' y='82' text-anchor='start' font-size='10.5' font-weight='400' fill='#5b6478' font-style='italic'>Packets 501 onwards wait at the receiver; when 500 arrives, the voice note is reassembled.</text></svg>