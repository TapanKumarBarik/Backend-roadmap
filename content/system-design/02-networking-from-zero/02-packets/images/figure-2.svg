<svg width='640' height='170' role='img' viewBox='0 0 640 170' xmlns='http://www.w3.org/2000/svg' font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"><title>Figure 2: packets</title><desc>A sofa is taken apart into 20 numbered boxes. Each box has a label: from the old flat, to the new flat, box 3 of 20. The boxes arrive out of order and are sorted by number; a missing box is asked for again on its own.</desc><rect x='0' y='0' width='640' height='170' rx='16' fill='#fbfbf9' stroke='#e4e4de'/><defs><marker id='ar-blue' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#2f6fdb'/></marker><marker id='ar-green' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#178a5e'/></marker><marker id='ar-purple' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#6f52c9'/></marker><marker id='ar-orange' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#d0702c'/></marker><marker id='ar-pink' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#c43d6e'/></marker><marker id='ar-grey' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#6b7280'/></marker><marker id='ar-teal' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#0f7b6c'/></marker><marker id='ar-ink' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#5b6478'/></marker></defs><rect x='10' y='20' width='110' height='50' rx='7' fill='#eee9fb' stroke='#6f52c9' stroke-width='1.6'/><text x='65.0' y='43.0' text-anchor='middle' font-size='12.5' font-weight='600' fill='#1f2a44'>Sofa</text><text x='65.0' y='58.0' text-anchor='middle' font-size='9.5' fill='#5b6478'>too big for the courier</text><line x1='122' y1='45' x2='150' y2='45' stroke='#6f52c9' stroke-width='1.5' marker-end='url(#ar-purple)'/><rect x='156' y='24' width='21' height='20' rx='4' fill='#eee9fb' stroke='#6f52c9' stroke-width='1.4'/><text x='166.5' y='37.0' text-anchor='middle' font-size='9' font-weight='700' fill='#1f2a44'>1</text><rect x='180' y='24' width='21' height='20' rx='4' fill='#eee9fb' stroke='#6f52c9' stroke-width='1.4'/><text x='190.5' y='37.0' text-anchor='middle' font-size='9' font-weight='700' fill='#1f2a44'>2</text><rect x='204' y='24' width='21' height='20' rx='4' fill='#eee9fb' stroke='#6f52c9' stroke-width='1.4'/><text x='214.5' y='37.0' text-anchor='middle' font-size='9' font-weight='700' fill='#1f2a44'>3</text><rect x='228' y='24' width='21' height='20' rx='4' fill='#eee9fb' stroke='#6f52c9' stroke-width='1.4'/><text x='238.5' y='37.0' text-anchor='middle' font-size='9' font-weight='700' fill='#1f2a44'>4</text><rect x='252' y='24' width='21' height='20' rx='4' fill='#eee9fb' stroke='#6f52c9' stroke-width='1.4'/><text x='262.5' y='37.0' text-anchor='middle' font-size='9' font-weight='700' fill='#1f2a44'>5</text><rect x='276' y='24' width='21' height='20' rx='4' fill='#eee9fb' stroke='#6f52c9' stroke-width='1.4'/><text x='286.5' y='37.0' text-anchor='middle' font-size='9' font-weight='700' fill='#1f2a44'>6</text><rect x='300' y='24' width='21' height='20' rx='4' fill='#eee9fb' stroke='#6f52c9' stroke-width='1.4'/><text x='310.5' y='37.0' text-anchor='middle' font-size='9' font-weight='700' fill='#1f2a44'>7</text><rect x='324' y='24' width='21' height='20' rx='4' fill='#eee9fb' stroke='#6f52c9' stroke-width='1.4'/><text x='334.5' y='37.0' text-anchor='middle' font-size='9' font-weight='700' fill='#1f2a44'>8</text><rect x='348' y='24' width='21' height='20' rx='4' fill='#eee9fb' stroke='#6f52c9' stroke-width='1.4'/><text x='358.5' y='37.0' text-anchor='middle' font-size='9' font-weight='700' fill='#1f2a44'>9</text><rect x='372' y='24' width='21' height='20' rx='4' fill='#eee9fb' stroke='#6f52c9' stroke-width='1.4'/><text x='382.5' y='37.0' text-anchor='middle' font-size='9' font-weight='700' fill='#1f2a44'>10</text><rect x='156' y='48' width='21' height='20' rx='4' fill='#eee9fb' stroke='#6f52c9' stroke-width='1.4'/><text x='166.5' y='61.0' text-anchor='middle' font-size='9' font-weight='700' fill='#1f2a44'>11</text><rect x='180' y='48' width='21' height='20' rx='4' fill='#eee9fb' stroke='#6f52c9' stroke-width='1.4'/><text x='190.5' y='61.0' text-anchor='middle' font-size='9' font-weight='700' fill='#1f2a44'>12</text><rect x='204' y='48' width='21' height='20' rx='4' fill='#eee9fb' stroke='#6f52c9' stroke-width='1.4'/><text x='214.5' y='61.0' text-anchor='middle' font-size='9' font-weight='700' fill='#1f2a44'>13</text><rect x='228' y='48' width='21' height='20' rx='4' fill='#eee9fb' stroke='#6f52c9' stroke-width='1.4'/><text x='238.5' y='61.0' text-anchor='middle' font-size='9' font-weight='700' fill='#1f2a44'>14</text><rect x='252' y='48' width='21' height='20' rx='4' fill='#eee9fb' stroke='#6f52c9' stroke-width='1.4'/><text x='262.5' y='61.0' text-anchor='middle' font-size='9' font-weight='700' fill='#1f2a44'>15</text><rect x='276' y='48' width='21' height='20' rx='4' fill='#eee9fb' stroke='#6f52c9' stroke-width='1.4'/><text x='286.5' y='61.0' text-anchor='middle' font-size='9' font-weight='700' fill='#1f2a44'>16</text><rect x='300' y='48' width='21' height='20' rx='4' fill='#eee9fb' stroke='#6f52c9' stroke-width='1.4'/><text x='310.5' y='61.0' text-anchor='middle' font-size='9' font-weight='700' fill='#1f2a44'>17</text><rect x='324' y='48' width='21' height='20' rx='4' fill='#eee9fb' stroke='#6f52c9' stroke-width='1.4'/><text x='334.5' y='61.0' text-anchor='middle' font-size='9' font-weight='700' fill='#1f2a44'>18</text><rect x='348' y='48' width='21' height='20' rx='4' fill='#eee9fb' stroke='#6f52c9' stroke-width='1.4'/><text x='358.5' y='61.0' text-anchor='middle' font-size='9' font-weight='700' fill='#1f2a44'>19</text><rect x='372' y='48' width='21' height='20' rx='4' fill='#eee9fb' stroke='#6f52c9' stroke-width='1.4'/><text x='382.5' y='61.0' text-anchor='middle' font-size='9' font-weight='700' fill='#1f2a44'>20</text><rect x='410' y='14' width='220' height='62' rx='7' fill='#fcefe4' stroke='#d0702c' stroke-width='1.6'/><text x='520.0' y='43.0' text-anchor='middle' font-size='12' font-weight='600' fill='#1f2a44'>Label on box 3</text><text x='520.0' y='58.0' text-anchor='middle' font-size='10.5' fill='#5b6478'>from: old flat · to: new flat</text><text x='520.0' y='71.0' text-anchor='middle' font-size='10.5' fill='#5b6478'>box 3 of 20</text><text x='10' y='104' text-anchor='start' font-size='10.5' font-weight='600' fill='#1f2a44'>Boxes go in different vans and arrive out of order (box 9 before box 2).</text><text x='10' y='122' text-anchor='start' font-size='10.5' font-weight='600' fill='#1f2a44'>At the new flat: read the labels, sort 1 to 20, rebuild the sofa (reassemble).</text><text x='10' y='140' text-anchor='start' font-size='10.5' font-weight='600' fill='#c43d6e'>Box 7 missing? You see the gap and ask for box 7 again: only box 7, not the whole sofa.</text><text x='10' y='160' text-anchor='start' font-size='10.5' font-weight='400' fill='#5b6478' font-style='italic'>Sofa = your photo · box = packet · label = header · contents = payload · courier&#x27;s size rule = MTU</text></svg>