<svg width='640' height='170' role='img' viewBox='0 0 640 170' xmlns='http://www.w3.org/2000/svg' font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"><title>Figure 5: packets</title><desc>Packets 5 to 9 leave the sender. A busy router drops packet 7. At the receiver, 9 arrives before 8 and is sorted back into place; the gap after 6 shows that 7 is missing, so the sender is asked to send only packet 7 again.</desc><rect x='0' y='0' width='640' height='170' rx='16' fill='#fbfbf9' stroke='#e4e4de'/><defs><marker id='ar-blue' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#2f6fdb'/></marker><marker id='ar-green' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#178a5e'/></marker><marker id='ar-purple' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#6f52c9'/></marker><marker id='ar-orange' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#d0702c'/></marker><marker id='ar-pink' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#c43d6e'/></marker><marker id='ar-grey' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#6b7280'/></marker><marker id='ar-teal' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#0f7b6c'/></marker><marker id='ar-ink' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#5b6478'/></marker></defs><rect x='10' y='50' width='92' height='50' rx='7' fill='#e6eefc' stroke='#2f6fdb' stroke-width='1.6'/><text x='56.0' y='73.0' text-anchor='middle' font-size='12.5' font-weight='600' fill='#1f2a44'>Sender</text><text x='56.0' y='88.0' text-anchor='middle' font-size='10.5' fill='#5b6478'>your phone</text><rect x='538' y='50' width='92' height='50' rx='7' fill='#e2f4ec' stroke='#178a5e' stroke-width='1.6'/><text x='584.0' y='73.0' text-anchor='middle' font-size='12.5' font-weight='600' fill='#1f2a44'>Receiver</text><text x='584.0' y='88.0' text-anchor='middle' font-size='10.5' fill='#5b6478'>the server</text><rect x='240' y='8' width='120' height='34' rx='7' fill='#f1f2f4' stroke='#6b7280' stroke-width='1.6'/><text x='300.0' y='28.833333333333332' text-anchor='middle' font-size='11.5' font-weight='600' fill='#1f2a44'>router</text><text x='372' y='30' text-anchor='start' font-size='10' font-weight='700' fill='#c43d6e'>busy: drops packet 7</text><rect x='116' y='64' width='26' height='22' rx='4' fill='#e6eefc' stroke='#2f6fdb' stroke-width='1.4'/><text x='129.0' y='78.5' text-anchor='middle' font-size='10.5' font-weight='700' fill='#1f2a44'>5</text><rect x='146' y='64' width='26' height='22' rx='4' fill='#e6eefc' stroke='#2f6fdb' stroke-width='1.4'/><text x='159.0' y='78.5' text-anchor='middle' font-size='10.5' font-weight='700' fill='#1f2a44'>6</text><rect x='176' y='64' width='26' height='22' rx='4' fill='#fbe6ee' stroke='#c43d6e' stroke-width='1.4' stroke-dasharray="4 3"/><text x='189.0' y='78.5' text-anchor='middle' font-size='10.5' font-weight='700' fill='#1f2a44'>7</text><rect x='206' y='64' width='26' height='22' rx='4' fill='#e6eefc' stroke='#2f6fdb' stroke-width='1.4'/><text x='219.0' y='78.5' text-anchor='middle' font-size='10.5' font-weight='700' fill='#1f2a44'>8</text><rect x='236' y='64' width='26' height='22' rx='4' fill='#e6eefc' stroke='#2f6fdb' stroke-width='1.4'/><text x='249.0' y='78.5' text-anchor='middle' font-size='10.5' font-weight='700' fill='#1f2a44'>9</text><text x='191' y='64.33333333333333' text-anchor='middle' font-size='16' font-weight='700' fill='#c43d6e'>✕</text><line x1='268' y1='75' x2='300' y2='75' stroke='#5b6478' stroke-width='1.5' marker-end='url(#ar-ink)'/><rect x='340' y='64' width='26' height='22' rx='4' fill='#e6eefc' stroke='#2f6fdb' stroke-width='1.4'/><text x='353.0' y='78.5' text-anchor='middle' font-size='10.5' font-weight='700' fill='#1f2a44'>5</text><rect x='374' y='64' width='26' height='22' rx='4' fill='#e6eefc' stroke='#2f6fdb' stroke-width='1.4'/><text x='387.0' y='78.5' text-anchor='middle' font-size='10.5' font-weight='700' fill='#1f2a44'>6</text><rect x='408' y='64' width='26' height='22' rx='4' fill='#fbe6ee' stroke='#c43d6e' stroke-width='1.4' stroke-dasharray="4 3"/><text x='421.0' y='78.5' text-anchor='middle' font-size='10.5' font-weight='700' fill='#1f2a44'>?</text><rect x='442' y='64' width='26' height='22' rx='4' fill='#fcefe4' stroke='#d0702c' stroke-width='1.4'/><text x='455.0' y='78.5' text-anchor='middle' font-size='10.5' font-weight='700' fill='#1f2a44'>9</text><rect x='476' y='64' width='26' height='22' rx='4' fill='#fcefe4' stroke='#d0702c' stroke-width='1.4'/><text x='489.0' y='78.5' text-anchor='middle' font-size='10.5' font-weight='700' fill='#1f2a44'>8</text><text x='420' y='106' text-anchor='middle' font-size='10' font-weight='700' fill='#d0702c'>9 arrives before 8: sort by number</text><text x='420' y='120' text-anchor='middle' font-size='10' font-weight='700' fill='#c43d6e'>gap after 6: where is 7?</text><line x1='536' y1='140' x2='110' y2='140' stroke='#d0702c' stroke-width='1.6' stroke-dasharray='5 4' marker-end='url(#ar-orange)'/><text x='320' y='134' text-anchor='middle' font-size='10' font-weight='700' fill='#d0702c'>please send packet 7 again (only that one)</text><text x='10' y='164' text-anchor='start' font-size='10' font-weight='400' fill='#5b6478' font-style='italic'>The receiver holds 8 and 9, gets the new copy of 7, and rebuilds the photo perfectly. How the asking works: lesson 8.</text></svg>