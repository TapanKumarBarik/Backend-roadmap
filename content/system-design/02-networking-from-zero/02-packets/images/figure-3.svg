<svg width='640' height='120' role='img' viewBox='0 0 640 120' xmlns='http://www.w3.org/2000/svg' font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"><title>Figure 3: packets</title><desc>A bar for one 1,500-byte packet: an orange 20-byte IP header with the addresses, an orange 20-byte TCP header with the number, and a blue payload of 1,460 bytes. Not to scale.</desc><rect x='0' y='0' width='640' height='120' rx='16' fill='#fbfbf9' stroke='#e4e4de'/><defs><marker id='ar-blue' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#2f6fdb'/></marker><marker id='ar-green' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#178a5e'/></marker><marker id='ar-purple' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#6f52c9'/></marker><marker id='ar-orange' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#d0702c'/></marker><marker id='ar-pink' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#c43d6e'/></marker><marker id='ar-grey' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#6b7280'/></marker><marker id='ar-teal' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#0f7b6c'/></marker><marker id='ar-ink' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#5b6478'/></marker></defs><rect x='10' y='30' width='90' height='40' rx='5' fill='#fcefe4' stroke='#d0702c' stroke-width='1.5'/><rect x='100' y='30' width='90' height='40' rx='5' fill='#fcefe4' stroke='#d0702c' stroke-width='1.5'/><rect x='190' y='30' width='440' height='40' rx='5' fill='#e6eefc' stroke='#2f6fdb' stroke-width='1.5'/><text x='55' y='55' text-anchor='middle' font-size='11.5' font-weight='700' fill='#d0702c'>IP 20</text><text x='145' y='55' text-anchor='middle' font-size='11.5' font-weight='700' fill='#d0702c'>TCP 20</text><text x='410' y='55' text-anchor='middle' font-size='11.5' font-weight='700' fill='#2f6fdb'>payload: 1,460 bytes of your photo</text><text x='55' y='88' text-anchor='middle' font-size='10' font-weight='600' fill='#1f2a44'>addresses</text><text x='145' y='88' text-anchor='middle' font-size='10' font-weight='600' fill='#1f2a44'>number</text><text x='10' y='20' text-anchor='start' font-size='11' font-weight='700' fill='#1f2a44'>One packet: at most 1,500 bytes (the MTU on Ethernet and typical Wi-Fi)</text><line x1='10' y1='100' x2='190' y2='100' stroke='#d0702c' stroke-width='1.2'/><text x='100' y='114' text-anchor='middle' font-size='10' font-weight='700' fill='#d0702c'>header: 40 bytes</text><text x='630' y='114' text-anchor='end' font-size='9.5' font-weight='400' fill='#5b6478' font-style='italic'>not to scale: the headers are really 2.7% of the packet</text></svg>