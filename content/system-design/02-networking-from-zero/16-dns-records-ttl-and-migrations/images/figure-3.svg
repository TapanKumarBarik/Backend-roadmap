<svg width='640' height='80' role='img' viewBox='0 0 640 80' xmlns='http://www.w3.org/2000/svg' font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"><title>Figure 3: DNS part 2, records, TTL and safe migrations</title><desc>shop.example.com points by CNAME to example.cdn.net, which points by A records to the CDN&#x27;s current addresses.</desc><rect x='0' y='0' width='640' height='80' rx='16' fill='#fbfbf9' stroke='#e4e4de'/><defs><marker id='ar-blue' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#2f6fdb'/></marker><marker id='ar-green' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#178a5e'/></marker><marker id='ar-purple' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#6f52c9'/></marker><marker id='ar-orange' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#d0702c'/></marker><marker id='ar-pink' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#c43d6e'/></marker><marker id='ar-grey' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#6b7280'/></marker><marker id='ar-teal' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#0f7b6c'/></marker><marker id='ar-ink' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#5b6478'/></marker></defs><rect x='14' y='14' width='140' height='18' rx='4' fill='#f1f2f4' stroke='#6b7280' stroke-width='1.2'/><text x='84.0' y='26.6' text-anchor='middle' font-size='10.5' font-weight='700' fill='#6b7280'>shop.example.com</text><line x1='158' y1='23' x2='214' y2='23' stroke='#6f52c9' stroke-width='1.5' marker-end='url(#ar-purple)'/><text x='186' y='16' text-anchor='middle' font-size='9' font-weight='700' fill='#6f52c9'>CNAME</text><rect x='218' y='14' width='140' height='18' rx='4' fill='#eee9fb' stroke='#6f52c9' stroke-width='1.2'/><text x='288.0' y='26.6' text-anchor='middle' font-size='10.5' font-weight='700' fill='#6f52c9'>example.cdn.net</text><line x1='362' y1='23' x2='418' y2='23' stroke='#2f6fdb' stroke-width='1.5' marker-end='url(#ar-blue)'/><text x='390' y='16' text-anchor='middle' font-size='9' font-weight='700' fill='#2f6fdb'>A</text><rect x='422' y='14' width='204' height='18' rx='4' fill='#e6eefc' stroke='#2f6fdb' stroke-width='1.2'/><text x='524.0' y='26.6' text-anchor='middle' font-size='10.5' font-weight='700' fill='#2f6fdb'>the CDN&#x27;s current addresses</text><text x='14' y='58' text-anchor='start' font-size='10' font-weight='600' fill='#1f2a44'>A CNAME says “look up that other name instead”: ideal for CDNs and cloud load balancers whose addresses change.</text><text x='14' y='74' text-anchor='start' font-size='10' font-weight='700' fill='#c43d6e'>Rule: no CNAME at the top of a domain next to other records; providers offer an ALIAS (or ANAME) record for that.</text></svg>