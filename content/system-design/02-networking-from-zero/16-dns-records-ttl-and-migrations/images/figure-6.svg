<svg width='640' height='120' role='img' viewBox='0 0 640 120' xmlns='http://www.w3.org/2000/svg' font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"><title>Figure 6: DNS part 2, records, TTL and safe migrations</title><desc>Five numbered steps: lower TTL from 86,400 to 300; wait at least the old TTL; switch the A record with both servers on; watch old traffic fall to zero; raise the TTL to 3,600.</desc><rect x='0' y='0' width='640' height='120' rx='16' fill='#fbfbf9' stroke='#e4e4de'/><defs><marker id='ar-blue' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#2f6fdb'/></marker><marker id='ar-green' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#178a5e'/></marker><marker id='ar-purple' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#6f52c9'/></marker><marker id='ar-orange' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#d0702c'/></marker><marker id='ar-pink' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#c43d6e'/></marker><marker id='ar-grey' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#6b7280'/></marker><marker id='ar-teal' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#0f7b6c'/></marker><marker id='ar-ink' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#5b6478'/></marker></defs><rect x='14' y='22' width='116' height='48' rx='7' fill='#fcefe4' stroke='#d0702c' stroke-width='1.6'/><text x='72.0' y='44.0' text-anchor='middle' font-size='10.5' font-weight='600' fill='#1f2a44'>lower TTL</text><text x='72.0' y='59.0' text-anchor='middle' font-size='9' fill='#5b6478'>86,400 → 300</text><circle cx='24' cy='22' r='9' fill='#d0702c'/><text x='24' y='25.8' text-anchor='middle' font-size='10.5' font-weight='700' fill='#fff'>1</text><line x1='131' y1='46' x2='137' y2='46' stroke='#5b6478' stroke-width='1.5' marker-end='url(#ar-ink)'/><rect x='138' y='22' width='116' height='48' rx='7' fill='#fcefe4' stroke='#d0702c' stroke-width='1.6'/><text x='196.0' y='44.0' text-anchor='middle' font-size='10.5' font-weight='600' fill='#1f2a44'>wait</text><text x='196.0' y='59.0' text-anchor='middle' font-size='9' fill='#5b6478'>≥ the old TTL</text><circle cx='148' cy='22' r='9' fill='#d0702c'/><text x='148' y='25.8' text-anchor='middle' font-size='10.5' font-weight='700' fill='#fff'>2</text><line x1='255' y1='46' x2='261' y2='46' stroke='#5b6478' stroke-width='1.5' marker-end='url(#ar-ink)'/><rect x='262' y='22' width='116' height='48' rx='7' fill='#e6eefc' stroke='#2f6fdb' stroke-width='1.6'/><text x='320.0' y='44.0' text-anchor='middle' font-size='10.5' font-weight='600' fill='#1f2a44'>switch A record</text><text x='320.0' y='59.0' text-anchor='middle' font-size='9' fill='#5b6478'>both servers on</text><circle cx='272' cy='22' r='9' fill='#2f6fdb'/><text x='272' y='25.8' text-anchor='middle' font-size='10.5' font-weight='700' fill='#fff'>3</text><line x1='379' y1='46' x2='385' y2='46' stroke='#5b6478' stroke-width='1.5' marker-end='url(#ar-ink)'/><rect x='386' y='22' width='116' height='48' rx='7' fill='#e2f4ec' stroke='#178a5e' stroke-width='1.6'/><text x='444.0' y='44.0' text-anchor='middle' font-size='10.5' font-weight='600' fill='#1f2a44'>watch</text><text x='444.0' y='59.0' text-anchor='middle' font-size='9' fill='#5b6478'>old traffic → 0</text><circle cx='396' cy='22' r='9' fill='#178a5e'/><text x='396' y='25.8' text-anchor='middle' font-size='10.5' font-weight='700' fill='#fff'>4</text><line x1='503' y1='46' x2='509' y2='46' stroke='#5b6478' stroke-width='1.5' marker-end='url(#ar-ink)'/><rect x='510' y='22' width='116' height='48' rx='7' fill='#e2f4ec' stroke='#178a5e' stroke-width='1.6'/><text x='568.0' y='44.0' text-anchor='middle' font-size='10.5' font-weight='600' fill='#1f2a44'>raise TTL</text><text x='568.0' y='59.0' text-anchor='middle' font-size='9' fill='#5b6478'>300 → 3,600</text><circle cx='520' cy='22' r='9' fill='#178a5e'/><text x='520' y='25.8' text-anchor='middle' font-size='10.5' font-weight='700' fill='#fff'>5</text><text x='14' y='94' text-anchor='start' font-size='10' font-weight='600' fill='#1f2a44'>Days before: lower the TTL. Wait out the old TTL so every cache holds the short one. Switch while both servers run;</text><text x='14' y='108' text-anchor='start' font-size='10' font-weight='600' fill='#1f2a44'>most users move within minutes. Keep the old server a little longer, then raise the TTL. Rollback stays a 5-minute job.</text></svg>