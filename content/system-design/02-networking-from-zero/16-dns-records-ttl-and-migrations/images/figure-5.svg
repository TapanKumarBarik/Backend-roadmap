<svg width='640' height='96' role='img' viewBox='0 0 640 96' xmlns='http://www.w3.org/2000/svg' font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"><title>Figure 5: DNS part 2, records, TTL and safe migrations</title><desc>A comparison: TTL 300 lasts 5 minutes, changes reach users fast, more lookups; TTL 86,400 lasts a day, changes take up to a day, few lookups.</desc><rect x='0' y='0' width='640' height='96' rx='16' fill='#fbfbf9' stroke='#e4e4de'/><defs><marker id='ar-blue' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#2f6fdb'/></marker><marker id='ar-green' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#178a5e'/></marker><marker id='ar-purple' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#6f52c9'/></marker><marker id='ar-orange' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#d0702c'/></marker><marker id='ar-pink' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#c43d6e'/></marker><marker id='ar-grey' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#6b7280'/></marker><marker id='ar-teal' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#0f7b6c'/></marker><marker id='ar-ink' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#5b6478'/></marker></defs><text x='14' y='24' text-anchor='start' font-size='10.5' font-weight='700' fill='#1f2a44'>TTL</text><text x='110' y='24' text-anchor='start' font-size='10.5' font-weight='700' fill='#1f2a44'>lasts</text><text x='230' y='24' text-anchor='start' font-size='10.5' font-weight='700' fill='#1f2a44'>changes reach users</text><text x='400' y='24' text-anchor='start' font-size='10.5' font-weight='700' fill='#1f2a44'>lookups</text><line x1='14' y1='30' x2='626' y2='30' stroke='#6b7280' stroke-width='1'/><text x='14' y='48' text-anchor='start' font-size='10.5' font-weight='700' fill='#178a5e'>300</text><text x='110' y='48' text-anchor='start' font-size='10.5' font-weight='600' fill='#1f2a44'>5 minutes</text><text x='230' y='48' text-anchor='start' font-size='10.5' font-weight='600' fill='#1f2a44'>fast</text><text x='400' y='48' text-anchor='start' font-size='10.5' font-weight='600' fill='#1f2a44'>more (each can add 20-100 ms)</text><line x1='14' y1='54' x2='626' y2='54' stroke='#6b7280' stroke-width='1'/><text x='14' y='72' text-anchor='start' font-size='10.5' font-weight='700' fill='#d0702c'>86,400</text><text x='110' y='72' text-anchor='start' font-size='10.5' font-weight='600' fill='#1f2a44'>1 day</text><text x='230' y='72' text-anchor='start' font-size='10.5' font-weight='600' fill='#1f2a44'>up to a day</text><text x='400' y='72' text-anchor='start' font-size='10.5' font-weight='600' fill='#1f2a44'>few</text><line x1='14' y1='78' x2='626' y2='78' stroke='#6b7280' stroke-width='1'/><text x='14' y='92' text-anchor='start' font-size='10' font-weight='400' fill='#5b6478' font-style='italic'>Keep TTLs short around a change, longer the rest of the time.</text></svg>