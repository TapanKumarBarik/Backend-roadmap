<svg width='640' height='120' role='img' viewBox='0 0 640 120' xmlns='http://www.w3.org/2000/svg' font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"><title>Figure 1: DNS part 2, records, TTL and safe migrations</title><desc>Three purple sticky notes, each with an old number and check again in 1 hour, and a green tag with the new number.</desc><rect x='0' y='0' width='640' height='120' rx='16' fill='#fbfbf9' stroke='#e4e4de'/><defs><marker id='ar-blue' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#2f6fdb'/></marker><marker id='ar-green' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#178a5e'/></marker><marker id='ar-purple' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#6f52c9'/></marker><marker id='ar-orange' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#d0702c'/></marker><marker id='ar-pink' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#c43d6e'/></marker><marker id='ar-grey' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#6b7280'/></marker><marker id='ar-teal' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#0f7b6c'/></marker><marker id='ar-ink' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#5b6478'/></marker></defs><g transform='rotate(3 109 45)'><rect x='14' y='18' width='190' height='52' rx='6' fill='#eee9fb' stroke='#6f52c9' stroke-width='1.2'/><text x='109' y='40' text-anchor='middle' font-size='11' font-weight='700' fill='#6f52c9'>friend: 555-0100</text><text x='109' y='58' text-anchor='middle' font-size='10' font-weight='700' fill='#d0702c'>check again in 1 hour</text></g><g transform='rotate(-2 315 45)'><rect x='220' y='18' width='190' height='52' rx='6' fill='#eee9fb' stroke='#6f52c9' stroke-width='1.2'/><text x='315' y='40' text-anchor='middle' font-size='11' font-weight='700' fill='#6f52c9'>friend: 555-0100</text><text x='315' y='58' text-anchor='middle' font-size='10' font-weight='700' fill='#d0702c'>check again in 1 hour</text></g><g transform='rotate(2 521 45)'><rect x='426' y='18' width='190' height='52' rx='6' fill='#eee9fb' stroke='#6f52c9' stroke-width='1.2'/><text x='521' y='40' text-anchor='middle' font-size='11' font-weight='700' fill='#6f52c9'>friend: 555-0100</text><text x='521' y='58' text-anchor='middle' font-size='10' font-weight='700' fill='#d0702c'>check again in 1 hour</text></g><rect x='14' y='84' width='170' height='18' rx='4' fill='#e2f4ec' stroke='#178a5e' stroke-width='1.2'/><text x='99.0' y='96.6' text-anchor='middle' font-size='10' font-weight='700' fill='#178a5e'>new number: 555-0199</text><text x='200' y='97' text-anchor='start' font-size='10' font-weight='600' fill='#1f2a44'>People keep calling the number they wrote down until they check again.</text><text x='14' y='116' text-anchor='start' font-size='10' font-weight='400' fill='#5b6478' font-style='italic'>The sticky note is a DNS cache; “check again in 1 hour” is the TTL.</text></svg>