<svg width='640' height='130' role='img' viewBox='0 0 640 130' xmlns='http://www.w3.org/2000/svg' font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"><title>Figure 7: DNS part 2, records, TTL and safe migrations</title><desc>Four red tags with explanations: skip the wait, old server off too early, a typo with a long TTL, and negative caching.</desc><rect x='0' y='0' width='640' height='130' rx='16' fill='#fbfbf9' stroke='#e4e4de'/><defs><marker id='ar-blue' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#2f6fdb'/></marker><marker id='ar-green' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#178a5e'/></marker><marker id='ar-purple' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#6f52c9'/></marker><marker id='ar-orange' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#d0702c'/></marker><marker id='ar-pink' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#c43d6e'/></marker><marker id='ar-grey' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#6b7280'/></marker><marker id='ar-teal' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#0f7b6c'/></marker><marker id='ar-ink' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#5b6478'/></marker></defs><rect x='14' y='12' width='160' height='18' rx='4' fill='#fbe6ee' stroke='#c43d6e' stroke-width='1.2'/><text x='94.0' y='24.6' text-anchor='middle' font-size='9.5' font-weight='700' fill='#c43d6e'>Skip the wait</text><text x='184' y='25' text-anchor='start' font-size='9.6' font-weight='600' fill='#1f2a44'>TTL and address changed together: caches keep the old answer, up to a day</text><rect x='14' y='40' width='160' height='18' rx='4' fill='#fbe6ee' stroke='#c43d6e' stroke-width='1.2'/><text x='94.0' y='52.6' text-anchor='middle' font-size='9.5' font-weight='700' fill='#c43d6e'>Old server off too early</text><text x='184' y='53' text-anchor='start' font-size='9.6' font-weight='600' fill='#1f2a44'>users with the old answer cached get errors until their cache expires</text><rect x='14' y='68' width='160' height='18' rx='4' fill='#fbe6ee' stroke='#c43d6e' stroke-width='1.2'/><text x='94.0' y='80.6' text-anchor='middle' font-size='9.5' font-weight='700' fill='#c43d6e'>A typo, long TTL</text><text x='184' y='81' text-anchor='start' font-size='9.6' font-weight='600' fill='#1f2a44'>the mistake is cached everywhere for a day; short TTLs during changes make mistakes cheap</text><rect x='14' y='96' width='160' height='18' rx='4' fill='#fbe6ee' stroke='#c43d6e' stroke-width='1.2'/><text x='94.0' y='108.6' text-anchor='middle' font-size='9.5' font-weight='700' fill='#c43d6e'>Negative caching</text><text x='184' y='109' text-anchor='start' font-size='9.6' font-weight='600' fill='#1f2a44'>look a name up before you create it, and the “no such name” answer is cached too</text></svg>