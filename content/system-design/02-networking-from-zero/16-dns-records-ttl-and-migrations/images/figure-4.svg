t-weight='600' fill='#1f2a44'>resolver cache</text><text x='99.0' y='57.0' text-anchor='middle' font-size='11' fill='#5b6478'>198.51.100.10</text><rect x='220' y='34' width='84' height='18' rx='4' fill='#fcefe4' stroke='#d0702c' stroke-width='1.2'/><text x='262.0' y='46.6' text-anchor='middle' font-size='10' font-weight='700' fill='#d0702c'>TTL 3,600</text><line x1='306' y1='43' x2='314' y2='43' stroke='#d0702c' stroke-width='1.5' marker-end='url(#ar-orange)'/><rect x='316' y='34' width='84' height='18' rx='4' fill='#fcefe4' stroke='#d0702c' stroke-width='1.2'/><text x='358.0' y='46.6' text-anchor='middle' font-size='10' font-weight='700' fill='#d0702c'>TTL 2,400</text><line x1='402' y1='43' x2='410' y2='43' stroke='#d0702c' stroke-width='1.5' marker-end='url(#ar-orange)'/><rect x='412' y='34' width='84' height='18' rx='4' fill='#fcefe4' stroke='#d0702c' stroke-width='1.2'/><text x='454.0' y='46.6' text-anchor='middle' font-size='10' font-weight='700' fill='#d0702c'>TTL 1,200</text><line x1='498' y1='43' x2='506' y2='43' stroke='#d0702c' stroke-width='1.5' marker-end='url(#ar-orange)'/><rect x='508' y='34' width='84' height='18' rx='4' fill='#fcefe4' stroke='#d0702c' stroke-width='1.2'/><text x='550.0' y='46.6' text-anchor='middle' font-size='10' font-weight='700' fill='#d0702c'>TTL 0</text><text x='220' y='24' text-anchor='start' font-size='9.5' font-weight='700' fill='#d0702c'>counting down, in seconds</text><text x='14' y='92' text-anchor='start' font-size='10' font-weight='400' fill='#5b6478' font-style='italic'>Every answer carries a TTL. The resolver keeps the answer and won&#x27;t ask again until the TTL reaches zero.</text></svg>