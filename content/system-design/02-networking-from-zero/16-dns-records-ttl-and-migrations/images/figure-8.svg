<svg width='640' height='90' role='img' viewBox='0 0 640 90' xmlns='http://www.w3.org/2000/svg' font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"><title>Figure 8: DNS part 2, records, TTL and safe migrations</title><desc>A long purple bar: a cache that took the old answer just before the change keeps it for 86,400 seconds.</desc><rect x='0' y='0' width='640' height='90' rx='16' fill='#fbfbf9' stroke='#e4e4de'/><defs><marker id='ar-blue' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#2f6fdb'/></marker><marker id='ar-green' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#178a5e'/></marker><marker id='ar-purple' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#6f52c9'/></marker><marker id='ar-orange' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#d0702c'/></marker><marker id='ar-pink' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#c43d6e'/></marker><marker id='ar-grey' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#6b7280'/></marker><marker id='ar-teal' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#0f7b6c'/></marker><marker id='ar-ink' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#5b6478'/></marker></defs><text x='14' y='18' text-anchor='start' font-size='10.5' font-weight='700' fill='#1f2a44'>TTL 1 day; you lower it to 5 minutes and change the address in the same minute:</text><rect x='14' y='28' width='612' height='26' fill='#eee9fb' stroke='#6f52c9' stroke-width='1.3'/><text x='320.0' y='44.5' text-anchor='middle' font-size='10.5' font-weight='700' fill='#6f52c9'>a cache that took the old answer just before your change: 86,400 s</text><text x='14' y='76' text-anchor='start' font-size='10.5' font-weight='700' fill='#c43d6e'>Up to a day. It never saw the new 5-minute TTL; lowering the TTL only helps once the old TTL has run out.</text></svg>