<svg width='640' height='166' role='img' viewBox='0 0 640 166' xmlns='http://www.w3.org/2000/svg' font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"><title>Figure 6: IP addresses</title><desc>Left: a laptop and a tablet in one home network, both 192.168.1.6 in red: an address conflict. Right: DHCP as a receptionist with a list of addresses, giving 192.168.1.8 to a new tablet with a 24-hour lease.</desc><rect x='0' y='0' width='640' height='166' rx='16' fill='#fbfbf9' stroke='#e4e4de'/><defs><marker id='ar-blue' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#2f6fdb'/></marker><marker id='ar-green' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#178a5e'/></marker><marker id='ar-purple' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#6f52c9'/></marker><marker id='ar-orange' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#d0702c'/></marker><marker id='ar-pink' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#c43d6e'/></marker><marker id='ar-grey' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#6b7280'/></marker><marker id='ar-teal' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#0f7b6c'/></marker><marker id='ar-ink' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#5b6478'/></marker></defs><rect x='10' y='10' width='300' height='110' rx='9' fill='#f1f2f4' fill-opacity='0.45' stroke='#6b7280' stroke-opacity='0.5' stroke-dasharray='4 4'/><text x='20' y='26' font-size='10' font-weight='700' letter-spacing='0.06em' fill='#6b7280'>ONE HOME NETWORK</text><rect x='24' y='36' width='120' height='34' rx='7' fill='#e6eefc' stroke='#2f6fdb' stroke-width='1.6'/><text x='84.0' y='56.833333333333336' text-anchor='middle' font-size='11.5' font-weight='600' fill='#1f2a44'>your laptop</text><rect x='170' y='36' width='126' height='34' rx='7' fill='#e6eefc' stroke='#2f6fdb' stroke-width='1.6'/><text x='233.0' y='56.833333333333336' text-anchor='middle' font-size='11.5' font-weight='600' fill='#1f2a44'>brother&#x27;s tablet</text><rect x='24' y='78' width='120' height='18' rx='4' fill='#fbe6ee' stroke='#c43d6e' stroke-width='1.2'/><text x='84.0' y='90.6' text-anchor='middle' font-size='10' font-weight='700' fill='#c43d6e'>192.168.1.6</text><rect x='170' y='78' width='126' height='18' rx='4' fill='#fbe6ee' stroke='#c43d6e' stroke-width='1.2'/><text x='233.0' y='90.6' text-anchor='middle' font-size='10' font-weight='700' fill='#c43d6e'>192.168.1.6</text><text x='160' y='112' text-anchor='middle' font-size='10' font-weight='700' fill='#c43d6e'>address conflict: replies reach the wrong device</text><rect x='340' y='12' width='290' height='108' rx='7' fill='#e2f4ec' stroke='#178a5e' stroke-width='1.6'/><text x='356' y='32' text-anchor='start' font-size='12' font-weight='700' fill='#178a5e'>DHCP: the receptionist&#x27;s list</text><text x='356' y='54' text-anchor='start' font-size='10.5' font-weight='600' fill='#1f2a44'>192.168.1.5   phone</text><text x='356' y='70' text-anchor='start' font-size='10.5' font-weight='600' fill='#1f2a44'>192.168.1.6   laptop</text><text x='356' y='86' text-anchor='start' font-size='10.5' font-weight='600' fill='#1f2a44'>192.168.1.7   TV</text><text x='356' y='102' text-anchor='start' font-size='10.5' font-weight='600' fill='#178a5e'>192.168.1.8   new tablet (lease: 24 h)</text><text x='10' y='142' text-anchor='start' font-size='10' font-weight='600' fill='#1f2a44'>DHCP picks a free address, writes it down and lends it for a while (a lease), so it never gives one address to two devices.</text><text x='10' y='158' text-anchor='start' font-size='10' font-weight='400' fill='#5b6478' font-style='italic'>Most conflicts come from an address typed in by hand. A wrong address, where no device is, gets no answer: a timeout.</text></svg>