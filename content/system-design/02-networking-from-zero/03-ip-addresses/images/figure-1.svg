<svg width='640' height='124' role='img' viewBox='0 0 640 124' xmlns='http://www.w3.org/2000/svg' font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"><title>Figure 1: IP addresses</title><desc>Four purple boxes in a row: India (country), Bengaluru (city), MG Road (street), flat 5 (the door). A brace under the first three says network part, gets the courier to the right building; a brace under flat 5 says device part, one door inside.</desc><rect x='0' y='0' width='640' height='124' rx='16' fill='#fbfbf9' stroke='#e4e4de'/><defs><marker id='ar-blue' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#2f6fdb'/></marker><marker id='ar-green' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#178a5e'/></marker><marker id='ar-purple' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#6f52c9'/></marker><marker id='ar-orange' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#d0702c'/></marker><marker id='ar-pink' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#c43d6e'/></marker><marker id='ar-grey' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#6b7280'/></marker><marker id='ar-teal' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#0f7b6c'/></marker><marker id='ar-ink' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#5b6478'/></marker></defs><rect x='12' y='14' width='130' height='46' rx='7' fill='#eee9fb' stroke='#6f52c9' stroke-width='1.6'/><text x='77.0' y='35.0' text-anchor='middle' font-size='13' font-weight='600' fill='#1f2a44'>India</text><text x='77.0' y='50.0' text-anchor='middle' font-size='10.5' fill='#5b6478'>country</text><line x1='144' y1='37' x2='166' y2='37' stroke='#6f52c9' stroke-width='1.5' marker-end='url(#ar-purple)'/><rect x='170' y='14' width='130' height='46' rx='7' fill='#eee9fb' stroke='#6f52c9' stroke-width='1.6'/><text x='235.0' y='35.0' text-anchor='middle' font-size='13' font-weight='600' fill='#1f2a44'>Bengaluru</text><text x='235.0' y='50.0' text-anchor='middle' font-size='10.5' fill='#5b6478'>city</text><line x1='302' y1='37' x2='324' y2='37' stroke='#6f52c9' stroke-width='1.5' marker-end='url(#ar-purple)'/><rect x='328' y='14' width='130' height='46' rx='7' fill='#eee9fb' stroke='#6f52c9' stroke-width='1.6'/><text x='393.0' y='35.0' text-anchor='middle' font-size='13' font-weight='600' fill='#1f2a44'>MG Road</text><text x='393.0' y='50.0' text-anchor='middle' font-size='10.5' fill='#5b6478'>street</text><line x1='460' y1='37' x2='482' y2='37' stroke='#6f52c9' stroke-width='1.5' marker-end='url(#ar-purple)'/><rect x='486' y='14' width='130' height='46' rx='7' fill='#eee9fb' stroke='#6f52c9' stroke-width='1.6'/><text x='551.0' y='35.0' text-anchor='middle' font-size='13' font-weight='600' fill='#1f2a44'>flat 5</text><text x='551.0' y='50.0' text-anchor='middle' font-size='10.5' fill='#5b6478'>the door</text><path d='M14 66 Q14 74 22 74 L223.0 74 Q229.0 74 229.0 81 Q229.0 74 235.0 74 L436 74 Q444 74 444 66' fill='none' stroke='#d0702c' stroke-width='1.6'/><text x='229.0' y='96' text-anchor='middle' font-size='10.5' font-weight='700' fill='#d0702c'>network part: gets the courier to the right building</text><path d='M486 66 Q486 74 494 74 L551.0 74 Q557.0 74 557.0 81 Q557.0 74 563.0 74 L620 74 Q628 74 628 66' fill='none' stroke='#2f6fdb' stroke-width='1.6'/><text x='557.0' y='96' text-anchor='middle' font-size='10.5' font-weight='700' fill='#2f6fdb'>device part: one door inside</text><text x='12' y='118' text-anchor='start' font-size='10' font-weight='400' fill='#5b6478' font-style='italic'>No two flats in one building share a number; if two doors said 5, the courier would not know where to knock.</text></svg>