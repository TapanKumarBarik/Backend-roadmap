<svg width='640' height='150' role='img' viewBox='0 0 640 150' xmlns='http://www.w3.org/2000/svg' font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"><title>Figure 3: IP addresses</title><desc>Three bars: IPv4 addresses, 4.3 billion; people, over 8 billion; devices, many more. Below: the free IPv4 blocks ran out in 2011; the two fixes are IPv6, with 128-bit addresses, and private addresses.</desc><rect x='0' y='0' width='640' height='150' rx='16' fill='#fbfbf9' stroke='#e4e4de'/><defs><marker id='ar-blue' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#2f6fdb'/></marker><marker id='ar-green' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#178a5e'/></marker><marker id='ar-purple' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#6f52c9'/></marker><marker id='ar-orange' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#d0702c'/></marker><marker id='ar-pink' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#c43d6e'/></marker><marker id='ar-grey' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#6b7280'/></marker><marker id='ar-teal' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#0f7b6c'/></marker><marker id='ar-ink' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#5b6478'/></marker></defs><text x='14' y='18' text-anchor='start' font-size='11.5' font-weight='700' fill='#d0702c'>256 × 256 × 256 × 256 = 2³² = 4,294,967,296 ≈ 4.3 billion IPv4 addresses</text><rect x='14' y='30' width='197.79999999999998' height='20' rx='3' fill='#e6eefc' stroke='#2f6fdb' stroke-width='1.3'/><text x='22' y='44' text-anchor='start' font-size='10.5' font-weight='700' fill='#2f6fdb'>IPv4 addresses: 4.3 billion</text><rect x='14' y='56' width='377.2' height='20' rx='3' fill='#fcefe4' stroke='#d0702c' stroke-width='1.3'/><text x='22' y='70' text-anchor='start' font-size='10.5' font-weight='700' fill='#d0702c'>people: over 8 billion</text><rect x='14' y='82' width='616.4' height='20' rx='3' fill='#fbe6ee' stroke='#c43d6e' stroke-width='1.3'/><text x='22' y='96' text-anchor='start' font-size='10.5' font-weight='700' fill='#c43d6e'>devices (phones, laptops, TVs, servers): many more</text><text x='14' y='124' text-anchor='start' font-size='10.5' font-weight='600' fill='#1f2a44'>The last big free blocks of IPv4 addresses ran out in 2011. Two fixes:</text><text x='14' y='142' text-anchor='start' font-size='10.5' font-weight='700' fill='#6f52c9'>1. IPv6: 128-bit addresses, 2¹²⁸ ≈ 3.4 × 10³⁸ (a 39-digit number).  2. private addresses, reused in every home.</text></svg>