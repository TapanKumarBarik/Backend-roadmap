<svg width='640' height='150' role='img' viewBox='0 0 640 150' xmlns='http://www.w3.org/2000/svg' font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"><title>Figure 5: IP addresses</title><desc>Left to right: your phone 192.168.1.5, the router 203.0.113.7, three routers in the internet, and the WhatsApp server 198.51.100.20, with numbered steps 1 to 4. Step 2 replaces the private sender address with the public one.</desc><rect x='0' y='0' width='640' height='150' rx='16' fill='#fbfbf9' stroke='#e4e4de'/><defs><marker id='ar-blue' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#2f6fdb'/></marker><marker id='ar-green' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#178a5e'/></marker><marker id='ar-purple' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#6f52c9'/></marker><marker id='ar-orange' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#d0702c'/></marker><marker id='ar-pink' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#c43d6e'/></marker><marker id='ar-grey' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#6b7280'/></marker><marker id='ar-teal' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#0f7b6c'/></marker><marker id='ar-ink' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#5b6478'/></marker></defs><rect x='10' y='40' width='84' height='44' rx='7' fill='#e6eefc' stroke='#2f6fdb' stroke-width='1.6'/><text x='52.0' y='60.0' text-anchor='middle' font-size='11.5' font-weight='600' fill='#1f2a44'>your phone</text><text x='52.0' y='75.0' text-anchor='middle' font-size='10.5' fill='#5b6478'>192.168.1.5</text><rect x='128' y='40' width='84' height='44' rx='7' fill='#f1f2f4' stroke='#6b7280' stroke-width='1.6'/><text x='170.0' y='60.0' text-anchor='middle' font-size='11.5' font-weight='600' fill='#1f2a44'>router</text><text x='170.0' y='75.0' text-anchor='middle' font-size='10.5' fill='#5b6478'>203.0.113.7</text><rect x='244' y='22' width='236' height='82' rx='9' fill='#f1f2f4' fill-opacity='0.45' stroke='#6b7280' stroke-opacity='0.5' stroke-dasharray='4 4'/><text x='254' y='38' font-size='10' font-weight='700' letter-spacing='0.06em' fill='#6b7280'>THE INTERNET</text><rect x='262' y='50' width='46' height='26' rx='7' fill='#f1f2f4' stroke='#6b7280' stroke-width='1.6'/><text x='285.0' y='66.66666666666667' text-anchor='middle' font-size='11' font-weight='600' fill='#1f2a44'>R</text><line x1='310' y1='63' x2='336' y2='63' stroke='#5b6478' stroke-width='1.5' marker-end='url(#ar-ink)'/><rect x='340' y='50' width='46' height='26' rx='7' fill='#f1f2f4' stroke='#6b7280' stroke-width='1.6'/><text x='363.0' y='66.66666666666667' text-anchor='middle' font-size='11' font-weight='600' fill='#1f2a44'>R</text><line x1='388' y1='63' x2='414' y2='63' stroke='#5b6478' stroke-width='1.5' marker-end='url(#ar-ink)'/><rect x='418' y='50' width='46' height='26' rx='7' fill='#f1f2f4' stroke='#6b7280' stroke-width='1.6'/><text x='441.0' y='66.66666666666667' text-anchor='middle' font-size='11' font-weight='600' fill='#1f2a44'>R</text><rect x='520' y='40' width='110' height='44' rx='7' fill='#e2f4ec' stroke='#178a5e' stroke-width='1.6'/><text x='575.0' y='60.0' text-anchor='middle' font-size='11' font-weight='600' fill='#1f2a44'>WhatsApp server</text><text x='575.0' y='75.0' text-anchor='middle' font-size='10.5' fill='#5b6478'>198.51.100.20</text><line x1='96' y1='62' x2='124' y2='62' stroke='#2f6fdb' stroke-width='1.5' marker-end='url(#ar-blue)'/><line x1='214' y1='62' x2='258' y2='62' stroke='#2f6fdb' stroke-width='1.5' marker-end='url(#ar-blue)'/><line x1='466' y1='62' x2='516' y2='62' stroke='#2f6fdb' stroke-width='1.5' marker-end='url(#ar-blue)'/><circle cx='52' cy='26' r='9' fill='#d0702c'/><text x='52' y='29.8' text-anchor='middle' font-size='10.5' font-weight='700' fill='#fff'>1</text><circle cx='170' cy='26' r='9' fill='#d0702c'/><text x='170' y='29.8' text-anchor='middle' font-size='10.5' font-weight='700' fill='#fff'>2</text><circle cx='362' cy='26' r='9' fill='#d0702c'/><text x='362' y='29.8' text-anchor='middle' font-size='10.5' font-weight='700' fill='#fff'>3</text><circle cx='575' cy='26' r='9' fill='#d0702c'/><text x='575' y='29.8' text-anchor='middle' font-size='10.5' font-weight='700' fill='#fff'>4</text><text x='10' y='116' text-anchor='start' font-size='10' font-weight='600' fill='#1f2a44'>1 the phone writes from: 192.168.1.5, to: 198.51.100.20   2 the router sends it out, from: its public address</text><text x='10' y='132' text-anchor='start' font-size='10' font-weight='600' fill='#1f2a44'>3 each router reads the network part and passes it one step closer   4 the device part finds the one server</text><text x='10' y='146' text-anchor='start' font-size='10' font-weight='400' fill='#5b6478' font-style='italic'>The reply comes back to 203.0.113.7, and the router hands it to the phone.</text></svg>