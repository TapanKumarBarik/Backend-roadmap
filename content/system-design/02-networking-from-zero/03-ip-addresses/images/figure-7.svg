<svg width='640' height='112' role='img' viewBox='0 0 640 112' xmlns='http://www.w3.org/2000/svg' font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"><title>Figure 7: IP addresses</title><desc>Two grey home networks, each with a phone at 192.168.1.5. Under them, different public addresses, 203.0.113.7 and 198.51.100.9. Same private address on two different networks is not a conflict.</desc><rect x='0' y='0' width='640' height='112' rx='16' fill='#fbfbf9' stroke='#e4e4de'/><defs><marker id='ar-blue' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#2f6fdb'/></marker><marker id='ar-green' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#178a5e'/></marker><marker id='ar-purple' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#6f52c9'/></marker><marker id='ar-orange' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#d0702c'/></marker><marker id='ar-pink' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#c43d6e'/></marker><marker id='ar-grey' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#6b7280'/></marker><marker id='ar-teal' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#0f7b6c'/></marker><marker id='ar-ink' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#5b6478'/></marker></defs><rect x='10' y='10' width='300' height='62' rx='9' fill='#f1f2f4' fill-opacity='0.45' stroke='#6b7280' stroke-opacity='0.5' stroke-dasharray='4 4'/><text x='20' y='26' font-size='10' font-weight='700' letter-spacing='0.06em' fill='#6b7280'>YOUR HOME</text><rect x='26' y='32' width='110' height='30' rx='7' fill='#e6eefc' stroke='#2f6fdb' stroke-width='1.6'/><text x='81.0' y='50.833333333333336' text-anchor='middle' font-size='11.5' font-weight='600' fill='#1f2a44'>phone</text><rect x='150' y='38' width='146' height='18' rx='4' fill='#e6eefc' stroke='#2f6fdb' stroke-width='1.2'/><text x='223.0' y='50.6' text-anchor='middle' font-size='10' font-weight='700' fill='#2f6fdb'>192.168.1.5 (private)</text><rect x='90' y='78' width='140' height='18' rx='4' fill='#fcefe4' stroke='#d0702c' stroke-width='1.2'/><text x='160.0' y='90.6' text-anchor='middle' font-size='10' font-weight='700' fill='#d0702c'>public: 203.0.113.7</text><rect x='334' y='10' width='300' height='62' rx='9' fill='#f1f2f4' fill-opacity='0.45' stroke='#6b7280' stroke-opacity='0.5' stroke-dasharray='4 4'/><text x='344' y='26' font-size='10' font-weight='700' letter-spacing='0.06em' fill='#6b7280'>FRIEND&#x27;S HOME, ANOTHER CITY</text><rect x='350' y='32' width='110' height='30' rx='7' fill='#e6eefc' stroke='#2f6fdb' stroke-width='1.6'/><text x='405.0' y='50.833333333333336' text-anchor='middle' font-size='11.5' font-weight='600' fill='#1f2a44'>phone</text><rect x='474' y='38' width='146' height='18' rx='4' fill='#e6eefc' stroke='#2f6fdb' stroke-width='1.2'/><text x='547.0' y='50.6' text-anchor='middle' font-size='10' font-weight='700' fill='#2f6fdb'>192.168.1.5 (private)</text><rect x='414' y='78' width='140' height='18' rx='4' fill='#fcefe4' stroke='#d0702c' stroke-width='1.2'/><text x='484.0' y='90.6' text-anchor='middle' font-size='10' font-weight='700' fill='#d0702c'>public: 198.51.100.9</text><text x='10' y='108' text-anchor='start' font-size='10.5' font-weight='700' fill='#178a5e'>Same private address, two different networks: no conflict. A conflict needs one address twice on the same network.</text></