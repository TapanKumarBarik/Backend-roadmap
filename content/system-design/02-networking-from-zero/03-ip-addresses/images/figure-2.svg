ht='700' fill='#1f2a44'>1</text><path d='M14 86 Q14 94 22 94 L221.0 94 Q227.0 94 227.0 101 Q227.0 94 233.0 94 L432 94 Q440 94 440 86' fill='none' stroke='#d0702c' stroke-width='1.6'/><text x='227.0' y='116' text-anchor='middle' font-size='10.5' font-weight='700' fill='#d0702c'>network part (in this home network): 192.168.1, the building</text><path d='M482 86 Q482 94 490 94 L540.0 94 Q546.0 94 546.0 101 Q546.0 94 552.0 94 L602 94 Q610 94 610 86' fill='none' stroke='#2f6fdb' stroke-width='1.6'/><text x='546.0' y='116' text-anchor='middle' font-size='10.5' font-weight='700' fill='#2f6fdb'>device part: 5, the flat</text><text x='14' y='142' text-anchor='start' font-size='10.5' font-weight='600' fill='#1f2a44'>Each number is 8 bits = 1 byte, so it goes from 0 (00000000) to 255 (11111111): 256 values.</text><text x='14' y='160' text-anchor='start' font-size='10.5' font-weight='400' fill='#5b6478' font-style='italic'>4 numbers × 8 bits = 32 bits. Where the line between the two parts falls is lesson 13 (subnets and CIDR).</text></svg>